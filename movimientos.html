<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#EEF2F6;color:#0F1B2A}
.hd{display:flex;align-items:center;justify-content:space-between;background:#fff;padding:10px 14px;border-bottom:1px solid #dde5ee}.hd img{height:28px;vertical-align:middle}.sp{display:inline-block;width:1px;height:24px;background:#ccd;margin:0 10px;vertical-align:middle}
.st{font-size:12px;font-weight:800;padding:4px 10px;border-radius:20px;background:#E6F4EA;color:#1E7A46}.st.off{background:#FDECEA;color:#B3261E}
.ti{background:#123A5C;color:#fff;padding:10px 14px}.ti h1{margin:0;font-size:18px}.ti p{margin:3px 0 0;font-weight:700;opacity:.9}

.c{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0002}

.ch{display:flex;flex-wrap:wrap;gap:8px}.ch button{font:inherit;font-weight:900;font-size:17px;border:2px solid #cfd8e3;background:#F4F7FA;border-radius:12px;padding:12px 14px;min-width:54px;cursor:pointer}
.ch button.on{background:#123A5C;color:#fff;border-color:#123A5C}
.gr button{font-size:24px;min-width:0;flex:1;padding:12px 0;border-width:3px}
.gr [data-v=A]{border-color:#9B59B6;color:#9B59B6}.gr [data-v=B]{border-color:#00B0F0;color:#00B0F0}.gr [data-v=C]{border-color:#D4B000;color:#B39300}.gr [data-v=D]{border-color:#999;color:#666}.gr [data-v=E]{border-color:#E02020;color:#E02020}.gr [data-v=F]{border-color:#FF9900;color:#E08600}
.gr .on[data-v=A]{background:#9B59B6}.gr .on[data-v=B]{background:#00B0F0}.gr .on[data-v=C]{background:#FFE100;color:#000}.gr .on[data-v=D]{background:#BFBFBF;color:#000}.gr .on[data-v=E]{background:#E02020}.gr .on[data-v=F]{background:#FF9900}.gr .on{color:#fff}

.e{text-align:center;color:#4A5868;font-weight:700;padding:14px}.pend{color:#B26A00;font-weight:800}
.sup{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sup button{font:inherit;font-weight:900;font-size:20px;padding:22px 10px;border:0;border-radius:14px;background:#123A5C;color:#fff}

.tabs{display:grid;grid-template-columns:1fr 1fr;background:#fff;border-bottom:1px solid #dde5ee}.tabs button{font:inherit;font-weight:900;font-size:15px;border:0;background:none;padding:12px 4px;color:#4A5868;border-bottom:4px solid transparent}.tabs .on{color:#123A5C;border-bottom-color:#123A5C}

.gr2 button{flex:none;padding:9px 10px;font-size:14px;border-width:2px}
.hide{display:none!important}
