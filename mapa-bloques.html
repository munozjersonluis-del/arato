.zonas{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.zonas::-webkit-scrollbar{display:none}
.zonas button{flex:0 0 auto;border:1px solid #ffffff55;background:#ffffff1a;color:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
.zonas button:active{background:#ffffff40}
#map{position:fixed;left:0;right:0;bottom:0;top:96px;background:#fff}
.leaflet-container{background:#fff}
.pin{width:26px;height:26px;border-radius:50%;background:#E5533D;border:3px solid #fff;box-shadow:0 0 0 0 #E5533Daa;animation:p 1.4s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 #E5533Daa}100%{box-shadow:0 0 0 22px #E5533D00}}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1C1E45;color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;z-index:1001;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
</style>

const q=document.getElementById('q'),sug=document.getElementById('sug');let sel=-1,res=[],pin=null;
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}

q.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();if(res.length)ir(res[sel>=0?sel:0])}
