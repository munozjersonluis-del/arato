L.control.zoom({position:'bottomright'}).addTo(map);

const norm=s=>String(s).toUpperCase().replace(/\s+/g,'').replace(/^BLO/,'');
const items=IDX.map(([l,x,y])=>({l,x,y,k:norm(l)}));
const q=document.getElementById('q'),sug=document.getElementById('sug');let sel=-1,res=[],pin=null;
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}

  res=items.filter(i=>i.k.includes(t)).sort((a,b)=>(a.k.indexOf(t)-b.k.indexOf(t))||a.k.localeCompare(b.k)).slice(0,30);
  sug.innerHTML=res.length?res.map((r,i)=>`<div data-i="${i}">${r.l}<small>${zona(r.y,r.x)}</small></div>`).join(''):'<div style="color:#999;font-weight:500">Sin resultados</div>';sug.style.display='block'};
function ir(r){sug.style.display='none';q.blur();const ll=px(r.x,r.y);map.flyTo(ll,MAXZ,{duration:.7});
  if(pin)map.removeLayer(pin);pin=L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="pin"></div>',iconSize:[26,26],iconAnchor:[13,13]})}).addTo(map);
  toast(r.l+' · '+zona(r.y,r.x));setTimeout(()=>{if(pin){map.removeLayer(pin);pin=null}},9000)}
sug.onclick=e=>{const d=e.target.closest('[data-i]');if(d)ir(res[+d.dataset.i])};
q.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();if(res.length)ir(res[sel>=0?sel:0])}
  else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=Math.max(0,Math.min(res.length-1,sel+(e.key==='ArrowDown'?1:-1)));sug.querySelectorAll('[data-i]').forEach((d,i)=>d.classList.toggle('on',i===sel))}};
document.addEventListener('click',e=>{if(!e.target.closest('.sw'))sug.style.display='none'});
