<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Guía de Bins — Arato</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
--g:#16A34A;--gc:#DCFCE7;--g2:#15803D;
--r:#DC2626;--rc:#FEE2E2;
--y:#D97706;--yc:#FEF3C7;
--b:#2563EB;
--bg:#F3F4F6;--bg2:#fff;--bg3:#F8FAFC;
--txt:#111827;--txt2:#374151;--txt3:#6B7280;
--bdr:#E5E7EB;
}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;}

/* HEADER */
.hdr{background:linear-gradient(135deg,#1A5C38,#16A34A);padding:12px 14px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.2);}
.hdr-row{display:flex;justify-content:space-between;align-items:center;}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:#fff;letter-spacing:2px;}
.hdr-sub{font-size:0.55rem;color:rgba(255,255,255,0.7);margin-top:1px;}
.hdr-btns{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;}
.hdr-btn{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;border-radius:7px;padding:5px 9px;font-size:0.62rem;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px 10px;background:#fff;border-bottom:1px solid var(--bdr);}
.kpi{text-align:center;padding:6px 4px;}
.kpi-val{font-size:1.1rem;font-weight:800;}
.kpi-lbl{font-size:0.48rem;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;}

.wrap{max-width:640px;margin:0 auto;padding:10px;}

/* GRUPO ACORDEON */
.grupo-card{background:#fff;border:1.5px solid var(--bdr);border-radius:12px;margin-bottom:8px;overflow:hidden;}
.grupo-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;user-select:none;background:#fff;}
.grupo-hdr:active{background:var(--bg3);}
.grupo-hdr.open{background:var(--gc);border-bottom:1.5px solid var(--g);}
.grupo-letra{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:1px;}
.grupo-hdr.open .grupo-letra{color:var(--g2);}
.grupo-info{font-size:0.62rem;color:var(--txt3);font-weight:600;}
.grupo-arrow{font-size:0.8rem;color:var(--txt3);transition:transform 0.2s;}
.grupo-hdr.open .grupo-arrow{transform:rotate(180deg);color:var(--g);}
.grupo-body{display:none;padding:8px 10px;}
.grupo-hdr.open + .grupo-body{display:block;}

/* SUBGRUPO ACORDEON */
.sg-card{border:1px solid var(--bdr);border-radius:9px;margin-bottom:6px;overflow:hidden;background:var(--bg3);}
.sg-hdr{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;cursor:pointer;user-select:none;}
.sg-hdr:active{background:var(--bdr);}
.sg-hdr.open{background:#fff;border-bottom:1px solid var(--bdr);}
.sg-nombre{font-family:monospace;font-size:0.88rem;font-weight:700;}
.sg-stats{font-size:0.6rem;color:var(--txt3);}
.sg-pct{font-size:0.72rem;font-weight:800;}
.sg-arrow{font-size:0.65rem;color:var(--txt3);transition:transform 0.2s;}
.sg-hdr.open .sg-arrow{transform:rotate(180deg);}
.sg-body{display:none;padding:10px;}
.sg-hdr.open + .sg-body{display:block;}

/* COLORES MODULOS */
.color-config{background:#fff;border:1.5px solid var(--bdr);border-radius:12px;padding:12px;margin-bottom:10px;}
.color-row{display:grid;grid-template-columns:32px 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px;}
.color-circle{width:28px;height:28px;border-radius:50%;border:2px solid rgba(0,0,0,0.1);}
.color-label{font-size:0.72rem;font-weight:700;}
.color-select{padding:7px 8px;border:1.5px solid var(--bdr);border-radius:7px;font-size:0.78rem;font-family:Inter,sans-serif;width:100%;}

/* BINS GRID */
.bins-grid{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
.bin{width:38px;height:38px;border-radius:7px;border:1.5px solid var(--bdr);background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:0.58rem;font-weight:700;color:var(--txt3);cursor:pointer;transition:all 0.1s;flex-direction:column;gap:1px;}
.bin:active{transform:scale(0.92);}
.bin.llegado{background:var(--gc);border-color:var(--g);color:var(--g2);}
.bin.faltante{background:var(--rc);border-color:var(--r);color:var(--r);}
.bin-hora{font-size:0.4rem;font-weight:600;opacity:0.8;}

/* BOTONES SUBGRUPO */
.sg-actions{display:flex;gap:6px;margin-top:6px;}
.sg-btn{flex:1;padding:7px;border-radius:8px;font-size:0.68rem;font-weight:700;cursor:pointer;border:none;font-family:Inter,sans-serif;}

/* AGREGAR GRUPO */
.add-grupo-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:10px;}
.add-grupo-btn{padding:10px 4px;border-radius:8px;border:1.5px dashed var(--bdr);background:var(--bg3);color:var(--txt3);font-size:0.72rem;font-weight:700;cursor:pointer;text-align:center;}
.add-grupo-btn:active{background:var(--gc);border-color:var(--g);color:var(--g);}
.add-grupo-btn.usado{background:var(--gc);border-color:var(--g);border-style:solid;color:var(--g2);}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:none;align-items:flex-end;}
.modal-bg.open{display:flex;}
.modal{background:#fff;border-radius:16px 16px 0 0;padding:20px;width:100%;}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:1px;margin-bottom:14px;}
.modal-input{width:100%;padding:10px 12px;border:1.5px solid var(--bdr);border-radius:8px;font-size:0.9rem;font-family:Inter,sans-serif;margin-bottom:10px;outline:none;}
.modal-input:focus{border-color:var(--g);}
.modal-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.modal-btn{padding:11px;border-radius:9px;font-size:0.82rem;font-weight:700;cursor:pointer;border:none;font-family:Inter,sans-serif;}
.modal-btn-ok{background:var(--g);color:#fff;}
.modal-btn-cancel{background:var(--bg3);color:var(--txt3);}

/* BIN MODAL */
.bin-modal-btns{display:flex;flex-direction:column;gap:8px;}
.bin-modal-btn{padding:12px;border-radius:9px;font-size:0.85rem;font-weight:700;cursor:pointer;border:none;font-family:Inter,sans-serif;}

.flash{position:fixed;top:70px;left:50%;transform:translateX(-50%);padding:9px 18px;border-radius:10px;font-size:0.75rem;font-weight:700;color:#fff;z-index:999;display:none;white-space:nowrap;}

@media print {
  .hdr,.hdr-btns,.no-print,.sg-actions,.add-grupo-grid,.grupo-arrow,.sg-arrow{display:none!important;}
  .grupo-body{display:block!important;}
  .sg-body{display:block!important;}
  body{background:#fff;}
}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-row">
    <div>
      <div class="hdr-title">📋 🥑 GUÍA DE BINS</div>
      <div class="hdr-sub" id="fechaHdr"></div>
    </div>
    <div class="hdr-btns">
      <button class="hdr-btn no-print" onclick="abrirColorConfig()">🎨 Módulos</button>

      <button class="hdr-btn no-print" onclick="cargarDeSupabase()">☁️ Cargar</button>
      <button class="hdr-btn no-print" onclick="syncAll()">🔄 Sync</button>
      <button class="hdr-btn no-print" onclick="window.open('https://docs.google.com/spreadsheets/d/1wKwRNcox1Ydnqwz9CkDP1_hheaAnWO8y0xWcuq9hTlk','_blank')">📊 Sheets</button>
      <button class="hdr-btn no-print" onclick="verHistorialFecha()">📅 Historial</button>
      <button class="hdr-btn no-print" onclick="generarReporte()">📄 Reporte</button>
    </div>
  </div>
</div>

<div class="kpis">
  <div class="kpi"><div class="kpi-val" id="kpi-total" style="color:var(--b);">0</div><div class="kpi-lbl">Total bins</div></div>
  <div class="kpi"><div class="kpi-val" id="kpi-llegados" style="color:var(--g);">0</div><div class="kpi-lbl">Llegados</div></div>
  <div class="kpi"><div class="kpi-val" id="kpi-faltantes" style="color:var(--r);">0</div><div class="kpi-lbl">Faltantes</div></div>
  <div class="kpi"><div class="kpi-val" id="kpi-pend" style="color:var(--y);">0</div><div class="kpi-lbl">Pendientes</div></div>
  <div class="kpi"><div class="kpi-val" id="kpi-tons" style="color:var(--b);font-size:0.9rem;">0 t</div><div class="kpi-lbl">Toneladas</div></div>
</div>

<div class="flash" id="flash"></div>

<!-- MODAL: Bin -->
<div class="modal-bg" id="modalBin">
  <div class="modal">
    <div class="modal-title" id="mBinTitle">Bin #</div>
    <div style="font-size:0.75rem;color:var(--txt3);margin-bottom:10px;" id="mBinSub"></div>
    <!-- Color/Módulo selector -->
    <div style="margin-bottom:12px;">
      <div style="font-size:0.62rem;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;">Módulo de origen</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;" id="colorBtns"></div>
    </div>
    <div class="bin-modal-btns">
      <button class="bin-modal-btn" style="background:var(--gc);color:var(--g2);" onclick="marcarBin('l')">✅ LLEGADO</button>
      <button class="bin-modal-btn" style="background:var(--rc);color:var(--r);" onclick="marcarBin('f')">⚠️ FALTANTE</button>
      <button class="bin-modal-btn" style="background:var(--bg3);color:var(--txt3);" onclick="marcarBin('')">↩️ Quitar marca</button>
      <button class="bin-modal-btn" style="background:var(--bg3);color:var(--txt3);" onclick="cerrarModal('modalBin')">Cancelar</button>
    </div>
  </div>
</div>

<!-- MODAL: Agregar subgrupo -->
<div class="modal-bg" id="modalSG">
  <div class="modal">
    <div class="modal-title" id="mSGTitle">Agregar subgrupo</div>
    <div style="font-size:0.7rem;color:var(--txt3);margin-bottom:8px;">Nombre del subgrupo</div>
    <input class="modal-input" id="mSGNombre" style="text-transform:uppercase;font-family:monospace;font-weight:700;font-size:1rem;" maxlength="5">
    <div style="font-size:0.7rem;color:var(--txt3);margin-bottom:6px;">Cantidad de bins</div>
    <input class="modal-input" type="number" id="mSGCantidad" value="60" min="1" max="100">
    <div class="modal-btns">
      <button class="modal-btn modal-btn-ok" onclick="confirmarAgregarSG()">✅ Agregar</button>
      <button class="modal-btn modal-btn-cancel" onclick="cerrarModal('modalSG')">Cancelar</button>
    </div>
  </div>
</div>

<div class="wrap">
  <!-- Config colores módulos -->
  <div class="color-config no-print" id="colorConfig" style="display:none;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <div style="font-size:0.62rem;font-weight:800;color:var(--txt3);letter-spacing:1px;text-transform:uppercase;">Colores de módulos</div>
      <button onclick="cerrarColorConfig()" style="background:none;border:none;cursor:pointer;font-size:0.9rem;">✕</button>
    </div>
    <div id="colorRows"></div>
    <button onclick="guardarColores()" style="width:100%;padding:9px;background:var(--g);color:#fff;border:none;border-radius:8px;font-size:0.78rem;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;">✅ Guardar configuración</button>
  </div>
  <!-- Grupos desplegables -->
  <div id="gruposWrap"></div>

  <!-- Agregar nuevo grupo -->
  <div class="no-print" style="margin-top:4px;">
    <button onclick="toggleAddGrid()" id="btn-add-grid" style="width:100%;padding:9px;background:#fff;border:1.5px solid var(--bdr);border-radius:10px;font-size:0.72rem;font-weight:700;color:var(--txt3);cursor:pointer;font-family:Inter,sans-serif;display:flex;justify-content:space-between;align-items:center;">
      <span>➕ Agregar grupo</span>
      <span id="arrow-add-grid">▼</span>
    </button>
    <div id="addGrupoWrap" style="display:none;margin-top:6px;">
      <div class="add-grupo-grid" id="addGrupoGrid"></div>
    </div>
  </div>
</div>

<script>
const SURL='https://rqvcvffyynpnighzwxju.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxdmN2ZmZ5eW5wbmlnaHp3eGp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MjgyNDcsImV4cCI6MjA5MzMwNDI0N30.fFufNEdRvAzl6O6BqtTbx83O3Eg8Wd7gACNJDGQKga4';

const GRUPOS_ALL = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
let data = {};
let _binCtx = null; // {grupo, sg, idx}
let _sgCtx = null;  // {grupo}
let _abiertos = {}; // {grupo: bool, grupo_sg: bool}

function fechaHoy() {
  const d=new Date(),o=d.getTimezoneOffset();
  return new Date(d.getTime()-o*60000).toISOString().slice(0,10);
}

document.getElementById('fechaHdr').textContent = new Date().toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

function flash(msg, tipo) {
  const f=document.getElementById('flash');
  f.textContent=msg;
  f.style.background=tipo==='verde'?'#16A34A':tipo==='rojo'?'#DC2626':tipo==='azul'?'#2563EB':'#1E293B';
  f.style.display='block';
  setTimeout(()=>f.style.display='none',2200);
}

function guardar() {
  localStorage.setItem('arato_guia_v2', JSON.stringify(data));
}

function cargar() {
  const saved = localStorage.getItem('arato_guia_v2');
  if(saved) { try { data=JSON.parse(saved); } catch(e){data={};} }
}

function cerrarModal(id) {
  document.getElementById(id).classList.remove('open');
}

// ── COLORES MODULOS ──
const COLORES = [
  {id:'verde',  label:'Verde',   hex:'#16A34A', light:'#DCFCE7', dark:'#15803D'},
  {id:'azul',   label:'Azul',    hex:'#2563EB', light:'#DBEAFE', dark:'#1D4ED8'},
  {id:'amarillo',label:'Amarillo',hex:'#D97706', light:'#FEF3C7', dark:'#B45309'},
  {id:'rojo',   label:'Rojo',    hex:'#DC2626', light:'#FEE2E2', dark:'#B91C1C'},
  {id:'morado', label:'Morado',  hex:'#7C3AED', light:'#F3E8FF', dark:'#6D28D9'},
  {id:'celeste',label:'Celeste', hex:'#0891B2', light:'#CFFAFE', dark:'#0E7490'},
];

let colorModulos = {}; // {colorId: 'Módulo X'}

function cargarColores() {
  try { colorModulos = JSON.parse(localStorage.getItem('arato_colores')||'{}'); } catch(e) { colorModulos={}; }
}

function guardarColores() {
  COLORES.forEach(c => {
    const sel = document.getElementById('csel-'+c.id);
    if(sel) colorModulos[c.id] = sel.value;
  });
  localStorage.setItem('arato_colores', JSON.stringify(colorModulos));
  cerrarColorConfig();
  render();
  flash('✅ Colores guardados','verde');
}

function abrirColorConfig() {
  const panel = document.getElementById('colorConfig');
  const rows = document.getElementById('colorRows');
  rows.innerHTML = COLORES.map(c => {
    const modActual = colorModulos[c.id] || '';
    return `<div class="color-row">
      <div class="color-circle" style="background:${c.hex};"></div>
      <div class="color-label">${c.label}</div>
      <select class="color-select" id="csel-${c.id}">
        <option value="">— Sin asignar —</option>
        ${Array.from({length:24},(_,i)=>`<option value="Módulo ${i+1}" ${modActual==='Módulo '+(i+1)?'selected':''}>Módulo ${i+1}</option>`).join('')}
      </select>
    </div>`;
  }).join('');
  panel.style.display = 'block';
}

function cerrarColorConfig() {
  document.getElementById('colorConfig').style.display = 'none';
}

function getColorDeBin(g, sg, idx) {
  // Check if bin has a color assigned
  const bins = data[g] && data[g][sg] ? data[g][sg] : [];
  const bin = bins[idx];
  if(bin && bin.c) return COLORES.find(c=>c.id===bin.c)||null;
  return null;
}

function getModuloLabel(colorId) {
  return colorModulos[colorId] || colorId;
}

function toggleAddGrid() {
  const wrap = document.getElementById('addGrupoWrap');
  const arrow = document.getElementById('arrow-add-grid');
  const visible = wrap.style.display !== 'none';
  wrap.style.display = visible ? 'none' : 'block';
  arrow.textContent = visible ? '▼' : '▲';
}

async function cargarDeSupabase() {
  flash('Cargando desde Supabase...','azul');
  try {
    const fecha=fechaHoy();
    // Load bin states (individual)
    const binStates = await supaFetch('guia_bins_estado?select=*&fecha=eq.'+fecha+'&order=grupo.asc,subgrupo.asc,bin_num.asc');
    
    if(binStates && binStates.length){
      // Rebuild data from individual bin states
      const newData={};
      binStates.forEach(function(b){
        const g=b.grupo, sg=b.subgrupo;
        if(!newData[g])newData[g]={};
        if(!newData[g][sg])newData[g][sg]=[];
        newData[g][sg].push({n:b.bin_num,e:b.estado||'',h:b.hora||'',c:b.color_mod||''});
        _abiertos[g]=true;
      });
      // Sort bins by number
      Object.keys(newData).forEach(g=>{
        Object.keys(newData[g]).forEach(sg=>{
          newData[g][sg].sort((a,b)=>a.n-b.n);
        });
      });
      data=newData;
    } else {
      // Fallback to summary
      const rows = await supaFetch('guia_registros?select=*&fecha=eq.'+fecha+'&order=grupo.asc,subgrupo.asc');
      if(!rows||!rows.length){flash('Sin datos para hoy','rojo');return;}
      rows.forEach(function(r){
        const g=r.grupo, sg=r.subgrupo;
        const total=r.viaje||0;
        const llegados=r.bins||0;
        if(!data[g])data[g]={};
        if(!data[g][sg]){
          data[g][sg]=Array.from({length:total},function(_,i){return{n:i+1,e:'',h:''};});
        }
        let lc=0;
        data[g][sg].forEach(function(b){if(lc<llegados){b.e='l';lc++;}else b.e='';});
        _abiertos[g]=true;
      });
    }
    guardar();render();
    const el=document.getElementById('act-hora');
    if(el)el.textContent='Act: '+new Date().toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
    flash('✅ Cargado correctamente','verde');
  }catch(e){flash('Error: '+e.message,'rojo');}
}

// ── RENDER PRINCIPAL ──
function render() {
  renderGrupos();
  renderAddGrid();
  updKPIs();
}

function renderGrupos() {
  const wrap = document.getElementById('gruposWrap');
  const gruposActivos = Object.keys(data).filter(g=>data[g]&&Object.keys(data[g]).length>0).sort();
  if(!gruposActivos.length) {
    wrap.innerHTML = '<div style="text-align:center;padding:30px 20px;color:var(--txt3);font-size:0.82rem;">Toca un grupo abajo para comenzar</div>';
    return;
  }
  wrap.innerHTML = gruposActivos.map(g => {
    const sgs = Object.keys(data[g]).sort();
    let totBins=0,totLleg=0,totFalt=0;
    sgs.forEach(sg=>{
      const bins=data[g][sg]||[];
      totBins+=bins.length;
      totLleg+=bins.filter(b=>b.e==='l').length;
      totFalt+=bins.filter(b=>b.e==='f').length;
    });
    const pend=totBins-totLleg-totFalt;
    const isOpen=_abiertos[g];
    return `<div class="grupo-card" id="gc-${g}">
      <div class="grupo-hdr ${isOpen?'open':''}" onclick="toggleGrupo('${g}')">
        <div>
          <span class="grupo-letra">Grupo ${g}</span>
          <span style="font-size:0.62rem;color:var(--txt3);margin-left:8px;">${sgs.length} subgrupos</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="text-align:right;">
            <div style="font-size:0.72rem;font-weight:800;color:var(--g);">${totLleg} bins · ${(totLleg*435/1000).toFixed(1)} t</div>
            <div style="font-size:0.55rem;color:var(--txt3);">${pend} pend · ${totFalt} falt</div>
          </div>
          <span class="grupo-arrow">▼</span>
        </div>
      </div>
      <div class="grupo-body">
        ${sgs.map(sg => renderSG(g, sg)).join('')}
        <button class="no-print" onclick="_sgCtx={grupo:'${g}'};abrirModalSG()" style="width:100%;padding:8px;background:var(--gc);border:1.5px dashed var(--g);color:var(--g);border-radius:8px;font-size:0.72rem;font-weight:700;cursor:pointer;margin-top:2px;font-family:Inter,sans-serif;">+ Agregar subgrupo</button>

}

function renderSG(g, sg) {
  const bins = data[g][sg]||[];
  const llegados=bins.filter(b=>b.e==='l').length;
  const faltantes=bins.filter(b=>b.e==='f').length;
  const total=bins.length;
  const pend=total-llegados-faltantes;
  const isOpen=_abiertos[g+'_'+sg];
  return `<div class="sg-card" id="sgc-${g}-${sg}">
    <div class="sg-hdr ${isOpen?'open':''}" onclick="toggleSG('${g}','${sg}')">
      <div>
        <span class="sg-nombre">${sg}</span>
        <span class="sg-stats"> — ${llegados} llegados · ${faltantes} faltantes · ${pend} pendientes</span>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <span style="font-size:0.72rem;font-weight:800;color:var(--g);">${llegados} bins · ${(llegados*435/1000).toFixed(1)} t</span>
        <span class="sg-arrow">▼</span>
      </div>
    </div>
    <div class="sg-body">
      <div class="bins-grid">
        ${bins.map((b,i)=>{
          const cls=b.e==='l'?'llegado':b.e==='f'?'faltante':'';
          const col=b.c?COLORES.find(c=>c.id===b.c):null;
          const bg=col&&b.e==='l'?col.light:b.e==='l'?'var(--gc)':b.e==='f'?'var(--rc)':'var(--bg3)';
          const border=col&&b.e==='l'?col.hex:b.e==='l'?'var(--g)':b.e==='f'?'var(--r)':'var(--bdr)';
          const color=col&&b.e==='l'?col.dark:b.e==='l'?'var(--g2)':b.e==='f'?'var(--r)':'var(--txt3)';
          return `<div class="bin" style="background:${bg};border-color:${border};color:${color};" onclick="abrirModalBin('${g}','${sg}',${i})">${b.n}${b.h?`<div class="bin-hora">${b.h}</div>`:''}</div>`;
        }).join('')}
      </div>
      <div class="sg-actions no-print">
        <button class="sg-btn" style="background:var(--gc);color:var(--g2);" onclick="marcarTodos('${g}','${sg}','l')">✅ Todos llegaron</button>
        <button class="sg-btn" style="background:var(--rc);color:var(--r);flex:0.5;" onclick="eliminarSG('${g}','${sg}')">🗑️</button>
      </div>
      ${(()=>{
        // Module summary
        const modCount = {};
        bins.forEach(b=>{
          if(b.e==='l'&&b.c&&colorModulos[b.c]){
            const mod=colorModulos[b.c];
            modCount[mod]=(modCount[mod]||0)+1;
          }
        });
        const mods=Object.keys(modCount);
        if(!mods.length) return '';
        return '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;">'+
          mods.map(m=>{
            const col=COLORES.find(c=>colorModulos[c.id]===m);
            return `<div style="padding:3px 8px;border-radius:6px;background:${col?col.light:'var(--bg3)'};color:${col?col.dark:'var(--txt3)'};font-size:0.62rem;font-weight:700;">${m}: ${modCount[m]}</div>`;
          }).join('')+'</div>';
      })()}
    </div>
  </div>`;
}

function updKPIs() {

// ── TOGGLE ──
function toggleGrupo(g) {
  _abiertos[g] = !_abiertos[g];
  renderGrupos();
}

function toggleSG(g, sg) {
  const key=g+'_'+sg;
  _abiertos[key] = !_abiertos[key];
  renderGrupos();
}

// ── AGREGAR GRUPO ──
function agregarGrupo(g) {
  if(data[g] && Object.keys(data[g]).length > 0) {
    // Ya tiene datos — solo abrir/cerrar acordeón
    _abiertos[g] = !_abiertos[g];
    renderGrupos();
    return;
  }
  // Nuevo grupo — crear y abrir modal
  if(!data[g]) data[g] = {};
  _abiertos[g] = true;
  _sgCtx = {grupo: g};
  abrirModalSG();
}

// ── SUBGRUPO ──
function abrirModalSG() {
  const g = _sgCtx.grupo;
  document.getElementById('mSGTitle').textContent = 'Agregar subgrupo — Grupo ' + g;
  // Auto-nombre
  const existing = Object.keys(data[g]||{});
  let nombre = g+'01';
  for(let i=1;i<=99;i++) {
    const n=g+String(i).padStart(2,'0');
    if(!existing.includes(n)){nombre=n;break;}
  }
  document.getElementById('mSGNombre').value = nombre;
  document.getElementById('mSGCantidad').value = '60';
  document.getElementById('modalSG').classList.add('open');
  setTimeout(()=>document.getElementById('mSGCantidad').focus(),100);
}

function confirmarAgregarSG() {
  const g = _sgCtx.grupo;
  const nombre = document.getElementById('mSGNombre').value.trim().toUpperCase();
  const cantidad = parseInt(document.getElementById('mSGCantidad').value)||60;
  if(!nombre){flash('Ingresa el nombre','rojo');return;}
  if(data[g][nombre]){flash('El subgrupo ya existe','rojo');return;}
  data[g][nombre] = Array.from({length:cantidad},(_,i)=>({n:i+1,e:'',h:''}));
  _abiertos[g]=true;
  _abiertos[g+'_'+nombre]=true;
  guardar();
  cerrarModal('modalSG');
  render();
  flash('✅ Subgrupo '+nombre+' creado con '+cantidad+' bins','verde');
}

function eliminarSG(g, sg) {
  if(!confirm('¿Eliminar subgrupo '+sg+'?'))return;
  delete data[g][sg];
  if(Object.keys(data[g]).length===0) delete data[g];
  guardar(); render();
  // Also delete from Supabase
  const fecha = fechaHoy();
  supaFetch('guia_registros?grupo=eq.'+g+'&subgrupo=eq.'+sg+'&fecha=eq.'+fecha,'DELETE').catch(()=>{});
  flash('Eliminado','rojo');
}

function marcarTodos(g, sg, estado) {
  if(!confirm('¿Marcar todos los bins de '+sg+' como llegados?'))return;
  const hora=new Date().toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
  data[g][sg].forEach(b=>{b.e=estado;b.h=estado==='l'?hora:'';});

  flash('✅ Todos marcados','verde');

function abrirModalBin(g, sg, idx) {

  const b = data[g][sg][idx];
  document.getElementById('mBinTitle').textContent = 'Bin #'+b.n+' — '+sg;
  document.getElementById('mBinSub').textContent = b.e==='l'?'✅ Llegó a las '+b.h+(b.c?' · '+getModuloLabel(b.c):'') : b.e==='f'?'⚠️ Faltante':'⬜ Pendiente';

function selColorBin(colorId) {
  if(!_binCtx) return;
  const {g,sg,idx} = _binCtx;
  const b = data[g][sg][idx];
  // Toggle
  b.c = b.c === colorId ? '' : colorId;
  // Update button styles
  COLORES.forEach(c => {
    const btn = document.getElementById('cbtn-'+c.id);
    if(!btn) return;
    const activo = b.c === c.id;
    btn.style.borderColor = activo ? c.hex : 'var(--bdr)';
    btn.style.background = activo ? c.light : 'var(--bg3)';
    btn.style.color = activo ? c.dark : 'var(--txt3)';
  });
  guardar();

function marcarBin(estado) {
  if(!_binCtx)return;
  const {g,sg,idx}=_binCtx;
  const hora=new Date().toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
  data[g][sg][idx].e=estado;

}

// ── SUPABASE SYNC ──
async function supaFetch(path,method,body){
  const opts={method:method||'GET',headers:{'apikey':SKEY,'Authorization':'Bearer '+SKEY,'Content-Type':'application/json'}};
  if(body)opts.body=JSON.stringify(body);
  if(method==='POST')opts.headers['Prefer']='return=representation';
  if(method==='PATCH')opts.headers['Prefer']='return=representation';
  const r=await fetch(SURL+'/rest/v1/'+path,opts);
  if(!r.ok)throw new Error(r.status);
  return method==='DELETE'?null:r.json();
}

async function syncAll(){
  const fecha=fechaHoy();
  let count=0;
  for(const g of Object.keys(data)){
    for(const sg of Object.keys(data[g]||{})){
      const bins=data[g][sg]||[];
      if(!bins.length)continue;
      try{
        // 1. Sync summary to guia_registros
        const llegados=bins.filter(b=>b.e==='l').length;
        const total=bins.length;
        const ex=await supaFetch('guia_registros?select=id&grupo=eq.'+g+'&subgrupo=eq.'+sg+'&fecha=eq.'+fecha);
        const payload={grupo:g,subgrupo:sg,viaje:total,bins:llegados,fecha,obs:'Total:'+total+' L:'+llegados};
        if(ex&&ex.length)await supaFetch('guia_registros?id=eq.'+ex[0].id,'PATCH',payload);
        else await supaFetch('guia_registros','POST',payload);

        // 2. Sync each bin state to guia_bins_estado
        // Delete existing for this sg/fecha and re-insert
        await supaFetch('guia_bins_estado?fecha=eq.'+fecha+'&grupo=eq.'+g+'&subgrupo=eq.'+sg,'DELETE');
        const binsPayload=bins.map(b=>({
          fecha,grupo:g,subgrupo:sg,
          bin_num:b.n,estado:b.e||'',hora:b.h||'',color_mod:b.c||''
        }));
        if(binsPayload.length){
          await supaFetch('guia_bins_estado','POST',binsPayload);
        }
        count++;
      }catch(e){console.warn(e);}
    }
  }
  try {
    await fetch('/api/sheets-guia', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'});
  } catch(e) {}
  flash('✅ Sincronizado '+count+' subgrupos','verde');
}

    modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:300;display:flex;align-items:flex-end;';
    modal.innerHTML = '<div style="background:#fff;border-radius:16px 16px 0 0;padding:20px;width:100%;max-height:85vh;overflow-y:auto;">'+
      '<div style="font-family:Bebas Neue,sans-serif;font-size:1.1rem;letter-spacing:1px;margin-bottom:10px;">Reporte</div>'+
      '<img src="'+canvas.toDataURL()+'" style="width:100%;border-radius:8px;margin-bottom:10px;">'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">'+
      '<a href="'+canvas.toDataURL()+'" download="Recepcion_Arato_'+fecha+'.png" style="display:block;padding:11px;background:#16A34A;color:#fff;border-radius:9px;font-size:0.82rem;font-weight:700;text-align:center;text-decoration:none;">⬇️ Descargar</a>'+
      '<button id="rep-cerrar" style="padding:11px;background:#F3F4F6;color:#374151;border:none;border-radius:9px;font-size:0.82rem;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;">Cerrar</button>'+
      '</div></div>';
    modal.addEventListener('click',function(e){if(e.target===this)this.remove();});
    document.body.appendChild(modal);
    const repCerrar = document.getElementById('rep-cerrar');
    if(repCerrar) repCerrar.addEventListener('click', function(){ modal.remove(); });
  }).catch(e => {
    document.body.removeChild(temp);
    flash('Error generando reporte','rojo');
  });
}
// Init
cargar();
cargarColores();
render();
</script>
