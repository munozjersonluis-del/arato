<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B2E83">
<link rel="manifest" href="pesos.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pesos">
<link rel="apple-touch-icon" href="pesos-icon-192.png">
<link rel="icon" type="image/png" href="pesos-icon-192.png">
<title>Peso de bandejas · Blueberries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F2F8;--panel:#fff;--ink:#1C1E45;--ink2:#5E6285;--line:#D5D7E6;--accent:#2B2E83;--accent-ink:#fff;--soft:#E8E9F5;--leaf:#6FA82E;--leaf-soft:#EDF5E3;--red:#D93A2B;--red-soft:#FCEBE9;--warn:#946200;--warn-soft:#FFF3DC;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12132A;--panel:#1C1E3B;--ink:#ECEDF8;--ink2:#A3A6C8;--line:#34375E;--accent:#9DA1F5;--accent-ink:#14163A;--soft:#26295A;--leaf:#8FD14F;--leaf-soft:#1F3318;--red:#FF7465;--red-soft:#3A1D1B;--warn:#F2B84B;--warn-soft:#3A2E14}}
:root[data-theme="dark"]{--bg:#12132A;--panel:#1C1E3B;--ink:#ECEDF8;--ink2:#A3A6C8;--line:#34375E;--accent:#9DA1F5;--accent-ink:#14163A;--soft:#26295A;--leaf:#8FD14F;--leaf-soft:#1F3318;--red:#FF7465;--red-soft:#3A1D1B;--warn:#F2B84B;--warn-soft:#3A2E14}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:10px 12px 112px}
.hdr{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:8px 12px;margin-bottom:12px;border:1px solid var(--line)}
.hdr img.m{height:30px;flex:none}.hdr img.b{height:22px;flex:none;min-width:0}
.hdr .st{flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;font-size:12px;padding:5px 8px}
.hdr .sep{width:1px;height:28px;background:#D5D7E6}
.hdr .st{margin-left:auto}
.st{font-size:12.5px;font-weight:600;border-radius:20px;padding:5px 10px;white-space:nowrap;background:var(--leaf-soft);color:var(--leaf)}
.st.off{background:var(--warn-soft);color:var(--warn)}.st.busy{background:var(--soft);color:var(--accent)}
.hero{display:flex;align-items:center;gap:12px;margin:0 2px 12px}
.hero img{width:64px;height:64px;object-fit:contain}
.hero h1{font:600 24px/1.1 "Barlow Semi Condensed",sans-serif;margin:0;color:var(--accent)}
.hero p{margin:2px 0 0;font-size:14px;color:var(--ink2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.sec{display:flex;align-items:center;gap:8px;font:600 17px "Barlow Semi Condensed",sans-serif;margin:0 0 12px;color:var(--accent)}
.sec i{font-style:normal;width:26px;height:26px;border-radius:13px;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font-size:15px}
.lbl{display:block;font-size:13.5px;font-weight:600;color:var(--ink2);margin:0 0 6px}
.field{margin-bottom:14px}.field:last-child{margin-bottom:0}
.in{width:100%;min-height:50px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;font-size:17px;color:var(--ink)}
.in:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.in.bad,.grp.bad{border-color:var(--red)!important;box-shadow:0 0 0 2px var(--red-soft)}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.grp{display:grid;gap:6px;border-radius:12px}
.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}.c5{grid-template-columns:repeat(5,1fr)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;min-height:50px;padding:8px 12px;font-weight:600;cursor:pointer;color:var(--ink)}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt small{display:block;font-weight:500;font-size:11.5px;opacity:.85}
.c5 .opt{font:600 21px "Barlow Semi Condensed",sans-serif;padding:8px 0}
.fundo{font-size:13px;color:var(--leaf);font-weight:600;margin-top:6px;min-height:18px}
.row2{display:grid;grid-template-columns:1fr 1.25fr;gap:10px}
.big{font:600 30px "Barlow Semi Condensed",sans-serif;text-align:center;min-height:64px}
.check{border-radius:12px;padding:10px 12px;margin-top:12px;font-size:14.5px;display:none;align-items:center;gap:10px}
.check b{font:600 24px "Barlow Semi Condensed",sans-serif;white-space:nowrap}
.check.ok{display:flex;background:var(--leaf-soft);color:var(--leaf)}
.check.hi{display:flex;background:var(--warn-soft);color:var(--warn)}
.check.lo{display:flex;background:var(--red-soft);color:var(--red)}
.err{color:var(--red);font-weight:600;font-size:14.5px;margin:10px 0 0;display:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.bar .in2{max-width:560px;margin:0 auto}
.save{width:100%;min-height:58px;border:0;border-radius:14px;background:var(--leaf);color:#fff;font:600 21px "Barlow Semi Condensed",sans-serif;cursor:pointer}
.save:active{transform:scale(.99)}
.list h2{font:600 18px "Barlow Semi Condensed",sans-serif;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;color:var(--accent)}
.list h2 span{font:500 13px "Barlow",sans-serif;color:var(--ink2)}
.sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-bottom:10px}
.sum div{border-radius:12px;padding:8px 10px;background:var(--soft)}
.sum div b{display:block;font:600 20px "Barlow Semi Condensed",sans-serif}
.sum div small{font-size:12px;color:var(--ink2)}
.sum .ok b{color:var(--leaf)}.sum .hi b{color:var(--warn)}.sum .lo b{color:var(--red)}
.reg{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.reg .g{width:38px;height:38px;border-radius:10px;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font:600 19px "Barlow Semi Condensed",sans-serif}
.reg small{display:block;color:var(--ink2);font-size:12.5px}
.reg .kg{text-align:right;font:600 18px "Barlow Semi Condensed",sans-serif}
.reg .kg small{font:600 12px "Barlow",sans-serif}
.pend{color:var(--warn);font-weight:600}
.empty{color:var(--ink2);font-size:14px;text-align:center;padding:12px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--panel);padding:11px 18px;border-radius:12px;font-size:15px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.links{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--ink2);text-decoration:underline;font-size:13.5px;cursor:pointer;padding:8px 0}
.inst{width:100%;border:1.5px dashed var(--accent);background:var(--soft);color:var(--accent);border-radius:14px;min-height:52px;font-weight:600;cursor:pointer;margin-bottom:12px}
.hidden{display:none!important}
.undo{position:fixed;left:12px;right:12px;bottom:calc(88px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;background:var(--ink);color:var(--panel);border-radius:14px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;z-index:9;font-weight:600;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.undo span{flex:1}
.undo button{background:var(--panel);color:var(--ink);border:0;border-radius:10px;min-height:44px;padding:0 16px;font-weight:600;cursor:pointer}
.undo i{position:absolute;left:0;bottom:0;height:3px;background:var(--leaf);border-radius:0 0 0 14px;animation:u 7s linear forwards}
@keyframes u{from{width:100%}to{width:0}}
.del{background:none;border:1px solid var(--line);color:var(--ink2);border-radius:8px;font-size:12.5px;font-weight:600;padding:3px 8px;margin-top:4px;cursor:pointer}
.del.sure{border-color:var(--red);color:var(--red)}
</style>
</head>

    <button class="save" id="apiSave" type="button" style="margin-top:10px">Conectar</button>
    <button class="link" id="apiNo" type="button" style="width:100%">Cancelar</button>
  </section>

  <form id="form" autocomplete="off" onsubmit="return false">
    <div class="card">
      <div class="sec"><i>1</i>¿Dónde?</div>
      <div class="field"><label class="lbl" for="fecha">Fecha</label><input class="in" type="date" id="fecha"></div>
      <div class="field"><span class="lbl">Acopio</span>
        <div class="grp c2" id="acopio"><button type="button" class="opt" data-v="VALLE AZUL 1">Valle Azul 1</button><button type="button" class="opt" data-v="VALLE AZUL 3">Valle Azul 3</button></div></div>
      <div class="field"><label class="lbl" for="modulo">Módulo</label><select class="in" id="modulo"></select><div class="fundo" id="fundo"></div></div>
    </div>
    <div class="card">
      <div class="sec"><i>2</i>¿Qué fruta?</div>
      <div class="field"><span class="lbl">Variedad</span><div class="grp c3" id="variedad"></div>
        <input class="in hidden" id="varOtra" placeholder="Escribe la variedad" style="margin-top:8px;text-transform:uppercase"></div>
      <div class="field"><span class="lbl">Grupo</span><div class="grp c5" id="grupo"></div></div>
      <div class="field"><span class="lbl">Tipo de bandeja</span>
        <div class="grp c2" id="tipo"><button type="button" class="opt" data-v="Normal">Normal<small>2.5 jarras</small></button><button type="button" class="opt" data-v="Humeda">Húmeda<small>1.5 jarras</small></button></div></div>
    </div>
    <div class="card">
      <div class="sec"><i>3</i>¿Cuánto pesa?</div>
      <div class="row2">
        <div><label class="lbl" for="cant">N° de bandejas</label><input class="in big" id="cant" type="number" inputmode="numeric" min="1" step="1"></div>
        <div><label class="lbl" for="kg">Kg (bandeja + fruta)</label><input class="in big" id="kg" type="number" inputmode="decimal" min="0" step="0.001" placeholder="0.000"></div>
      </div>
      <div class="check" id="check"></div>
      <p class="err" id="err"></p>
    </div>
  </form>

  <section class="card list" id="listCard">
    <h2>Hoy <span id="cnt"></span></h2>
    <div class="sum" id="sum"></div>
    <div id="list"></div>
  </section>
  <div class="links"><button class="link" id="btnRef" type="button">Actualizar</button></div>
</div>

<div class="bar" id="bar"><div class="in2"><button class="save" id="btnSave" type="button">Guardar</button></div></div>
<div class="undo hidden" id="undo" role="status"><span id="undoTxt"></span><button type="button" id="undoBtn">Deshacer</button><i></i></div>
<div class="toast" id="toast" role="status"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K='pesosBandejas:';
function ls(k,v){try{if(v===undefined)return localStorage.getItem(K+k);if(v===null)localStorage.removeItem(K+k);else localStorage.setItem(K+k,v)}catch(e){return null}}
function lsj(k,d){try{return JSON.parse(ls(k))??d}catch(e){return d}}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1800)}

const TARA=0.292,JARRA=1.25,JARRAS={Normal:2.5,Humeda:1.5};
const VAR_BASE=['ARANA','BREEZE','CASCADE','CORRINA','KIRRA','RAYMI','ROSITA','TERRAPIN']; // lista de la hoja
const MOD_BASE=[['M01','DUNA AZUL'],['M02','DUNA AZUL'],['M03','DUNA AZUL'],['M04','DUNA AZUL'],['M05','DUNA AZUL'],['M06','DUNA AZUL'],['M09','VALLE AZUL 1'],['M10','VALLE AZUL 1'],['M11','VALLE AZUL 1'],['M12','VALLE AZUL 1'],['M13','VALLE AZUL 2'],['M14','VALLE AZUL 2'],['M19','VALLE AZUL 2'],['M15','VALLE AZUL 3'],['M16','VALLE AZUL 3'],['M17','VALLE AZUL 3'],['M18','VALLE AZUL 3'],['M20','VALLE AZUL 4']].map(([modulo,fundo])=>({modulo,fundo}));
const API_DEF='https://script.google.com/macros/s/AKfycbxDGEiboTzCglD0jaEOoQdNX5KZVs8EwW0Tjn9BHCDODP2Kvm2ClcZravP5RRYKds9U/exec';

let API=new URLSearchParams(location.search).get('api')||ls('api')||API_DEF;
let S={acopio:ls('acopio')||'',variedad:ls('variedad')||'',grupo:ls('grupo')||'',tipo:ls('tipo')||'Normal'};
let modulos=lsj('modulos',MOD_BASE),variedades=lsj('variedades',[]),registros=lsj('registros',[]),cola=lsj('cola',[]),enviando=false,online=true;

function today(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function fmt(d){const[y,m,x]=String(d).split('-');return`${x}/${m}/${y}`}
function esperado(c,t){return c*(JARRAS[t]*JARRA+TARA)}
function nivel(p){return p<98?'lo':p>103?'hi':'ok'}

/* ---------- opciones ---------- */
function press(box,val){box.querySelectorAll('.opt').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===val)))}
function renderModulos(){
  const sel=$('modulo'),cur=sel.value||ls('modulo')||'';
  const first=modulos.filter(m=>m.fundo===S.acopio),rest=modulos.filter(m=>m.fundo!==S.acopio);
  const grp=(t,a)=>a.length?`<optgroup label="${esc(t)}">${a.map(m=>`<option value="${esc(m.modulo)}">${esc(m.modulo)} · ${esc(m.fundo)}</option>`).join('')}</optgroup>`:'';
  sel.innerHTML='<option value="">Elige el módulo</option>'+grp(S.acopio?'De '+S.acopio:'Módulos',first)+grp('Otros fundos',rest);
  if(modulos.some(m=>m.modulo===cur))sel.value=cur;showFundo();
}
function showFundo(){const m=modulos.find(x=>x.modulo===$('modulo').value);$('fundo').textContent=m?'Fundo '+m.fundo:''}
function renderVariedades(){
  const list=VAR_BASE;
  if(S.variedad&&!list.includes(S.variedad)){S.variedad='';ls('variedad',null)}
  $('variedad').innerHTML=list.map(v=>`<button type="button" class="opt" data-v="${esc(v)}">${esc(v.charAt(0)+v.slice(1).toLowerCase())}</button>`).join('');
  press($('variedad'),S.variedad);
}
$('grupo').innerHTML=['A','B','C','D','E'].map(g=>`<button type="button" class="opt" data-v="${g}">${g}</button>`).join('');
$('acopio').onclick=e=>{const b=e.target.closest('.opt');if(!b)return;S.acopio=b.dataset.v;ls('acopio',S.acopio);press($('acopio'),S.acopio);
  const c=ls('cant:'+S.acopio);if(c)$('cant').value=c;renderModulos();clearErr();preview()};
$('variedad').onclick=e=>{const b=e.target.closest('.opt');if(!b)return;
  if(b.dataset.v==='__otra'){S.variedad='';$('varOtra').classList.remove('hidden');$('varOtra').focus();press($('variedad'),'__otra')}
  else{S.variedad=b.dataset.v;$('varOtra').classList.add('hidden');press($('variedad'),S.variedad);ls('variedad',S.variedad)}clearErr()};
$('varOtra').oninput=()=>{S.variedad=$('varOtra').value.trim().toUpperCase();ls('variedad',S.variedad);clearErr()};
$('grupo').onclick=e=>{const b=e.target.closest('.opt');if(!b)return;S.grupo=b.dataset.v;ls('grupo',S.grupo);press($('grupo'),S.grupo);clearErr()};
$('tipo').onclick=e=>{const b=e.target.closest('.opt');if(!b)return;S.tipo=b.dataset.v;ls('tipo',S.tipo);press($('tipo'),S.tipo);preview()};
$('modulo').onchange=()=>{ls('modulo',$('modulo').value);showFundo();clearErr()};
$('cant').oninput=()=>{if(S.acopio&&$('cant').value)ls('cant:'+S.acopio,$('cant').value);preview();clearErr()};
$('kg').oninput=()=>{preview();clearErr()};
$('kg').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();save()}});

/* ---------- vista previa ---------- */
function preview(){
  const c=parseFloat($('cant').value),kg=parseFloat($('kg').value),box=$('check');
  if(!(c>0)||!(kg>0)){box.className='check';return}
  const esp=esperado(c,S.tipo),pct=kg/esp*100,n=nivel(pct);
  const txt={ok:'Peso correcto',hi:'Sobrepeso',lo:'Bajo peso'}[n];
  box.className='check '+n;
  box.innerHTML=`<b>${pct.toFixed(1)}%</b><span><b style="font-size:16px">${txt}</b><br>Esperado ${esp.toFixed(2)} kg · ${(kg-esp>=0?'+':'')+(kg-esp).toFixed(2)} kg</span>`;
}

/* ---------- guardar (instantáneo, envío en segundo plano) ---------- */
function clearErr(){$('err').style.display='none';document.querySelectorAll('.bad').forEach(e=>e.classList.remove('bad'))}
function fail(m,id){$('err').textContent=m;$('err').style.display='block';const el=id&&$(id);if(el){el.classList.add('bad');el.scrollIntoView({behavior:'smooth',block:'center'});if(el.focus&&el.tagName!=='DIV')el.focus()}}
function collect(){return{t:Date.now(),id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),fecha:$('fecha').value,acopio:S.acopio,modulo:$('modulo').value,variedad:S.variedad,grupo:S.grupo,tipo:S.tipo,cantidad:parseInt($('cant').value,10),kg:parseFloat($('kg').value)}}
function validate(r){
  if(!r.fecha)return['Elige la fecha.','fecha'];
  if(!r.acopio)return['Elige el acopio.','acopio'];
  if(!r.modulo)return['Elige el módulo.','modulo'];
  if(!r.variedad)return['Elige la variedad.','variedad'];
  if(!r.grupo)return['Elige el grupo.','grupo'];
  if(!(r.cantidad>0))return['Escribe cuántas bandejas.','cant'];
  if(!(r.kg>0))return['Escribe el peso en kg.','kg'];
  const esp=esperado(r.cantidad,r.tipo),p=r.kg/esp;
  if(p<0.6||p>1.4)return[`${r.kg} kg está muy lejos de lo normal para ${r.cantidad} bandejas (≈${esp.toFixed(1)} kg). Revisa el peso o la cantidad.`,'kg'];
  return null;
}
function save(){
  const r=collect();const bad=validate(r);if(bad){fail(...bad);return}
  cola.push(r);ls('cola',JSON.stringify(cola));
  if(navigator.vibrate)navigator.vibrate(30);
  showUndo(r);
  $('kg').value='';preview();renderList();$('kg').focus();
  flush();
}
async function flush(){
  if(enviando||!cola.length||!API)return;
  enviando=true;status();
  const lote=cola.slice(0,20);
  try{
    const res=await fetch(API,{method:'POST',body:JSON.stringify({registros:lote})});
    const j=await res.json();if(!j.ok)throw new Error(j.error||'Error');
    const ok=new Set(j.guardados);const sent=cola.filter(x=>ok.has(x.id));
    registros.push(...sent);cola=cola.filter(x=>!ok.has(x.id));
    ls('cola',JSON.stringify(cola));ls('registros',JSON.stringify(registros.slice(-300)));online=true;
  }catch(e){online=false}
  enviando=false;status();renderList();
  if(cola.length&&online)setTimeout(flush,300);
}
function status(){
  const s=$('st');
  if(enviando){s.className='st busy';s.textContent='Enviando '+cola.length+'…';return}
  if(!online){s.className='st off';s.textContent='Sin señal'+(cola.length?' · '+cola.length+' en espera':'');return}
  s.className='st';s.textContent=cola.length?cola.length+' en espera':'✓ Todo en la hoja';
}

/* ---------- resumen del día ---------- */
function renderList(){
  const f=$('fecha').value||today();
  const all=[...registros.filter(r=>r.fecha===f).map(r=>({...r,p:false})),...cola.filter(r=>r.fecha===f).map(r=>({...r,p:true}))];
  $('cnt').textContent=fmt(f)+' · '+all.length+' registro'+(all.length===1?'':'s');
  const g={};all.forEach(r=>{const t=r.tipo in JARRAS?r.tipo:'Normal';const e=esperado(+r.cantidad,t);if(!(e>0))return;(g[r.grupo]=g[r.grupo]||{n:0,kg:0,e:0});g[r.grupo].n++;g[r.grupo].kg+=+r.kg;g[r.grupo].e+=e});
  $('sum').innerHTML=Object.keys(g).sort().map(k=>{const p=g[k].kg/g[k].e*100;return`<div class="${nivel(p)}"><small>Grupo ${esc(k)} · ${g[k].n}</small><b>${p.toFixed(1)}%</b></div>`}).join('');
  $('list').innerHTML=all.length?all.slice().reverse().slice(0,40).map(r=>{const t=r.tipo in JARRAS?r.tipo:'Normal';const p=+r.kg/esperado(+r.cantidad,t)*100;
    return`<div class="reg"><div class="g">${esc(r.grupo)}</div><div>${esc(r.modulo)} · ${esc(r.variedad)}<small>${esc(String(r.acopio).replace('VALLE AZUL','VA'))} · ${esc(r.tipo)} · ${esc(r.cantidad)} band. · <span style="color:var(--${nivel(p)==='ok'?'leaf':nivel(p)==='hi'?'warn':'red'})">${isFinite(p)?p.toFixed(1)+'%':''}</span>${r.p?' · <span class="pend">enviando…</span>':''}</small></div><div class="kg">${Number(r.kg).toFixed(3)}<small> kg</small>${r.id&&r.t&&Date.now()-r.t<5.5*3600e3?`<br><button type="button" class="del" data-del="${esc(r.id)}">Deshacer</button>`:''}</div></div>`}).join(''):'<div class="empty">Aún no hay registros este día.</div>';
}
$('fecha').onchange=renderList;
/* ---------- deshacer ---------- */
let undoRec=null,undoTimer=null;
function showUndo(r){undoRec=r;$('undoTxt').textContent='✓ Guardado · Grupo '+r.grupo+' · '+r.kg.toFixed(3)+' kg';
  const u=$('undo');u.classList.add('hidden');void u.offsetWidth;u.classList.remove('hidden');clearTimeout(undoTimer);undoTimer=setTimeout(()=>u.classList.add('hidden'),7000)}
$('undoBtn').onclick=()=>{$('undo').classList.add('hidden');if(undoRec)deshacer(undoRec.id)};
async function deshacer(id){
  while(enviando)await new Promise(z=>setTimeout(z,200));
  const qi=cola.findIndex(x=>x.id===id);
  if(qi>=0){const r=cola.splice(qi,1)[0];ls('cola',JSON.stringify(cola));renderList();status();toast('Registro borrado ('+r.kg.toFixed(3)+' kg)');return}
  const r=registros.find(x=>x.id===id);if(!r)return;
  toast('Borrando…');
  try{const res=await fetch(API,{method:'POST',body:JSON.stringify({accion:'deshacer',id:r.id,kg:r.kg,modulo:r.modulo})});const j=await res.json();
    if(!j.ok){toast(j.error||'No se pudo deshacer');return}
    registros=registros.filter(x=>x.id!==id);ls('registros',JSON.stringify(registros.slice(-300)));renderList();toast('Registro borrado de la hoja (fila '+j.fila+')');
  }catch(e){toast('Sin señal: no se pudo borrar. Inténtalo de nuevo.')}
}
$('list').onclick=e=>{const b=e.target.closest('[data-del]');if(!b)return;
  if(!b.classList.contains('sure')){b.classList.add('sure');b.textContent='¿Borrar?';setTimeout(()=>{b.classList.remove('sure');b.textContent='Deshacer'},3000);return}
  deshacer(b.dataset.del)};

async function load(){
  try{
    const r=await fetch(API);const j=await r.json();if(!j.ok)throw new Error(j.error);
    if(j.modulos&&j.modulos.length){modulos=j.modulos;ls('modulos',JSON.stringify(modulos))}
    variedades=j.variedades||[];ls('variedades',JSON.stringify(variedades));
    const mine=registros.filter(x=>x.id&&x.t&&Date.now()-x.t<5.5*3600e3);
    const hoja=(j.registros||[]).map(x=>({...x,fecha:String(x.fecha).slice(0,10)}));
    // conserva los registros propios recientes (para poder deshacerlos) sin duplicarlos
    const usados=new Set();
    mine.forEach(m=>{const i=hoja.findIndex((h,k)=>!usados.has(k)&&h.fecha===m.fecha&&String(h.modulo)===String(m.modulo)&&Math.abs(+h.kg-+m.kg)<0.0005&&String(h.grupo)===String(m.grupo));if(i>=0){usados.add(i);hoja[i]={...hoja[i],id:m.id,t:m.t}}});
    registros=hoja;ls('registros',JSON.stringify(registros.slice(-300)));
    online=true;renderModulos();renderVariedades();renderList();status();flush();return true;
  }catch(e){online=false;status();renderList();return false}
}

/* ---------- configuración ---------- */
function showApp(){$('setup').classList.add('hidden');['form','listCard','bar'].forEach(i=>$(i).classList.remove('hidden'))}
// Oculto: mantener presionado el encabezado (logos) 1.5 s para cambiar el enlace de la hoja
{let lp=null;const h=$('hdr');
 const start=()=>{lp=setTimeout(()=>{$('setup').classList.remove('hidden');$('apiIn').value=API;if(navigator.vibrate)navigator.vibrate(60);$('setup').scrollIntoView({behavior:'smooth'})},1500)};
 const stop=()=>clearTimeout(lp);
 h.addEventListener('pointerdown',start);['pointerup','pointerleave','pointercancel'].forEach(t=>h.addEventListener(t,stop));
 h.addEventListener('contextmenu',e=>e.preventDefault())}
$('apiNo').onclick=()=>$('setup').classList.add('hidden');
$('apiSave').onclick=async()=>{
  const u=$('apiIn').value.trim();$('apiErr').style.display='none';
  if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(u)){$('apiErr').textContent='Debe empezar con https://script.google.com/macros/s/ y terminar en /exec';$('apiErr').style.display='block';return}
  API=u;ls('api',u);showApp();toast((await load())?'Conectado a la hoja':'No se pudo leer la hoja')};
$('btnSave').onclick=save;
$('btnRef').onclick=async()=>{await flush();toast((await load())?'Actualizado':'Sin señal')};
window.addEventListener('online',()=>{online=true;flush()});
setInterval(()=>{if(cola.length)flush()},15000);

/* ---------- app instalable ---------- */
let installEvt=null;
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw-pesos.js',{scope:'./registro-pesos-bandejas.html'}).catch(()=>{}));
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;$('inst').classList.remove('hidden')});
window.addEventListener('appinstalled',()=>{$('inst').classList.add('hidden');toast('App instalada: búscala como "Pesos"')});
$('inst').onclick=async()=>{if(!installEvt){toast('En Chrome: ⋮ → Instalar app');return}installEvt.prompt();await installEvt.userChoice;installEvt=null;$('inst').classList.add('hidden')};

/* ---------- inicio ---------- */
$('fecha').value=today();press($('acopio'),S.acopio);press($('grupo'),S.grupo);press($('tipo'),S.tipo);
{const c=S.acopio&&ls('cant:'+S.acopio);if(c)$('cant').value=c}
renderModulos();renderVariedades();renderList();status();load();
</script>
</body>
</html>
