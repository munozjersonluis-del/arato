    <div class="modal-h"><b>⚙ Ajustes</b><button class="x" onclick="cerrarModal()">✕</button></div>
    <div class="muted" style="margin-bottom:6px">Horario que aparece por defecto al registrar, y costo por hora para calcular las horas extra en soles.</div>
    ${bloque('acopio')}${bloque('estibas')}
    <button class="primary" onclick="guardarAjustes()">Guardar ajustes</button>`);
}
async function guardarAjustes(){
  for(const m of ['acopio','estibas']){
    if(!stores[m]) continue;
    const v = id => document.getElementById(`aj_${m}_${id}`).value;
    stores[m].data.config = { inicio: v('ini') || CFG_DEF[m].inicio, fin: v('fin') || CFG_DEF[m].fin, descanso: parseInt(v('des') || '0', 10), costoHora: parseFloat(v('costo') || '0') || 0 };
    await guardarModulo(m);
  }
  cerrarModal(); render(); toast('Ajustes guardados ✔');
}

// --- Editar un registro
function abrirEditar(id){
  const r = state.registros.find(x => x.id === id); if(!r) return;
  if(semanaCerrada(mod, r.fecha)){ alert('Esa semana está cerrada. Reábrela en la pestaña Semana para poder editar.'); return; }
  const tipo = r.tipo || 'asistencia';
  abrirModal(`
    <div class="modal-h"><b>✏️ Editar registro</b><button class="x" onclick="cerrarModal()">✕</button></div>
    <div class="aj-t">${esc(r.trabajador)}</div>
    <label class="field">Tipo</label>
    <select class="field" id="ed_tipo" onchange="document.getElementById('ed_horas').style.display = this.value==='asistencia' ? 'block' : 'none'">
      <option value="asistencia" ${tipo==='asistencia'?'selected':''}>Asistencia</option>
      ${Object.entries(AUSENCIAS).map(([k,a]) => `<option value="${k}" ${tipo===k?'selected':''}>${a.label}</option>`).join('')}
    </select>
    <label class="field">Fecha</label><input class="field" type="date" id="ed_fecha" value="${r.fecha}">
    <div id="ed_horas" style="display:${tipo==='asistencia'?'block':'none'}">
      <div class="field-row">
        <div><label class="field">Inicio</label><input class="field" type="time" id="ed_ini" value="${r.inicio || cfg(mod).inicio}"></div>
        <div><label class="field">Fin</label><input class="field" type="time" id="ed_fin" value="${r.fin || cfg(mod).fin}"></div>
      </div>
      <label class="field">Descanso (min)</label><input class="field" type="number" min="0" step="5" id="ed_des" value="${r.descanso ?? 60}">
    </div>
    <label class="field">Observación</label><input class="field" id="ed_obs" value="${esc(r.obs || '')}" placeholder="Opcional">
    <div style="display:flex;gap:8px;margin-top:14px;"><button class="ghost" style="flex:1" onclick="cerrarModal()">Cancelar</button><button class="primary" style="flex:2" onclick="guardarEdicion(${r.id})">Guardar cambios</button></div>`);
}
async function guardarEdicion(id){
  const r = state.registros.find(x => x.id === id); if(!r) return;
  const tipo = document.getElementById('ed_tipo').value, fecha = document.getElementById('ed_fecha').value;
  if(!fecha){ alert('Elige la fecha.'); return; }
  if(semanaCerrada(mod, fecha)){ alert('La nueva fecha está en una semana cerrada.'); return; }
  r.fecha = fecha; r.obs = document.getElementById('ed_obs').value.trim();
  if(tipo === 'asistencia'){
    const ini = document.getElementById('ed_ini').value, fin = document.getElementById('ed_fin').value, des = parseInt(document.getElementById('ed_des').value || '0', 10);
    if(!ini || !fin){ alert('Completa inicio y fin.'); return; }
    delete r.tipo; r.inicio = ini; r.fin = fin; r.descanso = des; r.horas = calcHoras(ini, fin, des);
    const tot = horasSemanaTrab(mod, r.trabajadorDni, fecha);
    if(tot > MAX_SEMANA) toast(`⚠️ ${esc(nombreCorto(r.trabajador))} queda con <b>${tot.toFixed(1)} h</b> esta semana (máx. ${MAX_SEMANA})`, 5000);
  } else { r.tipo = tipo; r.inicio = ''; r.fin = ''; r.descanso = 0; r.horas = 0; }
  await saveState(); cerrarModal(); render(); toast('Registro actualizado ✔');
}
function horasSemanaTrab(m, dni, fecha, excluirId){
  const k = semKey(fecha);
  return stores[m].data.registros.filter(r => r.trabajadorDni === dni && !esAus(r) && semKey(r.fecha) === k && r.id !== excluirId).reduce((s,r)=>s+r.horas,0);
}

// --- Cierre de semana
async function toggleCierre(){
  const { days } = datosSemana(); const f = fmtDate(days[0]), k = semKey(f);
  const d = state; d.cerradas = d.cerradas || [];
  if(d.cerradas.includes(k)){
    if(!confirm(`¿Reabrir la semana ${semanaISO(days[0])}? Se podrá volver a registrar, editar y borrar.`)) return;
    d.cerradas = d.cerradas.filter(x => x !== k);
  } else {
    if(!confirm(`¿Cerrar la semana ${semanaISO(days[0])} de ${M().titulo}? Ya no se podrá registrar, editar ni borrar en esa semana.`)) return;
    d.cerradas.push(k);
  }
  await saveState(); render();
}

// --- Ficha por trabajador
let fichaDni = null, fichaMes = null;
function abrirFicha(dni){ fichaDni = dni; if(!fichaMes) fichaMes = fmtDate(new Date()); pintarFicha(); }
function moverFichaMes(n){ const d = parseDate(fichaMes); fichaMes = fmtDate(new Date(d.getFullYear(), d.getMonth() + n, 1)); pintarFicha(); }
function pintarFicha(){
  const t = state.trabajadores.find(x => x.dni === fichaDni) || { dni: fichaDni, nombre: (state.registros.find(r => r.trabajadorDni === fichaDni) || {}).trabajador || fichaDni };
  const fechas = diasDelMes(fichaMes), set = new Set(fechas);
  const regs = state.registros.filter(r => r.trabajadorDni === fichaDni && set.has(r.fecha));
  const asis = regs.filter(r => !esAus(r)), aus = regs.filter(esAus);
  const porDia = {}; asis.forEach(r => porDia[r.fecha] = (porDia[r.fecha]||0) + r.horas);
  const semanas = [...new Set(fechas.map(semKey))];
  const filasSem = semanas.map(k => {
    const h = Object.entries(porDia).filter(([f]) => semKey(f) === k).reduce((s,[,v])=>s+v,0);
    const dts = Object.keys(porDia).filter(f => semKey(f) === k).length;
    const a = aus.filter(r => semKey(r.fecha) === k);
    return { n: Number(k.split('-W')[1]), h, dts, ext: Math.max(0, h - JORNADA_SEMANA), a };
  });
  const horas = asis.reduce((s,r)=>s+r.horas,0), dias = Object.keys(porDia).length, extra = filasSem.reduce((s,x)=>s+x.ext,0);
  const cnt = tp => aus.filter(r => r.tipo === tp).length;
  const mes = parseDate(fichaMes);
  const ult = regs.slice().sort((a,b) => b.fecha.localeCompare(a.fecha) || b.id - a.id).slice(0, 8);
  abrirModal(`
    <div class="modal-h"><b>👤 Ficha del trabajador</b><button class="x" onclick="cerrarModal()">✕</button></div>
    <div class="weeknav"><button onclick="moverFichaMes(-1)">‹</button><div class="label" style="text-transform:capitalize">${MESES[mes.getMonth()]} ${mes.getFullYear()}</div><button onclick="moverFichaMes(1)">›</button></div>
    <div class="rep" id="fichaCard" style="margin-bottom:10px">
      <div class="rep-head"><img src="${LOGO_SRC}" alt="Mission"><div class="fecha"><small>${M().titulo}</small><span style="text-transform:capitalize">${MESES[mes.getMonth()]} ${mes.getFullYear()}</span></div></div>
      <div class="rep-title"><b>${esc(t.nombre)}</b><span>DNI ${esc(t.dni)} · Blueberries</span></div>
      ${t.baja ? `<div class="baja-banner">🚪 Dado de baja · último día ${diaCortoFijo(t.baja)} · ${esc(MOTIVOS_BAJA[t.bajaMotivo] || 'Baja')}${t.bajaObs ? ' · ' + esc(t.bajaObs) : ''}</div>` : ''}
      <div class="rep-kpis k3">
        ${kpi(dias, 'Días trab.')}${kpi(horas.toFixed(1), 'Horas')}${kpi(extra.toFixed(1), 'H. extra', extra?'warn':'')}
        ${kpi(cnt('falta'), 'Faltas', '', `background:${AUSENCIAS.falta.bg};--c:${AUSENCIAS.falta.color}`)}
        ${kpi(cnt('permiso'), 'Permisos', '', `background:${AUSENCIAS.permiso.bg};--c:${AUSENCIAS.permiso.color}`)}
        ${kpi(cnt('dm'), 'Desc. méd.', '', `background:${AUSENCIAS.dm.bg};--c:${AUSENCIAS.dm.color}`)}
      </div>
      <table class="rep-t"><thead><tr><th style="text-align:left">Semana</th><th>Días</th><th>Horas</th><th>Extra</th><th>Ausencias</th></tr></thead><tbody>
        ${filasSem.map(x => `<tr><td class="n">Sem ${x.n}</td><td>${x.dts || '–'}</td><td class="h" style="color:${COL_SEM[estadoSemana(x.h)]}">${x.h ? x.h.toFixed(1) : '–'}</td><td style="font-weight:800;color:${COL_SEM[estadoSemana(x.h)]}">${x.ext ? '+' + x.ext.toFixed(1) : '–'}</td><td>${x.a.map(r => badgeAus(r.tipo)).join(' ') || '–'}</td></tr>`).join('')}
      </tbody></table>
      <div class="gtitle">Últimos registros</div>
      ${ult.length ? ult.map(r => `<div class="ai" style="display:grid;grid-template-columns:62px 1fr auto;gap:8px;font-size:.74rem;padding:5px 0;border-bottom:1px solid #eef0f6"><span style="font-weight:700;color:#16226b">${diaCorto(r.fecha)} ${parseDate(r.fecha).getDate()===0?'':''}</span><span style="color:#636b8a">${esAus(r) ? AUSENCIAS[r.tipo].label + (r.obs ? ' · ' + esc(r.obs) : '') : `${r.inicio} – ${r.fin}`}</span><span style="font-weight:800">${esAus(r) ? badgeAus(r.tipo) : r.horas.toFixed(1) + ' h'}</span></div>`).join('') : '<div class="muted">Sin registros este mes.</div>'}
      ${hojaPie(`Extra = horas de cada semana − ${JORNADA_SEMANA} h`)}
    </div>
    <button class="primary" onclick="capturaNitida(document.getElementById('fichaCard'), 'ficha-${esc(t.dni)}-${MESES[mes.getMonth()]}.png')">📷 Enviar imagen (WhatsApp)</button>`);
}

async function eliminarRegistro(id){
  const r = state.registros.find(x => x.id === id);
  if(r && semanaCerrada(mod, r.fecha)){ alert('Esa semana está cerrada.'); return; }
  if(!confirm('¿Eliminar este registro de horas?')) return;
  state.registros = state.registros.filter(r => r.id !== id);
  await saveState();
  render();
}

init();
</script>
</body>
</html>
