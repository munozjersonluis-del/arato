<style>
  :root {
    --bg: #f2f4fa;
    --surface: #ffffff;
    --surface-2: #eef1f8;
    --ink: #141a3a;
    --ink-dim: #636b8a;
    --line: #dde2ef;
    --green: #1f2f8f;      /* azul Mission (principal) */
    --green-2: #4a5cc7;    /* arándano */
    --navy: #16226b;
    --berry: #5b6dd6;
    --red: #e8321f;        /* rojo Mission */
    --accent: #e8321f;
    --danger: #d12a18;
    --warn-bg: #fde8e5;
    --warn-ink: #b0240f;
    --shadow: 0 1px 2px rgba(20,26,58,0.05), 0 6px 18px rgba(20,26,58,0.07);
    --radius: 14px;
    --navh: 66px;
    --font-display: 'Barlow Condensed', -apple-system, sans-serif;
    --font-body: 'Barlow', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c1024; --surface: #151a36; --surface-2: #1c2244;
      --ink: #e9ecfa; --ink-dim: #a0a8cc; --line: #2a3160;
      --green: #8b9bf0; --green-2: #6f80e6; --navy: #111842; --berry: #8b9bf0;
      --accent: #ff5a45; --warn-bg: #3a1a16; --warn-ink: #ff8a78;
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 6px 18px rgba(0,0,0,0.35);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); }
  body {
    color: var(--ink); font-family: var(--font-body); line-height: 1.4;
    padding-bottom: calc(var(--navh) + env(safe-area-inset-bottom) + 10px);
  }
  .shell { max-width: 520px; margin: 0 auto; }
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
    position: sticky; top: 0; z-index: 20;
    background: linear-gradient(135deg, var(--navy) 0%, #24348f 60%, #3a4bb3 100%);
    color: #fff; border-bottom: 3px solid var(--red);
    box-shadow: 0 4px 16px rgba(22,34,107,0.25);
  }
  .brand-logo {
    width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--green), var(--green-2));
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; box-shadow: var(--shadow);
  }
  .topbar h1 { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; margin: 0; letter-spacing: .02em; color:#fff; }
  .topbar .titles { flex:1; min-width:0; }
  .topbar .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.68rem; color: rgba(255,255,255,0.75); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .sync-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .sync-dot.ok { background: #3ddc97; box-shadow: 0 0 0 3px rgba(61,220,151,0.25); }
  .sync-dot.pending { background: #ffc233; box-shadow: 0 0 0 3px rgba(255,194,51,0.25); }
  .sync-dot.offline { background: #ff5a45; box-shadow: 0 0 0 3px rgba(255,90,69,0.3); }

  main { padding: 0 14px 24px; }
  .view { display: none; animation: fadein .15s ease; }
  .view.active { display: block; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px);} to { opacity:1; transform:none; } }

  h2.section-title { font-family: var(--font-display); font-size: 1.05rem; font-weight: 800; margin: 4px 2px 12px; padding-left: 10px; border-left: 4px solid var(--red); letter-spacing: .02em; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); }

  label.field { display:block; font-size: 0.78rem; color: var(--ink-dim); margin-bottom: 4px; margin-top: 12px; font-weight: 600; }
  label.field:first-child { margin-top: 0; }
  input.field, select.field {
    width: 100%; padding: 11px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--ink); font-size: 1rem; font-family: var(--font-body);
  }
  input.field:focus, select.field:focus { outline: none; border-color: var(--green-2); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green-2) 25%, transparent); }
  .field-row { display:flex; gap: 10px; }
  .field-row > div { flex:1; }
  .trab-row { display:flex; gap: 8px; align-items: flex-end; }
  .trab-row select { flex: 1; }
  .trab-check-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 2px; border-bottom: 1px solid var(--line);
  }
  .trab-check-row:last-child { border-bottom: none; }
  .trab-check-row.all { border-bottom: 1px solid var(--line); margin-bottom: 4px; padding-bottom: 12px; }
  .trab-check-row label { display: flex; align-items: center; gap: 9px; font-size: 0.95rem; cursor: pointer; }
  .trab-check-row input[type="checkbox"] { width: 19px; height: 19px; accent-color: var(--green); flex-shrink: 0; }
  .dni-tag { font-size: 0.72rem; color: var(--ink-dim); }
  .icon-btn {
    flex-shrink: 0; width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--ink-dim); font-size: 1.1rem; cursor: pointer;
  }

  button.primary {
    width: 100%; padding: 14px; border-radius: 12px; border: none;
    background: linear-gradient(135deg, var(--navy), var(--green-2)); color: #fff; font-size: 1.02rem; box-shadow: 0 4px 12px rgba(31,47,143,0.3); text-transform: uppercase;
    font-family: var(--font-display); font-weight: 700; cursor: pointer; letter-spacing: .02em;
  }
  button.primary:active { opacity: 0.85; }
  button.ghost {
    width: 100%; background: transparent; border: 1px solid var(--line); color: var(--ink-dim);
    font-weight: 600; font-size: 0.85rem; padding: 10px; border-radius: 10px; cursor: pointer;
  }
  button.small { padding: 10px; font-size: 0.85rem; }

  .preview { text-align: center; font-family: var(--font-display); font-size: 1.6rem; font-weight: 800; color: var(--green); margin: 14px 0; }
  .preview .u { font-size: 0.9rem; color: var(--ink-dim); font-weight: 600; }

  .weeknav { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .weeknav button { flex-shrink: 0; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--green); font-weight:700; font-size: 1.1rem; cursor: pointer; }
  .weeknav .label { flex: 1; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 0.95rem; }

  table.week { width: 100%; border-collapse: collapse; font-size: 0.74rem; font-variant-numeric: tabular-nums; }
  table.week td:first-child { max-width: 110px; padding-left: 6px; }
  table.week th, table.week td { padding: 7px 2px; text-align: center; border-bottom: 1px solid var(--line); }
  table.week thead th { font-family: var(--font-display); font-weight: 700; color: #fff; background: var(--navy); font-size: 0.7rem; text-transform: uppercase; border-bottom: none; }
  table.week thead th:first-child { border-radius: 8px 0 0 0; } table.week thead th:last-child { border-radius: 0 8px 0 0; }
  table.week tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
  table.week td:first-child, table.week th:first-child { text-align: left; font-weight: 600; }
  table.week tr.total-row td { font-weight: 800; border-top: 2px solid var(--line); border-bottom: none; color: var(--green); }
  table.week td.zero { color: var(--ink-dim); opacity: 0.4; }
  .weeksum { display:flex; justify-content: space-between; align-items:center; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .weeksum .big { font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; color: var(--green); }
  .export-row { display: flex; gap: 10px; margin-top: 14px; }
  .export-row button { flex: 1; }

  .hist-day { margin-bottom: 16px; }
  .hist-day-label { font-family: var(--font-display); font-weight: 700; font-size: 0.85rem; color: var(--ink-dim); margin: 0 2px 6px; text-transform: uppercase; letter-spacing: .03em; }
  .hist-item { display:flex; justify-content:space-between; align-items:center; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
  .hist-item:last-child { border-bottom: none; }
  .hist-item .name { font-weight: 600; }
  .hist-item .meta { color: var(--ink-dim); font-size: 0.78rem; }
  .hist-item .horas { font-family: var(--font-display); font-weight: 700; color: var(--green); }
  .del-btn { background: none; border: none; padding: 0 0 0 10px; font-size: 0.95rem; cursor: pointer; }
  .muted { color: var(--ink-dim); font-size: 0.82rem; padding: 6px 0; }

  #loadingNote { text-align:center; color: var(--ink-dim); padding: 60px 0; }

  .bottomnav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    display: flex; height: var(--navh);
    padding-bottom: env(safe-area-inset-bottom);
    background: var(--surface); border-top: 1px solid var(--line);
    box-shadow: 0 -2px 16px rgba(0,0,0,0.08);
  }
  .navbtn {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    background: none; border: none; color: var(--ink-dim); font-family: var(--font-body);
    font-size: 0.66rem; font-weight: 700; cursor: pointer; padding: 6px 0 0;
  }
  .navbtn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .navbtn.active { color: var(--green); }
  .navbtn .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--green); margin-top: 1px; opacity: 0; }
  .navbtn.active .dot { opacity: 1; background: var(--red); width: 16px; border-radius: 2px; }
  .modswitch { display:flex; gap:4px; margin: 14px 14px 14px; padding: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; }
  .modswitch button {
    flex:1; padding: 9px 6px; border-radius: 9px; border: none;
    background: transparent; color: var(--ink-dim); font-family: var(--font-display);
    font-weight: 700; font-size: 0.82rem; cursor: pointer; letter-spacing: .02em; text-transform: uppercase; white-space: nowrap;
  }
  .modswitch button.active { background: var(--surface); color: var(--green); box-shadow: 0 1px 4px rgba(20,26,58,0.12); }
  .cargo-tag { font-size: 0.66rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 2px 6px; border-radius: 6px; background: var(--warn-bg); color: var(--warn-ink); }
  .cargo-tag.t { background: color-mix(in srgb, var(--green-2) 15%, transparent); color: var(--green); }
  table.week tr.sub-row td { font-weight: 700; color: var(--ink-dim); background: var(--surface-2); font-size: 0.72rem; }
  .searchbar { display:flex; align-items:center; gap:8px; background: var(--surface); border:1px solid var(--line); border-radius: 12px; padding: 0 10px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .searchbar svg { width:18px; height:18px; stroke: var(--ink-dim); fill:none; stroke-width:2; stroke-linecap:round; flex-shrink:0; }
  .searchbar input { flex:1; border:none; background:transparent; padding: 12px 0; font-size: 1rem; color: var(--ink); font-family: var(--font-body); outline:none; min-width:0; }
  .searchbar input:placeholder-shown + .clear { display:none; }
  .searchbar input::-webkit-search-cancel-button { display:none; }
  .searchbar .clear { border:none; background: var(--surface-2); color: var(--ink-dim); width:26px; height:26px; border-radius: 50%; cursor:pointer; font-size:.8rem; }
  .chips { display:flex; gap:6px; overflow-x:auto; padding-bottom: 2px; margin-bottom: 10px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex-shrink:0; border:1px solid var(--line); background: var(--surface); color: var(--ink-dim); border-radius: 999px; padding: 7px 13px; font-family: var(--font-display); font-weight:700; font-size: .82rem; letter-spacing:.02em; cursor:pointer; }
  .chip.on { background: var(--green); border-color: var(--green); color:#fff; }
  .filtro-info { font-size:.78rem; color: var(--ink-dim); margin: -2px 2px 10px; }
  .trab-check-row.oculto { display:none; }
  .rep { background:#fff; color:#141a3a; border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); border:1px solid #dde2ef; }
  .rep-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .rep-title { margin-top:10px; padding-bottom:10px; border-bottom: 3px solid #e8321f; }
  .rep-title b { display:block; font-family: var(--font-display); font-size: 1.3rem; font-weight:800; color:#1f2f8f; line-height:1.05; }
  .rep-title span { font-size:.68rem; font-weight:700; color:#636b8a; text-transform:uppercase; letter-spacing:.05em; }
  .rep-head img { height: 34px; }
  .rep-head .tt { flex:1; }
  .rep-head .tt b { display:block; font-family: var(--font-display); font-size: 1.15rem; font-weight:800; color:#1f2f8f; line-height:1.05; }
  .rep-head .tt span { font-size:.68rem; font-weight:700; color:#636b8a; text-transform:uppercase; letter-spacing:.05em; }
  .rep-head .fecha { text-align:right; font-family: var(--font-display); font-weight:800; color:#16226b; font-size:.95rem; line-height:1.1; }
  .rep-head .fecha small { display:block; font-size:.66rem; color:#636b8a; font-weight:700; text-transform:uppercase; }
  .rep-kpis { display:grid; grid-template-columns: repeat(4,1fr); gap:6px; margin: 12px 0; }
  .rep-kpi { background:#eef1f8; border-radius:10px; padding: 8px 4px; text-align:center; }
  .rep-kpi b { display:block; font-family: var(--font-display); font-size: 1.35rem; font-weight:800; color:#1f2f8f; line-height:1; }
  .rep-kpi span { font-size:.6rem; font-weight:700; color:#636b8a; text-transform:uppercase; letter-spacing:.03em; }
  .rep-kpi.alerta { background:#fde8e5; } .rep-kpi.alerta b { color:#d12a18; }
  table.rep-t { width:100%; border-collapse:collapse; font-size:.72rem; font-variant-numeric: tabular-nums; }
  table.rep-t th { background:#16226b; color:#fff; font-family: var(--font-display); font-weight:700; text-transform:uppercase; font-size:.64rem; padding:7px 3px; text-align:center; }
  table.rep-t th:first-child { border-radius:8px 0 0 0; } table.rep-t th:last-child { border-radius:0 8px 0 0; }
  table.rep-t td { padding:7px 3px; border-bottom:1px solid #e6e9f2; text-align:center; }
  table.rep-t td.n { text-align:left; font-weight:600; }
  table.rep-t tr:nth-child(even) td { background:#f6f7fb; }
  table.rep-t tr.extra td { background:#fdeeec; }
  table.rep-t td.hx { color:#d12a18; font-weight:800; }
  table.rep-t td.h { font-weight:800; color:#1f2f8f; }
  table.rep-t tr.tot td { font-weight:800; color:#1f2f8f; border-top:2px solid #1f2f8f; border-bottom:none; background:#fff; }
  .rep-nota { margin-top:10px; font-size:.7rem; color:#636b8a; display:flex; justify-content:space-between; gap:8px; }
  .rep-leyenda { display:inline-flex; align-items:center; gap:5px; } .rep-leyenda i { width:10px; height:10px; border-radius:2px; background:#fdeeec; border:1px solid #f3b7ad; display:inline-block; }
  .gtitle { font-family: var(--font-display); font-weight:800; color:#16226b; font-size:.95rem; margin: 14px 0 8px; display:flex; justify-content:space-between; align-items:baseline; }
  .gtitle small { font-family: var(--font-body); font-size:.66rem; color:#636b8a; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .hbar { display:grid; grid-template-columns: 98px 1fr 44px; align-items:center; gap:6px; margin-bottom:5px; font-size:.7rem; }
  .hbar .nm { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#141a3a; }
  .hbar .track { position:relative; height:16px; background:#eef1f8; border-radius:4px; }
  .hbar .fill { position:absolute; left:0; top:0; bottom:0; border-radius:4px; background: linear-gradient(90deg,#1f2f8f,#5b6dd6); }
  .hbar .fill.x { background: linear-gradient(90deg,#1f2f8f 0%, #5b6dd6 70%, #e8321f 100%); }
  .hbar .meta { position:absolute; top:-3px; bottom:-3px; width:0; border-left:2px dashed #e8321f; }
  .hbar .v { font-weight:800; color:#1f2f8f; text-align:right; font-variant-numeric: tabular-nums; }
  .hbar .v.x { color:#d12a18; }
  .vchart { display:flex; align-items:flex-end; gap:6px; height:150px; padding: 0 2px; border-bottom:2px solid #16226b; position:relative; }
  .vcol { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
  .vcol .vv { font-size:.66rem; font-weight:800; color:#1f2f8f; margin-bottom:3px; font-variant-numeric: tabular-nums; }
  .vcol .vb { width:100%; max-width:34px; border-radius:6px 6px 0 0; background: linear-gradient(180deg,#5b6dd6,#1f2f8f); min-height:2px; }
  .vcol.hoy .vb { background: linear-gradient(180deg,#ff6b57,#e8321f); }
  .vlabels { display:flex; gap:6px; padding: 5px 2px 0; }
  .vlabels div { flex:1; text-align:center; font-size:.62rem; font-weight:700; color:#636b8a; text-transform:uppercase; line-height:1.15; }
  .stack { display:flex; height:30px; border-radius:8px; overflow:hidden; background:#eef1f8; }
  .stack div { display:flex; align-items:center; justify-content:center; color:#fff; font-family: var(--font-display); font-weight:800; font-size:.9rem; }
  .donut-row { display:flex; align-items:center; gap:14px; }
  .donut { width:104px; height:104px; border-radius:50%; flex-shrink:0; position:relative; }
  .donut::after { content:''; position:absolute; inset:18px; background:#fff; border-radius:50%; }
  .donut span { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:1; font-family: var(--font-display); font-weight:800; font-size:1.3rem; color:#1f2f8f; line-height:1; }
  .donut span small { font-size:.55rem; color:#636b8a; font-family: var(--font-body); text-transform:uppercase; font-weight:700; margin-top:2px; }
  .leg { font-size:.74rem; display:flex; flex-direction:column; gap:7px; }
  .leg div { display:flex; align-items:center; gap:7px; } .leg i { width:12px; height:12px; border-radius:3px; display:inline-block; }
  .leg b { font-family: var(--font-display); font-size:.95rem; color:#141a3a; }
  .aus { display:inline-block; font-family: var(--font-display); font-weight:800; font-size:.68rem; padding: 1px 5px; border-radius:5px; letter-spacing:.02em; }
  .tipo-chips { display:grid; grid-template-columns: repeat(4,1fr); gap:5px; margin-bottom: 4px; }
  .tipo-chips button { border:1px solid var(--line); background: var(--surface-2); color: var(--ink-dim); border-radius:10px; padding: 9px 2px; font-family: var(--font-display); font-weight:700; font-size:.78rem; cursor:pointer; line-height:1.1; }
  .tipo-chips button.on { background: var(--green); border-color: var(--green); color:#fff; }

  .tipo-chips button[data-t="dm"].on { background:#6b46c1; border-color:#6b46c1; }
  .aus-box { border-radius: 12px; padding: 12px; margin: 12px 0 4px; text-align:center; font-weight:700; font-size:.9rem; }
  table.rep-t.sem td, table.rep-t.sem th { padding: 6px 1px; font-size: .64rem; }
  table.rep-t.sem td.n { font-size:.66rem; white-space:nowrap; max-width: 96px; overflow:hidden; text-overflow:ellipsis; }
  .rep-aus { margin-top: 12px; }
  .rep-aus .it { display:flex; justify-content:space-between; align-items:center; gap:8px; padding: 6px 0; border-bottom:1px solid #eef0f6; font-size:.74rem; }
  .rep-aus .it .ob { color:#636b8a; font-size:.68rem; }
  .cmp-row { display:grid; grid-template-columns: 1fr 86px 86px; align-items:center; gap:6px; padding: 7px 0; border-bottom:1px solid #eef0f6; font-size:.76rem; }

const JORNADA_DIA = 8, JORNADA_SEMANA = 48, MAX_SEMANA = 60;
// Estado semanal: normal ≤48 h · con extra 48–60 h · excede >60 h
function estadoSemana(t){ return t > MAX_SEMANA ? 'exc' : t > JORNADA_SEMANA ? 'ext' : 'ok'; }

function badgeAus(tipo){ const a = AUSENCIAS[tipo]; return a ? `<span class="aus" style="color:${a.color};background:${a.bg}">${a.cod}</span>` : ''; }
function semanaISO(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dia = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - dia);
  const ini = new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return Math.ceil((((t - ini) / 86400000) + 1) / 7);
}
function diasDeSemana(fechaRef){ const l = mondayOf(fechaRef); return [...Array(7)].map((_,i)=>{ const d = new Date(l); d.setDate(l.getDate()+i); return d; }); }
function nombreCorto(n){ const p = String(n||'').trim().split(/\s+/); if(p.length <= 2) return p.join(' '); return p[0] + ' ' + (p.length >= 4 ? p[p.length-2] : p[1]); }
let regTipo = 'asistencia';
// Resumen de un módulo en un conjunto de fechas (para reporte semanal y comparativo)
function resumen(data, fechas){
  const set = new Set(fechas);
  const regs = (data?.registros || []).filter(r => set.has(r.fecha));
  const asis = regs.filter(r => !esAus(r)), aus = regs.filter(esAus);
  const wd = {}; asis.forEach(r => { const k = r.trabajadorDni + '|' + r.fecha; wd[k] = (wd[k]||0) + r.horas; });
  let extra = 0; const conExtra = new Set(); let exceden = 0;
  if(fechas.length === 7){
    const pt = {}; Object.entries(wd).forEach(([k,h]) => { const d = k.split('|')[0]; pt[d] = (pt[d]||0) + h; });
    Object.entries(pt).forEach(([d,t]) => { if(t > JORNADA_SEMANA){ extra += t - JORNADA_SEMANA; conExtra.add(d); } if(t > MAX_SEMANA) exceden++; });
  } else {
    Object.entries(wd).forEach(([k,h]) => { if(h > JORNADA_DIA){ extra += h - JORNADA_DIA; conExtra.add(k.split('|')[0]); } });
  }
  const ausWD = new Set(aus.map(r => r.trabajadorDni + '|' + r.fecha));
  const cuenta = t => new Set(aus.filter(r => r.tipo === t).map(r => r.trabajadorDni + '|' + r.fecha)).size;
  const horas = asis.reduce((s,r)=>s+r.horas,0);
  const diasTrab = Object.keys(wd).length;
  return {
    personal: new Set(asis.map(r => r.trabajadorDni)).size,
    catalogo: (data?.trabajadores || []).length,
    horas, extra: Math.round(extra*10)/10, conExtra: conExtra.size, exceden, diasTrab,
    promedio: diasTrab ? horas / diasTrab : 0,
    faltas: cuenta('falta'), permisos: cuenta('permiso'), dm: cuenta('dm'), ausencias: ausWD.size,
    asistenciaPct: (diasTrab + ausWD.size) ? diasTrab / (diasTrab + ausWD.size) * 100 : 0,
    porDia: fechas.map(f => asis.filter(r => r.fecha === f).reduce((s,r)=>s+r.horas,0)),
    ausPorDia: fechas.map(f => new Set(aus.filter(r => r.fecha === f).map(r => r.trabajadorDni)).size),
    persPorDia: fechas.map(f => new Set(asis.filter(r => r.fecha === f).map(r => r.trabajadorDni)).size)
  };
}
let repFecha = null;
let repAutor = ''; try { repAutor = localStorage.getItem('horas_reporte_autor') || ''; } catch(e){}
function norm(x){ return String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function coincide(nombre, dni){ const q = norm(filtro.q).trim(); if(!q) return true; return q.split(/\s+/).every(p => norm(nombre).includes(p) || String(dni||'').includes(p)); }
function barraBusqueda(ph){

}

function chips(opciones, actual, onclickFn){

}
// Vuelve a pintar solo los resultados, sin tocar el buscador (para no perder el teclado)
function refrescarCuerpo(){
  if(activeTab === 'registrar'){ filtrarListaRegistrar(); return; }

  if(!b){ render(); return; }

function setPeriodo(p){ filtro.periodo = p; if(p==='fecha' && !filtro.fecha) filtro.fecha = fmtDate(new Date()); render(); }
function toggleSoloConHoras(){ filtro.soloConHoras = !filtro.soloConHoras; render(); }
let mod = 'acopio';
try { const m = localStorage.getItem(MOD_PREF_KEY); if(m && MODULOS[m]) mod = m; } catch(e){}
// stores[m] = { data, syncStatus: 'ok' | 'pending' | 'offline' }
const stores = {};
let state = null; // apunta siempre a stores[mod].data

function M(){ return MODULOS[mod]; }
function defaultState(m){ return { trabajadores: MODULOS[m].defaults.map(t => ({...t})), registros: [] }; }

function migrateState(raw, m){
  const parsed = {...(raw || {})};
  parsed.trabajadores = (parsed.trabajadores || []).map(t => typeof t === 'string' ? { dni:'', nombre:t } : t);
  parsed.registros = (parsed.registros || []).map(r => r.trabajadorDni !== undefined ? r : { ...r, trabajadorDni:'' });
  if(parsed.trabajadores.length === 0 && MODULOS[m].defaults.length > 0) parsed.trabajadores = MODULOS[m].defaults.map(t => ({...t}));
  return parsed;
}

function loadCache(m){
  try {
    const raw = localStorage.getItem(MODULOS[m].cacheKey);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(parsed && parsed.data && typeof parsed.pending === 'boolean'){
      return { data: migrateState(parsed.data, m), pending: parsed.pending };
    }
    return { data: migrateState(parsed, m), pending: true };
  } catch(e){ return null; }
}
function writeCache(m, pending){
  try { localStorage.setItem(MODULOS[m].cacheKey, JSON.stringify({data: stores[m].data, pending})); }
  catch(e){ /* sin localStorage: seguimos en memoria */ }
}
function updateSyncDot(){
  const el = document.getElementById('syncDot');
  if(!el || !stores[mod]) return;
  const s = stores[mod].syncStatus;
  el.className = 'sync-dot ' + s;
  el.title = s === 'ok' ? 'Sincronizado' : s === 'pending' ? 'Guardando…' : 'Sin conexión — se sincroniza al volver la señal';
}

function fmtDate(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function parseDate(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function mondayOf(date){
  const d = new Date(date);
  const day = d.getDay();
  d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
  d.setHours(0,0,0,0);
  return d;
}
function calcHoras(inicio, fin, descansoMin){
  const [ih, im] = inicio.split(':').map(Number);
  const [fh, fm] = fin.split(':').map(Number);
  let diff = (fh*60+fm) - (ih*60+im);
  if(diff < 0) diff += 24*60;
  let horas = (diff - (descansoMin||0)) / 60;
  if(horas < 0) horas = 0;
  return Math.round(horas*10)/10;
}
function fmtHoras(h){ return h.toLocaleString('es-PE',{minimumFractionDigits:1, maximumFractionDigits:1}) + 'h'; }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function cargoTag(t){
  if(!M().cargos || !t.cargo) return '';
  return `<span class="cargo-tag ${t.cargo==='Transporte'?'t':''}">${esc(t.cargo)}</span>`;
}

async function downloadFile(filename, blob){
  try {
    const downloads = await claude.use('downloads');
    if(downloads){ await downloads.save({filename, data: blob}); return; }
  } catch(e){ if(e && e.code === 'declined') return; }
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  } catch(e){ alert('No se pudo descargar el archivo en este navegador.'); }
}

function showApp(){
  document.getElementById('loadingNote').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('bottomnav').style.display = 'flex';
  const ms = document.getElementById('modswitch'); ms.dataset.ready = '1'; ms.style.display = activeTab === 'reporte' ? 'none' : 'flex';
}

async function cargarModulo(m){
  const cache = loadCache(m);
  if(cache){ stores[m] = { data: cache.data, syncStatus: cache.pending ? 'pending' : 'ok' }; }
  try {
    const { data, error } = await sb.from('acopio_horas_estado').select('data').eq('id', MODULOS[m].rowId).maybeSingle();
    if(error) throw error;
    if(data && (!cache || !cache.pending)){
      stores[m] = { data: migrateState(data.data, m), syncStatus: 'ok' };
    } else if(!data && !cache){
      stores[m] = { data: defaultState(m), syncStatus: 'ok' };
      await sb.from('acopio_horas_estado').insert({ id: MODULOS[m].rowId, data: stores[m].data });
    }
    writeCache(m, stores[m].syncStatus === 'pending');
    if(stores[m].syncStatus === 'pending') trySync(m);
  } catch(err){
    if(!stores[m]) stores[m] = { data: defaultState(m), syncStatus: 'offline' };
    else stores[m].syncStatus = 'offline';
  }
  if(m === mod){ state = stores[m].data; }
}

function init(){
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Mostrar al instante lo que haya en caché del módulo activo
  const cache = loadCache(mod);
  if(cache){
    stores[mod] = { data: cache.data, syncStatus: cache.pending ? 'pending' : 'ok' };
    state = stores[mod].data;
    showApp(); render(); updateSyncDot();
  }

  (async () => {
    await Promise.all(Object.keys(MODULOS).map(cargarModulo));
    state = stores[mod].data;
    showApp(); render(); updateSyncDot();

    Object.keys(MODULOS).forEach(m => {
      sb.channel('horas_changes_' + m)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'acopio_horas_estado', filter: 'id=eq.' + MODULOS[m].rowId }, payload => {
          if(payload.new && payload.new.data && stores[m] && stores[m].syncStatus !== 'pending'){
            stores[m].data = migrateState(payload.new.data, m);
            stores[m].syncStatus = 'ok';
            writeCache(m, false);
            if(m === mod){ state = stores[m].data; updateSyncDot(); rerenderSafe(); }
          }
        })
        .subscribe();
    });

    const syncAll = () => Object.keys(MODULOS).forEach(m => trySync(m));
    window.addEventListener('online', syncAll);
    setInterval(syncAll, 20000);
  })();
}

// Evita borrar lo que el usuario está llenando en Registrar si llega un cambio remoto
function rerenderSafe(){
  if(activeTab !== 'registrar'){ render(); return; }
  const marcados = [...document.querySelectorAll('.chk-trab:checked')].map(b => b.value);
  const vals = ['fechaInput','inicioInput','finInput','descansoInput'].map(id => { const e = document.getElementById(id); return e ? e.value : null; });
  render();
  ['fechaInput','inicioInput','finInput','descansoInput'].forEach((id,i) => { const e = document.getElementById(id); if(e && vals[i] !== null) e.value = vals[i]; });
  marcados.forEach(d => { const b = document.querySelector(`.chk-trab[value="${d}"]`); if(b) b.checked = true; });
  actualizarPreview(); syncCount();
}

async function trySync(m){
  const s = stores[m];
  if(!s || (s.syncStatus !== 'pending' && s.syncStatus !== 'offline')) return;
  if(navigator.onLine === false){ s.syncStatus = 'offline'; if(m===mod) updateSyncDot(); return; }
  try {
    const { error } = await sb.from('acopio_horas_estado').upsert({ id: MODULOS[m].rowId, data: s.data, updated_at: new Date().toISOString() });
    if(error) throw error;
    s.syncStatus = 'ok';
    writeCache(m, false);
  } catch(err){
    s.syncStatus = 'offline';
    writeCache(m, true);
  }
  if(m === mod) updateSyncDot();
}

async function saveState(){
  const m = mod;
  stores[m].syncStatus = 'pending';
  writeCache(m, true);
  updateSyncDot();
  await trySync(m);
}

const MOTIVOS_BAJA = { cese: 'Cese / renuncia', area: 'Cambio de área', otro: 'Otro' };
function hoyStr(){ return fmtDate(new Date()); }
function activoEn(t, fecha){ return !t.baja || fecha <= t.baja; }
function fCorta(f){ const d = parseDate(f); return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0'); }
function tagBaja(t){ return t && t.baja ? `<span class="btag" title="${esc(MOTIVOS_BAJA[t.bajaMotivo] || 'Baja')}">BAJA ${fCorta(t.baja)}</span>` : ''; }
function trabDe(m, dni){ const d = stores[m] && stores[m].data; return d ? d.trabajadores.find(x => x.dni === dni) : null; }

function catalogoOrdenado(){
  const lista = state.trabajadores.slice();
  if(M().cargos){
    const ord = c => { const i = M().cargos.indexOf(c); return i < 0 ? 99 : i; };
    lista.sort((a,b) => ord(a.cargo) - ord(b.cargo) || a.nombre.localeCompare(b.nombre));

    lista.sort((a,b) => a.nombre.localeCompare(b.nombre));

}

function viewRegistrar(){
  const hoy = hoyStr();
  const activos = catalogoOrdenado().filter(t => activoEn(t, hoy));

      <button class="ghost small" onclick="reactivarTrabajador('${esc(t.dni)}')">Reactivar</button>
    </div>`).join('');
  const filas = activos.map(t => `
    <div class="trab-check-row" data-n="${esc(t.nombre)}" data-d="${esc(t.dni)}">
      <label><input type="checkbox" class="chk-trab" value="${esc(t.dni)}" onchange="syncCount()"> <span>${esc(t.nombre)}</span> ${cargoTag(t)} <span class="dni-tag">${esc(t.dni)}</span></label>

function actualizarPreview(){
  const inicio = document.getElementById('inicioInput')?.value;
  const fin = document.getElementById('finInput')?.value;
  const descanso = parseInt(document.getElementById('descansoInput')?.value || '0', 10);
  const el = document.getElementById('horasPreview');
  if(el && inicio && fin) el.textContent = fmtHoras(calcHoras(inicio, fin, descanso));
}

function syncCount(){
  const boxes = [...document.querySelectorAll('.chk-trab')];
  const checked = boxes.filter(b => b.checked).length;
  const label = document.getElementById('selCount');
  if(label) label.textContent = `${checked} trabajador${checked===1?'':'es'} seleccionado${checked===1?'':'s'}`;
  const chkAll = document.getElementById('chkAll');
  if(chkAll){
    const vis = visiblesChk(); const visOn = vis.filter(b => b.checked).length;
    chkAll.checked = vis.length > 0 && visOn === vis.length;
    chkAll.indeterminate = visOn > 0 && visOn < vis.length;
  }
}
function filtrarListaRegistrar(){
  let vis = 0;
  document.querySelectorAll('.trab-check-row[data-d]').forEach(r => { const ok = coincide(r.dataset.n, r.dataset.d); r.classList.toggle('oculto', !ok); if(ok) vis++; });
  const lbl = document.getElementById('chkAllLbl');
  if(lbl) lbl.textContent = filtro.q ? `Seleccionar los ${vis} filtrados` : 'Seleccionar todos';
  syncCount();
}
function visiblesChk(){ return [...document.querySelectorAll('.trab-check-row:not(.oculto) .chk-trab')]; }
function toggleAll(checked){ visiblesChk().forEach(b => b.checked = checked); syncCount(); }
function marcarCargo(c){
  const dnis = new Set(state.trabajadores.filter(t => t.cargo === c).map(t => t.dni));
  document.querySelectorAll('.chk-trab').forEach(b => b.checked = dnis.has(b.value));
  syncCount();
}

async function nuevoTrabajador(){
  const dni = prompt('DNI del nuevo trabajador:');
  if(!dni || !dni.trim()) return;
  const d = dni.trim();
  const existe = state.trabajadores.find(t => t.dni === d);
  if(existe){ if(existe.baja){ if(confirm(`${existe.nombre} está dado de baja (último día ${fCorta(existe.baja)}). ¿Reactivarlo?`)){ delete existe.baja; delete existe.bajaMotivo; delete existe.bajaObs; await saveState(); render(); } } else alert('Ese DNI ya está en el catálogo.'); return; }
  const nombre = prompt('Nombre completo:');
  if(!nombre || !nombre.trim()) return;
  const nuevo = { dni: d, nombre: nombre.trim() };
  if(M().cargos){
    const op = prompt(`Cargo:\n${M().cargos.map((c,i)=>`${i+1} = ${c}`).join('\n')}`, '1');
    const idx = parseInt(op, 10) - 1;
    nuevo.cargo = M().cargos[idx] || M().cargos[0];
  }
  state.trabajadores.push(nuevo);
  state.trabajadores.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  await saveState();
  render();
  const box = document.querySelector(`.chk-trab[value="${d}"]`);
  if(box){ box.checked = true; syncCount(); }
}

let bajaMotivoSel = 'cese';
function abrirBaja(dni){
  const t = state.trabajadores.find(x => x.dni === dni); if(!t) return;
  const ult = state.registros.filter(r => r.trabajadorDni === dni && !esAus(r)).map(r => r.fecha).sort().pop();
  bajaMotivoSel = t.bajaMotivo || 'cese';
  abrirModal(`
    <div class="modal-h"><b>🚪 Dar de baja</b><button class="x" onclick="cerrarModal()">✕</button></div>
    <div style="font-weight:800;margin-bottom:2px">${esc(t.nombre)}</div>
    <div class="muted" style="margin-bottom:10px">DNI ${esc(t.dni)}${ult ? ` · último registro: ${diaCortoFijo(ult)}` : ''}</div>
    <label class="field">Último día que trabajó</label>
    <input class="field" type="date" id="bajaFecha" value="${t.baja || ult || hoyStr()}">
    <label class="field">Motivo</label>
    <div class="tipo-chips" style="grid-template-columns:repeat(3,1fr)">${Object.entries(MOTIVOS_BAJA).map(([k,v]) => `<button data-bm="${k}" class="${k===bajaMotivoSel?'on':''}" onclick="bajaMotivoSel='${k}'; document.querySelectorAll('[data-bm]').forEach(b=>b.classList.toggle('on', b.dataset.bm===bajaMotivoSel))">${v}</button>`).join('')}</div>
    <label class="field">Detalle (opcional)</label>
    <input class="field" id="bajaObs" placeholder="Ej. pasó a cosecha, se retiró…" value="${esc(t.bajaObs || '')}">
    <div class="muted" style="margin:6px 0 12px">Sus horas, faltas y permisos anteriores se mantienen en los reportes. Desde el día siguiente ya no aparece para registrar ni cuenta en el personal.</div>
    <button class="primary" onclick="guardarBaja('${esc(t.dni)}')">Confirmar baja</button>
    <button class="ghost small" style="width:100%;margin-top:10px;color:#d12a18" onclick="eliminarTrabajador('${esc(t.dni)}')">Eliminar del catálogo (solo si se agregó por error)</button>`);
}
function diaCortoFijo(f){ const d = parseDate(f); return DIAS[(d.getDay()+6)%7] + ' ' + fCorta(f); }
async function guardarBaja(dni){
  const t = state.trabajadores.find(x => x.dni === dni); if(!t) return;
  const fecha = document.getElementById('bajaFecha').value;
  if(!fecha){ alert('Indica el último día que trabajó.'); return; }
  const despues = state.registros.filter(r => r.trabajadorDni === dni && r.fecha > fecha).length;
  if(despues && !confirm(`${t.nombre} tiene ${despues} registro(s) después del ${fCorta(fecha)}. Se mantienen, pero revisa si están bien. ¿Continuar?`)) return;
  t.baja = fecha; t.bajaMotivo = bajaMotivoSel; t.bajaObs = (document.getElementById('bajaObs').value || '').trim();
  await saveState(); cerrarModal(); render();
  toast(`🚪 ${esc(nombreCorto(t.nombre))} dado de baja (último día ${fCorta(fecha)})`);
}
async function reactivarTrabajador(dni){
  const t = state.trabajadores.find(x => x.dni === dni); if(!t) return;
  if(!confirm(`¿Reactivar a ${t.nombre}? Volverá a aparecer para registrar.`)) return;
  delete t.baja; delete t.bajaMotivo; delete t.bajaObs;
  await saveState(); render();
}
async function eliminarTrabajador(dni){
  const t = state.trabajadores.find(x => x.dni === dni);
  if(!t) return;
  if(!confirm(`¿Eliminar a "${t.nombre}" del catálogo? Úsalo solo si lo agregaste por error. Sus registros de horas NO se borran.`)) return;
  state.trabajadores = state.trabajadores.filter(x => x.dni !== dni);
  await saveState();
  cerrarModal(); render();
}

function setRegTipo(t){ regTipo = t; pintarTipo(); }
function pintarTipo(){
  document.querySelectorAll('.tipo-chips button').forEach(b => b.classList.toggle('on', b.dataset.t === regTipo));

async function registrarHora(){
  const dnis = [...document.querySelectorAll('.chk-trab:checked')].map(b => b.value);
  if(dnis.length === 0){ alert('Marca al menos un trabajador.'); return; }
  const fecha = document.getElementById('fechaInput').value;
  if(fecha && semanaCerrada(mod, fecha)){ alert(`La semana ${semanaISO(parseDate(fecha))} está cerrada. Reábrela en la pestaña Semana si necesitas registrar.`); return; }
  const fuera = dnis.map(d => state.trabajadores.find(x => x.dni === d)).filter(t => t && fecha && !activoEn(t, fecha));
  if(fuera.length){ alert(`No se puede registrar el ${fCorta(fecha)} porque ya están de baja:\n\n${fuera.map(t => `• ${t.nombre} (último día ${fCorta(t.baja)})`).join('\n')}\n\nDesmárcalos o elige una fecha anterior.`); return; }
  if(AUSENCIAS[regTipo]){
    if(!fecha){ alert('Elige la fecha.'); return; }
    const obs = (document.getElementById('obsInput')?.value || '').trim();
    const yaTiene = dnis.filter(d => state.registros.some(r => r.trabajadorDni === d && r.fecha === fecha));
    if(yaTiene.length && !confirm(`${yaTiene.length} de los seleccionados ya tienen un registro ese día. ¿Guardar igual?`)) return;
    const ahora = Date.now();
    dnis.forEach((dni, i) => {
      const t = state.trabajadores.find(x => x.dni === dni);
      state.registros.push({ id: ahora + i, fecha, trabajadorDni: dni, trabajador: t ? t.nombre : dni, tipo: regTipo, obs, inicio: '', fin: '', descanso: 0, horas: 0 });
    });
    await saveState();
    regTipo = 'asistencia';
    setTab('historial');
    return;
  }
  const inicio = document.getElementById('inicioInput').value;
  const fin = document.getElementById('finInput').value;
  const descanso = parseInt(document.getElementById('descansoInput').value || '0', 10);
  if(!fecha || !inicio || !fin){ alert('Completa fecha, hora de inicio y hora de fin.'); return; }
  const horas = calcHoras(inicio, fin, descanso);
  // Aviso si alguien pasaría las 60 h de la semana
  const pasan = dnis.map(d => ({ d, t: horasSemanaTrab(mod, d, fecha) + horas })).filter(x => x.t > MAX_SEMANA);
  if(pasan.length){
    const nom = d => nombreCorto((state.trabajadores.find(x => x.dni === d) || {}).nombre || d);
    if(!confirm(`⚠️ Con este registro pasarían el máximo de ${MAX_SEMANA} h en la semana:\n\n${pasan.map(x => `• ${nom(x.d)}: ${x.t.toFixed(1)} h`).join('\n')}\n\n¿Guardar igual?`)) return;
  }
  const conExtra = dnis.filter(d => { const t = horasSemanaTrab(mod, d, fecha) + horas; return t > JORNADA_SEMANA && t <= MAX_SEMANA; }).length;
  const ahora = Date.now();
  dnis.forEach((dni, i) => {
    const t = state.trabajadores.find(x => x.dni === dni);
    const reg = { id: ahora + i, fecha, trabajadorDni: dni, trabajador: t ? t.nombre : dni, inicio, fin, descanso, horas };
    if(t && t.cargo) reg.cargo = t.cargo;
    state.registros.push(reg);
  });
  await saveState();
  setTab('semana');
  if(conExtra) toast(`${conExtra} trabajador${conExtra>1?'es':''} ya pasa${conExtra>1?'n':''} de ${JORNADA_SEMANA} h esta semana (horas extra)`);
}

function datosSemana(){
  const monday = mondayOf(new Date());
  monday.setDate(monday.getDate() + weekOffset*7);
  const days = [];
  for(let i=0;i<7;i++){ const d = new Date(monday); d.setDate(monday.getDate()+i); days.push(d); }
  const dayKeys = days.map(fmtDate);

  // Catálogo actual + cualquiera que tenga registros esa semana aunque ya no esté en el catálogo
  const mapa = {};
  catalogoOrdenado().filter(t => activoEn(t, dayKeys[0])).forEach(t => mapa[t.dni] = t);
  state.registros.filter(r => dayKeys.includes(r.fecha)).forEach(r => {
    if(!mapa[r.trabajadorDni]) mapa[r.trabajadorDni] = { dni: r.trabajadorDni, nombre: r.trabajador, cargo: r.cargo };
  });
  const catalogo = Object.values(mapa).sort((x,y) => x.nombre.localeCompare(y.nombre));

  const horasDe = t => dayKeys.map(k => state.registros.filter(r => r.trabajadorDni === t.dni && r.fecha === k && !esAus(r)).reduce((s,r)=>s+r.horas,0));
  const ausDe = t => dayKeys.map(k => { const a = state.registros.find(r => r.trabajadorDni === t.dni && r.fecha === k && esAus(r)); return a ? a.tipo : null; });
  const filas = catalogo.map(t => ({ t, horas: horasDe(t), aus: ausDe(t) }))
    .filter(f => coincide(f.t.nombre, f.t.dni))
    .filter(f => !filtro.soloConHoras || f.horas.some(h => h > 0) || f.aus.some(Boolean));
  const totalesDia = dayKeys.map((k,i) => filas.reduce((s,f)=>s+f.horas[i],0));
  const totalSemana = totalesDia.reduce((a,b)=>a+b,0);
  return { days, dayKeys, filas, totalesDia, totalSemana };
}

function rangoSemana(days){
  return `${days[0].getDate()} ${days[0].toLocaleDateString('es-PE',{month:'short'})} – ${days[6].getDate()} ${days[6].toLocaleDateString('es-PE',{month:'short'})}`;
}

function cuerpoSemana(){
  const { days, filas, totalesDia, totalSemana } = datosSemana();
  const rangeLabel = rangoSemana(days);
  const filaHTML = f => {
    const total = f.horas.reduce((a,b)=>a+b,0);
    return `<tr><td><a class="lnk" onclick="abrirFicha('${esc(f.t.dni)}')"><span class="nf">${esc(f.t.nombre)}</span><span class="nc">${esc(nombreCorto(f.t.nombre))}</span></a> ${tagBaja(trabDe(mod, f.t.dni))}</td>${f.horas.map((h,i) => h===0 && f.aus[i] ? `<td>${badgeAus(f.aus[i])}</td>` : `<td class="${h===0?'zero':''}">${h===0?'–':h.toFixed(1)}</td>`).join('')}<td style="font-weight:800;color:${total > JORNADA_SEMANA ? COL_SEM[estadoSemana(total)] : 'var(--green)'}">${total.toFixed(1)}</td></tr>`;
  };
  let cuerpo = '';
  if(filas.length === 0){
    cuerpo = `<tr><td colspan="9" class="muted">${(filtro.q || filtro.soloConHoras) ? 'Nadie coincide con el filtro.' : 'Aún no hay registros ni trabajadores.'}</td></tr>`;
  } else if(M().cargos){
    [...M().cargos, 'Sin cargo'].forEach(g => {
      const del = filas.filter(f => (f.t.cargo || 'Sin cargo') === g);
      if(del.length === 0) return;
      const sub = [0,1,2,3,4,5,6].map(i => del.reduce((s,f)=>s+f.horas[i],0));
      cuerpo += del.map(filaHTML).join('');
      cuerpo += `<tr class="sub-row"><td>Subtotal ${g}</td>${sub.map(v=>`<td>${v===0?'–':v.toFixed(1)}</td>`).join('')}<td>${sub.reduce((a,b)=>a+b,0).toFixed(1)}</td></tr>`;
    });
  } else {
    cuerpo = filas.map(filaHTML).join('');
  }
  const totalRow = filas.length === 0 ? '' : `<tr class="total-row"><td>Total día</td>${totalesDia.map(v=>`<td>${v.toFixed(1)}</td>`).join('')}<td>${totalSemana.toFixed(1)}</td></tr>`;
  const filtrado = filtro.q || filtro.soloConHoras;
  const nota = filtrado ? ` · Filtrado (${filas.length})` : '';
  return `
      <div class="card" id="weekCard">
        <div class="card-head"><div class="brandline"><img src="${LOGO_SRC}" alt="Mission"><span class="t1">${M().titulo} · Sem. ${semanaISO(days[0])}<small>Blueberries · ${rangeLabel}${nota}</small></span></div></div>
        <div style="overflow-x:auto;">
          <table class="week">
            <thead><tr><th>Nombre</th>${days.map((d,i)=>`<th><span class="nf">${DIAS[i]}</span><span class="nc">${DIAS[i].slice(0,2)}</span><br>${d.getDate()}</th>`).join('')}<th>Tot.</th></tr></thead>
            <tbody>${cuerpo}${totalRow}</tbody>
          </table>
        </div>
        <div style="font-size:.66rem;color:var(--ink-dim);margin-top:8px;">${Object.values(AUSENCIAS).map(a => `<span class="aus" style="color:${a.color};background:${a.bg}">${a.cod}</span> ${a.label}`).join(' &nbsp; ')}<br>Total: <b style="color:${COL_SEM.ok}">≤${JORNADA_SEMANA} h normal</b> · <b style="color:${COL_SEM.ext}">${JORNADA_SEMANA}–${MAX_SEMANA} h con extra</b> · <b style="color:${COL_SEM.exc}">+${MAX_SEMANA} h excede</b></div>
        <div class="weeksum">
          <span class="name" style="color:var(--ink-dim);font-weight:600;">${filtrado ? 'Total filtrado' : 'Total del equipo esta semana'}</span>
          <span class="big">${totalSemana.toFixed(1)}h</span>
        </div>
      </div>
      <div class="export-row">
        <button class="ghost small" onclick="exportarImagenSemana()">📷 Imagen (WhatsApp)</button>
        <button class="ghost small" onclick="exportarCSVSemana()">📄 CSV</button>
      </div>`;
}

// Captura nítida e igual en celular y laptop: ancho fijo, tema claro y escala 3x
let capturando = false;
async function capturaNitida(el, nombre){
  if(!el || typeof html2canvas === 'undefined' || capturando) return;
  capturando = true;
  const root = document.documentElement, temaPrev = root.getAttribute('data-theme');
  root.setAttribute('data-theme', 'light');
  el.classList.add('export-fijo');
  const aviso = document.createElement('div'); aviso.className = 'toast'; aviso.textContent = 'Generando imagen…'; document.body.appendChild(aviso);
  try {
    try { if(document.fonts && document.fonts.ready) await document.fonts.ready; } catch(e){}
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    const canvas = await html2canvas(el, { backgroundColor: '#ffffff', scale: 3, windowWidth: 760, useCORS: true, logging: false });
    await new Promise(res => canvas.toBlob(async blob => { if(blob) await downloadFile(nombre, blob); res(); }, 'image/png'));
  } catch(e){ alert('No se pudo generar la imagen.'); }
  finally {
    el.classList.remove('export-fijo');
    if(temaPrev === null) root.removeAttribute('data-theme'); else root.setAttribute('data-theme', temaPrev);
    aviso.remove(); capturando = false;
  }
}

async function exportarImagenSemana(){
  await capturaNitida(document.getElementById('weekCard'), `horas-${M().archivo}-semana-${semanaISO(datosSemana().days[0])}.png`);

function exportarCSVSemana(){
  const { filas } = datosSemana();
  const cab = M().cargos ? ['DNI','Trabajador','Cargo', ...DIAS, 'Total'] : ['DNI','Trabajador', ...DIAS, 'Total'];
  const rows = [cab];
  filas.forEach(f => {
    const base = M().cargos ? [f.t.dni, f.t.nombre, f.t.cargo || ''] : [f.t.dni, f.t.nombre];
    rows.push([...base, ...f.horas.map((h,i)=> h===0 && f.aus[i] ? AUSENCIAS[f.aus[i]].cod : h.toFixed(1)), f.horas.reduce((a,b)=>a+b,0).toFixed(1)]);
  });
  const csv = '\ufeff' + rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  downloadFile(`horas-${M().archivo}-semana-${semanaISO(datosSemana().days[0])}.csv`, new Blob([csv], {type:'text/csv;charset=utf-8;'}));
}

function registrosFiltradosHist(){
  const hoy = fmtDate(new Date());
  const ay = new Date(); ay.setDate(ay.getDate()-1); const ayer = fmtDate(ay);
  const lun = mondayOf(new Date()); const dom = new Date(lun); dom.setDate(lun.getDate()+6);
  const iniSem = fmtDate(lun), finSem = fmtDate(dom);
  return state.registros.filter(r => {
    if(filtro.periodo === 'hoy' && r.fecha !== hoy) return false;
    if(filtro.periodo === 'ayer' && r.fecha !== ayer) return false;
    if(filtro.periodo === 'semana' && (r.fecha < iniSem || r.fecha > finSem)) return false;
    if(filtro.periodo === 'fecha' && r.fecha !== filtro.fecha) return false;
    return coincide(r.trabajador, r.trabajadorDni);
  });
}

function viewHistorial(){
  return `
    <div class="view active">
      <h2 class="section-title">Historial · ${M().titulo}</h2>
      ${barraBusqueda('Filtrar trabajador (nombre o DNI)')}
      ${chips([['todo','Todo'],['hoy','Hoy'],['ayer','Ayer'],['semana','Semana'],['fecha','📅 Fecha']], filtro.periodo, 'setPeriodo')}
      ${filtro.periodo === 'fecha' ? `<input class="field" type="date" value="${filtro.fecha}" onchange="filtro.fecha=this.value; refrescarCuerpo()" style="margin-bottom:10px;">` : ''}
      <div id="vbody">${cuerpoHistorial()}</div>
    </div>`;
}

function cuerpoHistorial(){
  if(state.registros.length === 0) return `<div class="card"><div class="muted">Aún no hay registros.</div></div>`;
  const regs = registrosFiltradosHist();
  if(regs.length === 0) return `<div class="card"><div class="muted">No hay registros con ese filtro.</div></div>`;
  const totalHoras = regs.reduce((s,r)=>s+r.horas,0);
  const personas = new Set(regs.map(r => r.trabajadorDni)).size;
  const nAus = regs.filter(esAus).length;
  const porFecha = {};
  regs.slice().sort((a,b)=> b.id - a.id).forEach(r => { (porFecha[r.fecha] = porFecha[r.fecha] || []).push(r); });
  const fechas = Object.keys(porFecha).sort((a,b)=> b.localeCompare(a));
  const bloques = fechas.map(f => {
    const items = porFecha[f].map(r => `
      <div class="hist-item">
        <div>
          <div class="name"><a class="lnk" onclick="abrirFicha('${esc(r.trabajadorDni)}')">${esc(r.trabajador)}</a> ${r.cargo && M().cargos ? cargoTag(r) : ''}</div>
          <div class="meta">${esAus(r) ? `${AUSENCIAS[r.tipo].label}${r.obs ? ' · ' + esc(r.obs) : ''}` : `${r.inicio} – ${r.fin}${r.descanso ? ` · ${r.descanso} min descanso` : ''}`}</div>
        </div>
        <div style="display:flex;align-items:center;">
          <span class="horas">${esAus(r) ? badgeAus(r.tipo) : fmtHoras(r.horas)}</span>
          ${semanaCerrada(mod, r.fecha) ? '<span class="del-btn" title="Semana cerrada">🔒</span>' : `<button class="del-btn" onclick="abrirEditar(${r.id})" title="Editar">✏️</button><button class="del-btn" onclick="eliminarRegistro(${r.id})" title="Eliminar">🗑️</button>`}
        </div>
      </div>`).join('');
    const totalDia = porFecha[f].reduce((s,r)=>s+r.horas,0);
    const fechaLabel = parseDate(f).toLocaleDateString('es-PE', {weekday:'long', day:'numeric', month:'long'});
    return `<div class="hist-day"><div class="hist-day-label">${fechaLabel} · ${porFecha[f].length} reg. · ${totalDia.toFixed(1)}h</div><div class="card">${items}</div></div>`;
  }).join('');
  return `<div class="filtro-info">${regs.length} registros · ${personas} trabajador${personas===1?'':'es'} · <strong>${totalHoras.toFixed(1)}h</strong>${nAus ? ` · ${nAus} ausencia${nAus===1?'':'s'}` : ''}</div>${bloques}`;
}

// ================= REPORTES (hojas) =================
let repHoja = 'resumen', repPer = 'semana', repMod = null;
const MOD_TXT = { acopio: 'Acopio', estibas: 'Estibas y Transporte', ambos: 'Acopio + Estibas y T.' };
const MOD_COL = { acopio: '#1f2f8f', estibas: '#3a8fd9' };
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','setiembre','octubre','noviembre','diciembre'];

function modsSel(){ return repMod === 'ambos' ? ['acopio','estibas'] : [repMod]; }
function diasDelMes(fechaStr){ const d = parseDate(fechaStr), y = d.getFullYear(), m = d.getMonth(), n = new Date(y, m+1, 0).getDate(); return [...Array(n)].map((_,i) => fmtDate(new Date(y, m, i+1))); }
function fechasPer(per){ const p = per || repPer; return p === 'semana' ? diasDeSemana(parseDate(repFecha)).map(fmtDate) : p === 'mes' ? diasDelMes(repFecha) : [repFecha]; }
function soles(v){ return 'S/ ' + v.toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

function agregado(mods, fechas, modo){
  modo = modo || repPer;
  const set = new Set(fechas), W = {}; let catalogo = 0; const bajasPer = [];
  mods.forEach(m => {
    const d = stores[m] && stores[m].data; if(!d) return;
    catalogo += d.trabajadores.filter(t => activoEn(t, fechas[0])).length;
    d.trabajadores.filter(t => t.baja && t.baja >= fechas[0] && t.baja <= fechas[fechas.length-1]).forEach(t => bajasPer.push({ ...t, m }));
    d.registros.filter(r => set.has(r.fecha)).forEach(r => {
      const k = m + '|' + r.trabajadorDni;
      const w = W[k] || (W[k] = { k, m, dni: r.trabajadorDni, nombre: r.trabajador, porDia: {}, ini: {}, fin: {}, aus: [] });
      if(esAus(r)) w.aus.push({ fecha: r.fecha, tipo: r.tipo, obs: r.obs || '' });
      else {
        w.porDia[r.fecha] = (w.porDia[r.fecha] || 0) + r.horas;
        if(!w.ini[r.fecha] || r.inicio < w.ini[r.fecha]) w.ini[r.fecha] = r.inicio;
        if(!w.fin[r.fecha] || r.fin > w.fin[r.fecha]) w.fin[r.fecha] = r.fin;
      }
    });
  });
  const sem = modo !== 'dia';
  const semanas = [...new Set(fechas.map(semKey))];
  const lista = Object.values(W).map(w => {
    const horas = Math.round(Object.values(w.porDia).reduce((a,b)=>a+b,0)*10)/10;
    // horas por semana ISO (para reglas de 48 h / 60 h)
    const porSem = {}; Object.entries(w.porDia).forEach(([f,h]) => { const k = semKey(f); porSem[k] = (porSem[k]||0) + h; });
    let extra, est, pasa60 = false;
    if(sem){
      extra = Object.values(porSem).reduce((s,t) => s + Math.max(0, t - JORNADA_SEMANA), 0);
      pasa60 = Object.values(porSem).some(t => t > MAX_SEMANA);
      est = pasa60 ? 'exc' : extra > 0 ? 'ext' : 'ok';
    } else {
      extra = Math.max(0, horas - JORNADA_DIA);
      est = horas > JORNADA_DIA ? 'ext' : 'ok';
    }
    extra = Math.round(extra*10)/10;
    // costo: recargo 25 % primeras 2 h extra del día, 35 % las siguientes
    let p2 = 0, pr = 0; Object.values(w.porDia).forEach(h => { const ex = Math.max(0, h - JORNADA_DIA); p2 += Math.min(2, ex); pr += Math.max(0, ex - 2); });
    const tasa = (p2 + pr) ? (p2*1.25 + pr*1.35)/(p2 + pr) : 1.25;
    const ch = cfg(w.m).costoHora || 0;
    return { ...w, horas, porSem, dias: Object.keys(w.porDia).length, extra, est, pasa60, costo: extra * ch * tasa };
  }).sort((a,b) => a.m.localeCompare(b.m) || a.nombre.localeCompare(b.nombre));
  const trab = lista.filter(w => w.horas > 0);
  const ausItems = lista.flatMap(w => w.aus.map(a => ({ ...a, nombre: w.nombre, m: w.m }))).sort((a,b) => a.fecha.localeCompare(b.fecha) || a.nombre.localeCompare(b.nombre));
  const cnt = t => ausItems.filter(a => a.tipo === t).length;
  const diasTrab = trab.reduce((s,w)=>s+w.dias,0), horas = trab.reduce((s,w)=>s+w.horas,0);
  const semConDatos = semanas.filter(k => trab.some(w => w.porSem[k])).length || 1;
  return {
    modo, sem, semanas, semConDatos, lista, trab, catalogo, horas, personal: trab.length, diasTrab,
    promedio: diasTrab ? horas/diasTrab : 0,
    extra: trab.reduce((s,w)=>s+w.extra,0), conExtra: trab.filter(w=>w.extra>0).length,
    exceden: sem ? trab.filter(w => w.pasa60).length : 0,
    costo: trab.reduce((s,w)=>s+w.costo,0), sinCosto: mods.some(m => !(cfg(m).costoHora > 0)),
    bajasPer, ausItems, faltas: cnt('falta'), permisos: cnt('permiso'), dm: cnt('dm'),
    asistencia: (diasTrab + ausItems.length) ? diasTrab/(diasTrab + ausItems.length)*100 : 0,
    porDia: fechas.map(f => trab.reduce((s,w)=>s+(w.porDia[f]||0),0)),
    persDia: fechas.map(f => trab.filter(w => w.porDia[f]).length),
    ausDia: fechas.map(f => ausItems.filter(a => a.fecha === f).length),
    porSemana: semanas.map(k => ({ k, n: Number(k.split('-W')[1]), horas: trab.reduce((s,w)=>s+(w.porSem[k]||0),0), pers: trab.filter(w => w.porSem[k]).length, aus: ausItems.filter(a => semKey(a.fecha) === k).length }))
  };
}

function periodoTxt(per){
  const p = per || repPer;
  if(p === 'semana'){ const d = diasDeSemana(parseDate(repFecha)); return ['Semana ' + semanaISO(d[0]), rangoSemana(d)]; }
  const f = parseDate(repFecha);
  if(p === 'mes') return ['Mes', MESES[f.getMonth()] + ' ' + f.getFullYear()];
  return [f.toLocaleDateString('es-PE',{weekday:'long'}), f.toLocaleDateString('es-PE',{day:'numeric', month:'long'})];
}
function hojaCab(titulo, modTxt){
  const p = periodoTxt();
  return `<div class="rep-head"><img src="${LOGO_SRC}" alt="Mission"><div class="fecha"><small>${p[0]}</small>${p[1]}</div></div>
    <div class="rep-title"><b>${titulo}</b><span>${modTxt} · Blueberries</span></div>`;
}
function hojaPie(nota){ return `<div class="rep-nota"><span>${nota || ''}</span><span>Por: <b class="repAutorTxt">${esc(repAutor) || '—'}</b></span></div>`; }
function kpi(v, l, cls, sty){ return `<div class="rep-kpi ${cls||''}" style="${sty||''}"><b>${v}</b><span>${l}</span></div>`; }
function modTag(m){ return repMod === 'ambos' ? `<span class="mtag" style="background:${MOD_COL[m]}">${m==='acopio'?'ACO':'EST'}</span>` : ''; }
function diaCorto(f){ const d = parseDate(f); return repPer === 'mes' ? `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}` : DIAS[(d.getDay()+6)%7] + ' ' + d.getDate(); }
function leyendaAus(){ return Object.values(AUSENCIAS).map(a => `<span class="aus" style="color:${a.color};background:${a.bg}">${a.cod}</span> ${a.label}`).join(' &nbsp;'); }
function reglaTxt(){ return repPer === 'dia' ? `Extra = horas del día − ${JORNADA_DIA} h` : `Extra = horas de cada semana − ${JORNADA_SEMANA} h · máx. ${MAX_SEMANA} h`; }

function graficoBarras(vals, labels, sub){
  const max = Math.max(1, ...vals);
  return `<div class="vchart sm">${vals.map(h => `<div class="vcol"><span class="vv">${h>0?h.toFixed(0):''}</span><div class="vb" style="height:${(h/max*80).toFixed(1)}%"></div></div>`).join('')}</div>
    <div class="vlabels">${labels.map((l,i)=>`<div>${l}${sub[i]||''}</div>`).join('')}</div>`;
}
function graficoPeriodo(A){
  if(A.modo === 'semana'){
    const dias = diasDeSemana(parseDate(repFecha));
    return `<div class="gtitle">Horas por día <small>Total ${A.horas.toFixed(1)} h</small></div>` + graficoBarras(A.porDia, dias.map((d,i)=>`${DIAS[i]} ${d.getDate()}`),
      dias.map((d,i)=>`${A.persDia[i]?`<br><span style="color:#1f2f8f;text-transform:none">${A.persDia[i]} pers.</span>`:''}${A.ausDia[i]?`<br><span style="color:#d12a18;text-transform:none">${A.ausDia[i]} aus.</span>`:''}`));
  }
  return `<div class="gtitle">Horas por semana <small>Total ${A.horas.toFixed(1)} h</small></div>` + graficoBarras(A.porSemana.map(s=>s.horas), A.porSemana.map(s=>'Sem ' + s.n),
    A.porSemana.map(s=>`${s.pers?`<br><span style="color:#1f2f8f;text-transform:none">${s.pers} pers.</span>`:''}${s.aus?`<br><span style="color:#d12a18;text-transform:none">${s.aus} aus.</span>`:''}`));
}
function costoTxt(A){ return A.sinCosto && !A.costo ? '—' : soles(A.costo); }

// ---- Hoja 1: Resumen ejecutivo
function hojaResumen(){
  const A = agregado(modsSel(), fechasPer());
  const alertas = [];
  if(A.sem && A.exceden) alertas.push(['#d12a18', `<b>${A.exceden}</b> pasan el máximo de ${MAX_SEMANA} h: ${A.trab.filter(w=>w.pasa60).map(w=>esc(nombreCorto(w.nombre))).join(', ')}`]);
  if(A.conExtra) alertas.push(['#c27c0e', `<b>${A.conExtra}</b> con horas extra · <b>${A.extra.toFixed(1)} h</b>${A.costo ? ` · costo aprox. <b>${soles(A.costo)}</b>` : ''}`]);
  if(A.ausItems.length) alertas.push(['#6b46c1', `Ausencias: <b>${A.faltas}</b> faltas · <b>${A.permisos}</b> permisos · <b>${A.dm}</b> desc. médicos`]);
  if(A.bajasPer.length) alertas.push(['#636b8a', `Bajas en el periodo: ${A.bajasPer.map(t => `<b>${esc(nombreCorto(t.nombre))}</b> (${fCorta(t.baja)}, ${esc((MOTIVOS_BAJA[t.bajaMotivo]||'baja').toLowerCase())})`).join(', ')}`]);
  if(!alertas.length) alertas.push(['#1a8a55', 'Sin horas extra ni ausencias en el periodo ✔']);
  let grafico;
  if(A.modo !== 'dia') grafico = graficoPeriodo(A);
  else {
    const normal = A.trab.reduce((s,w)=>s+Math.min(w.horas,JORNADA_DIA),0), pct = A.horas ? normal/A.horas*100 : 100;
    grafico = `<div class="gtitle">Jornada normal vs. extra <small>Total ${A.horas.toFixed(1)} h</small></div>
      <div class="stack"><div style="width:${pct.toFixed(1)}%;background:#1f2f8f">${pct>=20?normal.toFixed(1)+' h':''}</div><div style="width:${(100-pct).toFixed(1)}%;background:#c27c0e">${100-pct>=14?A.extra.toFixed(1)+' h':''}</div></div>
      <div class="gleg"><span><i style="background:#1f2f8f"></i>Normal ${normal.toFixed(1)} h (${pct.toFixed(0)}%)</span><span><i style="background:#c27c0e"></i>Extra ${A.extra.toFixed(1)} h (${(100-pct).toFixed(0)}%)</span></div>`;
  }
  return `
    ${hojaCab('Resumen de horas', MOD_TXT[repMod])}
    <div class="rep-kpis k3">
      ${kpi(`${A.personal}<small>/${A.catalogo}</small>`, 'Personal')}
      ${kpi(A.horas.toFixed(1), 'Horas')}
      ${kpi(A.promedio.toFixed(1), 'Prom. h/día')}
      ${kpi(A.extra.toFixed(1), 'H. extra', A.extra>0?'warn':'')}
      ${kpi(A.asistencia.toFixed(0)+'%', 'Asistencia')}
      ${kpi(A.ausItems.length, 'Ausencias', A.ausItems.length?'alerta':'')}
    </div>
    <div class="alertas"><div class="at">Puntos a revisar</div>${alertas.map(([c,t]) => `<div class="al"><i style="background:${c}"></i><span>${t}</span></div>`).join('')}</div>
    ${grafico}
    ${hojaPie(A.modo === 'dia' ? `Jornada ${JORNADA_DIA} h/día` : `Normal ≤${JORNADA_SEMANA} h · máx. ${MAX_SEMANA} h/semana`)}`;
}

// ---- Hoja 2: Horas (tareo)
function hojaHoras(){
  const f = fechasPer(), A = agregado(modsSel(), f);
  const lista = A.lista.filter(w => w.horas > 0 || w.aus.length);
  const extCell = w => `<td style="font-weight:800;color:${COL_SEM[w.est]}">${w.extra>0?'+'+w.extra.toFixed(1):'–'}</td>`;
  const sumExt = l => { const e = l.reduce((s,w)=>s+w.extra,0); return e ? '+'+e.toFixed(1) : '–'; };
  let head, filaFn, totRow, cols;
  if(A.modo === 'semana'){
    const dias = diasDeSemana(parseDate(repFecha)); cols = 10;
    head = `<tr><th style="text-align:left">Nombre</th>${dias.map((d,i)=>`<th>${DIAS[i].slice(0,2)}<br>${d.getDate()}</th>`).join('')}<th>Tot</th><th>Ext</th></tr>`;
    filaFn = w => `<tr><td class="n">${esc(nombreCorto(w.nombre))} ${tagBaja(trabDe(w.m, w.dni))}</td>${f.map(k => { const h = w.porDia[k]; const a = w.aus.find(x => x.fecha === k); return h ? `<td>${h.toFixed(1)}</td>` : a ? `<td>${badgeAus(a.tipo)}</td>` : '<td class="z">–</td>'; }).join('')}<td class="h" style="color:${COL_SEM[w.est]}">${w.horas.toFixed(1)}</td>${extCell(w)}</tr>`;
    totRow = X => `<tr class="tot"><td class="n">${X.label}</td>${f.map(k => { const v = X.l.reduce((s,w)=>s+(w.porDia[k]||0),0); return `<td>${v?v.toFixed(0):'–'}</td>`; }).join('')}<td>${X.l.reduce((s,w)=>s+w.horas,0).toFixed(1)}</td><td>${sumExt(X.l)}</td></tr>`;
  } else if(A.modo === 'mes'){
    cols = A.semanas.length + 6;
    head = `<tr><th style="text-align:left">Nombre</th>${A.porSemana.map(s=>`<th>S${s.n}</th>`).join('')}<th>Tot</th><th>Ext</th><th>F</th><th>P</th><th>DM</th></tr>`;
    const c = (w,t) => { const n = w.aus.filter(a=>a.tipo===t).length; return n ? `<td style="color:${AUSENCIAS[t].color};font-weight:800">${n}</td>` : '<td class="z">–</td>'; };
    filaFn = w => `<tr><td class="n">${esc(nombreCorto(w.nombre))} ${tagBaja(trabDe(w.m, w.dni))}</td>${A.semanas.map(k => { const h = w.porSem[k]; return h ? `<td style="color:${COL_SEM[estadoSemana(h)]};font-weight:${h>JORNADA_SEMANA?800:400}">${h.toFixed(1)}</td>` : '<td class="z">–</td>'; }).join('')}<td class="h">${w.horas.toFixed(1)}</td>${extCell(w)}${c(w,'falta')}${c(w,'permiso')}${c(w,'dm')}</tr>`;
    totRow = X => `<tr class="tot"><td class="n">${X.label}</td>${A.semanas.map(k => { const v = X.l.reduce((s,w)=>s+(w.porSem[k]||0),0); return `<td>${v?v.toFixed(0):'–'}</td>`; }).join('')}<td>${X.l.reduce((s,w)=>s+w.horas,0).toFixed(0)}</td><td>${sumExt(X.l)}</td>${['falta','permiso','dm'].map(t=>`<td>${X.l.reduce((s,w)=>s+w.aus.filter(a=>a.tipo===t).length,0)||'–'}</td>`).join('')}</tr>`;
  } else {
    cols = 5;
    head = `<tr><th style="text-align:left">Nombre</th><th>Entr.</th><th>Sal.</th><th>Horas</th><th>Ext</th></tr>`;
    filaFn = w => { const a = w.aus[0]; return w.horas ? `<tr><td class="n">${esc(nombreCorto(w.nombre))} ${tagBaja(trabDe(w.m, w.dni))}</td><td>${w.ini[repFecha]}</td><td>${w.fin[repFecha]}</td><td class="h">${w.horas.toFixed(1)}</td>${extCell(w)}</tr>`
      : `<tr><td class="n">${esc(nombreCorto(w.nombre))} ${tagBaja(trabDe(w.m, w.dni))}</td><td colspan="3">${badgeAus(a.tipo)} ${AUSENCIAS[a.tipo].label}</td><td>–</td></tr>`; };
    totRow = X => `<tr class="tot"><td class="n">${X.label}</td><td></td><td></td><td>${X.l.reduce((s,w)=>s+w.horas,0).toFixed(1)}</td><td>${sumExt(X.l)}</td></tr>`;
  }
  let cuerpo = '';
  if(!lista.length) cuerpo = `<tr><td colspan="${cols}" style="padding:16px;color:#636b8a">Sin registros en el periodo.</td></tr>`;
  else if(repMod === 'ambos'){
    ['acopio','estibas'].forEach(m => { const l = lista.filter(w => w.m === m); if(!l.length) return;
      cuerpo += `<tr class="grp"><td colspan="${cols}" style="color:${MOD_COL[m]}">${MOD_TXT[m]} · ${l.filter(w=>w.horas).length} pers.</td></tr>` + l.map(filaFn).join('') + totRow({label:'Subtotal', l}); });
    cuerpo += totRow({ label: 'TOTAL', l: lista });
  } else cuerpo = lista.map(filaFn).join('') + totRow({ label: 'TOTAL', l: lista });
  return `
    ${hojaCab('Tareo de horas', MOD_TXT[repMod])}

    <table class="rep-t ${A.modo!=='dia'?'sem':''}"><thead>${head}</thead><tbody>${cuerpo}</tbody></table>
    <div class="leyenda-mini">${A.modo !== 'dia' ? `<b style="color:${COL_SEM.ok}">≤${JORNADA_SEMANA} h</b> normal · <b style="color:${COL_SEM.ext}">${JORNADA_SEMANA}–${MAX_SEMANA} h</b> con extra · <b style="color:${COL_SEM.exc}">+${MAX_SEMANA} h</b> excede (por semana)<br>` : ''}${leyendaAus()}</div>
    ${hojaPie(reglaTxt())}`;
}

// ---- Hoja 3: Horas extra (con costo)
function hojaExtras(){
  const A = agregado(modsSel(), fechasPer());
  const conE = A.trab.filter(w => w.extra > 0).sort((a,b) => b.extra - a.extra || b.horas - a.horas);
  const conCosto = !A.sinCosto || A.costo > 0;
  let barras, escalaHtml = '', leyenda = '';
  if(A.modo === 'semana' || A.modo === 'dia'){
    const base = A.modo === 'semana' ? JORNADA_SEMANA : JORNADA_DIA, tope = A.modo === 'semana' ? MAX_SEMANA : null;
    const escala = A.modo === 'semana' ? Math.max(MAX_SEMANA + 8, ...conE.map(w => w.horas + 2)) : Math.max(JORNADA_DIA + 4, ...conE.map(w => w.horas + 1));
    const xb = (base/escala*100).toFixed(1), xt = tope ? (tope/escala*100).toFixed(1) : null;
    barras = conE.map(w => `<div class="wbar"><span class="nm">${modTag(w.m)}${esc(nombreCorto(w.nombre))}</span>
      <div class="track"><div class="fill" style="width:${(w.horas/escala*100).toFixed(1)}%;background:${COL_SEM[w.est]}"></div><i class="l48" style="left:${xb}%"></i>${xt?`<i class="l60" style="left:${xt}%"></i>`:''}</div>
      <span class="v" style="color:${COL_SEM[w.est]}">${w.horas.toFixed(1)}<small>+${w.extra.toFixed(1)} ext${conCosto && w.costo ? ' · ' + soles(w.costo) : ''}</small></span></div>`).join('');
    escalaHtml = `<div class="wscale"><span style="left:${xb}%">${base}</span>${xt?`<span class="r" style="left:${xt}%">${tope}</span>`:''}</div>`;
    leyenda = `<b style="color:#c27c0e">- - -</b> ${base} h ${A.modo==='semana'?'jornada semanal':'jornada del día'}${tope?` &nbsp; <b style="color:#d12a18">│</b> ${tope} h máximo con extras`:''}`;
  } else {
    const max = Math.max(1, ...conE.map(w => w.extra));
    barras = conE.map(w => `<div class="wbar"><span class="nm">${modTag(w.m)}${esc(nombreCorto(w.nombre))}</span>
      <div class="track"><div class="fill" style="width:${(w.extra/max*100).toFixed(1)}%;background:${COL_SEM[w.est]}"></div></div>
      <span class="v" style="color:${COL_SEM[w.est]}">+${w.extra.toFixed(1)}<small>${conCosto && w.costo ? soles(w.costo) : w.horas.toFixed(0) + ' h mes'}</small></span></div>`).join('');
    leyenda = `Barras = horas extra del mes (suma de lo que pasó de ${JORNADA_SEMANA} h cada semana) · <b style="color:#d12a18">rojo</b>: alguna semana pasó ${MAX_SEMANA} h`;
  }
  return `
    ${hojaCab('Horas extra', MOD_TXT[repMod])}
    <div class="rep-kpis">
      ${kpi(conE.length + `<small>/${A.personal}</small>`, 'Con extra', conE.length?'warn':'')}
      ${kpi(A.extra.toFixed(1), 'Horas extra', A.extra?'warn':'')}
      ${A.sem ? kpi(A.exceden, `Pasan ${MAX_SEMANA} h`, A.exceden?'alerta':'') : kpi(conE.length ? (A.extra/conE.length).toFixed(1) : '0.0', 'Prom. extra')}
      ${kpi(conCosto ? 'S/ ' + Math.round(A.costo).toLocaleString('es-PE') : '—', 'Costo aprox.', A.costo?'warn':'')}
    </div>
    ${conE.length ? `${escalaHtml}${barras}<div class="leyenda-mini">${leyenda}</div>` : `<div class="okbox">✔ Nadie hizo horas extra en ${A.modo === 'dia' ? 'el día' : A.modo === 'semana' ? 'la semana' : 'el mes'}</div>`}
    <div class="leyenda-mini">${conCosto ? `Costo = horas extra × S/ por hora × recargo (25 % las 2 primeras h extra del día, 35 % las siguientes).` : `Para ver el costo en soles, configura el S/ por hora en ⚙ Ajustes.`}</div>
    ${hojaPie(reglaTxt())}`;
}

// ---- Hoja 4: Faltas, permisos y descanso médico

// ---- Hoja 5: Comparativo con semáforo sobre proporciones
const SEMAFORO = { g: { c:'#1a8a55', bg:'#e3f5ec', t:'Bien' }, a: { c:'#a8650a', bg:'#fdf1d8', t:'Atención' }, r: { c:'#d12a18', bg:'#fde8e5', t:'Elevado' } };
function semaf(val, v, a, mayorEsMejor){ if(mayorEsMejor) return val >= v ? 'g' : val >= a ? 'a' : 'r'; return val <= v ? 'g' : val <= a ? 'a' : 'r'; }
function indicadoresComp(X){
  const total = X.diasTrab + X.ausItems.length;
  const div = X.modo === 'mes' ? X.semConDatos : 1;   // en mes: extra por persona por semana
  const extraPers = X.personal ? X.extra / X.personal / div : 0;
  const pctExtra = X.horas ? X.extra / X.horas * 100 : 0;
  const pctFaltas = total ? X.faltas / total * 100 : 0;
  const hayDatos = X.diasTrab > 0 || X.ausItems.length > 0;
  const ind = [
    { lb:'Prom. h/persona/día', v: X.promedio, f: x => x.toFixed(1), s: semaf(X.promedio, 8.0, 9.0) },
    { lb: X.modo === 'dia' ? 'H. extra por persona' : X.modo === 'mes' ? 'H. extra por persona/semana' : 'H. extra por persona', v: extraPers, f: x => x.toFixed(1), s: X.modo !== 'dia' ? semaf(extraPers, 6, 12) : semaf(extraPers, 1, 2) },
    { lb:'% de horas que son extra', v: pctExtra, f: x => x.toFixed(0)+'%', s: semaf(pctExtra, 10, 20) },
    ...(X.sem ? [{ lb:`Pasan ${MAX_SEMANA} h`, v: X.exceden, f: x => String(x), s: X.exceden === 0 ? 'g' : 'r' }] : []),
    { lb:'Asistencia', v: X.asistencia, f: x => x.toFixed(0)+'%', s: semaf(X.asistencia, 95, 90, true) },
    { lb:'% faltas (ausentismo)', v: pctFaltas, f: x => x.toFixed(1)+'%', s: semaf(pctFaltas, 2, 5) }
  ];
  if(!hayDatos) ind.forEach(i => i.s = null);
  const peor = ind.some(i => i.s === 'r') ? 'r' : ind.some(i => i.s === 'a') ? 'a' : hayDatos ? 'g' : null;
  return { ind, peor, rojos: ind.filter(i => i.s === 'r').length, ambar: ind.filter(i => i.s === 'a').length };
}
function pill(txt, s){ if(!s) return `<span class="pill" style="color:#9aa1bb">${txt}</span>`; const S = SEMAFORO[s]; return `<span class="pill" style="color:${S.c};background:${S.bg}"><i style="background:${S.c}"></i>${txt}</span>`; }

function hojaComparativo(){
  const f = fechasPer(), A = agregado(['acopio'], f), B = agregado(['estibas'], f);
  const IA = indicadoresComp(A), IB = indicadoresComp(B);
  const total = A.horas + B.horas, pA = total ? A.horas/total*100 : 50;
  const estado = (I, nombre, col) => {
    const S = I.peor ? SEMAFORO[I.peor] : { c:'#9aa1bb', bg:'#f1f3f8', t:'Sin datos' };
    const det = I.peor === null ? '' : I.rojos ? `${I.rojos} indicador${I.rojos>1?'es':''} en rojo` : I.ambar ? `${I.ambar} en atención` : 'Todo en rango';
    return `<div class="estado" style="background:${S.bg};border-color:${S.c}"><span class="en" style="color:${col}">${nombre}</span><b style="color:${S.c}">${S.t}</b><span class="ed">${det}</span></div>`;
  };
  let graf = '';
  if(A.modo !== 'dia'){
    const va = A.modo === 'semana' ? A.porDia : A.porSemana.map(s=>s.horas), vb = B.modo === 'semana' ? B.porDia : B.porSemana.map(s=>s.horas);
    const labels = A.modo === 'semana' ? diasDeSemana(parseDate(repFecha)).map((d,i)=>`${DIAS[i]} ${d.getDate()}`) : A.porSemana.map(s=>'Sem '+s.n);
    const max = Math.max(1, ...va, ...vb);
    graf = `<div class="gtitle">Horas por ${A.modo === 'semana' ? 'día' : 'semana'}</div>
      <div class="gchart sm">${labels.map((l,i)=>`<div class="gcol"><div class="gb a" style="height:${(va[i]/max*78).toFixed(1)}%">${va[i]?`<span class="gv" style="color:#1f2f8f;right:0">${va[i].toFixed(0)}</span>`:''}</div><div class="gb b" style="height:${(vb[i]/max*78).toFixed(1)}%">${vb[i]?`<span class="gv" style="color:#3a8fd9;left:0">${vb[i].toFixed(0)}</span>`:''}</div></div>`).join('')}</div>
      <div class="vlabels">${labels.map(l=>`<div>${l}</div>`).join('')}</div>`;
  }
  const filasInd = IA.ind.map((ia, i) => { const ib = IB.ind[i];
    return `<div class="cmp-row"><span class="lb">${ia.lb}</span><span class="c">${pill(ia.f(ia.v), ia.s)}</span><span class="c">${pill(ib.f(ib.v), ib.s)}</span></div>`; }).join('');
  const semTxt = A.modo === 'dia' ? '(día)' : A.modo === 'mes' ? '(mes, por semana)' : '(semana)';
  const P = [
    ['Prom. h/persona/día', '≤ 8', '8.1 – 9', '> 9'],
    A.modo === 'dia' ? ['H. extra por persona', '≤ 1 h', '1 – 2 h', '> 2 h'] : ['H. extra por persona', '≤ 6 h', '6 – 12 h', '> 12 h'],
    ['% horas extra', '≤ 10%', '10 – 20%', '> 20%'],
    ...(A.sem ? [[`Pasan ${MAX_SEMANA} h`, '0', '—', '1 o más']] : []),
    ['Asistencia', '≥ 95%', '90 – 94%', '< 90%'],
    ['% faltas', '≤ 2%', '2 – 5%', '> 5%']
  ];
  const params = `<table class="ptab"><thead><tr><th>Parámetros ${semTxt}</th><th class="g">Bien</th><th class="a">Atención</th><th class="r">Elevado</th></tr></thead>
    <tbody>${P.map(r => `<tr><td>${r[0]}</td><td class="g">${r[1]}</td><td class="a">${r[2]}</td><td class="r">${r[3]}</td></tr>`).join('')}</tbody></table>`;
  const cst = X => X.sinCosto && !X.costo ? '—' : 'S/ ' + Math.round(X.costo).toLocaleString('es-PE');
  return `
    ${hojaCab('Comparativo de equipos', 'Acopio vs. Estibas y Transporte')}
    <div class="estados">${estado(IA, 'Acopio', '#1f2f8f')}${estado(IB, 'Estibas y T.', '#3a8fd9')}</div>
    <div class="cmp-row h"><span>Indicador</span><span style="text-align:center;color:#1f2f8f">Acopio</span><span style="text-align:center;color:#3a8fd9">Estibas</span></div>
    <div class="cmp-row"><span class="lb">Personal · Horas</span><span class="c neutro">${A.personal} · ${A.horas.toFixed(0)} h</span><span class="c neutro">${B.personal} · ${B.horas.toFixed(0)} h</span></div>
    ${filasInd}
    <div class="cmp-row"><span class="lb">Faltas · Perm. · D. méd.<small>solo informativo</small></span><span class="c neutro">${A.faltas} · ${A.permisos} · ${A.dm}</span><span class="c neutro">${B.faltas} · ${B.permisos} · ${B.dm}</span></div>
    <div class="cmp-row"><span class="lb">Costo horas extra<small>aproximado</small></span><span class="c neutro">${cst(A)}</span><span class="c neutro">${cst(B)}</span></div>
    <div class="stack" style="margin-top:12px;height:24px"><div style="width:${pA.toFixed(1)}%;background:#1f2f8f">${pA>=15?A.horas.toFixed(0)+' h':''}</div><div style="width:${(100-pA).toFixed(1)}%;background:#3a8fd9">${100-pA>=15?B.horas.toFixed(0)+' h':''}</div></div>
    <div class="gleg"><span><i style="background:#1f2f8f"></i>Acopio ${pA.toFixed(0)}%</span><span><i style="background:#3a8fd9"></i>Estibas y T. ${(100-pA).toFixed(0)}%</span><span style="margin-left:auto">Total <b>${total.toFixed(1)} h</b></span></div>
    ${graf}
    ${params}
    ${hojaPie('Indicadores en proporción: comparables aunque los equipos sean de distinto tamaño')}`;
}

const HOJAS = {
  resumen: { t: '📋 Resumen', f: hojaResumen },
  horas:   { t: '⏱ Horas', f: hojaHoras },

function setHoja(h){ repHoja = h; render(); }
function setRepPer(p){ repPer = p; render(); }
function setRepMod(m){ repMod = m; render(); }
function setRepDia(v){ const d = new Date(); if(v==='ayer') d.setDate(d.getDate()-1); repFecha = fmtDate(d); render(); }
function moverSemana(n){ const d = parseDate(repFecha); d.setDate(d.getDate() + 7*n); repFecha = fmtDate(d); render(); }
function moverMes(n){ const d = parseDate(repFecha); repFecha = fmtDate(new Date(d.getFullYear(), d.getMonth() + n, 1)); render(); }
function sufijoPer(){ const d = parseDate(repFecha); return repPer === 'semana' ? 'semana-' + semanaISO(d) : repPer === 'mes' ? MESES[d.getMonth()] + '-' + d.getFullYear() : repFecha; }

function exportarCSVHoja(){

  });

function cfg(m){ const d = stores[m] && stores[m].data; return { ...CFG_DEF[m], ...((d && d.config) || {}) }; }
function semKey(f){ const d = parseDate(f); const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const dia = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - dia); return t.getUTCFullYear() + '-W' + String(semanaISO(d)).padStart(2,'0'); }
function semanaCerrada(m, f){ const d = stores[m] && stores[m].data; return !!(d && (d.cerradas || []).includes(semKey(f))); }
