<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Control de Horas - Acopio</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232d6a4f'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-weight='800' font-size='30' fill='white' text-anchor='middle'%3E%E2%8F%B1%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg: #f4f7fb;
    --surface: #ffffff;
    --surface-2: #eef2f6;
    --ink: #14231d;
    --ink-dim: #667a72;
    --line: #dde5e0;
    --green: #2d6a4f;
    --green-2: #40916c;
    --accent: #f0a500;
    --danger: #c0392b;
    --warn-bg: #fdf0d5;
    --warn-ink: #8a5a00;
    --shadow: 0 1px 2px rgba(20,35,29,0.05), 0 4px 14px rgba(20,35,29,0.06);
    --radius: 16px;
    --navh: 66px;
    --font-display: 'Barlow Condensed', -apple-system, sans-serif;
    --font-body: 'Barlow', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1512; --surface: #17201b; --surface-2: #1d2822;
      --ink: #eaf2ec; --ink-dim: #9db3a6; --line: #2b382f;
      --green: #52b788; --green-2: #74c69d; --accent: #ffb703;
      --warn-bg: #2e2410; --warn-ink: #ffd166;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.3);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); }
  body {
    color: var(--ink); font-family: var(--font-body); line-height: 1.4;
    padding-bottom: calc(var(--navh) + env(safe-area-inset-bottom) + 10px);
  }
  .shell { max-width: 520px; margin: 0 auto; }
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: calc(env(safe-area-inset-top) + 14px) 16px 10px;
    position: sticky; top: 0; z-index: 20;
    background: linear-gradient(var(--bg) 80%, transparent);
  }
  .brand-logo {
    width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--green), var(--green-2));
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; box-shadow: var(--shadow);
  }
  .topbar h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; margin: 0; flex: 1; }
  .topbar .sub { font-size: 0.68rem; color: var(--ink-dim); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .sync-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .sync-dot.ok { background: var(--green); }
  .sync-dot.pending { background: var(--accent); }
  .sync-dot.offline { background: var(--danger); }

  main { padding: 0 14px 24px; }
  .view { display: none; animation: fadein .15s ease; }
  .view.active { display: block; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px);} to { opacity:1; transform:none; } }

  h2.section-title { font-family: var(--font-display); font-size: 1rem; font-weight: 700; margin: 4px 2px 10px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); }

  label.field { display:block; font-size: 0.78rem; color: var(--ink-dim); margin-bottom: 4px; margin-top: 12px; font-weight: 600; }
  label.field:first-child { margin-top: 0; }
  input.field, select.field {
    width: 100%; padding: 11px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--ink); font-size: 1rem; font-family: var(--font-body);
  }
  .field-row { display:flex; gap: 10px; }
  .field-row > div { flex:1; }
  .trab-row { display:flex; gap: 8px; align-items: flex-end; }
  .trab-row select { flex: 1; }
  .trab-check-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 2px; border-bottom: 1px solid var(--line);
  }
  .trab-check-row:last-child { border-bottom: none; }
  .trab-check-row.all { border-bottom: 1px solid var(--line); margin-bottom: 4px; padding-bottom: 12px; }
  .trab-check-row label { display: flex; align-items: center; gap: 9px; font-size: 0.95rem; cursor: pointer; }
  .trab-check-row input[type="checkbox"] { width: 19px; height: 19px; accent-color: var(--green); flex-shrink: 0; }
  .dni-tag { font-size: 0.72rem; color: var(--ink-dim); }
  .icon-btn {
    flex-shrink: 0; width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--ink-dim); font-size: 1.1rem; cursor: pointer;
  }

  button.primary {
    width: 100%; padding: 14px; border-radius: 12px; border: none;
    background: linear-gradient(135deg, var(--green), var(--green-2)); color: #fff; font-size: 1.02rem;
    font-family: var(--font-display); font-weight: 700; cursor: pointer; letter-spacing: .02em;
  }
  button.primary:active { opacity: 0.85; }
  button.ghost {
    width: 100%; background: transparent; border: 1px solid var(--line); color: var(--ink-dim);
    font-weight: 600; font-size: 0.85rem; padding: 10px; border-radius: 10px; cursor: pointer;
  }
  button.small { padding: 10px; font-size: 0.85rem; }

  .preview { text-align: center; font-family: var(--font-display); font-size: 1.6rem; font-weight: 800; color: var(--green); margin: 14px 0; }
  .preview .u { font-size: 0.9rem; color: var(--ink-dim); font-weight: 600; }

  .weeknav { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .weeknav button { flex-shrink: 0; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 1.1rem; cursor: pointer; }
  .weeknav .label { flex: 1; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 0.95rem; }

  table.week { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
  table.week th, table.week td { padding: 7px 4px; text-align: center; border-bottom: 1px solid var(--line); }
  table.week th { font-family: var(--font-display); font-weight: 700; color: var(--ink-dim); font-size: 0.7rem; text-transform: uppercase; }
  table.week td:first-child, table.week th:first-child { text-align: left; font-weight: 600; }
  table.week tr.total-row td { font-weight: 800; border-top: 2px solid var(--line); border-bottom: none; color: var(--green); }
  table.week td.zero { color: var(--ink-dim); opacity: 0.4; }
  .weeksum { display:flex; justify-content: space-between; align-items:center; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .weeksum .big { font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; color: var(--green); }
  .export-row { display: flex; gap: 10px; margin-top: 14px; }
  .export-row button { flex: 1; }

  .hist-day { margin-bottom: 16px; }
  .hist-day-label { font-family: var(--font-display); font-weight: 700; font-size: 0.85rem; color: var(--ink-dim); margin: 0 2px 6px; text-transform: uppercase; letter-spacing: .03em; }
  .hist-item { display:flex; justify-content:space-between; align-items:center; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
  .hist-item:last-child { border-bottom: none; }
  .hist-item .name { font-weight: 600; }
  .hist-item .meta { color: var(--ink-dim); font-size: 0.78rem; }
  .hist-item .horas { font-family: var(--font-display); font-weight: 700; color: var(--green); }
  .del-btn { background: none; border: none; padding: 0 0 0 10px; font-size: 0.95rem; cursor: pointer; }
  .muted { color: var(--ink-dim); font-size: 0.82rem; padding: 6px 0; }

  #loadingNote { text-align:center; color: var(--ink-dim); padding: 60px 0; }

  .bottomnav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    display: flex; height: var(--navh);
    padding-bottom: env(safe-area-inset-bottom);
    background: var(--surface); border-top: 1px solid var(--line);
    box-shadow: 0 -2px 16px rgba(0,0,0,0.08);
  }
  .navbtn {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    background: none; border: none; color: var(--ink-dim); font-family: var(--font-body);
    font-size: 0.66rem; font-weight: 700; cursor: pointer; padding: 6px 0 0;
  }
  .navbtn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .navbtn.active { color: var(--green); }
  .navbtn .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--green); margin-top: 1px; opacity: 0; }
  .navbtn.active .dot { opacity: 1; }
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand-logo">⏱️</div>
    <div>
      <h1>Control de Horas</h1>
      <div class="sub">Acopio · Fundo Arato</div>
    </div>
    <div id="syncDot" class="sync-dot ok" title="Sincronizado"></div>
  </div>
  <div id="loadingNote">Cargando...</div>
  <main id="app" style="display:none;"></main>
</div>

<nav class="bottomnav" id="bottomnav" style="display:none;">
  <button class="navbtn" data-tab="registrar" onclick="setTab('registrar')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
    Registrar<span class="dot"></span>
  </button>
  <button class="navbtn" data-tab="semana" onclick="setTab('semana')">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M8 3v4M16 3v4"/></svg>
    Semana<span class="dot"></span>
  </button>
  <button class="navbtn" data-tab="historial" onclick="setTab('historial')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
    Historial<span class="dot"></span>
  </button>
</nav>

<script>
const STORE_KEY = 'acopio_horas_v1';
const DIAS = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const DEFAULT_TRABAJADORES = [
  { dni: '76566026', nombre: 'Ever Cotrina Ramirez' },
  { dni: '71120774', nombre: 'Yony Molina Alvarado' },
  { dni: '76281460', nombre: 'Ricardo Gianmarco Diestra Barreto' },
  { dni: '76917122', nombre: 'Wilson Camizan Naira' },
  { dni: '63394588', nombre: 'Jerson Luis Moncada Muñoz' },
  { dni: '74813615', nombre: 'Gabriel Elias Atoche Bustamante' },
  { dni: '75545706', nombre: 'Eylin Alexis Chaupe Rodriguez' }
];

const SUPABASE_URL = 'https://rqvcvffyynpnighzwxju.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxdmN2ZmZ5eW5wbmlnaHp3eGp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MjgyNDcsImV4cCI6MjA5MzMwNDI0N30.fFufNEdRvAzl6O6BqtTbx83O3Eg8Wd7gACNJDGQKga4';

let state = null, sb = null, activeTab = 'registrar', weekOffset = 0;
let syncStatus = 'ok'; // 'ok' | 'pending' | 'offline'

function defaultState(){ return { trabajadores: DEFAULT_TRABAJADORES.map(t => ({...t})), registros: [] }; }

function migrateState(raw){
  const parsed = {...raw};
  parsed.trabajadores = (parsed.trabajadores || []).map(t => typeof t === 'string' ? { dni:'', nombre:t } : t);
  parsed.registros = (parsed.registros || []).map(r => r.trabajadorDni !== undefined ? r : { ...r, trabajadorDni:'' });
  if(parsed.trabajadores.length === 0) parsed.trabajadores = DEFAULT_TRABAJADORES.map(t => ({...t}));
  return parsed;
}

function loadCache(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(parsed && parsed.data && typeof parsed.pending === 'boolean'){
      return { data: migrateState(parsed.data), pending: parsed.pending };
    }
    // Formato antiguo (solo local, antes de conectar Supabase): tratarlo como cambios pendientes de subir
    return { data: migrateState(parsed), pending: true };
  } catch(e){ return null; }
}
function writeCache(data, pending){
  try { localStorage.setItem(STORE_KEY, JSON.stringify({data, pending})); }
  catch(e){ /* localStorage no disponible: seguimos solo en memoria */ }
}
function updateSyncDot(){
  const el = document.getElementById('syncDot');
  if(!el) return;
  el.className = 'sync-dot ' + syncStatus;
  el.title = syncStatus === 'ok' ? 'Sincronizado'
    : syncStatus === 'pending' ? 'Guardando…'
    : 'Sin conexión — se sincroniza al volver la señal';
}

function fmtDate(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function parseDate(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function mondayOf(date){
  const d = new Date(date);
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1 - day);
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}
function calcHoras(inicio, fin, descansoMin){
  const [ih, im] = inicio.split(':').map(Number);
  const [fh, fm] = fin.split(':').map(Number);
  let diff = (fh*60+fm) - (ih*60+im);
  if(diff < 0) diff += 24*60;
  let horas = (diff - (descansoMin||0)) / 60;
  if(horas < 0) horas = 0;
  return Math.round(horas*10)/10;
}
function fmtHoras(h){ return h.toLocaleString('es-PE',{minimumFractionDigits:1, maximumFractionDigits:1}) + 'h'; }

async function downloadFile(filename, blob){
  try {
    const downloads = await claude.use('downloads');
    if(downloads){ await downloads.save({filename, data: blob}); return; }
  } catch(e){ /* declined, or capability rejected — fall through */ if(e && e.code === 'declined') return; }
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  } catch(e){ alert('No se pudo descargar el archivo en este navegador.'); }
}

function init(){
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const cache = loadCache();

  const showApp = () => {
    document.getElementById('loadingNote').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('bottomnav').style.display = 'flex';
  };

  (async () => {
    if(cache){
      state = cache.data;
      syncStatus = cache.pending ? 'pending' : 'ok';
      showApp(); render(); updateSyncDot();
    }

    try {
      const { data, error } = await sb.from('acopio_horas_estado').select('data').eq('id','main').maybeSingle();
      if(error) throw error;
      if(data && (!cache || !cache.pending)){
        state = migrateState(data.data);
      } else if(!data && !cache){
        state = defaultState();
        await sb.from('acopio_horas_estado').insert({ id:'main', data: state });
      }
      showApp();
      syncStatus = (cache && cache.pending) ? 'pending' : 'ok';
      writeCache(state, syncStatus === 'pending');
      render(); updateSyncDot();
      if(syncStatus === 'pending') trySync();
    } catch(err){
      if(!state){ state = defaultState(); }
      syncStatus = 'offline';
      showApp(); render(); updateSyncDot();
    }

    sb.channel('acopio_horas_changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'acopio_horas_estado', filter: 'id=eq.main' }, payload => {
        if(payload.new && payload.new.data && syncStatus !== 'pending'){
          state = migrateState(payload.new.data); writeCache(state, false); syncStatus = 'ok'; updateSyncDot(); render();
        }
      })
      .subscribe();

    window.addEventListener('online', trySync);
    setInterval(trySync, 20000);
  })();
}

async function trySync(){
  if(syncStatus !== 'pending' && syncStatus !== 'offline') return;
  if(navigator.onLine === false){ syncStatus = 'offline'; updateSyncDot(); return; }
  try {
    const { error } = await sb.from('acopio_horas_estado').upsert({ id:'main', data: state, updated_at: new Date().toISOString() });
    if(error) throw error;
    writeCache(state, false);
    syncStatus = 'ok';
  } catch(err){
    syncStatus = 'offline';
    writeCache(state, true);
  }
  updateSyncDot();
}

async function saveState(){
  writeCache(state, true);
  syncStatus = 'pending';
  updateSyncDot();
  await trySync();
}

function setTab(tab){ activeTab = tab; render(); window.scrollTo(0,0); }

function render(){
  document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('active', b.dataset.tab === activeTab));
  const app = document.getElementById('app');
  if(activeTab === 'registrar') app.innerHTML = viewRegistrar();
  else if(activeTab === 'semana') app.innerHTML = viewSemana();
  else if(activeTab === 'historial') app.innerHTML = viewHistorial();
  if(activeTab === 'registrar'){ actualizarPreview(); syncCount(); }
}

function viewRegistrar(){
  const filas = state.trabajadores.map(t => `
    <div class="trab-check-row">
      <label><input type="checkbox" class="chk-trab" value="${t.dni}" onchange="syncCount()"> <span>${t.nombre}</span> <span class="dni-tag">${t.dni}</span></label>
      <button class="del-btn" onclick="eliminarTrabajador('${t.dni}')" title="Quitar del catálogo">🗑️</button>
    </div>
  `).join('');
  return `
    <div class="view active">
      <h2 class="section-title">Registrar hora trabajada</h2>
      <div class="card" style="padding-bottom:6px;">
        <div class="trab-check-row all">
          <label><input type="checkbox" id="chkAll" onchange="toggleAll(this.checked)"> <strong>Seleccionar todos</strong></label>
          <button class="icon-btn" onclick="nuevoTrabajador()" title="Agregar trabajador">➕</button>
        </div>
        ${state.trabajadores.length === 0 ? '<div class="muted">Sin trabajadores — agrega uno con ➕</div>' : filas}
      </div>

      <div class="card">
        <label class="field">Fecha</label>
        <input class="field" type="date" id="fechaInput" value="${fmtDate(new Date())}">

        <div class="field-row">
          <div>
            <label class="field">Hora inicio</label>
            <input class="field" type="time" id="inicioInput" value="07:00" oninput="actualizarPreview()">
          </div>
          <div>
            <label class="field">Hora fin</label>
            <input class="field" type="time" id="finInput" value="16:00" oninput="actualizarPreview()">
          </div>
        </div>

        <label class="field">Descanso (minutos)</label>
        <input class="field" type="number" id="descansoInput" value="60" min="0" step="5" oninput="actualizarPreview()">

        <div class="preview"><span id="horasPreview">8.0</span><span class="u"> horas</span></div>
        <div class="muted" style="text-align:center;margin-top:-8px;margin-bottom:10px;" id="selCount">0 trabajadores seleccionados</div>

        <button class="primary" onclick="registrarHora()">Guardar registro</button>
      </div>
    </div>
  `;
}

function actualizarPreview(){
  const inicio = document.getElementById('inicioInput').value;
  const fin = document.getElementById('finInput').value;
  const descanso = parseInt(document.getElementById('descansoInput').value || '0', 10);
  const el = document.getElementById('horasPreview');
  if(el && inicio && fin) el.textContent = fmtHoras(calcHoras(inicio, fin, descanso));
}

function syncCount(){
  const boxes = [...document.querySelectorAll('.chk-trab')];
  const checked = boxes.filter(b => b.checked).length;
  const label = document.getElementById('selCount');
  if(label) label.textContent = `${checked} trabajador${checked===1?'':'es'} seleccionado${checked===1?'':'s'}`;
  const chkAll = document.getElementById('chkAll');
  if(chkAll){
    chkAll.checked = boxes.length > 0 && checked === boxes.length;
    chkAll.indeterminate = checked > 0 && checked < boxes.length;
  }
}

function toggleAll(checked){
  document.querySelectorAll('.chk-trab').forEach(b => b.checked = checked);
  syncCount();
}

async function nuevoTrabajador(){
  const dni = prompt('DNI del nuevo trabajador:');
  if(!dni || !dni.trim()) return;
  const d = dni.trim();
  if(state.trabajadores.some(t => t.dni === d)){ alert('Ese DNI ya está en el catálogo.'); return; }
  const nombre = prompt('Nombre completo:');
  if(!nombre || !nombre.trim()) return;
  const n = nombre.trim();
  state.trabajadores.push({ dni: d, nombre: n });
  state.trabajadores.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  await saveState();
  render();
  const box = document.querySelector(`.chk-trab[value="${d}"]`);
  if(box){ box.checked = true; syncCount(); }
}

async function eliminarTrabajador(dni){
  const t = state.trabajadores.find(x => x.dni === dni);
  if(!t) return;
  if(!confirm(`¿Quitar a "${t.nombre}" del catálogo? Sus registros de horas ya guardados NO se borran.`)) return;
  state.trabajadores = state.trabajadores.filter(x => x.dni !== dni);
  await saveState();
  render();
}

async function registrarHora(){
  const dnis = [...document.querySelectorAll('.chk-trab:checked')].map(b => b.value);
  if(dnis.length === 0){ alert('Marca al menos un trabajador.'); return; }
  const fecha = document.getElementById('fechaInput').value;
  const inicio = document.getElementById('inicioInput').value;
  const fin = document.getElementById('finInput').value;
  const descanso = parseInt(document.getElementById('descansoInput').value || '0', 10);
  if(!fecha || !inicio || !fin){ alert('Completa fecha, hora de inicio y hora de fin.'); return; }
  const horas = calcHoras(inicio, fin, descanso);
  const ahora = Date.now();
  dnis.forEach((dni, i) => {
    const t = state.trabajadores.find(x => x.dni === dni);
    state.registros.push({ id: ahora + i, fecha, trabajadorDni: dni, trabajador: t ? t.nombre : dni, inicio, fin, descanso, horas });
  });
  await saveState();
  setTab('semana');
}

function viewSemana(){
  const monday = mondayOf(new Date());
  monday.setDate(monday.getDate() + weekOffset*7);
  const days = [];
  for(let i=0;i<7;i++){ const d = new Date(monday); d.setDate(monday.getDate()+i); days.push(d); }
  const dayKeys = days.map(fmtDate);

  const catalogo = state.trabajadores.length > 0 ? state.trabajadores
    : Object.values(state.registros.filter(r => dayKeys.includes(r.fecha)).reduce((acc,r) => {
        acc[r.trabajadorDni] = { dni: r.trabajadorDni, nombre: r.trabajador }; return acc;
      }, {}));

  const porTrabajadorDia = {};
  catalogo.forEach(t => { porTrabajadorDia[t.dni] = dayKeys.map(k =>
    state.registros.filter(r => r.trabajadorDni === t.dni && r.fecha === k).reduce((s,r)=>s+r.horas,0)
  )});

  const totalesDia = dayKeys.map((k,i) => catalogo.reduce((s,t)=>s+porTrabajadorDia[t.dni][i],0));
  const totalSemana = totalesDia.reduce((a,b)=>a+b,0);

  const rangeLabel = `${days[0].getDate()} ${days[0].toLocaleDateString('es-PE',{month:'short'})} – ${days[6].getDate()} ${days[6].toLocaleDateString('es-PE',{month:'short'})}`;

  const filas = catalogo.length === 0
    ? `<tr><td colspan="9" class="muted">Aún no hay registros ni trabajadores.</td></tr>`
    : catalogo.map(t => {
        const horas = porTrabajadorDia[t.dni];
        const total = horas.reduce((a,b)=>a+b,0);
        return `<tr><td>${t.nombre}</td>${horas.map(h => `<td class="${h===0?'zero':''}">${h===0?'–':h.toFixed(1)}</td>`).join('')}<td style="font-weight:700;color:var(--green)">${total.toFixed(1)}</td></tr>`;
      }).join('');

  const totalRow = catalogo.length === 0 ? '' : `<tr class="total-row"><td>Total día</td>${totalesDia.map(v=>`<td>${v.toFixed(1)}</td>`).join('')}<td>${totalSemana.toFixed(1)}</td></tr>`;

  return `
    <div class="view active">
      <h2 class="section-title">Horas por semana</h2>
      <div class="weeknav">
        <button onclick="weekOffset--; render()">‹</button>
        <div class="label">${rangeLabel}${weekOffset===0 ? ' · Esta semana' : ''}</div>
        <button onclick="weekOffset++; render()">›</button>
      </div>
      <div class="card" id="weekCard">
        <div style="overflow-x:auto;">
          <table class="week">
            <thead><tr><th>Trabajador</th>${days.map((d,i)=>`<th>${DIAS[i]}<br>${d.getDate()}</th>`).join('')}<th>Total</th></tr></thead>
            <tbody>${filas}${totalRow}</tbody>
          </table>
        </div>
        <div class="weeksum">
          <span class="name" style="color:var(--ink-dim);font-weight:600;">Total del equipo esta semana</span>
          <span class="big">${totalSemana.toFixed(1)}h</span>
        </div>
      </div>
      <div class="export-row">
        <button class="ghost small" onclick="exportarImagenSemana()">📷 Imagen (WhatsApp)</button>
        <button class="ghost small" onclick="exportarCSVSemana()">📄 CSV</button>
      </div>
    </div>
  `;
}

async function exportarImagenSemana(){
  const el = document.getElementById('weekCard');
  if(!el || typeof html2canvas === 'undefined') return;
  const canvas = await html2canvas(el, { backgroundColor: getComputedStyle(document.body).backgroundColor, scale: 2 });
  canvas.toBlob(async blob => {
    if(blob) await downloadFile(`horas-acopio-semana.png`, blob);
  }, 'image/png');
}

function exportarCSVSemana(){
  const monday = mondayOf(new Date());
  monday.setDate(monday.getDate() + weekOffset*7);
  const days = []; for(let i=0;i<7;i++){ const d = new Date(monday); d.setDate(monday.getDate()+i); days.push(d); }
  const dayKeys = days.map(fmtDate);
  const catalogo = state.trabajadores.length > 0 ? state.trabajadores
    : Object.values(state.registros.filter(r => dayKeys.includes(r.fecha)).reduce((acc,r) => {
        acc[r.trabajadorDni] = { dni: r.trabajadorDni, nombre: r.trabajador }; return acc;
      }, {}));
  let rows = [['DNI', 'Trabajador', ...DIAS, 'Total']];
  catalogo.forEach(t => {
    const horas = dayKeys.map(k => state.registros.filter(r => r.trabajadorDni===t.dni && r.fecha===k).reduce((s,r)=>s+r.horas,0));
    rows.push([t.dni, t.nombre, ...horas.map(h=>h.toFixed(1)), horas.reduce((a,b)=>a+b,0).toFixed(1)]);
  });
  const csv = '\ufeff' + rows.map(r => r.join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  downloadFile('horas-acopio-semana.csv', blob);
}

function viewHistorial(){
  if(state.registros.length === 0){
    return `<div class="view active"><h2 class="section-title">Historial</h2><div class="card"><div class="muted">Aún no hay registros.</div></div></div>`;
  }
  const porFecha = {};
  state.registros.slice().sort((a,b)=> b.id - a.id).forEach(r => {
    (porFecha[r.fecha] = porFecha[r.fecha] || []).push(r);
  });
  const fechas = Object.keys(porFecha).sort((a,b)=> b.localeCompare(a));
  const bloques = fechas.map(f => {
    const items = porFecha[f].map(r => `
      <div class="hist-item">
        <div>
          <div class="name">${r.trabajador}</div>
          <div class="meta">${r.inicio} – ${r.fin}${r.descanso ? ` · ${r.descanso} min descanso` : ''}</div>
        </div>
        <div style="display:flex;align-items:center;">
          <span class="horas">${fmtHoras(r.horas)}</span>
          <button class="del-btn" onclick="eliminarRegistro(${r.id})" title="Eliminar">🗑️</button>
        </div>
      </div>
    `).join('');
    const totalDia = porFecha[f].reduce((s,r)=>s+r.horas,0);
    const fechaLabel = parseDate(f).toLocaleDateString('es-PE', {weekday:'long', day:'numeric', month:'long'});
    return `<div class="hist-day"><div class="hist-day-label">${fechaLabel} · ${totalDia.toFixed(1)}h</div><div class="card">${items}</div></div>`;
  }).join('');
  return `<div class="view active"><h2 class="section-title">Historial</h2>${bloques}</div>`;
}

async function eliminarRegistro(id){
  if(!confirm('¿Eliminar este registro de horas?')) return;
  state.registros = state.registros.filter(r => r.id !== id);
  await saveState();
  render();
}

init();
</script>
