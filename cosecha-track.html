<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Cosecha Track — Arato</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--g:#16a34a;--g2:#15803d;--gc:#dcfce7;--rojo:#dc2626;--azul:#2563eb;--morado:#7c3aed;--amarillo:#d97706;--bg:#f3f4f6;--bg2:#fff;--txt:#111827;--txt2:#374151;--txt3:#6b7280;--bdr:#e5e7eb;}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;}
.hdr{background:var(--g);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(22,163,74,0.3);}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;color:#fff;letter-spacing:2px;}
.hdr-sub{font-size:0.58rem;color:rgba(255,255,255,0.75);letter-spacing:1px;}
.hdr-stats{display:flex;gap:14px;}
.hdr-stat{text-align:right;}
.hdr-stat-val{font-size:1.1rem;font-weight:800;color:#fff;}
.hdr-stat-lbl{font-size:0.5rem;color:rgba(255,255,255,0.7);text-transform:uppercase;letter-spacing:1px;}
.tabs{display:flex;background:#fff;border-bottom:2px solid var(--bdr);position:sticky;top:60px;z-index:99;}
.tb{flex:1;padding:12px 6px;border:none;background:none;font-family:Inter,sans-serif;font-size:0.7rem;font-weight:700;color:var(--txt3);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;}
.tb.on{color:var(--g);border-bottom-color:var(--g);}
.wrap{max-width:640px;margin:0 auto;padding:12px;}
.card{background:#fff;border:1px solid var(--bdr);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,0.05);}
.f{margin-bottom:10px;}
.f label{font-size:0.68rem;font-weight:700;color:var(--txt2);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px;}
.f input,.f select{width:100%;padding:9px 12px;border:1.5px solid var(--bdr);border-radius:8px;font-size:0.88rem;color:var(--txt);background:#fff;font-family:Inter,sans-serif;outline:none;}
.f input:focus,.f select:focus{border-color:var(--g);}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.btn{border:none;border-radius:10px;padding:12px;font-size:0.82rem;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;width:100%;}
.btn-g{background:var(--g);color:#fff;box-shadow:0 2px 8px rgba(22,163,74,0.25);}
.btn-ghost{background:none;border:1.5px solid var(--bdr);color:var(--txt3);}
.btn-sm{padding:5px 10px;font-size:0.68rem;border-radius:7px;width:auto;border:none;cursor:pointer;font-weight:700;font-family:Inter,sans-serif;}
.crono-box{background:var(--gc);border:1.5px solid var(--g);border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.crono-t{font-family:monospace;font-size:1.5rem;font-weight:800;color:var(--g);}
.tab-c{display:none;}.tab-c.on{display:block;}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);padding:9px 18px;border-radius:10px;font-size:0.75rem;font-weight:700;z-index:999;display:none;white-space:nowrap;}
.toast.ok{background:#16a34a;color:#fff;}.toast.err{background:#dc2626;color:#fff;}
.empty{text-align:center;color:var(--txt3);padding:40px 20px;font-size:0.85rem;}

/* MAQUINAS GRID */
.maq-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.maq-btn{background:#fff;border:2px solid var(--bdr);border-radius:12px;padding:12px;cursor:pointer;text-align:left;transition:all 0.15s;position:relative;}
.maq-btn:active{transform:scale(0.97);}
.maq-btn.sel{border-color:var(--g);background:var(--gc);}
.maq-btn-name{font-weight:800;font-size:0.85rem;color:var(--txt);font-family:monospace;}
.maq-btn-stats{font-size:0.62rem;color:var(--txt3);margin-top:3px;}
.maq-btn-badge{position:absolute;top:8px;right:8px;background:var(--g);color:#fff;font-size:0.55rem;font-weight:800;padding:2px 6px;border-radius:10px;}

/* DETALLE MÁQUINA */
.det-header{background:linear-gradient(135deg,var(--g),var(--g2));border-radius:12px;padding:16px;margin-bottom:10px;color:#fff;}
.det-maq-name{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:2px;}
.det-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;}
.det-kpi{background:rgba(255,255,255,0.15);border-radius:8px;padding:8px;text-align:center;}
.det-kpi-val{font-size:1rem;font-weight:800;}
.det-kpi-lbl{font-size:0.5rem;opacity:0.8;text-transform:uppercase;letter-spacing:.5px;}

/* VIAJE ROW */
.viaje-row{display:flex;align-items:center;padding:10px 12px;background:#f9fafb;border-radius:8px;margin-bottom:6px;border-left:3px solid var(--g);}
.viaje-num-badge{background:var(--g);color:#fff;font-size:0.6rem;font-weight:800;padding:3px 7px;border-radius:6px;margin-right:10px;min-width:28px;text-align:center;}
.viaje-info{flex:1;}
.viaje-hora{font-size:0.68rem;color:var(--txt3);}
.viaje-ruta{font-size:0.72rem;color:var(--txt2);font-weight:600;}
.viaje-dur-badge{font-family:monospace;font-size:0.85rem;font-weight:800;color:var(--g);background:var(--gc);padding:4px 8px;border-radius:6px;white-space:nowrap;}
.viaje-bins{font-size:0.72rem;font-weight:700;color:var(--txt);margin-left:8px;}

/* RANKING */
.rank-row{display:flex;align-items:center;padding:12px;background:#fff;border-radius:10px;margin-bottom:6px;border:1px solid var(--bdr);gap:10px;}
.rank-pos{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;min-width:28px;text-align:center;}
.rank-pos.gold{color:#d97706;}.rank-pos.silver{color:#6b7280;}.rank-pos.bronze{color:#92400e;}
.rank-info{flex:1;}
.rank-name{font-weight:800;font-size:0.9rem;font-family:monospace;}
.rank-sub{font-size:0.65rem;color:var(--txt3);}
.rank-metric{text-align:right;}
.rank-val{font-weight:800;font-size:0.9rem;}
.rank-lbl{font-size:0.55rem;color:var(--txt3);text-transform:uppercase;}
.section-title{font-size:0.65rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt3);margin-bottom:8px;margin-top:12px;}
.bar-wrap{height:5px;background:#e5e7eb;border-radius:3px;margin-top:6px;}
.bar-fill{height:100%;border-radius:3px;background:var(--g);transition:width 0.5s;}
</style>
</head>
<body>

<div class="hdr">
  <div><div class="hdr-title">🌿 COSECHA TRACK</div><div class="hdr-sub">Arato Mission Produce</div></div>
  <div class="hdr-stats">
    <div class="hdr-stat"><div class="hdr-stat-val" id="hdr-v">0</div><div class="hdr-stat-lbl">Viajes</div></div>
    <div class="hdr-stat"><div class="hdr-stat-val" id="hdr-b">0</div><div class="hdr-stat-lbl">Bines</div></div>
  </div>
</div>

<div class="tabs">
  <button class="tb on" onclick="goTab('nuevo',this)">➕ Nuevo</button>
  <button class="tb" onclick="goTab('maquinas',this)">🚜 Máquinas</button>
  <button class="tb" onclick="goTab('ranking',this)">🏆 Ranking</button>
  <button class="tb" onclick="goTab('historial',this)">📋 Historial</button>
</div>

<div class="toast" id="toast"></div>

<div class="wrap">

<!-- NUEVO -->
<div class="tab-c on" id="tab-nuevo">
<div class="card">
  <div class="crono-box">
    <div><div style="font-size:0.58rem;color:var(--g);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px;">Cronómetro</div>
    <div class="crono-t" id="crono-t">00:00:00</div></div>
    <div style="display:flex;gap:6px;">
      <button id="btn-ini" class="btn-sm" onclick="startC()" style="background:var(--g);color:#fff;">▶ Iniciar</button>
      <button id="btn-det" class="btn-sm" onclick="stopC()" style="background:var(--rojo);color:#fff;display:none;">⏹ Detener</button>
    </div>
  </div>
  <div class="g2">
    <div class="f"><label>🚜 Máquina *</label><input type="text" id="f-maq" placeholder="JKG-JD-09" style="text-transform:uppercase;font-family:monospace;font-weight:700;font-size:1rem;"></div>
    <div class="f"><label>🗺️ Módulo *</label><select id="f-mod"><option value="">— Módulo —</option></select></div>
  </div>
  <div class="g2">
    <div class="f"><label>📍 Origen</label><select id="f-ori"><option value="campo">Campo</option><option value="acopio">Acopio</option><option value="planta">Planta</option></select></div>
    <div class="f"><label>🏁 Destino</label><select id="f-des"><option value="acopio">Acopio</option><option value="campo">Campo</option><option value="planta">Planta</option></select></div>
  </div>
  <div class="g2">
    <div class="f"><label>🕐 Hora salida *</label><input type="time" id="f-hi"></div>
    <div class="f"><label>🕐 Hora retorno</label><input type="time" id="f-hf"></div>
  </div>
  <div class="f"><label>📦 Bins *</label><input type="number" id="f-bins" min="0" placeholder="Ej: 3" oninput="updPeso()"></div>
<label style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fff7ed;border:1.5px solid #fed7aa;border-radius:8px;cursor:pointer;margin-bottom:10px;">
<input type="checkbox" id="f-vacio" style="width:18px;height:18px;" onchange="toggleVacio(this)">
<span style="font-size:0.78rem;font-weight:700;color:#d97706;">⚠️ Vino vacío — sin fruta (solo traslado de bins)</span>
</label>
  <div id="peso-prev" style="display:none;background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:9px 14px;display:none;justify-content:space-between;margin-bottom:10px;">
    <span style="font-size:0.75rem;color:#15803d;">Peso total</span>
    <span style="font-weight:800;color:var(--g);" id="peso-val">0 kg</span>
  </div>
  <div class="f"><label>📝 Notas</label><input type="text" id="f-notas" placeholder="Observaciones..."></div>
  <button class="btn btn-g" id="btn-guardar" onclick="guardar()">✅ Registrar Viaje</button>
  <div id="cancelar-wrap" style="display:none;margin-top:6px;"><button class="btn btn-ghost" onclick="cancelEdit()">Cancelar edición</button></div>
</div>
</div>

<!-- MÁQUINAS -->
<div class="tab-c" id="tab-maquinas">
  <div id="maq-lista"></div>
  <div id="maq-detalle" style="display:none;">
    <button class="btn btn-ghost" onclick="volverMaqLista()" style="margin-bottom:10px;">← Todas las máquinas</button>
    <div id="maq-det-content"></div>
  </div>
</div>

<!-- RANKING -->
<div class="tab-c" id="tab-ranking">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
    <div style="font-size:0.65rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt3);">Rendimiento del día</div>
    <button onclick="enviarWsp()" style="background:#25D366;border:none;border-radius:9px;padding:9px 14px;color:#fff;font-size:0.78rem;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:5px;">📲 Enviar WhatsApp</button>
  </div>
  <div id="ranking-content"></div>
</div>

<!-- HISTORIAL -->
<div class="tab-c" id="tab-historial">
  <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
    <select id="filtro" onchange="renderHistorial()" style="flex:1;padding:8px 10px;border:1.5px solid var(--bdr);border-radius:8px;font-size:0.78rem;font-family:Inter,sans-serif;"></select>
    <button class="btn-sm btn-g" onclick="exportar()" style="background:var(--g);color:#fff;">📊 Excel</button>
  </div>
  <div id="lista-h"></div>
</div>

</div>

<script>
// ── Supabase Connection ──
const SUPA_URL = 'https://rqvcvffyynpnighzwxju.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxdmN2ZmZ5eW5wbmlnaHp3eGp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MjgyNDcsImV4cCI6MjA5MzMwNDI0N30.fFufNEdRvAzl6O6BqtTbx83O3Eg8Wd7gACNJDGQKga4';
const db = supabase.createClient(SUPA_URL, SUPA_KEY, {auth:{persistSession:false}});

const PESO=435;
const MODS=Array.from({length:24},(_,i)=>'Módulo '+(i+1));
let viajes=[];
let editId=null,cronoInt=null,cronoStart=null;
let cargando=false;

// Cargar viajes desde Supabase
async function cargarViajes() {
  if(cargando) return;
  cargando=true;
  try {
    const res = await db.from('viajes').select('*').order('ts_inicio', {ascending:false});
    if(res.error) { toast('Error conectando: '+res.error.message, true); return; }
    // Transformar datos de Supabase al formato del app
    viajes = (res.data||[]).map(function(v) {
      var retornos = safeRetornos(v.retornos);
      var bins = safeArray(v.bins);
      var binsRet = retornos.filter(function(r){return r.tipo!=='vacio';}).flatMap(function(r){return r.bins||[];});
      // Calcular duración desde ts_inicio hasta último retorno
      var dur = null;
      if (v.ts_inicio && retornos.length > 0) {
        var lastRet = retornos[retornos.length-1];
        if (lastRet.tsRetorno) dur = Math.floor((lastRet.tsRetorno - v.ts_inicio)/60000); // en minutos
      }
      return {
        id: v.id,
        fecha: v.fecha || '',
        ts: v.ts_inicio || 0,
        maq: v.maquina || '—',
        mod: v.modulo || '—',
        grupo: v.grupo || '—',
        ori: 'campo',
        des: 'acopio',
        hi: v.ts_inicio ? new Date(v.ts_inicio).toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'}) : '--',
        hf: retornos.length>0&&retornos[retornos.length-1].tsRetorno ? new Date(retornos[retornos.length-1].tsRetorno).toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'}) : null,
        durSeg: dur ? dur*60 : null,
        bins: binsRet.length || bins.length,
        binsEnviados: bins.length,
        binsRetornados: binsRet.length,
        notas: v.notas || '',
        operador: v.operador || '',
        retornos: retornos
      };
    });
    updHeader();
    renderHistorial();
    toast('✅ '+viajes.length+' viajes cargados');
  } catch(e) {
    toast('Error: '+e.message, true);
  } finally {
    cargando=false;
  }
}

function safeRetornos(r) {
  try { return JSON.parse(r||'[]'); } catch(e) { return []; }
}
function safeArray(a) {
  try { return JSON.parse(a||'[]'); } catch(e) { return []; }
}

// Init módulos
const ms=document.getElementById('f-mod');
MODS.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=m;ms.appendChild(o);});

function sv(){} // Read-only from Supabase - no local save needed

function toast(t,err){
const el=document.getElementById('toast');
el.textContent=t;el.className='toast '+(err?'err':'ok');
el.style.display='block';setTimeout(()=>el.style.display='none',2500);
}

function goTab(name,btn){
document.querySelectorAll('.tab-c').forEach(t=>t.classList.remove('on'));
document.querySelectorAll('.tb').forEach(b=>b.classList.remove('on'));
document.getElementById('tab-'+name).classList.add('on');
btn.classList.add('on');
if(name==='maquinas')renderMaquinas();
if(name==='ranking')renderRanking();
if(name==='historial')renderHistorial();
}

function toggleVacio(cb){
const inp=document.getElementById('f-bins');
if(cb.checked){inp.value='0';inp.disabled=true;}
else{inp.value='';inp.disabled=false;}
updPeso();
}

function updPeso(){
const v=parseInt(document.getElementById('f-bins').value)||0;
const p=document.getElementById('peso-prev');
if(v>0){p.style.display='flex';document.getElementById('peso-val').textContent=(v*PESO).toLocaleString()+' kg';}
else p.style.display='none';
}

function fmtDur(sec){
if(!sec&&sec!==0)return '--';
const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
if(h>0)return h+'h '+String(m).padStart(2,'0')+'m';
return String(m).padStart(2,'0')+'m '+String(s).padStart(2,'0')+'s';
}

function calcDur(a,b){
if(!a||!b)return null;
const [h1,m1]=a.split(':').map(Number),[h2,m2]=b.split(':').map(Number);
let d=(h2*60+m2)-(h1*60+m1);if(d<0)d+=1440;return d*60;
}

function startC(){
cronoStart=Date.now();
const n=new Date();
document.getElementById('f-hi').value=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
document.getElementById('btn-ini').style.display='none';
document.getElementById('btn-det').style.display='block';
cronoInt=setInterval(()=>{
const e=Math.floor((Date.now()-cronoStart)/1000);
const h=Math.floor(e/3600),m=Math.floor((e%3600)/60),s=e%60;
document.getElementById('crono-t').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
},500);
}

function stopC(){
clearInterval(cronoInt);
const n=new Date();
document.getElementById('f-hf').value=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
document.getElementById('btn-ini').style.display='block';
document.getElementById('btn-det').style.display='none';
}

function guardar(){
const maq=(document.getElementById('f-maq').value||'').trim().toUpperCase();
const mod=document.getElementById('f-mod').value;
const hi=document.getElementById('f-hi').value;
const bins=parseInt(document.getElementById('f-bins').value)||0;
const esVacio=document.getElementById('f-vacio').checked;
if(!maq||!mod||!hi||(!bins&&!esVacio)){toast('Completa los campos obligatorios',true);return;}
const hf=document.getElementById('f-hf').value;
const v={
id:editId||Date.now(),
fecha:new Date().toLocaleDateString('es-PE'),
ts:Date.now(),
maq,mod,
ori:document.getElementById('f-ori').value,
des:document.getElementById('f-des').value,
hi,hf,
durSeg:calcDur(hi,hf),
bins,
esVacio,
notas:document.getElementById('f-notas').value
};
if(editId){viajes=viajes.map(x=>x.id===editId?v:x);toast('✅ Viaje actualizado');}
else{viajes=[v,...viajes];toast('✅ Viaje registrado');}
editId=null;sv();resetForm();updHeader();
// ir a historial
document.querySelectorAll('.tab-c').forEach(t=>t.classList.remove('on'));
document.querySelectorAll('.tb').forEach(b=>b.classList.remove('on'));
document.getElementById('tab-historial').classList.add('on');
document.querySelectorAll('.tb')[3].classList.add('on');
renderHistorial();
}

function resetForm(){
['f-maq','f-mod','f-hi','f-hf','f-bins','f-notas'].forEach(id=>{
const e=document.getElementById(id);if(e)e.value='';
});
document.getElementById('f-ori').value='campo';
document.getElementById('f-des').value='acopio';
document.getElementById('f-vacio').checked=false;
document.getElementById('f-bins').disabled=false;
document.getElementById('peso-prev').style.display='none';
document.getElementById('btn-guardar').textContent='✅ Registrar Viaje';
document.getElementById('cancelar-wrap').style.display='none';
clearInterval(cronoInt);
document.getElementById('crono-t').textContent='00:00:00';
document.getElementById('btn-ini').style.display='block';
document.getElementById('btn-det').style.display='none';
}

function cancelEdit(){editId=null;resetForm();}

function editar(id){
const v=viajes.find(x=>x.id===id);if(!v)return;
document.getElementById('f-maq').value=v.maq;
document.getElementById('f-mod').value=v.mod;
document.getElementById('f-ori').value=v.ori;
document.getElementById('f-des').value=v.des;
document.getElementById('f-hi').value=v.hi;
document.getElementById('f-hf').value=v.hf||'';
document.getElementById('f-bins').value=v.bins;
document.getElementById('f-notas').value=v.notas||'';
editId=id;updPeso();
document.getElementById('btn-guardar').textContent='💾 Guardar Cambios';
document.getElementById('cancelar-wrap').style.display='block';
document.querySelectorAll('.tab-c').forEach(t=>t.classList.remove('on'));
document.querySelectorAll('.tb').forEach(b=>b.classList.remove('on'));
document.getElementById('tab-nuevo').classList.add('on');
document.querySelectorAll('.tb')[0].classList.add('on');
window.scrollTo(0,0);
}

function eliminar(id){
if(!confirm('¿Eliminar este viaje?'))return;
viajes=viajes.filter(v=>v.id!==id);sv();updHeader();renderHistorial();toast('Viaje eliminado');
}

// ── MÁQUINAS ──
function getMaqData(fechaFiltro){
const map={};
viajes.filter(function(v){
  if(!fechaFiltro) return true;
  return v.fecha === fechaFiltro;
}).forEach(v=>{
if(!map[v.maq])map[v.maq]={viajes:[],bins:0,binsEnv:0,durs:[]};
map[v.maq].viajes.push(v);
map[v.maq].bins+=v.binsRetornados||v.bins||0;
map[v.maq].binsEnv+=v.binsEnviados||v.bins||0;
if(v.durSeg)map[v.maq].durs.push(v.durSeg);
});
return map;
}

function renderMaquinas(){

// ── RANKING ──
function renderRanking(){
const map=getMaqData();
const maqNames=Object.keys(map);
if(!maqNames.length){document.getElementById('ranking-content').innerHTML='<div class="empty">Sin datos todavía.</div>';return;}

const posColors=['gold','silver','bronze'];

// Ranking por bins
const byBins=[...maqNames].sort((a,b)=>map[b].bins-map[a].bins);
// Ranking por velocidad (menor tiempo promedio = mejor)
const conTiempo=maqNames.filter(m=>map[m].durs.length>0);
const byVel=[...conTiempo].sort((a,b)=>{
const pa=map[a].durs.reduce((s,v)=>s+v,0)/map[a].durs.length;
const pb=map[b].durs.reduce((s,v)=>s+v,0)/map[b].durs.length;
return pa-pb;
});
// Ranking por viajes
const byViajes=[...maqNames].sort((a,b)=>map[b].viajes.length-map[a].viajes.length);

let html='';

html+='<div class="section-title">🏆 Más productiva (bins totales)</div>';
html+=byBins.map((m,i)=>`<div class="rank-row">
<div class="rank-pos ${posColors[i]||''}">${i+1}</div>
<div class="rank-info">
<div class="rank-name">🚜 ${m}</div>
<div class="rank-sub">${map[m].viajes.length} viajes · ${(map[m].bins*PESO/1000).toFixed(1)} tn</div>
<div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(map[m].bins/map[byBins[0]].bins*100)}%"></div></div>
</div>
<div class="rank-metric">
<div class="rank-val" style="color:var(--g);">${map[m].bins}</div>
<div class="rank-lbl">bins</div>
</div>
</div>`).join('');

if(byVel.length){
html+='<div class="section-title" style="margin-top:16px;">⚡ Más rápida (menor tiempo promedio)</div>';
html+=byVel.map((m,i)=>{
const avg=map[m].durs.reduce((s,v)=>s+v,0)/map[m].durs.length;
return`<div class="rank-row">
<div class="rank-pos ${posColors[i]||''}">${i+1}</div>
<div class="rank-info">
<div class="rank-name">🚜 ${m}</div>
<div class="rank-sub">${map[m].durs.length} viajes con tiempo registrado</div>
<div class="bar-wrap"><div class="bar-fill" style="width:${Math.round((1-(avg-Math.min(...byVel.map(x=>map[x].durs.reduce((s,v)=>s+v,0)/map[x].durs.length)))/(Math.max(...byVel.map(x=>map[x].durs.reduce((s,v)=>s+v,0)/map[x].durs.length))-Math.min(...byVel.map(x=>map[x].durs.reduce((s,v)=>s+v,0)/map[x].durs.length))+1))*100)}%"></div></div>
</div>
<div class="rank-metric">
<div class="rank-val" style="color:var(--azul);">${fmtDur(Math.floor(avg))}</div>
<div class="rank-lbl">prom/viaje</div>
</div>
</div>`;
}).join('');
}

html+='<div class="section-title" style="margin-top:16px;">🔄 Más activa (viajes realizados)</div>';
html+=byViajes.map((m,i)=>`<div class="rank-row">
<div class="rank-pos ${posColors[i]||''}">${i+1}</div>
<div class="rank-info">
<div class="rank-name">🚜 ${m}</div>
<div class="rank-sub">${map[m].bins} bins · ${(map[m].bins*PESO/1000).toFixed(1)} tn</div>
<div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(map[m].viajes.length/map[byViajes[0]].viajes.length*100)}%"></div></div>
</div>
<div class="rank-metric">
<div class="rank-val" style="color:var(--morado);">${map[m].viajes.length}</div>
<div class="rank-lbl">viajes</div>
</div>
</div>`).join('');

document.getElementById('ranking-content').innerHTML=html;
}

function exportar(){

// Preparar datos detalle
const rows=[...viajes].reverse().map((v,i)=>({

}));

return{

'Total Viajes':d.viajes.length,
'Viajes con fruta':viajesNorm.length,

'T.Máximo':durs.length?fmtDur(Math.max(...durs)):'--',
'Eficiencia (bins/viaje)':viajesNorm.length?(d.bins/viajesNorm.length).toFixed(1):'--'
};
});

const wb=XLSX.utils.book_new();

function enviarWsp() {
  const map = getMaqData();
  const maqNames = Object.keys(map).sort();
  if (!maqNames.length) { toast('Sin datos para enviar', true); return; }

  const fecha = new Date().toLocaleDateString('es-PE', {day:'2-digit', month:'2-digit', year:'numeric'});
  const totBins = viajes.reduce((a,v) => a+v.bins, 0);
  const totViajes = viajes.length;
  const totTn = (totBins * PESO / 1000).toFixed(2);

  // Calcular promedio general
  const allDurs = viajes.filter(v => v.durSeg && !v.esVacio).map(v => v.durSeg);
  const promGeneral = allDurs.length ? allDurs.reduce((a,b)=>a+b,0)/allDurs.length : 0;

  let msg = '';
  msg += '🌿 *COSECHA TRACK — ARATO*\n';
  msg += '📅 ' + fecha + '\n';
  msg += '─────────────────\n';
  msg += '📦 *Total:* ' + totBins + ' bins · ' + totTn + ' tn\n';
  msg += '🔄 *Viajes:* ' + totViajes + '\n';
  msg += '─────────────────\n';
  msg += '*RENDIMIENTO POR MÁQUINA:*\n\n';

  // Ordenar por bins desc
  const sorted = [...maqNames].sort((a,b) => map[b].bins - map[a].bins);

  sorted.forEach((m, idx) => {
    const d = map[m];
    const vNorm = d.viajes.filter(v => !v.esVacio);
    const vVacio = d.viajes.filter(v => v.esVacio);
    const durs = vNorm.filter(v => v.durSeg).map(v => v.durSeg);
    const prom = durs.length ? durs.reduce((a,b)=>a+b,0)/durs.length : 0;
    const tn = (d.bins * PESO / 1000).toFixed(2);

    // Evaluar rendimiento
    let estado = '';
    if (prom > 0 && promGeneral > 0) {
      if (prom <= promGeneral * 0.9) estado = '✅ Muy bueno';
      else if (prom <= promGeneral * 1.1) estado = '🟡 Normal';
      else estado = '⚠️ Lento';
    }

    const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '▪️';
    msg += medal + ' *' + m + '*\n';
    msg += '   📦 ' + d.bins + ' bins · ' + tn + ' tn\n';
    msg += '   🔄 ' + d.viajes.length + ' viajes';
    if (vVacio.length) msg += ' (' + vVacio.length + ' vacíos)';
    msg += '\n';
    if (prom > 0) msg += '   ⏱ Prom: ' + fmtDur(Math.floor(prom)) + (estado ? ' · ' + estado : '') + '\n';
    msg += '\n';
  });

  msg += '_Arato Mission Produce_';

  window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
}
