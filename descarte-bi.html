<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Descarte campo vs acopio</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:#E9EDF2;color:#000}
.hd{display:flex;align-items:center;gap:16px;background:#123A5C;color:#fff;padding:10px 18px}
.hd img{height:38px;background:#fff;border-radius:6px;padding:3px 8px}.hd h1{flex:1;margin:0;font-size:24px;font-weight:900;letter-spacing:.5px;text-align:center}
.fl{display:flex;gap:10px}.fl label{font-size:11px;font-weight:700;display:block;opacity:.85}.fl select,.fl input{font:inherit;font-size:14px;font-weight:700;padding:6px 8px;border-radius:6px;border:0;min-width:150px}
.wrap{padding:10px 16px 8px;max-width:2000px;margin:0 auto}
@media(min-width:701px){.hd{padding-left:max(18px,calc((100vw - 2000px)/2 + 20px));padding-right:max(18px,calc((100vw - 2000px)/2 + 20px))}}.g2>.p{display:flex;flex-direction:column}.g2>.p>.b{flex:1;display:flex;flex-direction:column;justify-content:center}.hd{position:sticky;top:0;z-index:5}
.kp{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:12px}
.kp div{background:#fff;border-radius:8px;padding:12px;text-align:center;border-left:8px solid #123A5C;box-shadow:0 1px 3px #0002}
.kp b{display:block;font-size:34px;font-weight:800}.kp small{font-size:12px;font-weight:800;color:#333}
.p{background:#fff;border-radius:8px;box-shadow:0 1px 3px #0002;overflow:hidden}
.p h2{margin:0;background:#1B4F7A;color:#fff;font-size:15px;font-weight:900;text-align:center;padding:7px;letter-spacing:.3px}
.p .b{padding:8px 12px}
.g2{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:12px;margin-top:12px}
.ley{font-size:12px;font-weight:800;text-align:center;margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:12px;font-weight:700}th{background:#EEF2F6;padding:6px 4px;font-size:11px}td{padding:5px 4px;border-bottom:1px solid #eee;text-align:center}
td.t,th.t{text-align:left}tr.tot td{background:#F1F4F8;font-weight:900}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:middle;margin-right:4px}
.e{text-align:center;padding:40px;font-weight:800;color:#555}
@media(max-width:1100px){.g2{grid-template-columns:1fr}.kp{grid-template-columns:1fr 1fr}}

@media(max-width:700px){.hd{flex-wrap:wrap;gap:8px;padding:10px 12px}.hd img{height:30px}.hd h1{font-size:15px;flex:1 1 60%;text-align:left}.fl{width:100%}.fl>div{flex:1}.fl select,.fl input{min-width:0;width:100%}
.wrap{padding:8px 8px 16px}.kp{grid-template-columns:1fr 1fr!important;gap:8px}.kp div{padding:8px 4px;border-left-width:6px}.kp b{font-size:22px}.kp small{font-size:11px}
.g2{grid-template-columns:1fr!important}.p h2{font-size:13px}.p .b{padding:6px}.sx{overflow-x:auto;-webkit-overflow-scrolling:touch}.sx svg{min-width:var(--mw)}
table{font-size:11px}th,td{padding:4px 2px}.dt{overflow-x:auto}.dt table{min-width:560px}}

.lay{display:grid;grid-template-columns:220px 1fr;align-items:start}
.sb{background:#123A5C;color:#fff;padding:14px 12px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;min-height:calc(100vh - 58px);max-height:calc(100vh - 58px);overflow:auto}
.sb label{font-size:12px;font-weight:800;display:block;margin-bottom:4px;opacity:.9}
.sb select,.sb input{width:100%;font:inherit;font-size:14px;font-weight:700;padding:7px;border-radius:6px;border:0;color:#000}
.ch{display:flex;flex-wrap:wrap;gap:5px;background:#fff;border-radius:6px;padding:6px}.ch button{font:inherit;padding:4px 9px;border-radius:5px;border:0;background:#E3E8EF;color:#000;font-size:13px;font-weight:800;cursor:pointer}.ch button.on{background:#2EAA4A;color:#fff}
.sb .ac{margin-top:auto;padding:10px;border:0;border-radius:6px;background:#2EAA4A;color:#fff;font-weight:900;font-size:15px;cursor:pointer}.sb .lp{padding:7px;border:1px solid #ffffff66;border-radius:6px;background:transparent;color:#fff;font-weight:800;cursor:pointer}
.sbt{display:none}#hr{font-size:12px;font-weight:700;opacity:.85;white-space:nowrap}
@media(max-width:900px){.lay{grid-template-columns:1fr}.sb{display:none;position:fixed;inset:0;z-index:20;max-height:none;min-height:0}.sb.op{display:flex}.sbt{display:inline-block;font:inherit;font-weight:900;padding:7px 12px;border-radius:6px;border:0;background:#2EAA4A;color:#fff}.sb .cx{display:block!important}}

@media(min-width:901px){#out{display:grid;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1.2fr) minmax(0,1fr);gap:10px;height:calc(100vh - 58px)}
#out.tr{grid-template-columns:1.55fr 1fr}#out>.kp,#out>.g2{grid-column:1/-1}#out>*{margin:0!important}#out>.e{grid-column:1/-1}
#out .kp{margin:0}#out .p{display:flex;flex-direction:column;min-height:0}#out .p>.b{flex:1;min-height:0;display:flex;flex-direction:column}
#out .p>.b>svg,#out .sx{flex:1;min-height:0}#out .p>.b svg{width:100%;height:100%}#out .sx svg{min-width:0!important}
#out .g2{min-height:0;margin:0}#out .g2>.p{min-height:0}#out .dt{overflow:auto}#out .kp div{padding:8px}#out .kp b{font-size:28px}}
@media(min-width:901px){#out .dt table{font-size:11px}#out .dt th,#out .dt td{padding:3px 4px}#out .dt td.t{white-space:nowrap}#out .dt{display:block!important}#out .dt th{position:sticky;top:0;z-index:1}}

.sb .ws{padding:10px;border:0;border-radius:6px;background:#25D366;color:#fff;font-weight:900;font-size:15px;cursor:pointer}
body.snap .sb .ws,body.snap .sb .ac,body.snap .sb .lp,body.snap .sbt{display:none!important}body.snap #hr{visibility:hidden}body.snap table{min-width:0!important;font-size:12px;table-layout:auto}body.snap .dt{overflow:visible!important}body.snap td,body.snap th{padding:4px 3px!important;white-space:nowrap}

body.snap .sb{display:none!important}body.snap .hd h1{font-size:20px!important;white-space:nowrap}body.snap .lay{grid-template-columns:1fr!important}body.snap #hr{visibility:visible!important;font-size:15px;font-weight:900;opacity:1}body.snap .dt{overflow:visible!important}body.snap .dt table{font-size:12px!important}
</style></head><body>
