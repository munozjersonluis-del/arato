<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14246B">
<title>Bandejas por punto · Blueberries</title>
<link rel="manifest" href="material.webmanifest">
<link rel="icon" href="material-icon-192.png">
<link rel="apple-touch-icon" href="material-icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#14246B;--ink:#16203F;--ink2:#56607E;--line:#D6DCEB;--paper:#F3F5FA;--leaf:#1F7A4D;--amber:#8A5300;--red:#C0331F}
*{box-sizing:border-box}html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font:16px/1.45 Barlow,system-ui,sans-serif;color:var(--ink);background:var(--paper);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8FA2E8;outline-offset:2px}
.hidden{display:none!important}
.top{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.top img{height:30px}
.inst{border:0;background:#fff;color:var(--navy);border-radius:10px;min-height:40px;padding:0 12px;font-weight:700}.top h1{font:600 20px/1.1 "Barlow Semi Condensed",sans-serif;flex:1;margin:0}.top h1 small{display:block;font:500 13px Barlow,sans-serif;opacity:.8}
main{max-width:560px;margin:0 auto;padding:12px 14px 40px}
/* barra de estado: siempre dice si todo está guardado */
.estado{display:flex;align-items:center;gap:10px;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-weight:600}
.estado .ic{font-size:22px;line-height:1}
.estado.ok{background:#E4F3EA;color:var(--leaf)}.estado.esp{background:#FFF0D6;color:var(--amber)}.estado.err{background:#FDEBE9;color:var(--red)}
.estado small{display:block;font-weight:500;font-size:13.5px;opacity:.9}
.estado button{margin-left:auto;border:0;background:#fff;border-radius:10px;min-height:40px;padding:0 12px;font-weight:700;color:inherit}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
h2{font:600 22px "Barlow Semi Condensed",sans-serif;margin:0 0 4px}
.sub{margin:0 0 8px;color:var(--ink2);font-size:14.5px}
.lbl{display:block;font-weight:600;font-size:14.5px;color:var(--ink2);margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:12px;min-height:50px;min-width:54px;padding:6px 14px;font-weight:600;font-size:16px}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.in{width:100%;min-height:52px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:500 17px Barlow,sans-serif;color:var(--ink);background:#fff}
.big{font:700 38px "Barlow Semi Condensed",sans-serif!important;text-align:center;min-height:68px}
.disp{text-align:center;font:700 40px "Barlow Semi Condensed",sans-serif;min-height:64px;caret-color:transparent}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pad button{min-height:58px;border:1.5px solid var(--line);background:#fff;border-radius:12px;font:700 26px "Barlow Semi Condensed",sans-serif;color:var(--ink);touch-action:manipulation}
.pad button:active{background:#E6EAF3}.pad .g{font-size:18px;color:#56607E;background:#F3F5FA}
.btn:disabled{opacity:.55}
.sheet #sOk{position:sticky;bottom:0;box-shadow:0 -8px 14px #fff}
.sheet .info{margin-top:6px}.sheet .info b{font-size:24px}
.pad button{min-height:52px}.disp{min-height:56px;font-size:36px}
.quick{display:flex;gap:8px;margin-top:8px}.quick .chip{flex:1}
.step{display:flex;align-items:center;gap:10px}.step button{width:58px;height:58px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font:700 28px "Barlow Semi Condensed",sans-serif}
.step output{flex:1;text-align:center;font:700 36px "Barlow Semi Condensed",sans-serif}
.btn{border:0;border-radius:14px;min-height:60px;width:100%;font:600 21px "Barlow Semi Condensed",sans-serif;background:var(--leaf);color:#fff;margin-top:16px}
.btn.az{background:var(--navy)}.btn.sec{background:#fff;color:var(--ink);border:1.5px solid var(--line);min-height:50px;font-size:18px}
.btn:disabled{opacity:.45}
.err{color:var(--red);font-weight:600;font-size:14.5px;margin:8px 0 0}
.unit{display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;border-radius:16px;padding:12px 16px;margin-bottom:12px}
.unit b{display:block;font:600 21px "Barlow Semi Condensed",sans-serif}.unit span{font-size:14px;opacity:.85}
.unit button{margin-left:auto;border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:10px;min-height:42px;padding:0 14px;font-weight:600}
h3{font:600 19px "Barlow Semi Condensed",sans-serif;margin:18px 2px 8px}
/* pedido */
.ped{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.ped.listo{border-color:#8FCBA9}
.ped .hd{display:flex;align-items:center;gap:10px}
.ped .g{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font:700 22px "Barlow Semi Condensed",sans-serif;flex:none}
.ped .t{flex:1;min-width:0}.ped .t b{display:block;font:600 18px "Barlow Semi Condensed",sans-serif}.ped .t span{font-size:13.5px;color:var(--ink2)}
.ped .n{text-align:right}.ped .n b{display:block;font:700 26px/1 "Barlow Semi Condensed",sans-serif}.ped .n span{font-size:12px;color:var(--ink2)}
.bar{height:8px;border-radius:4px;background:#E3E7F2;margin:12px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--leaf)}
.msg{font-weight:600;font-size:14.5px;color:var(--ink2)}
.pts{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:12px}
.pt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 6px;text-align:center;min-height:80px}
.pt b{display:block;font:600 15px "Barlow Semi Condensed",sans-serif;color:var(--ink2)}
.pt span{display:block;font:700 24px/1.15 "Barlow Semi Condensed",sans-serif}
.pt i{display:block;font-style:normal;font-size:12px;color:var(--ink2)}
.pt.on{background:#E4F3EA;border-color:#7CC39C}
.pt.add span{color:var(--navy)}
.ft{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.st{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:20px;background:#E4F3EA;color:var(--leaf)}.st.p{background:#FFF0D6;color:#7A4A00}
.ft button{border:1.5px solid var(--line);background:#fff;border-radius:10px;min-height:42px;padding:0 12px;font-weight:600;font-size:14px}
.empty{padding:22px;text-align:center;color:var(--ink2);background:#fff;border:1.5px dashed var(--line);border-radius:14px}
/* hoja del punto */
.sheet{position:fixed;inset:0;background:rgba(10,20,50,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:#fff;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;max-height:92vh;overflow:auto}
.sheet .hdr{display:flex;align-items:center;gap:10px}.sheet .hdr h2{flex:1;margin:0}
.sheet .x{border:0;background:#EEF1F7;border-radius:10px;width:42px;height:42px;font-size:20px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.info div{background:var(--paper);border-radius:12px;padding:10px;text-align:center}.info b{display:block;font:700 26px "Barlow Semi Condensed",sans-serif}.info span{font-size:13px;color:var(--ink2)}
.hist{margin-top:14px;border-top:1px solid var(--line)}
.hist .r{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:15px}
.hist .r b{font:700 18px "Barlow Semi Condensed",sans-serif;min-width:48px}.hist .r span{flex:1;color:var(--ink2)}.hist .r em{font-style:normal;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 14px 12px 18px;border-radius:12px;font-weight:600;display:flex;align-items:center;gap:14px;max-width:94vw;z-index:40}
.toast button{border:0;background:#fff;color:var(--ink);border-radius:8px;min-height:38px;padding:0 12px;font-weight:700}
</style>
</head>

<script>
/* ================= CONFIGURACIÓN ================= */
const API='https://script.google.com/macros/s/AKfycby_Xt-GUVXDEuE9JrqO3H_jy40Hp4VC4Cao6azNIyFMc-aDVFUMSKAIpJbulcTakQI6/exec';
const K='bpp2:';
const COL={A:'#7A3E9D',B:'#0B8FB0',C:'#B38B00',D:'#6B6B6B',E:'#C0331F'};

/* ================= utilidades ================= */
const $=id=>document.getElementById(id);
const S={get:(k,d)=>{try{const v=localStorage.getItem(K+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(K+k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const up=s=>String(s??'').trim().toUpperCase();
const n0=n=>Number(n||0).toLocaleString('es-PE');
const p2=n=>String(n).padStart(2,'0');
const hoy=()=>{const d=new Date();return p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear()};
const hora=()=>new Date().toTimeString().slice(0,5);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

/* ================= datos =================
   Todo se guarda primero en el celular (nunca se pierde) y luego se envía.
   - pedidos: {id, fecha, hora, placa, fundo, grupo, total, npuntos, enviado, anulado}
   - entregas: {id, pedido, punto, n, hora, enviado, anulado}
   - cola: acciones por enviar, en orden; cada una con su código (la hoja no la repite aunque llegue dos veces) */
let D=S.get('datos',{fecha:hoy(),pedidos:[],entregas:[]});
if(D.fecha!==hoy())D={fecha:hoy(),pedidos:[],entregas:[]};
let COLA=S.get('cola',[]);
let LIST=S.get('listas',{unidades:[],fundos:['VALLE AZUL 1','VALLE AZUL 2','VALLE AZUL 3','VALLE AZUL 4','DUNA AZUL'],grupos:['A','B','C','D','E']});
let U=S.get('unidad',null);
let ERR='',online=true;
const guardar=()=>{S.set('datos',D);S.set('cola',COLA)};
/* trae lo registrado hoy con la versión anterior del formulario (una sola vez), para no perder nada */
(function migrar(){
  try{
    if(localStorage.getItem(K+'migrado'))return;localStorage.setItem(K+'migrado','1');
    const viejo=k=>{try{return JSON.parse(localStorage.getItem('bpp:'+k)||'null')}catch(e){return null}};
    if(!U&&viejo('unidad'))U=viejo('unidad');
    const cola=viejo('cola')||[],pend=new Set(cola.filter(x=>x.accion==='pedido').map(x=>x.id));
    (viejo('mis')||[]).filter(m=>m.fecha===hoy()&&!m.x).forEach(m=>{
      if(D.pedidos.some(p=>p.id===m.id))return;
      const p={id:m.id,fecha:m.fecha,hora:m.hora||'',placa:m.placa,fundo:up(m.fundo),grupo:up(m.grupo),total:Number(m.total)||0,npuntos:Number(m.npuntos)||1,enviado:!pend.has(m.id)};
      D.pedidos.push(p);
      if(!p.enviado)COLA.push({q:uid(),accion:'pedido',id:p.id,placa:p.placa,fundo:p.fundo,grupo:p.grupo,total:p.total,npuntos:p.npuntos});
      (m.ent||[]).forEach(e=>{const en={id:e.id,pedido:p.id,punto:Number(e.punto),n:Number(e.n)||0,hora:e.h||'',enviado:false};D.entregas.push(en);
        COLA.push({q:uid(),accion:'entrega',id:en.id,pedido:p.id,placa:p.placa,fundo:p.fundo,grupo:p.grupo,punto:en.punto,bandejas:en.n,hora:en.hora,fecha:p.fecha})});
    });
    if(U)S.set('unidad',U);guardar();
  }catch(e){}
})();

/* ================= envío seguro ================= */
const TAB=uid();
function turno(){ // solo una pestaña envía a la vez
  try{const l=JSON.parse(localStorage.getItem(K+'lock')||'null');if(l&&l.tab!==TAB&&Date.now()-l.t<40000)return false;
    localStorage.setItem(K+'lock',JSON.stringify({tab:TAB,t:Date.now()}));return JSON.parse(localStorage.getItem(K+'lock')).tab===TAB}catch(e){return true}}
const soltar=()=>{try{const l=JSON.parse(localStorage.getItem(K+'lock')||'null');if(l&&l.tab===TAB)localStorage.removeItem(K+'lock')}catch(e){}};
async function pedir(body){
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),30000);
  try{const r=await fetch(API,body?{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),signal:ctl.signal}:{cache:'no-store',signal:ctl.signal});
    return await r.json()}finally{clearTimeout(t)}
}
let enviando=false;
async function enviar(){
  if(enviando||!COLA.length)return;
  if(!turno())return;
  enviando=true;pintarEstado();
  try{
    while(COLA.length){
      COLA=S.get('cola',COLA);if(!COLA.length)break;
      const o=COLA[0];
      let j;try{j=await pedir(o)}catch(e){online=false;break}   // sin señal: se reintenta solo
      online=true;
      if(!j.ok&&/ocupado/i.test(j.error||'')){await new Promise(r=>setTimeout(r,3000));continue}
      COLA=S.get('cola',COLA).filter(x=>x.q!==o.q);
      if(j.ok){marcarEnviado(o);ERR=''}else{ERR=j.error||'La hoja no aceptó un registro.'}
      guardar();pintar();
    }
  }finally{enviando=false;soltar();pintarEstado()}
}
function marcarEnviado(o){
  if(o.accion==='pedido'){const p=D.pedidos.find(x=>x.id===o.id);if(p)p.enviado=true}
  if(o.accion==='entrega'){const e=D.entregas.find(x=>x.id===o.id);if(e)e.enviado=true}
}
function encolar(o){o.q=uid();COLA=S.get('cola',COLA);COLA.push(o);guardar();pintarEstado();enviar()}
setInterval(()=>{if(!document.hidden){enviar();cargar()}},20000);
window.addEventListener('online',()=>{enviar();cargar()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){enviar();cargar()}});

/* listas y pedidos de la hoja (otros celulares) */
let REMOTO={pedidos:[],entregas:[]};
async function cargar(){
  // lo que ya estaba guardado ANTES de preguntar; si la hoja ya no lo tiene, es porque se borró allá
  const yaP=new Set(D.pedidos.filter(p=>p.enviado).map(p=>p.id)),yaE=new Set(D.entregas.filter(e=>e.enviado).map(e=>e.id));
  try{const j=await pedir(null);if(!j.ok)return;online=true;
    LIST={unidades:j.unidades&&j.unidades.length?j.unidades:LIST.unidades,fundos:(j.fundos&&j.fundos.length?j.fundos:LIST.fundos).map(up),grupos:j.grupos&&j.grupos.length?j.grupos.map(up):LIST.grupos};
    S.set('listas',LIST);REMOTO={pedidos:j.pedidos||[],entregas:j.entregas||[]};
    // lo que la hoja ya tiene se marca como guardado
    const ip=new Set(REMOTO.pedidos.map(p=>p.id)),ie=new Set(REMOTO.entregas.map(e=>e.id));
    D.pedidos.forEach(p=>{if(ip.has(p.id))p.enviado=true});D.entregas.forEach(e=>{if(ie.has(e.id))e.enviado=true});
    const enCola=new Set(S.get('cola',COLA).flatMap(o=>[o.id,o.pedido]));
    const fuera=new Set(D.pedidos.filter(p=>yaP.has(p.id)&&!ip.has(p.id)&&!enCola.has(p.id)).map(p=>p.id));
    D.pedidos=D.pedidos.filter(p=>!fuera.has(p.id));
    D.entregas=D.entregas.filter(e=>!fuera.has(e.pedido)&&!(yaE.has(e.id)&&!ie.has(e.id)&&!enCola.has(e.id)&&!e.anulado));
    guardar();
  }catch(e){online=false}
  pintar();
}

/* ================= estado (siempre visible) ================= */
function pintarEstado(){
  const n=S.get('cola',COLA).length,el=$('estado');
  if(ERR){el.className='estado err';el.innerHTML=`<span class="ic">⚠</span><span>No se guardó un registro<small>${esc(ERR)}</small></span><button type="button" id="eOk">Entendido</button>`;$('eOk').onclick=()=>{ERR='';pintarEstado()};return}
  if(!n){el.className='estado ok';el.innerHTML='<span class="ic">✓</span><span>Todo guardado en la hoja</span>';return}
  el.className='estado esp';
  el.innerHTML=`<span class="ic">⏳</span><span>${n} registro${n>1?'s':''} por enviar<small>${enviando?'Enviando…':online?'Se enviarán en unos segundos':'Sin señal: se enviarán solos cuando vuelva'}</small></span><button type="button" id="eRe">Enviar ya</button>`;
  $('eRe').onclick=()=>{enviar()};
}

/* ================= unidad ================= */
function pintarUni(){
  $('uSel').innerHTML='<option value="">Elegir placa</option>'+LIST.unidades.map(u=>`<option value="${esc(u.placa)}">${esc(u.placa)}${u.tipo?' · '+esc(u.tipo):''}${u.chofer?' · '+esc(u.chofer):''}</option>`).join('');
  if(!LIST.unidades.length)$('uErr').textContent='Cargando placas… (necesita señal la primera vez)';else $('uErr').textContent='';
}
$('uOk').onclick=()=>{const p=$('uSel').value;if(!p){$('uErr').textContent='Elige tu placa.';return}U=LIST.unidades.find(u=>u.placa===p)||{placa:p};S.set('unidad',U);pintar()};
$('uCh').onclick=()=>{U=null;S.set('unidad',null);pintar()};

/* ================= nuevo pedido ================= */
let F={fundo:S.get('fundo',''),grupo:''};
function chips(cont,items,sel,on){$(cont).innerHTML=items.map(v=>`<button type="button" class="chip" aria-pressed="${up(v)===up(sel)}" data-v="${esc(v)}">${esc(v)}</button>`).join('');
  $(cont).onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;$(cont).querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));on(b.dataset.v)}}
let ultimoClic=0;
function grupoAbierto(fundo,grupo){return D.pedidos.find(p=>!p.anulado&&up(p.placa)===up(U.placa)&&up(p.fundo)===up(fundo)&&up(p.grupo)===up(grupo))}
// lo que otros camiones ya dejaron hoy a ese grupo en ese fundo (cuando un compañero se queda con tus grupos)
function otros(fundo,grupo){
  const ids=new Set(REMOTO.pedidos.filter(p=>up(p.placa)!==up(U.placa)&&up(p.fundo)===up(fundo)&&up(p.grupo)===up(grupo)).map(p=>p.id));
  const E=REMOTO.entregas.filter(e=>ids.has(e.pedido)),pl=[...new Set(E.map(e=>up(e.placa)))];
  return {pts:Math.max(0,...E.map(e=>Number(e.punto)||0)),n:E.reduce((a,e)=>a+(Number(e.bandejas)||0),0),placas:pl,puntos:new Set(E.map(e=>e.pedido+'|'+e.punto)).size,ult:E.map(e=>e.hora).sort().pop()||''}}
function sigPunto(p){return Math.max(0,...entDe(p.id).map(x=>x.punto),otros(p.fundo,p.grupo).pts)+1}
$('fOk').onclick=()=>{
  const f=!F.fundo?'Elige el fundo.':!F.grupo?'Elige el grupo.':'';
  if(f){$('fErr').textContent=f;return}$('fErr').textContent='';
  const p=grupoAbierto(F.fundo,F.grupo);           // si el grupo ya está abierto hoy en ese fundo, se sigue en el mismo
  if(p){abrirPunto(p.id,sigPunto(p));return}
  abrirPunto(null,otros(F.fundo,F.grupo).pts+1,{fundo:F.fundo,grupo:F.grupo});
};

/* ================= lista de pedidos ================= */
function entDe(pid){return D.entregas.filter(e=>e.pedido===pid&&!e.anulado)}
function pedidosVista(){
  const mios=D.pedidos.filter(p=>!p.anulado&&up(p.placa)===up(U.placa));
  const ids=new Set(D.pedidos.map(p=>p.id));
  const otros=REMOTO.pedidos.filter(p=>!ids.has(p.id)&&up(p.placa)===up(U.placa)).map(p=>({...p,remoto:true}));
  return [...mios,...otros];
}
function pintarLista(){
  const L=pedidosVista();
  $('lista').innerHTML=L.length?L.map(p=>{
    const c=COL[up(p.grupo)]||'#4B4FA8';
    if(p.remoto){const RE=REMOTO.entregas.filter(e=>e.pedido===p.id),t=RE.reduce((a,e)=>a+(Number(e.bandejas)||0),0),np=new Set(RE.map(e=>e.punto)).size;
      return `<div class="ped"><div class="hd"><span class="g" style="background:${c}">${esc(p.grupo)}</span><span class="t"><b>Grupo ${esc(p.grupo)} · ${esc(p.fundo)}</b><span>Registrado en otro celular</span></span><span class="n"><b>${n0(t)}</b><span>${np} punto${np===1?'':'s'}</span></span></div></div>`}
    const E=entDe(p.id),dej=E.reduce((a,e)=>a+e.n,0),ks=[...new Set(E.map(e=>e.punto))].sort((a,b)=>a-b),pend=!p.enviado||E.some(e=>!e.enviado);
    const tiles=ks.map(k=>{const l=E.filter(e=>e.punto===k),s=l.reduce((a,e)=>a+e.n,0);
      return `<button type="button" class="pt on" data-pid="${p.id}" data-pn="${k}"><b>Punto ${k}</b><span>${n0(s)}</span><i>${l.length>1?(l.length-1)+' relleno'+(l.length>2?'s':''):l[0].hora}</i></button>`}).join('');
    return `<div class="ped"><div class="hd"><span class="g" style="background:${c}">${esc(p.grupo)}</span><span class="t"><b>Grupo ${esc(p.grupo)} · ${esc(p.fundo)}</b><span>Desde ${esc(p.hora)} · ${ks.length} punto${ks.length===1?'':'s'}${(()=>{const o=otros(p.fundo,p.grupo);return o.n?` · antes ${esc(o.placas.join(', '))}: ${n0(o.n)}`:''})()}</span></span><span class="n"><b>${n0(dej)}</b><span>bandejas</span></span></div>
      <div class="pts">${tiles}<button type="button" class="pt add" data-addp="${p.id}"><b>Punto ${sigPunto(p)}</b><span>＋</span><i>nuevo punto</i></button></div>
      <p class="sub" style="margin:6px 0 0">Toca un punto para anotar un relleno.</p>
      <div class="ft"><span class="st ${pend?'p':''}">${pend?'⏳ Por enviar':'✓ Guardado'}</span>${E.length?'':`<button type="button" data-an="${p.id}">Quitar</button>`}</div></div>`}).join('')
    :'<div class="empty">Aún no dejaste bandejas hoy. Elige fundo y grupo arriba.</div>';
}
$('lista').addEventListener('click',e=>{
  const t=e.target.closest('[data-pn]');if(t){abrirPunto(t.dataset.pid,Number(t.dataset.pn));return}
  const a=e.target.closest('[data-addp]');if(a){const p=D.pedidos.find(x=>x.id===a.dataset.addp);if(p)abrirPunto(p.id,sigPunto(p));return}
  const an=e.target.closest('[data-an]');
  if(an){if(!an.dataset.s){an.dataset.s=1;an.textContent='¿Seguro? Toca otra vez';setTimeout(()=>{if(an.isConnected){delete an.dataset.s;an.textContent='Quitar'}},3000);return}
    const p=D.pedidos.find(x=>x.id===an.dataset.an);if(!p)return;p.anulado=true;
    // si aún no salió del celular, se quita de la cola; si ya está en la hoja, se manda anular
    const enCola=S.get('cola',COLA).some(x=>x.accion==='pedido'&&x.id===p.id);
    if(enCola){COLA=S.get('cola',COLA).filter(x=>x.id!==p.id);guardar()}else encolar({accion:'anular',id:p.id});
    guardar();pintar();aviso('Grupo quitado')}
});

/* ================= hoja del punto ================= */
let PS=null;
function abrirPunto(pid,k,nuevo){
  const p=pid?D.pedidos.find(x=>x.id===pid):null;if(!p&&!nuevo)return;PS={pid,k,nuevo};
  const g=p?p.grupo:nuevo.grupo,fu=p?p.fundo:nuevo.fundo;
  const E=p?entDe(pid):[],l=E.filter(e=>e.punto===k),sp=l.reduce((a,e)=>a+e.n,0),dej=E.reduce((a,e)=>a+e.n,0);
  $('sTit').textContent=`Punto ${k} · Grupo ${g}`;
  const o=otros(fu,g);$('sSub').innerHTML=esc(fu)+(o.n?`<br><b style="color:var(--navy)">Antes lo atendió ${esc(o.placas.join(', '))}: ${n0(o.n)} bandejas en ${o.puntos} punto${o.puntos===1?'':'s'}${o.ult?' (último '+esc(o.ult)+')':''}. Sigues desde el punto ${k}.</b>`:'');
  $('sPunto').textContent=n0(sp);$('sPed').textContent=n0(dej);
  $('sLbl').textContent=l.length?'¿Cuántas bandejas más dejaste? (relleno)':'¿Cuántas bandejas dejaste en este punto?';
  $('sOk').textContent=l.length?'Guardar relleno':'Guardar punto '+k;
  // sugerencia: lo que se dejó en el punto anterior
  const ant=E.filter(e=>e.punto===k-1),sug=l.length?0:ant.reduce((a,e)=>a+e.n,0);
  $('sQuick').innerHTML=(sug>0?`<button class="chip" type="button" data-s="${sug}">Igual: ${n0(sug)}</button>`:'')+'<button class="chip" type="button" data-s="+50">+50</button><button class="chip" type="button" data-s="+100">+100</button>';
  $('sN').value='';$('sErr').textContent='';
  $('sHist').innerHTML=l.length?l.map((e,i)=>`<div class="r"><b>${esc(e.hora)}</b><span>${i?'Relleno '+i:'Entrega'}</span><em>${n0(e.n)}</em></div>`).join(''):'';
  guardando=false;$('sOk').disabled=false;$('sheet').classList.remove('hidden');
}
$('sPad').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k,v=$('sN').value;
  $('sN').value=k==='C'?'':k==='B'?v.slice(0,-1):(v==='0'?'':v).length>=5?v:(v==='0'?'':v)+k;$('sErr').textContent='';delete $('sOk').dataset.c};
document.addEventListener('keydown',e=>{if($('sheet').classList.contains('hidden'))return;
  if(/^[0-9]$/.test(e.key)){$('sPad').querySelector(`[data-k="${e.key}"]`).click()}else if(e.key==='Backspace')$('sPad').querySelector('[data-k="B"]').click();else if(e.key==='Enter')$('sOk').click()});
$('sQuick').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;const v=b.dataset.s;$('sN').value=v[0]==='+'?(Number($('sN').value)||0)+Number(v.slice(1)):Number(v)};
$('sX').onclick=()=>{$('sheet').classList.add('hidden');PS=null};
$('sheet').onclick=e=>{if(e.target.id==='sheet'){$('sheet').classList.add('hidden');PS=null}};
let ultimoReg=0,guardando=false;
$('sOk').onclick=()=>{
  if(!PS||guardando||Date.now()-ultimoReg<2000)return; // un toque = un registro (los toques repetidos no hacen nada)
  const n=Math.round(Number($('sN').value)||0);if(!(n>0)){$('sErr').textContent='Escribe cuántas bandejas.';return}
  if(n>2000&&!$('sOk').dataset.c){$('sOk').dataset.c=1;$('sErr').textContent=`¿Seguro? ${n0(n)} bandejas en un solo punto es mucho. Toca otra vez para confirmar.`;return}
  // mismo punto, misma cantidad, hace menos de 30 s: es un doble registro
  if(PS.pid){const ult=entDe(PS.pid).filter(x=>x.punto===PS.k).pop();
    if(ult&&ult.n===n&&Date.now()-(ult.t||0)<30000&&!$('sOk').dataset.d){$('sOk').dataset.d=1;$('sErr').textContent=`Ya guardaste ${n0(n)} en este punto hace un momento. Si es otro relleno igual, toca otra vez.`;return}}
  delete $('sOk').dataset.d;delete $('sOk').dataset.c;ultimoReg=Date.now();guardando=true;$('sOk').disabled=true;
  let p=PS.pid?D.pedidos.find(x=>x.id===PS.pid):null;
  if(!p&&PS.nuevo){p=grupoAbierto(PS.nuevo.fundo,PS.nuevo.grupo);   // por si se tocó dos veces
    if(!p){p={id:uid(),fecha:hoy(),hora:hora(),placa:U.placa,fundo:PS.nuevo.fundo,grupo:PS.nuevo.grupo,total:n,npuntos:1,enviado:false};
      D.pedidos.unshift(p);guardar();
      encolar({accion:'pedido',id:p.id,placa:p.placa,fundo:p.fundo,grupo:p.grupo,total:n,npuntos:1});
      F.grupo='';}}
  if(!p)return;
  const e={id:uid(),pedido:p.id,punto:PS.k,n,hora:hora(),t:Date.now(),enviado:false};
  D.entregas.push(e);guardar();
  encolar({accion:'entrega',id:e.id,pedido:p.id,placa:p.placa,fundo:p.fundo,grupo:p.grupo,punto:e.punto,bandejas:n,hora:e.hora,fecha:p.fecha});
  $('sheet').classList.add('hidden');PS=null;pintar();
  aviso(`Punto ${e.punto}: ${n0(n)} bandejas · ${e.hora}`,()=>{ // deshacer (10 s)
    e.anulado=true;const enCola=S.get('cola',COLA).some(x=>x.accion==='entrega'&&x.id===e.id);
    if(enCola){COLA=S.get('cola',COLA).filter(x=>x.id!==e.id);guardar()}else encolar({accion:'entrega_anular',id:e.id});
    guardar();pintar();aviso('Registro quitado')});
};

/* ================= aviso ================= */
let tt;function aviso(t,deshacer){$('tTxt').textContent=t;$('toast').classList.remove('hidden');$('tUndo').classList.toggle('hidden',!deshacer);
  $('tUndo').onclick=()=>{$('toast').classList.add('hidden');deshacer&&deshacer()};clearTimeout(tt);tt=setTimeout(()=>$('toast').classList.add('hidden'),deshacer?10000:3000)}

/* ================= pintar ================= */
function pintar(){
  $('fechaTop').textContent=new Date().toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long'});
  if(D.fecha!==hoy()){D={fecha:hoy(),pedidos:[],entregas:[]};guardar()}
  $('vUni').classList.toggle('hidden',!!U);$('vMain').classList.toggle('hidden',!U);
  pintarEstado();
  if(!U){pintarUni();return}
  $('uPlaca').textContent=U.placa;$('uInfo').textContent=[U.tipo,U.chofer].filter(Boolean).join(' · ');
  chips('fFundo',LIST.fundos,F.fundo,v=>{F.fundo=v;S.set('fundo',v)});
  chips('fGrupo',LIST.grupos,F.grupo,v=>{F.grupo=v});
  pintarLista();
}
pintar();cargar();enviar();

window.addEventListener('appinstalled',()=>{$('inst').classList.add('hidden');aviso('App instalada: búscala como "Bandejas" en tu pantalla')});
