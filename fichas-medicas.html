<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Fichas Médicas — Grupo Rocío</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'Plus Jakarta Sans',sans-serif;background:#f1f3f7;color:#111827;}
#root{height:100%;}

/* ── PRINT ── */
#print-frame { display: none; }
@media print {
  #print-frame { display: block !important; }
  #root        { display: none !important; }
  @page        { size: A4; margin: 10mm 12mm; }
}

/* ── TOPBAR ── */
.top{height:54px;background:#0f172a;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.3);}
.top-left{display:flex;align-items:center;gap:12px;}
.logo{background:#c8102e;color:#fff;font-weight:800;font-size:12px;padding:4px 10px;border-radius:3px;}
.top-title{font-size:13px;font-weight:700;color:#fff;}
.top-sub{font-size:9px;color:rgba(255,255,255,.35);margin-top:1px;}
.top-right{display:flex;gap:8px;}

/* ── BUTTONS ── */
.btn{padding:8px 15px;border-radius:5px;font-size:12px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:all .15s;display:inline-flex;align-items:center;gap:5px;}
.btn-red{background:#c8102e;color:#fff;} .btn-red:hover{background:#a80d26;}
.btn-dark{background:rgba(255,255,255,.1);color:#fff;border:1.5px solid rgba(255,255,255,.2);}
.btn-white{background:#fff;color:#111827;border:1.5px solid #e5e7eb;}
.btn-green{background:#15803d;color:#fff;}
.btn-ghost{background:#f3f4f6;color:#374151;border:1.5px solid #e5e7eb;}
.btn-sm{padding:6px 12px;font-size:11px;}

/* ── LISTA ── */
.list-screen{max-width:980px;margin:0 auto;padding:28px 20px;}
.list-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:14px;}
.list-header h1{font-size:24px;font-weight:800;color:#0f172a;}
.list-header p{font-size:12px;color:#9ca3af;margin-top:3px;}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}
.stat{background:#fff;border-radius:8px;padding:14px 18px;box-shadow:0 1px 4px rgba(0,0,0,.07);}
.stat-n{font-size:26px;font-weight:800;line-height:1;}
.stat-l{font-size:10px;color:#9ca3af;margin-top:3px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
.s-green .stat-n{color:#16a34a;} .s-red .stat-n{color:#c8102e;} .s-orange .stat-n{color:#d97706;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.rcard{background:#fff;border-radius:8px;padding:16px 18px;box-shadow:0 1px 4px rgba(0,0,0,.07);border:2px solid transparent;cursor:pointer;transition:all .18s;}
.rcard:hover{border-color:#c8102e;box-shadow:0 4px 14px rgba(200,16,46,.12);transform:translateY(-2px);}
.av{width:40px;height:40px;border-radius:50%;background:#f1f3f7;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#0f172a;margin-bottom:4px;border:2px solid #e5e7eb;}
.rname{font-size:14px;font-weight:700;color:#0f172a;margin-bottom:2px;}
.rdni{font-size:10px;color:#9ca3af;margin-bottom:3px;}
.rtags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px;}
.rtag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;background:#f1f3f7;color:#6b7280;}
.apill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;color:#fff;}
.rfooter{display:flex;justify-content:space-between;padding-top:8px;border-top:1px solid #f3f4f6;}
.redit{font-size:11px;font-weight:700;color:#c8102e;background:none;border:none;cursor:pointer;font-family:inherit;}
.rdel{font-size:11px;font-weight:700;color:#9ca3af;background:none;border:none;cursor:pointer;font-family:inherit;}
.rdel:hover{color:#dc2626;}
.addcard{background:rgba(200,16,46,.04);border:2px dashed rgba(200,16,46,.3);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;cursor:pointer;padding:24px 16px;min-height:150px;transition:all .18s;}
.addcard:hover{background:rgba(200,16,46,.08);border-color:#c8102e;}
.addicon{width:38px;height:38px;border-radius:50%;background:#c8102e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;}
.addlbl{font-size:13px;font-weight:700;color:#c8102e;}
.addsub{font-size:11px;color:#9ca3af;}

/* ── FORMULARIO ── */
.form-screen{display:flex;flex-direction:column;height:calc(100vh - 54px);}
.form-bar{background:#fff;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e5e7eb;flex-shrink:0;flex-wrap:wrap;gap:8px;}
.back-btn{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:#6b7280;background:none;border:none;cursor:pointer;font-family:inherit;padding:6px 10px;border-radius:4px;}
.back-btn:hover{background:#f3f4f6;color:#111827;}
.ftitle h2{font-size:15px;font-weight:800;color:#0f172a;}
.ftitle p{font-size:10px;color:#9ca3af;margin-top:1px;}
.tabs{display:flex;background:#f8fafc;border-bottom:2px solid #e5e7eb;padding:0 24px;flex-shrink:0;}
.tab{padding:12px 20px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:none;background:none;cursor:pointer;color:#9ca3af;border-bottom:3px solid transparent;margin-bottom:-2px;font-family:inherit;transition:all .15s;}
.tab:hover{color:#c8102e;} .tab.on{color:#c8102e;border-bottom-color:#c8102e;}
.fscroll{flex:1;overflow-y:auto;padding:20px 24px 50px;}
.fcard{background:#fff;border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,.07);overflow:hidden;max-width:880px;margin:0 auto;}
.fcard-head{background:#0f172a;color:#fff;padding:11px 20px;display:flex;align-items:center;justify-content:space-between;}
.fcard-title{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;}
.fcard-code{font-size:9px;opacity:.4;}
.fcard-foot{padding:14px 20px;background:#fafafa;border-top:1px solid #f3f4f6;display:flex;justify-content:flex-end;gap:8px;}

/* ── CAMPOS ── */
.fw{padding:18px 20px 26px;}
.sc{background:#0f172a;color:#fff;padding:5px 11px;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:18px -20px 11px;border-left:4px solid #c8102e;}
.sl{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9ca3af;margin:10px 0 7px;}
.fg{display:grid;gap:11px;margin-bottom:2px;}
.fg1{grid-template-columns:1fr;}
.fg2{grid-template-columns:repeat(2,1fr);}
.fg3{grid-template-columns:repeat(3,1fr);}
.fg4{grid-template-columns:repeat(4,1fr);}
@media(max-width:620px){.fg2,.fg3,.fg4{grid-template-columns:1fr 1fr;}}
@media(max-width:380px){.fg2,.fg3,.fg4{grid-template-columns:1fr;}}
.ff{display:flex;flex-direction:column;gap:3px;margin-bottom:2px;}
.fl{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#4b5563;}
.fi{padding:8px 10px;border:1.5px solid #d1d5db;border-radius:5px;font-size:13px;font-family:'Plus Jakarta Sans',sans-serif;color:#0f172a;background:#fafafa;width:100%;transition:all .15s;}
.fi:focus{outline:none;border-color:#c8102e;box-shadow:0 0 0 3px rgba(200,16,46,.09);background:#fff;}
.lab{display:flex;gap:10px;padding:12px;background:#f8fafc;border:1.5px solid #e5e7eb;border-radius:6px;margin-bottom:3px;}
.labn{font-size:18px;font-weight:900;color:#d1d5db;padding-top:2px;min-width:20px;}
.aptbox{background:#f8fafc;border:1.5px solid #e5e7eb;border-radius:6px;padding:13px;margin:13px 0 9px;}
.apttitle{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#374151;margin-bottom:9px;}
.aptrow{display:flex;gap:7px;flex-wrap:wrap;}
.aptopt{display:flex;align-items:center;gap:5px;padding:7px 12px;border:2px solid #d1d5db;border-radius:5px;cursor:pointer;font-size:10.5px;font-weight:700;text-transform:uppercase;color:#6b7280;transition:all .15s;background:#fff;}
.aptopt input{display:none;} .aptopt:hover{border-color:#c8102e;color:#c8102e;}
.aptopt.on{border-color:#c8102e;background:#c8102e;color:#fff;}
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin-bottom:4px;}
@media(max-width:500px){.cgrid{grid-template-columns:1fr;}}
.ck{display:flex;align-items:flex-start;gap:7px;padding:8px 10px;border:1.5px solid #e5e7eb;border-radius:5px;cursor:pointer;font-size:11.5px;color:#374151;background:#fafafa;transition:all .15s;line-height:1.4;}
.ck:hover{border-color:#c8102e;background:#fef2f4;} .ck input{margin-top:3px;accent-color:#c8102e;flex-shrink:0;}
.medrow{display:flex;align-items:center;gap:12px;margin-bottom:9px;flex-wrap:wrap;}
.rl{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;cursor:pointer;}
.rl input{accent-color:#c8102e;}
.dopt{display:flex;align-items:center;gap:9px;padding:12px 14px;border:2px solid #d1d5db;border-radius:5px;cursor:pointer;font-size:13px;color:#374151;background:#fff;transition:all .15s;}
.dopt input{accent-color:#c8102e;} .dopt:hover{border-color:#c8102e;}
.dopt.on{border-color:#c8102e;background:#fef2f4;font-weight:700;color:#c8102e;}
.legal{font-size:11px;line-height:1.7;color:#6b7280;padding:11px;background:#f3f4f6;border-radius:5px;border:1px solid #e5e7eb;}

/* ── TOAST ── */
.toast{position:fixed;bottom:22px;right:22px;padding:11px 18px;border-radius:6px;font-size:12px;font-weight:600;color:#fff;z-index:9999;box-shadow:0 4px 18px rgba(0,0,0,.2);}
.t-ok{background:#15803d;} .t-err{background:#dc2626;}

/* ── MODAL ── */
.ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:9000;display:flex;align-items:flex-start;justify-content:center;padding-top:20px;overflow-y:auto;}
.modal{background:#fff;border-radius:10px;padding:24px;max-width:340px;width:90%;box-shadow:0 8px 30px rgba(0,0,0,.5);position:relative;z-index:9001;}
.modal h3{font-size:15px;font-weight:800;margin-bottom:7px;}
.modal p{font-size:12px;color:#6b7280;margin-bottom:18px;line-height:1.6;}
.mbtns{display:flex;gap:8px;justify-content:flex-end;}

/* ── ESTILOS DE IMPRESION EN TABLA ── */
.ptd{border:1px solid #bbb;padding:3px 5px;font-size:9px;vertical-align:top;}
.pth{border:1px solid #999;padding:3px 5px;font-size:9px;vertical-align:top;background:#1a2332;color:#fff;font-weight:700;text-align:center;}
</style>
</head>

function doPrint(html) {
  var win = window.open("", "_blank");
  if(!win){ alert("Permite ventanas emergentes en tu navegador."); return; }

  var css = ''
    + '*{box-sizing:border-box;margin:0;padding:0;}'
    + 'html{background:#888;}'
    + 'body{font-family:Arial,sans-serif;background:#888;margin:0;padding:16px 0;}'
    + 'table{border-collapse:collapse;}'
    // Cada div de página se muestra como hoja A4 en pantalla
    + '.pgwrap{'
    +   'background:white;'
    +   'width:210mm;'
    +   'min-height:297mm;'
    +   'margin:0 auto 16px;'
    +   'padding:12mm 14mm;'
    +   'box-shadow:0 3px 16px rgba(0,0,0,.5);'
    +   'display:block;'
    + '}'
    // Barra de botones
    + '.topbtn{'
    +   'position:sticky;top:0;z-index:99;'
    +   'background:#0f172a;padding:10px 20px;'
    +   'display:flex;justify-content:center;gap:14px;margin-bottom:16px;'
    + '}'
    + '.topbtn button{padding:10px 28px;font-size:14px;font-weight:700;border:none;border-radius:5px;cursor:pointer;font-family:Arial;}'
    + '.bp{background:#c8102e;color:white;font-size:15px;}'
    + '.bc{background:#6b7280;color:white;}'
    // Al imprimir: sin fondo gris, sin botones, cada .pgwrap = 1 hoja
    + '@page{size:A4 portrait;margin:0;}'
    + '@media print{'
    +   '.topbtn{display:none!important;}'
    +   'html,body{background:white;padding:0;margin:0;}'
    +   '.pgwrap{'
    +     'width:100%;min-height:auto;margin:0;'
    +     'padding:12mm 14mm;box-shadow:none;'
    +     'page-break-after:always;'
    +   '}'
    +   '.pgwrap:last-child{page-break-after:avoid;}'
    + '}';

  // Envolver cada página (div con page-break-after) en un .pgwrap
  // Los divs de página tienen style con page-break-after:always o son el último
  var wrapped = html
    // Página con page-break-after → .pgwrap
    .replace(
      /<div style="font-family:Arial[^"]*page-break-after:always[^"]*">/g,
      '<div class="pgwrap">'
    )
    // Última página (sin page-break-after) → .pgwrap también
    .replace(
      /<div style="font-family:Arial[^"]*min-height:297mm[^"]*padding:12mm 14mm;">/g,
      '<div class="pgwrap">'
    );

  var fullPage = '<!DOCTYPE html>'
    + '<html><head><meta charset="UTF-8"/>'
    + '<meta name="viewport" content="width=device-width,initial-scale=1"/>'
    + '<title>Grupo Roc&#237;o — Documentos</title>'
    + '<style>'+css+'</style>'
    + '</head><body>'
    + '<div class="topbtn">'
    + '<button class="bp" onclick="window.print()">&#128438;&nbsp; Imprimir / Guardar PDF</button>'
    + '<button class="bc" onclick="window.close()">&#x2715; Cerrar</button>'
    + '</div>'
    + wrapped
    + '</body></html>';

  win.document.write(fullPage);
  win.document.close();
}

// ── EXCEL ─────────────────────────────────────────────────────────────────────
function calcIMC(peso, talla) {
  const p = parseFloat(peso), t = parseFloat(talla);
  if(!p || !t || t === 0) return "";
  const imc = p / (t * t);
  if(imc < 18.5) return "BAJO PESO";
  if(imc < 25)   return "NORMAL";
  if(imc < 30)   return "SOBRE PESO";
  if(imc < 35)   return "OBESIDAD 1";
  if(imc < 40)   return "OBESIDAD 2";
  return "OBESIDAD 3";
}

function exportAll(records) {
  const wb = XLSX.utils.book_new();

  // Colores exactos del Excel original del cliente
  const blue   = {rgb:"9BC2E6"};  // azul claro encabezado
  const white  = {rgb:"FFFFFF"};
  const dark   = {rgb:"000000"};
  const stripe = {rgb:"DDEBF7"};  // azul muy claro filas pares

  const brd = {
    top:{style:"thin",color:{rgb:"AAAAAA"}},
    bottom:{style:"thin",color:{rgb:"AAAAAA"}},
    left:{style:"thin",color:{rgb:"AAAAAA"}},
    right:{style:"thin",color:{rgb:"AAAAAA"}}
  };

  // Estilo encabezado — igual al original: fondo azul, negrita, centrado
  const hS = {
    font:{bold:true, sz:10, color:dark},
    fill:{fgColor:blue},
    alignment:{horizontal:"center", vertical:"center", wrapText:true},
    border:brd
  };
  // Fila de datos normal
  const dS = {
    font:{sz:10, color:dark},
    fill:{fgColor:white},
    alignment:{horizontal:"center", vertical:"center", wrapText:true},
    border:brd
  };
  // Fila de datos (nombre — alineado a la izquierda)
  const dSL = {
    font:{sz:10, color:dark},
    fill:{fgColor:white},
    alignment:{horizontal:"left", vertical:"center", wrapText:true},
    border:brd
  };
  // Fila alterna
  const dSA = {
    font:{sz:10, color:dark},
    fill:{fgColor:stripe},
    alignment:{horizontal:"center", vertical:"center", wrapText:true},
    border:brd
  };
  const dSAL = {
    font:{sz:10, color:dark},
    fill:{fgColor:stripe},
    alignment:{horizontal:"left", vertical:"center", wrapText:true},
    border:brd
  };

  // ── HOJA PRINCIPAL: exactamente igual al Excel del cliente ──
  // Columnas: N° | FECHA DE EVALUACION | NOMBRES Y APELLIDOS | DNI | SEXO |
  //           FECHA DE NACIMIENTO | AREA | SEDE | PESO | TALLA | IMC |
  //           DIAGNOSTICO | FUR | ACO | ALERGIA | ANTECEDENTES PATOLOGICOS |
  //           ANTECEDENTES QUIRURGICOS | DIAGNOSTICOS | APTITUD MEDICA | TELEFONO

  const HEADERS = [
    "N°","FECHA DE EVALUACION","NOMBRES Y APELLIDOS","DNI","SEXO",
    "FECHA DE NACIMIENTO","AREA","SEDE","PESO","TALLA","IMC",
    "DIAGNOSTICO","FUR","ACO","ALERGIA","ANTECEDENTES PATOLOGICOS",
    "ANTECEDENTES QUIRURGICOS","DIAGNOSTICOS","APTITUD MEDICA","TELEFONO"
  ];

  const COL_WIDTHS = [7, 12, 42, 16.5, 7.5, 17, 31, 17, 11.5, 22, 14.5, 11.5, 25, 21.5, 20, 14, 15.5, 20, 14, 20];

  const dataRows = records.map((r, i) => {
    const f = r.ficha;
    const d = r.decl;
    // Usar datos de ficha médica; si no hay nombre buscar en declaración
    const nombre    = f.apellidosNombres || d.apellidosNombres || "";
    const dni       = f.dni || d.apellidosNombres || "";
    const sexo      = f.genero ? (f.genero==="Masculino"?"M":f.genero==="Femenino"?"F":f.genero) : (d.genero||"");
    const fechaEval = f.fechaExamen || d.fecha || "";
    const fechaNac  = d.fechaNacimiento || "";
    const area      = f.area || d.area || "";
    const sede      = f.empresa || d.sede || "";
    const peso      = f.peso || "";
    const talla     = f.talla ? (parseFloat(f.talla) > 3 ? (parseFloat(f.talla)/100).toFixed(2) : f.talla) : "";
    const tallaNum  = talla ? parseFloat(talla) : 0;
    const pesoNum   = peso ? parseFloat(peso) : 0;
    const imcVal    = (pesoNum && tallaNum) ? (pesoNum/(tallaNum*tallaNum)).toFixed(2) : "";
    const diagImc   = calcIMC(pesoNum, tallaNum);
    const fur       = f.fur || "NA";
    const aco       = f.aco || "NA";
    const alergia   = f.alergias || "NIEGA";
    const antecPat  = [f.tbc&&"TBC",f.asma&&"ASMA",f.hepatitis&&"HEPATITIS",f.otros].filter(Boolean).join(", ")||"NIEGA";
    const antecQuir = f.observaciones || "NIEGA";
    const diagClin  = f.anamnesis || "CLINICAMENTE SANO";
    const aptitud   = f.aptitudMedica || "";
    const telefono  = "";

    return [
      i+1, fechaEval, nombre, f.dni||d.apellidosNombres||"", sexo,
      fechaNac, area, sede, peso, talla, imcVal,
      diagImc, fur, aco, alergia, antecPat,
      antecQuir, diagClin, aptitud, telefono
    ];
  });

  const ws = XLSX.utils.aoa_to_sheet([HEADERS, ...dataRows]);

  // Anchos de columna exactos del original
  ws["!cols"] = COL_WIDTHS.map(w => ({wch: w}));

  // Altura de filas
  ws["!rows"] = [{hpx:30}, ...dataRows.map(()=>({hpx:18}))];

  // Aplicar estilos al encabezado
  HEADERS.forEach((_, c) => {
    const ref = XLSX.utils.encode_cell({r:0, c});
    if(ws[ref]) ws[ref].s = hS;
  });

  // Aplicar estilos a las filas de datos
  dataRows.forEach((_, i) => {
    const isOdd = i % 2 === 1;
    HEADERS.forEach((_, c) => {
      const ref = XLSX.utils.encode_cell({r: 1+i, c});
      if(ws[ref]) {
        if(c === 2) ws[ref].s = isOdd ? dSAL : dSL;      // Nombre: alineado izquierda
        else if(c === 6) ws[ref].s = isOdd ? dSAL : dSL;  // Área: alineado izquierda
        else ws[ref].s = isOdd ? dSA : dS;
      }
    });
  });

  XLSX.utils.book_append_sheet(wb, ws, "Hoja1");

  // ── HOJA 2: Declaración Jurada (complemento) ──
  const dH2 = ["N°","NOMBRES Y APELLIDOS","FECHA","SEXO","F. NACIMIENTO","ÁREA","SEDE","PUESTO",
    ...CONDS.map(([,l])=>l.toUpperCase()),
    "USA MEDICAMENTOS","DETALLE MEDICAMENTOS","DECLARACIÓN FINAL"];

  const dR2 = records.map((r,i)=>{
    const d=r.decl;
    return [i+1, d.apellidosNombres||r.ficha.apellidosNombres, d.fecha, d.genero, d.fechaNacimiento,
      d.area||r.ficha.area, d.sede||r.ficha.empresa, d.puesto,
      ...CONDS.map(([k])=>d[k]?"SÍ":"No"),
      d.usaMedicamentos, d.detalleMedicamentos,
      d.declaracion==="NO_TENER"?"NO TIENE condiciones":d.declaracion==="TENER"?"TIENE condiciones":""];
  });

  const ws2 = XLSX.utils.aoa_to_sheet([dH2, ...dR2]);
  ws2["!cols"] = dH2.map((_,i)=>({wch: i===1?42:i===0?7:16}));
  ws2["!rows"] = [{hpx:30}, ...dR2.map(()=>({hpx:18}))];
  dH2.forEach((_,c)=>{ const ref=XLSX.utils.encode_cell({r:0,c}); if(ws2[ref]) ws2[ref].s=hS; });
  dR2.forEach((_,i)=>{
    const isOdd=i%2===1;
    dH2.forEach((_,c)=>{
      const ref=XLSX.utils.encode_cell({r:1+i,c});
      if(ws2[ref]) ws2[ref].s = c===1?(isOdd?dSAL:dSL):(isOdd?dSA:dS);
    });
  });
  XLSX.utils.book_append_sheet(wb, ws2, "Declaración Jurada");

  XLSX.writeFile(wb, `FICHAS_MEDICAS_COLABORADORES_CAPTADOS_${new Date().getFullYear()}.xlsx`);
}

function SignaturePad({ label, value, onChange }) {
  const canvasRef  = React.useRef(null);
  const drawing    = React.useRef(false);
  const lastPos    = React.useRef(null);

  // Sync canvas internal size to its display size
  const syncSize = () => {
    const canvas = canvasRef.current;
    if(!canvas) return;
    const rect = canvas.getBoundingClientRect();
    const dpr  = window.devicePixelRatio || 1;
    if(canvas.width !== Math.round(rect.width * dpr) || canvas.height !== Math.round(rect.height * dpr)) {
      // Save current drawing
      const imgData = canvas.toDataURL();
      canvas.width  = Math.round(rect.width  * dpr);
      canvas.height = Math.round(rect.height * dpr);
      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);
      // Restore drawing
      if(value) {
        const img = new Image();
        img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
        img.src = imgData;
      }
    }
  };

  React.useEffect(() => {
    syncSize();
    if(value) {
      const canvas = canvasRef.current;
      if(!canvas) return;
      const ctx  = canvas.getContext("2d");
      const rect = canvas.getBoundingClientRect();
      const img  = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
      img.src = value;
    }
    window.addEventListener("resize", syncSize);
    return () => window.removeEventListener("resize", syncSize);
  }, []);

  // Get position scaled to canvas internal resolution
  const getPos = (e) => {
    const canvas = canvasRef.current;
    const rect   = canvas.getBoundingClientRect();
    const dpr    = window.devicePixelRatio || 1;
    const src    = e.touches ? e.touches[0] : e;
    return {
      x: (src.clientX - rect.left),
      y: (src.clientY - rect.top)
    };
  };

  const startDraw = (e) => {
    e.preventDefault();
    syncSize();
    drawing.current  = true;
    lastPos.current  = getPos(e);
  };

  const draw = (e) => {
    e.preventDefault();
    if(!drawing.current) return;
    const canvas = canvasRef.current;
    const ctx    = canvas.getContext("2d");
    const pos    = getPos(e);
    ctx.beginPath();
    ctx.moveTo(lastPos.current.x, lastPos.current.y);
    ctx.lineTo(pos.x, pos.y);
    ctx.strokeStyle = "#000";
    ctx.lineWidth   = 2.5;
    ctx.lineCap     = "round";
    ctx.lineJoin    = "round";
    ctx.stroke();
    lastPos.current = pos;
  };

  const endDraw = () => {
    if(!drawing.current) return;
    drawing.current = false;
    onChange(canvasRef.current.toDataURL("image/png"));
  };

  const clear = () => {
    const canvas = canvasRef.current;
    const rect   = canvas.getBoundingClientRect();
    canvas.getContext("2d").clearRect(0, 0, rect.width, rect.height);
    onChange("");
  };

  return (
    <div style={{marginBottom:10}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:5}}>
        <label className="fl">{label}</label>
        <button onClick={clear} type="button"
          style={{fontSize:10,color:"#dc2626",background:"none",border:"1px solid #fca5a5",
                  borderRadius:3,padding:"2px 8px",cursor:"pointer",fontFamily:"inherit"}}>
          ✕ Borrar
        </button>
      </div>
      <div style={{
        border:"1.5px solid "+(value?"#16a34a":"#d1d5db"),
        borderRadius:6,
        background:value?"#f0fdf4":"#fafafa",
        touchAction:"none",
        overflow:"hidden",
        width:"100%"
      }}>
        <canvas
          ref={canvasRef}
          style={{
            width:"100%",
            height:100,
            display:"block",
            cursor:"crosshair",
            touchAction:"none"
          }}
          onMouseDown={startDraw} onMouseMove={draw} onMouseUp={endDraw} onMouseLeave={endDraw}
          onTouchStart={startDraw} onTouchMove={draw} onTouchEnd={endDraw}
        />
      </div>
      <p style={{fontSize:10,color:value?"#16a34a":"#9ca3af",marginTop:4,fontWeight:value?600:400}}>
        {value ? "✓ Firma guardada correctamente" : "✍ Dibuja tu firma con el dedo o el mouse en todo el recuadro"}
      </p>
    </div>
  );
}

            <button className="sync-btn" style={{width:"100%",marginBottom:8,background:"#16A34A",color:"#fff"}} onClick={()=>{
              const SK="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxdmN2ZmZ5eW5wbmlnaHp3eGp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MjgyNDcsImV4cCI6MjA5MzMwNDI0N30.fFufNEdRvAzl6O6BqtTbx83O3Eg8Wd7gACNJDGQKga4";
              const SU="https://rqvcvffyynpnighzwxju.supabase.co";
              const recs=records;
              if(!recs.length){showToast("Sin fichas");return;}
              let n=0;
              recs.forEach(r=>{
                const p={record_id:String(r.id),ficha:r.ficha||{},decl:r.decl||{},empresa:(r.ficha&&r.ficha.empresa)||""};
                fetch(SU+"/rest/v1/fichas_medicas?record_id=eq."+r.id,{headers:{"apikey":SK,"Authorization":"Bearer "+SK}})
                .then(res=>res.json()).then(ex=>{
                  const method=ex&&ex.length?"PATCH":"POST";
                  const url=ex&&ex.length?SU+"/rest/v1/fichas_medicas?record_id=eq."+r.id:SU+"/rest/v1/fichas_medicas";
                  return fetch(url,{method,headers:{"apikey":SK,"Authorization":"Bearer "+SK,"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify(p)});
                }).then(()=>{n++;if(n===recs.length){
                  showToast("Guardadas "+n+" fichas en la nube");
                  // Also sync to Google Sheets
                  fetch("/api/sheets-fichas",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({records:recs})}).catch(()=>{});
                }})
                .catch(e=>console.warn(e));
              });
            }}>Guardar en Nube ({records.length} fichas)</button>
            <button className="sync-btn" style={{width:"100%",marginBottom:8,background:"#2563EB",color:"#fff"}} onClick={()=>{
              const SK="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxdmN2ZmZ5eW5wbmlnaHp3eGp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MjgyNDcsImV4cCI6MjA5MzMwNDI0N30.fFufNEdRvAzl6O6BqtTbx83O3Eg8Wd7gACNJDGQKga4";
              const SU="https://rqvcvffyynpnighzwxju.supabase.co";
              fetch(SU+"/rest/v1/fichas_medicas?select=*&order=created_at.asc",{headers:{"apikey":SK,"Authorization":"Bearer "+SK}})
              .then(r=>r.json()).then(rows=>{
                if(!rows||!rows.length){showToast("Sin fichas en la nube");return;}
                const rs=rows.map(r=>({id:r.record_id,ficha:r.ficha||{},decl:r.decl||{}}));
                setRecords(rs);
                showToast("Cargadas "+rs.length+" fichas");
                setShowSync(false);
              }).catch(e=>showToast("Error: "+e.message));
            }}>Cargar desde Nube</button>
            <button className="sync-btn" style={{width:"100%",marginBottom:8,background:"#0F9D58",color:"#fff"}} onClick={()=>window.open("https://docs.google.com/spreadsheets/d/1a1MGpVTZOeB6YHoP9pVzSUuYABpAru-wlfqc-Uuck7g","_blank")}>Abrir Google Sheets</button>
            <button className="sync-btn sync-btn-gray" style={{width:"100%"}} onClick={()=>setShowSync(false)}>Cerrar</button>
          </div>
        </div>
      )}

      {confirmDel&&(
        <div className="ov">
          <div className="modal">
            <h3>¿Eliminar registro?</h3>
            <p>Se eliminará el registro de <b>"{GN(confirmDel)}"</b>. No se puede deshacer.</p>
            <div className="mbtns">
              <button className="btn btn-ghost" onClick={()=>setConfirmDel(null)}>Cancelar</button>
              <button className="btn btn-red" onClick={()=>delRec(confirmDel.id)}>Eliminar</button>
            </div>
          </div>
        </div>
      )}

      {/* TOPBAR */}
      <div className="top">
        <div className="top-left">
          <div className="logo">Grupo Rocío</div>
          <div>
            <div className="top-title">Sistema de Fichas Médicas</div>
            <div className="top-sub">Área SIG · Salud Ocupacional</div>
          </div>
        </div>
        <div className="top-right">
          {screen==="list"?(
            <button className="btn btn-red btn-sm" onClick={()=>exportAll(records)}>⬇ Exportar Excel ({total})</button>
          ):(
            <>
              <button className="btn btn-dark btn-sm" onClick={()=>print("ficha")}>🖨 Ficha</button>
              <button className="btn btn-dark btn-sm" onClick={()=>print("decl")}>🖨 Declaración</button>
              <button className="btn btn-red btn-sm" onClick={printAll}>🖨 Todo (4 hojas)</button>
              <button className="btn btn-dark btn-sm" onClick={()=>exportAll(records)}>⬇ Excel</button>
            </>
          )}
        </div>
      </div>

      {/* PANTALLA 1: LISTA */}
      {screen==="list"&&(
        <div className="list-screen">
          <div className="list-header">
            <div>
              <h1>Colaboradores Registrados</h1>
              <p style={{display:"flex",alignItems:"center",gap:6}}>
                <span style={{display:"inline-block",width:8,height:8,borderRadius:"50%",background:loadingInit?"#f59e0b":"#16a34a"}}></span>
                {loadingInit?"Cargando desde Supabase...":"Guardado en Supabase · "+records.filter(r=>GN(r)!=="Nuevo colaborador").length+" colaborador(es) registrados"}
              </p>
            </div>
            <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                <button className="btn btn-white" style={{fontSize:11,color:"#0369a1",borderColor:"#bae6fd"}} onClick={()=>{
                if(gsUrl&&gsUrl.startsWith("https://")){
                  showToast("⏳ Sincronizando...");
                  fetch(gsUrl,{method:"POST",mode:"no-cors",body:JSON.stringify({records})})
                    .then(()=>showToast("✓ Sincronizado con Google Sheets"))
                    .catch(()=>showToast("✓ Datos enviados"));
                } else {
                  setShowSync(true);
                }
              }}>🔄 Sync</button>

              <button className="btn btn-white" onClick={()=>exportAll(records)}>⬇ Excel</button>
              <button className="btn btn-red" onClick={addNew}>+ Nuevo</button>
            </div>
          </div>
          {/* BUSCADOR */}
          <div style={{marginBottom:18,position:"relative"}}>
            <input
              className="fi"
              style={{paddingLeft:38,fontSize:13,borderRadius:7,border:"1.5px solid #d1d5db",background:"#fff",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}
              placeholder="🔍  Buscar por nombre o DNI..."
              value={search}
              onChange={e=>setSearch(e.target.value)}
            />
            {search && (
              <button onClick={()=>setSearch("")}
                style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",fontSize:16,color:"#9ca3af"}}>
                ✕
              </button>
            )}
          </div>
          <div className="stats-row">
            <div className="stat"><div className="stat-n">{total}</div><div className="stat-l">Total registros</div></div>
            <div className="stat s-green"><div className="stat-n">{aptos}</div><div className="stat-l">Aptos</div></div>
            <div className="stat s-red"><div className="stat-n">{noApto}</div><div className="stat-l">No aptos</div></div>
            <div className="stat s-orange"><div className="stat-n">{obs}</div><div className="stat-l">Con obs./restr.</div></div>
          </div>
          <div className="grid">
            {records.filter(r=>{
              if(!search.trim()) return true;
              const q = search.toLowerCase().trim();
              const name = GN(r).toLowerCase();
              const dni  = (r.ficha.dni||r.decl.apellidosNombres||"").toLowerCase();
              return name.includes(q) || dni.includes(q);
            }).map(r=>{
              const name=GN(r);
              const ini=name.split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"?";
              return(
                <div key={r.id} className="rcard" onClick={()=>open(r.id)}>
                  <div className="av">{ini}</div>
                  <div className="rname">{name}</div>
                  <div className="rdni">DNI: {r.ficha.dni||"—"}</div>
                  <div className="rtags">
                    {r.ficha.empresa&&<span className="rtag">{r.ficha.empresa}</span>}
                    {r.ficha.area&&<span className="rtag">{r.ficha.area}</span>}
                    {r.ficha.aptitudMedica&&<span className="apill" style={{background:AC(r.ficha.aptitudMedica)}}>{r.ficha.aptitudMedica}</span>}
                  </div>
                  <div className="rfooter">
                    <button className="redit" onClick={e=>{e.stopPropagation();open(r.id);}}>✏ Editar</button>
                    <button className="rdel" onClick={e=>{e.stopPropagation();setConfirmDel(r);}}>🗑 Eliminar</button>
                  </div>
                </div>
              );
            })}
            {!search && <div className="addcard" onClick={addNew}>
              <div className="addicon">+</div>
              <div className="addlbl">Nuevo colaborador</div>
              <div className="addsub">Agregar ficha médica</div>
            </div>}
          </div>
        </div>
      )}

      {/* PANTALLA 2: FORMULARIO */}
      {screen==="form"&&(
        <div className="form-screen">
          <div className="form-bar">
            <div className="form-topbar-left" style={{display:"flex",alignItems:"center",gap:12}}>
              <button className="back-btn" onClick={()=>setScreen("list")}>← Volver a la lista</button>
              <div style={{width:1,height:26,background:"#e5e7eb"}}/>
              <div className="ftitle">
                <h2>{GN(active)}</h2>
                <p>DNI: {active.ficha.dni||"—"} · {active.ficha.empresa||"Sin empresa"}</p>
              </div>
            </div>
            <div style={{display:"flex",gap:8}}>
              <button className="btn btn-ghost btn-sm" onClick={()=>print(formTab===0?"ficha":"decl")}>
                🖨 {formTab===0?"Ficha":"Declaración"}
              </button>
              <button className="btn btn-red btn-sm" onClick={printAll}>🖨 Todo (4 hojas)</button>
              <button className="btn btn-green btn-sm" onClick={saveBack}>✓ Guardar y volver</button>
            </div>
          </div>
          <div className="tabs">
            {["Ficha Médica  ·  F-GSS-25-06","Declaración Jurada  ·  F-GSS-88-02"].map((t,i)=>(
              <button key={i} className={"tab"+(formTab===i?" on":"")} onClick={()=>setFormTab(i)}>{t}</button>
            ))}
          </div>
          <div className="fscroll">
            <div className="fcard">
              <div className="fcard-head">
                <span className="fcard-title">{formTab===0?"Ficha Médica para Colaborador Captado":"Declaración Jurada de Salud"}</span>
                <span className="fcard-code">{formTab===0?"F-GSS-25-06":"F-GSS-88-02"} · Emisión 01/10/2025</span>
              </div>
              {formTab===0
                ?<FichaForm data={active.ficha} onChange={v=>{
  upd("ficha",v);
  const gMap={"Femenino":"F","Masculino":"M","No binario / Otro":"Otro","Prefiero no responder":"Otro"};
  setRecords(rs=>rs.map(r=>r.id===activeId?{...r,decl:{...r.decl,
    apellidosNombres:v.apellidosNombres!==undefined?v.apellidosNombres:r.decl.apellidosNombres,
    dni:v.dni!==undefined?v.dni:r.decl.dni,
    genero:v.genero?gMap[v.genero]||r.decl.genero:r.decl.genero,
    edad:v.edad!==undefined?v.edad:r.decl.edad,
    fechaNacimiento:v.fechaNacimiento!==undefined?v.fechaNacimiento:r.decl.fechaNacimiento,
    area:v.area!==undefined?v.area:r.decl.area,
    sede:v.sede!==undefined?v.sede:r.decl.sede,
    puesto:v.puesto!==undefined?v.puesto:r.decl.puesto,
    fecha:v.fechaExamen!==undefined?v.fechaExamen:r.decl.fecha,
  }}:r));
}}/>
                :<DeclForm  data={active.decl}  onChange={v=>{
  upd("decl",v);
  const gRevMap={"F":"Femenino","M":"Masculino","Otro":"No binario / Otro"};
  setRecords(rs=>rs.map(r=>r.id===activeId?{...r,ficha:{...r.ficha,
    apellidosNombres:v.apellidosNombres!==undefined?v.apellidosNombres:r.ficha.apellidosNombres,
    genero:v.genero?gRevMap[v.genero]||r.ficha.genero:r.ficha.genero,
    edad:v.edad!==undefined?v.edad:r.ficha.edad,
    fechaNacimiento:v.fechaNacimiento!==undefined?v.fechaNacimiento:r.ficha.fechaNacimiento,
    area:v.area!==undefined?v.area:r.ficha.area,
    sede:v.sede!==undefined?v.sede:r.ficha.sede,
    puesto:v.puesto!==undefined?v.puesto:r.ficha.puesto,
    fechaExamen:v.fecha!==undefined?v.fecha:r.ficha.fechaExamen,
  }}:r));
}}/>
              }
              <div className="fcard-foot">
                <button className="btn btn-ghost btn-sm" onClick={()=>print(formTab===0?"ficha":"decl")}>🖨 {formTab===0?"Ficha":"Declaración"}</button>
                <button className="btn btn-red btn-sm" onClick={printAll}>🖨 Imprimir Todo (4 hojas PDF)</button>
                <button className="btn btn-green" onClick={saveBack}>✓ Guardar y volver</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

ReactDOM.render(React.createElement(App), document.getElementById("root"));
</script>
</body>
</html>
