<title>Tableros · Blueberries</title><meta name="theme-color" content="#123A5C"><link rel="manifest" href="tableros.webmanifest"><link rel="icon" href="tableros-icon-192.png"><link rel="apple-touch-icon" href="tableros-icon-192.png">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}body{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#EEF2F6;color:#0F1B2A}
.hd{display:flex;align-items:center;justify-content:space-between;background:#fff;padding:10px 14px;border-bottom:1px solid #dde5ee}.hd img{height:30px}.sp{display:inline-block;width:1px;height:26px;background:#ccd;margin:0 10px;vertical-align:middle}
.ti{background:#123A5C;color:#fff;padding:16px 16px 18px}.ti h1{margin:0;font-size:24px}.ti p{margin:4px 0 0;opacity:.85;font-weight:600}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding:14px;max-width:1100px;margin:0 auto}
.t{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:4px 12px;border:0;border-radius:16px;background:#fff;padding:16px;text-align:left;cursor:pointer;box-shadow:0 2px 8px #0001;border-left:7px solid var(--c);font:inherit;color:inherit}
.t:active{transform:scale(.98)}.t span{grid-row:1/3;width:64px;height:64px;border-radius:14px;background:var(--c);display:flex;align-items:center;justify-content:center;font-size:34px}
.t b{font-size:20px}.t small{font-size:14px;color:#4A5868;font-weight:600}
#vw{position:fixed;inset:0;display:none;flex-direction:column;background:#fff;z-index:9}#vw.on{display:flex}
.bar{display:flex;align-items:center;gap:10px;background:#123A5C;color:#fff;padding:calc(6px + env(safe-area-inset-top,0px)) 10px 6px}
.bar button{border:0;background:#ffffff22;color:#fff;font:700 16px system-ui;border-radius:10px;padding:8px 12px;cursor:pointer}.bar b{flex:1;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
iframe{flex:1;border:0;width:100%}
</style></head><body>
