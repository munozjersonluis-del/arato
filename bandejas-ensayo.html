<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Bandejas · Ensayo</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#F2F4F8;color:#123A5C}

.qk{display:flex;gap:8px;margin:0 16px}.qk button{flex:1;border:0;background:#E3ECF6;color:#141F6B;border-radius:10px;padding:10px;font-weight:900;font-size:16px}
.lv{text-align:center;margin:18px 14px 0;background:#fff;border-radius:18px;padding:16px}.lv .t{font-size:16px;font-weight:800;color:#567}.lv b{display:block;font-size:84px;line-height:1;color:#141F6B}.lv p{font-size:21px;font-weight:900;margin:6px 0}
.e{text-align:center;color:#789;font-weight:700;padding:30px}
input,select{font-size:17px;padding:10px;border-radius:10px;border:2px solid #C9D2DC;width:100%;font-weight:700}
.lab{margin:10px 16px 4px;font-weight:800}.fld{margin:0 16px}
.msg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#123A5C;color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;display:none;z-index:9}
.tag{display:inline-block;background:#FFF3C4;color:#7A5A00;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:6px}
</style></head><body><div id=app></div><div id=msg class=msg></div>
<script>
const SB='https://rqvcvffyynpnighzwxju.supabase.co',K='sb_publishable_keWbJCavFGWO_B976cjxAA_Gd5JMzFn',H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json',Prefer:'return=representation'};
const BL=[{"b": "BLO1702", "l": "3835-KR", "x": 190, "y": 274}, {"b": "BLO1703", "l": "3836-KR", "x": 191, "y": 377}, {"b": "BLO1705", "l": "3842-KR", "x": 396, "y": 371}, {"b": "BLO1705", "l": "3843-KR", "x": 403, "y": 474}, {"b": "BLO1703", "l": "3838-KR", "x": 205, "y": 580}, {"b": "BLO1703", "l": "3839-KR", "x": 205, "y": 702}, {"b": "BLO1707", "l": "3864-KR", "x": 1171, "y": 255}, {"b": "BLO1602", "l": "3853-KR", "x": 796, "y": 360}, {"b": "BLO1604", "l": "3865-KR", "x": 1192, "y": 357}, {"b": "BLO1603", "l": "3859-KR", "x": 994, "y": 363}, {"b": "BLO1603", "l": "3862-KR", "x": 1001, "y": 670}, {"b": "BLO1604", "l": "3868-KR", "x": 1213, "y": 669}, {"b": "BLO1709", "l": "3878-KR", "x": 1591, "y": 439}, {"b": "BLO1606", "l": "3872-KR", "x": 1397, "y": 457}, {"b": "BLO1602", "l": "3856-KR", "x": 810, "y": 681}, {"b": "BLO1601", "l": "3851-KR", "x": 615, "y": 685}, {"b": "BLO1708", "l": "3874-AR", "x": 1418, "y": 672}, {"b": "BLO1606", "l": "3879-KR", "x": 1598, "y": 547}, {"b": "BLO1708", "l": "3881", "x": 1608, "y": 738}, {"b": "BLO1708", "l": "3880-AR", "x": 1641, "y": 648}, {"b": "BLO1705", "l": "3845-KR", "x": 411, "y": 690}, {"b": "BLO1603", "l": "3861-KR", "x": 1000, "y": 561}, {"b": "BLO1606", "l": "3873-KR", "x": 1403, "y": 546}, {"b": "BLO1602", "l": "3855-KR", "x": 809, "y": 561}, {"b": "BLO1605", "l": "3877-KR", "x": 1613, "y": 331}, {"b": "BLO1605", "l": "3871-KR", "x": 1415, "y": 339}, {"b": "BLO1604", "l": "3867-KR", "x": 1199, "y": 547}, {"b": "BLO1601", "l": "3850-KR", "x": 612, "y": 558}, {"b": "BLO1604", "l": "3866-KR", "x": 1199, "y": 446}, {"b": "BLO1603", "l": "3860-KR", "x": 990, "y": 478}, {"b": "BLO1605", "l": "3870-KR", "x": 1401, "y": 235}, {"b": "BLO1602", "l": "3854-KR", "x": 796, "y": 472}, {"b": "BLO1601", "l": "3849-KR", "x": 605, "y": 478}, {"b": "BLO1705", "l": "3844-KR", "x": 403, "y": 573}, {"b": "BLO1707", "l": "3858-KR", "x": 983, "y": 255}, {"b": "BLO1601", "l": "3848-KR", "x": 589, "y": 381}, {"b": "BLO1605", "l": "3869-KR", "x": 1397, "y": 108}, {"b": "BLO1707", "l": "3863-KR", "x": 1192, "y": 151}, {"b": "BLO1707", "l": "3857-KR", "x": 1016, "y": 176}, {"b": "BLO1706", "l": "3852-KR", "x": 788, "y": 258}, {"b": "BLO1706", "l": "3847-KR", "x": 586, "y": 266}, {"b": "BLO1706", "l": "3846", "x": 553, "y": 204}, {"b": "BLO1703", "l": "3837-KR", "x": 208, "y": 493}, {"b": "BLO1704", "l": "3840-KR", "x": 374, "y": 190}, {"b": "BLO1704", "l": "3841-KR", "x": 395, "y": 258}, {"b": "BLO1511", "l": "3834-AR", "x": 175, "y": 154}];
const $=s=>document.querySelector(s),A=$('#app');
const ls=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
const ymd=d=>d.toLocaleDateString('en-CA',{timeZone:'America/Lima'}),HOY=()=>ymd(new Date()),MAN=()=>ymd(new Date(Date.now()+864e5));
const hm=t=>t?new Date(t).toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit',timeZone:'America/Lima'}):'';
const dn=d=>new Date(d+'T12:00').toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'short'});
function toast(t){const m=$('#msg');m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',2200)}
async function q(p,o={}){const r=await fetch(SB+'/rest/v1/bandejas_pedidos'+p,{headers:H,...o});if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json()}
let Z=0.55,U=ls('bj_user'),VW='home',FD=null,NEW=null,DATA=[];
function render(){if(!U)return pickRole();if(U.rol==='aux')return VW==='pedir'?pedir():aux();return est()}
function pickRole(){A.innerHTML=`<div style="text-align:center;padding:26px 0 0"><b style="font-size:23px;color:#141F6B">Bandejas Blueberries</b><div style="color:#567;font-weight:700">Ensayo · ¿Quién eres?</div></div>
<button class=ic style="background:#1E7FD9" onclick="setup('aux')"><div>📋</div><b>Pedidos</b><small>Soy auxiliar · pido bandejas</small></button>
<button class=ic style="background:#1E9E5A" onclick="setup('est')"><div>🚚</div><b>Estiba</b><small>Soy estiba · llevo y dejo bandejas</small></button>`}
function setup(r){A.innerHTML=r==='aux'?`<div class=hd style="background:#1E7FD9">📋 Pedidos</div><div class=lab>Tu nombre</div><div class=fld><input id=nm placeholder="Ej. Fiorela"></div><div class=lab>Tu grupo</div><div class=fld><select id=gr>${'ABCDEF'.split('').map(g=>'<option>'+g+'</option>').join('')}</select></div><button class=big style="background:#1E9E5A" onclick="saveU('aux')">Entrar</button>`
:`<div class=hd style="background:#1E9E5A">🚚 Estiba</div><div class=lab>Placa de tu unidad</div><div class=fld><select id=pl>${['TCI-843','TAU-800','TCX-842','TCA-816','TEY-880','THF-949'].map(p=>'<option>'+p+'</option>').join('')}</select></div><button class=big style="background:#1E9E5A" onclick="saveU('est')">Entrar</button>`}
function saveU(r){U=r==='aux'?{rol:'aux',nombre:($('#nm').value||'').trim(),grupo:$('#gr').value}:{rol:'est',placa:$('#pl').value};if(r==='aux'&&!U.nombre){toast('Escribe tu nombre');return}ls('bj_user',U);load()}
function salir(){if(confirm('¿Cambiar de usuario?')){localStorage.removeItem('bj_user');U=null;render()}}
async function load(){try{const f=U&&U.rol==='aux'?`?grupo=eq.${U.grupo}&fecha=in.(${HOY()},${MAN()})`:`?fecha=eq.${HOY()}`;DATA=await q(f+'&order=creado')||[]}catch(e){toast('Sin conexión')}render()}
const ST=p=>p.estado==='anulado'?['✕','anulado']:p.estado==='entregado'?['✅','dejó '+hm(p.entregado_at)]:['⏳','esperando'];
function aux(){FD=FD||MAN();const L=DATA.filter(p=>p.fecha===FD);const tot=L.filter(p=>p.estado!=='anulado').reduce((s,p)=>s+p.cantidad,0);
A.innerHTML=`<div class=hd style="background:#1E7FD9"><div>📋 Mis bandejas · Grupo ${U.grupo}<small>${U.nombre} · Valle 3 · M17</small></div><button onclick="salir()">⚙</button></div>
<div class=tabs><button class="${FD===HOY()?'on':''}" onclick="FD=HOY();render()">Hoy</button><button class="${FD===MAN()?'on':''}" onclick="FD=MAN();render()">Mañana</button></div>
<div style="margin:8px 16px 0;font-weight:800;color:#567;text-transform:capitalize">Solicitud para ${dn(FD)}</div>
<button class=big style="background:#1E7FD9" onclick="NEW={cant:40};VW='pedir';render()">➕ PEDIR BANDEJAS</button>
${L.length?L.map(p=>{const s=ST(p);return`<div class="pt ${p.estado==='anulado'?'x':''}"><div class=n>P${p.punto}</div><div><b>${p.cantidad}</b><small>${p.bloque||''} · pidió ${hm(p.creado)}</small></div><div class=s>${s[0]}<small>${s[1]}</small>${p.estado==='pendiente'?`<br><button onclick="anular(${p.id})" style="border:0;background:#FDECEA;color:#B0301F;border-radius:8px;font-weight:800;padding:3px 8px;margin-top:3px">Anular</button>`:''}</div></div>`}).join(''):'<div class=e>Aún no hay pedidos</div>'}
${L.length?`<div style="text-align:center;font-weight:900;margin:10px">Total: ${tot} bandejas</div>`:''}
<div style="text-align:center;color:#789;font-size:13px;font-weight:700;margin:10px">✅ llegó · ⏳ esperando · ✕ anulado</div>`}
function near(x,y){let b=null,d=1e9;BL.forEach(o=>{const e=(o.x-x)**2+(o.y-y)**2;if(e<d){d=e;b=o}});return b}
function pedir(){const L=DATA.filter(p=>p.fecha===FD&&p.estado!=='anulado');const np=(Math.max(0,...DATA.filter(p=>p.fecha===FD).map(p=>p.punto||0))+1);NEW.punto=np;
A.innerHTML=`<div class=hd style="background:#1E7FD9">➕ Pedir · Punto ${np}<button onclick="VW='home';render()">✕</button></div>
<div class=q>1. Toca dónde</div><div style="position:relative"><div class=zm><button onclick="zoom(1.3)">+</button><button onclick="zoom(1/1.3)">−</button></div><div class=mp id=mp><div class=in id=mi style="width:${1680*Z}px"><img src="mapas/va3-m17.png" id=im style="width:${1680*Z}px">${L.map(p=>`<div class="pin old" style="left:${p.x*Z}px;top:${p.y*Z}px">P${p.punto}</div>`).join('')}${NEW.x!=null?`<div class=pin style="left:${NEW.x*Z}px;top:${NEW.y*Z}px">P${np}</div>`:''}</div></div></div>
<div class=sel>${NEW.b?'📍 '+NEW.b.b+' · '+NEW.b.l:'<span style="color:#99A">Toca un bloque en el mapa</span>'}</div>
<div class=q>2. ¿Cuántas?</div><div class=num><button onclick="NEW.cant=Math.max(1,NEW.cant-5);render()">−</button><b>${NEW.cant}</b><button onclick="NEW.cant+=5;render()">+</button></div>
<div class=qk>${[20,30,40,50,100].map(v=>`<button onclick="NEW.cant=${v};render()">${v}</button>`).join('')}</div>
<button class=big style="background:${NEW.b?'#1E9E5A':'#9AA'}" onclick="enviar()">ENVIAR</button>`;
const mp=$('#mp');if(NEW.sx!=null){mp.scrollLeft=NEW.sx;mp.scrollTop=NEW.sy}else{mp.scrollLeft=230*Z;mp.scrollTop=150*Z}
$('#im').onclick=e=>{const r=$('#mi').getBoundingClientRect();NEW.x=Math.round((e.clientX-r.left)/Z);NEW.y=Math.round((e.clientY-r.top)/Z);NEW.b=near(NEW.x,NEW.y);NEW.sx=mp.scrollLeft;NEW.sy=mp.scrollTop;render()}}
async function enviar(){if(!NEW.b){toast('Toca un bloque');return}try{await q('',{method:'POST',body:JSON.stringify({fecha:FD,grupo:U.grupo,auxiliar:U.nombre,fundo:'VALLE 3',modulo:'M17',punto:NEW.punto,bloque:NEW.b.b,lote:NEW.b.l,x:NEW.x,y:NEW.y,cantidad:NEW.cant,tipo:FD===HOY()?'dia':'inicio'})});toast('✔ Pedido enviado');VW='home';load()}catch(e){toast('No se pudo enviar')}}
function zoom(f){const mp=document.getElementById('mp');const cx=(mp.scrollLeft+mp.clientWidth/2)/Z,cy=(mp.scrollTop+mp.clientHeight/2)/Z;Z=Math.min(1.6,Math.max(0.3,Z*f));NEW.sx=cx*Z-mp.clientWidth/2;NEW.sy=cy*Z-mp.clientHeight/2;render()}
async function anular(id){if(!confirm('¿Anular este pedido?'))return;await q('?id=eq.'+id,{method:'PATCH',body:JSON.stringify({estado:'anulado',anulado_at:new Date().toISOString()})});toast('Pedido anulado');load()}
function est(){const P=DATA.filter(p=>p.estado==='pendiente'),D=DATA.filter(p=>p.estado==='entregado'&&p.placa===U.placa),c=P[0];
A.innerHTML=`<div class=hd style="background:#1E9E5A"><div>🚚 Estiba · ${U.placa}<small style="text-transform:capitalize">${dn(HOY())}</small></div><button onclick="salir()">⚙</button></div>
${c?`<div class=lv><div class=t>LLEVAR AHORA</div><b>${c.cantidad}</b><p>bandejas</p><p style="color:#1E7FD9">Grupo ${c.grupo} · Punto ${c.punto}</p><div class=t>${c.bloque} · Valle 3 M17 · pidió ${c.tipo==='inicio'?'para iniciar':hm(c.creado)}</div></div>
<button class=big style="background:#1E9E5A" onclick="deje(${c.id},${c.cantidad})">✔ YA DEJÉ</button><button class=big style="background:#E8A23A;font-size:17px;padding:13px;margin-top:0" onclick="otra(${c.id})">Dejé otra cantidad</button>
${P.length>1?`<div class=q>Después</div>${P.slice(1).map(p=>`<div class=pt><div class=n>P${p.punto}</div><div><b>${p.cantidad}</b><small>Grupo ${p.grupo} · ${p.bloque}</small></div></div>`).join('')}`:''}`:'<div class=lv><b style="color:#1E9E5A">✔</b><p>No hay pedidos pendientes</p></div>'}
<div class=q>Ya dejé hoy: ${D.reduce((s,p)=>s+(p.entregado||0),0)} bandejas</div>${D.slice(-5).reverse().map(p=>`<div class=pt><div class=n style="background:#1E9E5A">P${p.punto}</div><div><b>${p.entregado}</b><small>Grupo ${p.grupo} · ${hm(p.entregado_at)}</small></div></div>`).join('')}`}
async function deje(id,n){try{await q('?id=eq.'+id,{method:'PATCH',body:JSON.stringify({estado:'entregado',entregado:n,entregado_at:new Date().toISOString(),placa:U.placa})});toast('✔ Entregado');load()}catch(e){toast('Sin conexión')}}
function otra(id){const n=parseInt(prompt('¿Cuántas bandejas dejaste?'));if(n>=0)deje(id,n)}
setInterval(()=>{if(U&&VW!=='pedir')load()},20000);U?load():render();
</script></body></html>
