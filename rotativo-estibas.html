.ptb td small{display:block;color:#2E86C1;font-size:10px;font-weight:800}td.gL{color:#fff;font-weight:900;font-size:18px}td.pr{font-weight:800}.lst{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 12px}@media(max-width:700px){.lst{grid-template-columns:1fr}}.lst>div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}</style></head><body>
<header><div><b>🔄 Rotativo de descanso</b><br><small id=sem></small></div><span id=st>…</span></header>

<script>
const DIAS=["Lun","Mar","Mié","Jue","Vie","Sáb"];
const UNIDADES=["Kia A","Kia B","Kia C","Kia D","Kia E","Kia F","Bandejero 1","Bandejero 2","Lavadero","Retén 1","Retén 2"];
const NEED=u=>u.startsWith("Retén")?1:2;
const BASE=[["Kia A","HUGO VILLANUEVA"],["Kia A","JORGE LOPEZ"],["Kia B","OWEN NARVAEZ"],["Kia B","VALENTIN TOLEDO"],["Kia C","JOSBER CORDOVA"],["Kia C","DAVID CORONEL"],["Kia D","JHAN CHAMAY"],["Kia D","RONALD HERNANDEZ"],["Kia E","NIKIN ACEBEDO"],["Kia E","HITLER RAMOS"],["Kia F","EYDER PAREDES"],["Kia F","IVAN FLORES"],["Bandejero 1","LENNER MUÑOZ"],["Bandejero 1","LUIS GUSMAN FLORES"],["Bandejero 2","ANGEL ROMAN"],["Bandejero 2","CARLOS BLANCO"],["Lavadero","YOBER CHAMAY"],["Lavadero","JHONATAN SABOGAL"],["Retén 1","MARCELO TAPULLIMA"],["Retén 1","CRISTIANO ALFARO"],["Retén 2","EYLIN CHAUPE"],["Sobrante","LUIS JUAREZ"],["Sobrante","JOSE CRUZ"],["Sobrante","MARIO ZUMARAN"]];
const PLAN={"HUGO VILLANUEVA":"D-----","JORGE LOPEZ":"---D--","OWEN NARVAEZ":"D-----","VALENTIN TOLEDO":"---D--","JOSBER CORDOVA":"D-----","DAVID CORONEL":"---D--","JHAN CHAMAY":"-D----","RONALD HERNANDEZ":"----D-","NIKIN ACEBEDO":"-D----","HITLER RAMOS":"----D-","EYDER PAREDES":"-D----","IVAN FLORES":"----D-","LENNER MUÑOZ":"--D---","LUIS GUSMAN FLORES":"-----D","ANGEL ROMAN":"--D---","CARLOS BLANCO":"-----D","YOBER CHAMAY":"--D---","JHONATAN SABOGAL":"-----D","MARCELO TAPULLIMA":"---D--","EYLIN CHAUPE":"-----D","LUIS JUAREZ":"D-----","JOSE CRUZ":"-D----","MARIO ZUMARAN":"--D---"};
const COV={"CRISTIANO ALFARO":["Kia C","Kia F","Lavadero","T","D","Retén 2"],"LUIS JUAREZ":[0,"Kia D","Bandejero 1","Kia A","Kia D","Bandejero 1"],"JOSE CRUZ":["Kia A",0,"Bandejero 2","Kia B","Kia E","Bandejero 2"],"MARIO ZUMARAN":["Kia B","Kia E",0,"Kia C","Kia F","Lavadero"]};
function semana(d=new Date()){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
function plantilla(){const p={};BASE.forEach(([u,n])=>{const c=COV[n];p[n]=DIAS.map((_,i)=>{if(c&&c[i]){return c[i]==="T"?"T":c[i]==="D"?"D":c[i]}return (PLAN[n]||"------")[i]==="D"?"D":"T"})});return p}
let S={sem:semana(),plan:plantilla()},dia=Math.min(Math.max((new Date().getDay()||7)-1,0),5),db=null,ref=null,saveT=null;
const $=id=>document.getElementById(id);
let grp="Kia A",vista="A",pdia=Math.min(Math.max((new Date().getDay()||7)-1,0),5);
const FUN={A:["Valle Azul 3","M18/M01/M02","Arana/Kirra"],B:["Valle Azul 1","M11/M14/M02","CO/RO/AR/KR"],C:["Valle Azul 1","M11/M14/M02","CO/RO/AR/KR"],D:["Valle Azul 3","M18/M16/M01/M02","AR/RO/KR"],E:["Valle Azul 1","M11/M14/M02","CO/RO/AR/KR"],F:["Valle Azul 3","M18/M02","Arana/Kirra"]};
const CEL={"YOBER CHAMAY":"982707154","JORGE LOPEZ":"930929193","OWEN NARVAEZ":"926639977","VALENTIN TOLEDO":"930200178","JOSBER CORDOVA":"906073459","DAVID CORONEL":"950034159","JHAN CHAMAY":"984763241","RONALD HERNANDEZ":"907461349","NIKIN ACEBEDO":"907888077","JHONATAN SABOGAL":"927156827","EYDER PAREDES":"993544688","IVAN FLORES":"922686996","CARLOS BLANCO":"960448201","ANGEL ROMAN":"993034139","LUIS GUSMAN FLORES":"921869347","LENNER MUÑOZ":"942668278","JOSE CRUZ":"924424670","HITLER RAMOS":"904213485","EYLIN CHAUPE":"986142077","HUGO VILLANUEVA":"913240839","MARIO ZUMARAN":"928320121","MARCELO TAPULLIMA":"936883714","LUIS JUAREZ":"","CRISTIANO ALFARO":"60572010"};
const UNI={"Kia A":["TCI-843","LEYDER PAREDES"],"Kia B":["TAU-800","MILLER"],"Kia C":["TCX-842","DANIEL FASANANDO"],"Kia D":["TCA-816","DAVID SALVADOR"],"Kia E":["TEY-880","JHAN CASTILLO"],"Kia F":["THF-949","SAMUEL TANDAYPAN"],"Bandejero 1":["BSB-860","FARRO"],"Bandejero 2":["T9N-825","JESÚS"],"Lavadero":["TEB-876","JIMMY CHAVEZ"],"Retén 1":["CFT-845","MAICOL UCEDA"],"Retén 2":["CKD-827","JEANPIER BORJA"]};
function calc(i){const p=S.plan,rest={},cubre={},porQ={},cnt={};UNIDADES.forEach(u=>cnt[u]=0);
 BASE.forEach(([u,n])=>{const v=p[n][i];if(v==="D")(rest[u]=rest[u]||[]).push(n);else if(v==="T"){if(cnt[u]!==undefined)cnt[u]++}else if(cnt[v]!==undefined)cnt[v]++});
 BASE.forEach(([u,n])=>{const v=p[n][i];if(v!=="T"&&v!=="D"){const x=(rest[v]||[]).find(r=>!cubre[r]);if(x){cubre[x]=n;porQ[n]=x}}});
 const desc=BASE.filter(([,n])=>p[n][i]==="D").length;return{rest,cubre,porQ,cnt,desc}}
function libres(i,c){return BASE.filter(([u,n])=>{const v=S.plan[n][i];if(v==="D")return false;if(v!=="T")return false;
 if(u==="Sobrante")return true;if(u.startsWith("Retén"))return c.cnt[u]>NEED(u);return false}).map(b=>b[1])}
const PLACAS=["TCI-843","TAU-800","TCX-842","TCA-816","TEY-880","THF-949","BSB-860","T9N-825","TEB-876","CFT-845","CKD-827","BTL-775"];
const NOM=u=>u.startsWith("Kia ")?"Grupo "+u.slice(4):u.startsWith("Bandejero")?"Bandejas "+u.slice(-1):u;
const CHO={"TCI-843":"LEYDER PAREDES","TAU-800":"MILLER RODRÍGUEZ","TCX-842":"DANIEL FASANANDO","TCA-816":"DAVID SALVADOR","TEY-880":"JHAN CASTILLO","THF-949":"SAMUEL TANDAYPAN","BSB-860":"CARLOS FARRO","T9N-825":"JESÚS","TEB-876":"JIMMY CHÁVEZ","CFT-845":"MAICOL UCEDA","CKD-827":"JEANPIER BORJA","BTL-775":"ROMEL SÁNCHEZ"};
const PLD=(u,i)=>(S.pdia&&S.pdia[i]&&S.pdia[i][u])||PL(u);
const selPl=(u,i)=>`<select data-pp="${u}" data-pi=${i} style="font-weight:800;border:1px solid #BFD0E0;border-radius:6px;padding:4px;background:#fff;color:#123A5C">${PLACAS.map(x=>`<option ${x===PLD(u,i)?"selected":""}>${x}</option>`).join("")}</select>`;
const PL=u=>(S.placa&&S.placa[u])||(UNI[u]?UNI[u][0]:"—");
const BASE0=BASE.map(b=>b[0]);const NAMES0=BASE.map(b=>b[1]),ORD=[...UNIDADES,"Sobrante"];function aplicaU(){BASE.forEach(b=>{b[0]=(S.unid&&S.unid[b[1]])||BASE0[NAMES0.indexOf(b[1])]});BASE.sort((p,q)=>ORD.indexOf(p[0])-ORD.indexOf(q[0]))}
function render(){aplicaU();const p=S.plan;$("sem").textContent="Semana "+S.sem+" · Cosecha Blueberries Chao";
 $("tA").classList.toggle("on",vista==="A");$("tR").classList.toggle("on",vista==="R");$("vA").hidden=vista!=="A";$("vR").hidden=vista!=="R";$("vG").hidden=vista!=="G";$("tG").classList.toggle("on",vista==="G");$("vP").hidden=vista!=="P";$("tP").classList.toggle("on",vista==="P");
 const c=calc(dia);
 const OPTS=["Trabaja","DESCANSA",...UNIDADES];
 const LB=u=>{const x=UNI[u];if(!x)return u;return NOM(u)+" · "+PL(u)};
 const al=[];DIAS.forEach((d,i)=>{const k=calc(i),f=UNIDADES.filter(u=>k.cnt[u]<NEED(u));if(f.length)al.push(`${d}: falta en ${f.map(LB).join(", ")}`);if(k.desc!==4)al.push(`${d}: descansan ${k.desc}`)});
 const dob=BASE.filter(([,n])=>p[n].filter(v=>v==="D").length>1).map(b=>b[1]),sin=BASE.filter(([,n])=>!p[n].includes("D")).map(b=>b[1]);
 if(dob.length)al.push("Descansa 2 veces: "+dob.join(", "));if(sin.length)al.push("Falta descansar: "+sin.join(", "));
 $("alerts").innerHTML=al.length?`<div class="al y">⚠ ${al.join("<br>⚠ ")}</div>`:`<div class="al g">✔ Semana OK · 4 descansan cada día · todos tienen su día</div>`;
 const cell=(n,i)=>{const v=p[n][i],t=v==="T"?"Trabaja":v==="D"?"DESCANSA":v;const ya=v!=="D"&&p[n].includes("D");
  return `<td class="${v==="D"?"cD":v==="T"?"cT":"cU"}"><select data-n="${n}" data-i=${i}>${OPTS.map(o=>`<option value="${o}" ${o===t?"selected":""} ${o==="DESCANSA"&&ya?"disabled":""}>${LB(o)}</option>`).join("")}</select></td>`};
 const tot=DIAS.map((_,i)=>calc(i));
 $("grid").innerHTML=`<table class=gt2><tr><th>Grupo</th><th>Placa</th><th>Estiba ▾</th>${["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"].map(d=>`<th>${d}</th>`).join("")}</tr>`+
