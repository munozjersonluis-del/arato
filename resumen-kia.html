  const BW=Math.max(1100,x.T.length*80);h+='<div style="display:grid;gap:14px">'+card(`🚚 ${x.p} · GRUPO ${x.g} · ${fuDe(x.p)} — KG POR VIAJE (hora de recojo)`,bars(x.T.map((t,i)=>((t.ds&&!t.kg?{v:0,l:'V'+(i+1)+' · '+hm(t.rec),c:'#000',t:(t.cls||['DESCARTE']).join(' + '),sm:1}:{v:t.kg,l:'V'+(i+1)+' · '+hm(t.rec),c}))),BW,300,{u:' kg',sep:sepK(x)}),c)
   +card(`🚚 ${x.p} · GRUPO ${x.g} · ${fuDe(x.p)} — CICLO ENTRE VIAJES (meta ${META_CICLO} min)`,x.cy.length?bars(x.cy.map((v,i)=>({v,l:'V'+(x.T.ci[i]+1)+((x.T[x.T.ci[i]].cf?'➜':x.T[x.T.ci[i]].nv&&x.T.ci[i]?'★':''))+' · '+hm(x.T[x.T.ci[i]].rec),c:sc(v,META_CICLO,40,1),t:du(v)})),BW,300,{meta:META_CICLO,mt:du(META_CICLO),sep:sepC(x)}):'<div class="empty">Sin hora de inicio</div>',c)+'</div>';
 }
 h+=`<div class="nt">📅 ${d.split('-').reverse().join('/')} · último recojo ${hm(ult)} · viajes = todas las guías (exportable y descarte) · kg = solo exportable · viajes de descarte o nacional cuentan como viaje (sin kg exportable) · kg = jarras × peso real de jarra del grupo (si no hay pesaje, ${PJ_DEF} kg) · 🟢 meta · 🟡 cerca · 🔴 revisar · ciclo: V1 y primer viaje en nuevo fundo (➜) o después del refrigerio 12:00–13:00 (★, desde 13:00) · ➜ = cambio de fundo = recojo − inicio de cosecha; el resto, recojo a recojo · meta ${META_CICLO} min</div>`;
 $('pan').innerHTML=h}
$('tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;TAB=b.dataset.t;pintar()};
