<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resumen Kia · Exportable</title>
<style>
:root{--nv:#123A5C;--bg:#EEF2F6;--mu:#7A8699;--ok:#1E9E5A;--md:#E8A23A;--bd:#D2412C}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:"Segoe UI",system-ui,Arial,sans-serif;color:#1E2A3A}
.top{background:linear-gradient(110deg,#0F2F4C,#1B5E8C);color:#fff;display:flex;align-items:center;gap:14px;padding:14px 26px;flex-wrap:wrap}
.top h1{margin:0;font-size:24px}.top .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.top input{padding:7px 10px;border-radius:9px;border:0;font-size:15px}.top button{border:0;border-radius:9px;padding:8px 12px;font-weight:800;background:#ffffff26;color:#fff;cursor:pointer}
.tabs{display:flex;gap:8px;padding:12px 26px 0;flex-wrap:wrap}.tabs button{border:0;border-radius:10px 10px 0 0;padding:11px 18px;font-size:15px;font-weight:800;background:#DCE4EC;color:var(--nv);cursor:pointer}
.tabs button[aria-pressed=true]{background:#fff;box-shadow:0 -2px 6px #0001}
.w{padding:0 26px 26px}.panel{background:#fff;border-radius:0 12px 12px 12px;padding:16px;display:grid;gap:14px}
.kp{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.kp div{background:#F4F7FA;border-radius:12px;padding:12px;text-align:center}.kp b{display:block;font-size:28px}.kp small{color:var(--mu);font-weight:700;font-size:12px;text-transform:uppercase}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.c{border:1px solid #E3E8EE;border-radius:12px;overflow:hidden}.c h3{margin:0;color:#fff;background:var(--nv);font-size:18px;padding:10px 14px;letter-spacing:.3px}
.empty{padding:40px;text-align:center;color:var(--mu)}.nt{color:var(--mu);font-size:12px;padding:0 4px}
@media(max-width:900px){.kp{grid-template-columns:repeat(3,1fr)}.g2,.g3{grid-template-columns:1fr}}
</style></head><body>
<div class="top"><h1>🚚 Resumen Kia · Exportable</h1><div class="r"><select id="fu" style="padding:7px 10px;border-radius:9px;border:0;font-size:15px;font-weight:700"><option value="">Todos los fundos</option></select><input type="date" id="dia"><button id="act">↻ Actualizar</button></div></div>
<div class="tabs" id="tabs"></div>
<div class="w"><div class="panel" id="pan"><div class="empty">Cargando…</div></div></div>
<script>
const SB='https://rqvcvffyynpnighzwxju.supabase.co',SBK='sb_publishable_keWbJCavFGWO_B976cjxAA_Gd5JMzFn',H={apikey:SBK,Authorization:'Bearer '+SBK};
const API_PESOS='https://script.google.com/macros/s/AKfycbwhK53Cj21HYT7irdMvqonPvhEjAzo2ab-cJ4wytAtoUnIV0dpA8LHrt6GBrOcXWFx8/exec';
const TARIFA={'TCI-843':230,'TAU-800':215,'TCX-842':220,'TCA-816':215,'TEY-880':215,'THF-949':215,'BTL-775':215,'T9N-825':300,'TEB-876':300,'H2X-887':220};
const META_CICLO=30,META_KGH=200,PJ_DEF=1.25,TARA=0.292,JPB={NORMAL:2.5,HUMEDA:1.5};
const COL={A:'#1B5E8C',B:'#7E4CC2',C:'#E8A23A',D:'#1E9E5A',E:'#D2412C'};
const $=id=>document.getElementById(id),f=n=>Math.round(n).toLocaleString('en'),hm=m=>m==null?'':Math.floor(m/60)+':'+String(m%60).padStart(2,'0');
const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().trim();
const mins=v=>{const m=String(v||'').match(/(\d{1,2}):(\d{2})/);return m?+m[1]*60+ +m[2]:null};
const sc=(v,a,b,inv)=>v==null?'#999':inv?(v<=a?'#1E9E5A':v<=b?'#E8A23A':'#D2412C'):(v>=a?'#1E9E5A':v>=b?'#E8A23A':'#D2412C');
let PESOS=null,IND=[],TAB='GENERAL';
const hoy=()=>new Date(Date.now()-5*3600e3).toISOString().slice(0,10);
$('dia').value=new URLSearchParams(location.search).get('fecha')||hoy();
$('dia').onchange=cargar;$('act').onclick=cargar;let ALL=[];$('fu').onchange=()=>{calc(ALL,$('dia').value);pintar()};
async function pesos(){if(PESOS)return;try{const ac=new AbortController();setTimeout(()=>ac.abort(),8000);const j=await (await fetch(API_PESOS,{signal:ac.signal})).json();PESOS=(j.registros||[]).filter(x=>x.tipoReg!=='descarte')}catch(e){PESOS=[]}}
function pj(d,g){const L=(PESOS||[]).filter(x=>String(x.fecha).slice(0,10)===d&&+x.cantidad>0&&+x.kg>0),v=x=>(x.kg/x.cantidad-TARA)/(JPB[norm(x.tipo)]||2.5),ok=a=>a.filter(z=>z>0.5&&z<2.5);
 let a=ok(L.filter(x=>norm(x.grupo)===g).map(v));if(!a.length)a=ok(L.map(v));return a.length?a.reduce((s,z)=>s+z,0)/a.length:PJ_DEF}
async function cargar(){const d=$('dia').value;$('pan').innerHTML='<div class="empty">Cargando…</div>';
 try{const L=await (await fetch(`${SB}/rest/v1/guias_campo?fecha=eq.${d}&calidad=eq.EXPORTABLE&select=*&limit=5000`,{headers:H})).json();
  ALL=Array.isArray(L)?L:[];const fs=[...new Set(ALL.map(r=>r.fundo).filter(Boolean))].sort(),cur=$('fu').value;$('fu').innerHTML='<option value="">Todos los fundos</option>'+fs.map(x=>`<option${x===cur?' selected':''}>${x}</option>`).join('');
  calc(ALL,d);pintar();await pesos();calc(ALL,d);pintar()}catch(e){$('pan').innerHTML='<div class="empty">Sin conexión.</div>'}}
function calc(L,d){const P={},F=$('fu').value;L.filter(r=>!F||r.fundo===F).forEach(r=>{const g=String(r.grupo||'');const k=pj(d,g);(P[r.placa]=P[r.placa]||[]).push({g,j:+r.jarras||0,kg:(+r.jarras||0)*k,ini:mins(r.inicio),fin:mins(r.fin),rec:mins(r.recojo)})});
 IND=Object.entries(P).map(([p,G])=>{G.sort((a,b)=>(a.rec??0)-(b.rec??0));const T=[];G.forEach(r=>{const t=T[T.length-1];if(t&&r.rec!=null&&r.rec-t.u<=10){t.kg+=r.kg;t.u=r.rec}else T.push({rec:r.rec,u:r.rec,kg:r.kg})});
  const cy=T.slice(1).map((t,i)=>t.rec-T[i].rec),kg=G.reduce((a,r)=>a+r.kg,0),ini=Math.min(...G.map(r=>r.ini??1e9)),ult=Math.max(...T.map(t=>t.rec??0)),hrs=ini<1e9&&ult>ini?(ult-ini)/60:0;
  const cos=G.filter(r=>r.ini!=null&&r.fin!=null).map(r=>r.fin-r.ini);
  return{p,g:G[0].g,v:T.length,kg,T,cy,cyp:cy.length?cy.reduce((a,b)=>a+b,0)/cy.length:null,kgh:hrs?kg/hrs:null,cos:cos.length?cos.reduce((a,b)=>a+b,0)/cos.length:null,tar:TARIFA[p]||0,ult}})
  .sort((a,b)=>a.g.localeCompare(b.g));IND.forEach(x=>x.cxt=x.tar&&x.kg?x.tar/(x.kg/1000):null)}
function bars(rows,W,H,o={}){if(!rows.length)return'<div class="empty">Sin datos</div>';const mx=Math.max(...rows.map(r=>r.v),o.meta||0)*1.2||1,gw=(W-30)/rows.length,bw=Math.min(66,gw*.6),Y=v=>H-42-(H-70)*v/mx;let s=`<svg width="100%" viewBox="0 0 ${W} ${H}">`;
 if(o.meta)s+=`<line x1="10" x2="${W-6}" y1="${Y(o.meta)}" y2="${Y(o.meta)}" stroke="#1E9E5A" stroke-width="2" stroke-dasharray="7 5"/><text x="12" y="${Y(o.meta)-6}" font-size="12" font-weight="800" fill="#1E9E5A" stroke="#fff" stroke-width="4" paint-order="stroke">Meta ${o.mt}</text>`;
 const fs=rows.length>12?11:rows.length>8?12:14;rows.forEach((r,i)=>{const x=20+gw*i+gw/2-bw/2,y=Y(r.v),lb=String(r.l).split(' · ');s+=`<rect x="${x}" y="${y}" width="${bw}" height="${H-42-y}" rx="6" fill="${r.c}"><title>${r.l}: ${r.t??f(r.v)}</title></rect><text x="${x+bw/2}" y="${y-7}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="${r.c}" stroke="#fff" stroke-width="4" paint-order="stroke">${r.t??f(r.v)+(o.u||'')}</text><text x="${x+bw/2}" y="${H-(lb[1]?22:14)}" text-anchor="middle" font-size="${fs}" fill="#555" font-weight="800">${lb[0]}</text>${lb[1]?`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle" font-size="${fs-1}" fill="#888">${lb[1]}</text>`:''}`});return s+'</svg>'}
const card=(t,svg,c)=>`<div class="c"><h3${c?` style="background:${c}"`:''}>${t}</h3>${svg}</div>`;
const kpis=a=>`<div class="kp">${a.map(k=>`<div><b style="color:${k[2]||'#123A5C'}">${k[0]}</b><small>${k[1]}</small></div>`).join('')}</div>`;
function pintar(){const d=$('dia').value;
 $('tabs').innerHTML=['GENERAL',...IND.map(x=>x.p)].map(t=>{const x=IND.find(i=>i.p===t);return`<button data-t="${t}" aria-pressed="${t===TAB}">${t==='GENERAL'?'📊 General':`<span style="color:${COL[x.g]||'#123A5C'}">●</span> ${t} · ${x.g}`}</button>`}).join('');
 if(!IND.length){$('pan').innerHTML='<div class="empty">No hay guías exportables guardadas para este día. Súbelas en <a href="/guias-kia">guias-kia</a>.</div>';return}
 if(TAB!=='GENERAL'&&!IND.find(x=>x.p===TAB))TAB='GENERAL';
 const kg=IND.reduce((a,x)=>a+x.kg,0),vi=IND.reduce((a,x)=>a+x.v,0),allcy=IND.flatMap(x=>x.cy),tar=IND.reduce((a,x)=>a+x.tar,0),hrs=IND.reduce((a,x)=>a+(x.kgh?x.kg/x.kgh:0),0),ult=Math.max(...IND.map(x=>x.ult));
 const cyp=allcy.length?allcy.reduce((a,b)=>a+b,0)/allcy.length:null;
 let h='';
 if(TAB==='GENERAL'){
  h+=kpis([[f(kg)+' kg','kg exportable'],[vi,'viajes'],[cyp==null?'—':Math.round(cyp)+"'",'ciclo promedio',sc(cyp,META_CICLO,40,1)],[hrs?f(kg/hrs)+' kg':'—','kg por hora',sc(hrs?kg/hrs:null,META_KGH,150)],[tar&&kg?'S/ '+f(tar/(kg/1000)):'—','costo por TN'],[IND.length,'kias trabajando']]);
  h+='<div class="g3">'+card('KILOS (KG) POR KIA',bars(IND.map(x=>({v:x.kg,l:x.p,c:COL[x.g]||'#1B5E8C'})),460,260,{u:' kg'}))
   +card('CICLO PROMEDIO (MIN)',bars(IND.filter(x=>x.cyp!=null).map(x=>({v:x.cyp,l:x.p,c:sc(x.cyp,META_CICLO,40,1),t:Math.round(x.cyp)+"'"})),460,260,{meta:META_CICLO,mt:META_CICLO+"'"}))
   +card('KG POR HORA DE TRABAJO',bars(IND.filter(x=>x.kgh).map(x=>({v:x.kgh,l:x.p,c:sc(x.kgh,META_KGH,150)})),460,260,{meta:META_KGH,mt:META_KGH+' kg',u:' kg'}))+'</div>';
  const porH={};IND.forEach(x=>x.T.forEach(t=>{if(t.rec!=null){const k=Math.floor(t.rec/60);porH[k]=(porH[k]||0)+t.kg}}));
  h+='<div class="g3">'+card('COSTO POR TN (S/)',bars(IND.filter(x=>x.cxt).map(x=>({v:x.cxt,l:x.p,c:sc(x.cxt,300,500,1),t:'S/ '+f(x.cxt)})),460,260))
   +card('VIAJES POR KIA',bars(IND.map(x=>({v:x.v,l:x.p,c:COL[x.g]||'#1B5E8C'})),460,260))
   +card('KG POR HORA DEL DÍA',bars(Object.keys(porH).sort((a,b)=>a-b).map(k=>({v:porH[k],l:k+':00',c:'#1B5E8C'})),460,260,{u:' kg'}))+'</div>';
 }else{const x=IND.find(i=>i.p===TAB),c=COL[x.g]||'#1B5E8C';
  h+=kpis([[x.v,'viajes'],[f(x.kg)+' kg','kg exportable'],[x.cyp==null?'—':Math.round(x.cyp)+"'",'ciclo promedio',sc(x.cyp,META_CICLO,40,1)],[x.kgh?f(x.kgh)+' kg':'—','kg por hora',sc(x.kgh,META_KGH,150)],[x.cos==null?'—':Math.round(x.cos)+"'",'cosecha prom.'],[hm(x.ult)||'—','último recojo']]);
  const BW=Math.max(1100,x.T.length*80);h+='<div style="display:grid;gap:14px">'+card(`🚚 ${x.p} · GRUPO ${x.g} — KG POR VIAJE (hora de recojo)`,bars(x.T.map((t,i)=>({v:t.kg,l:'V'+(i+1)+' · '+hm(t.rec),c})),BW,300,{u:' kg'}),c)
   +card(`🚚 ${x.p} · GRUPO ${x.g} — CICLO ENTRE VIAJES (meta ${META_CICLO} min)`,x.cy.length?bars(x.cy.map((v,i)=>({v,l:'V'+(i+2)+' · '+hm(x.T[i+1].rec),c:sc(v,META_CICLO,40,1),t:v+"'"})),BW,300,{meta:META_CICLO,mt:META_CICLO+"'"}):'<div class="empty">Solo 1 viaje</div>',c)+'</div>';
 }
 h+=`<div class="nt">📅 ${d.split('-').reverse().join('/')} · último recojo ${hm(ult)} · solo exportable · kg = jarras × peso real de jarra del grupo (si no hay pesaje, ${PJ_DEF} kg) · 🟢 meta · 🟡 cerca · 🔴 revisar · ciclo meta ${META_CICLO} min</div>`;
 $('pan').innerHTML=h}
$('tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;TAB=b.dataset.t;pintar()};
cargar();
</script></body></html>
