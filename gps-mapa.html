<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B1437">
<title>Mapa GPS — Arato Supervisor</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--ink:#0B1437;--g:#16A34A;--r:#DC2626;--y:#D97706;--gold:#F5C800}
body{font-family:'Inter',sans-serif;background:var(--ink);color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.top{background:var(--ink);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--gold);flex-shrink:0;z-index:100}
.top-brand{font-family:'Bebas Neue',sans-serif;font-size:1rem;color:var(--gold);letter-spacing:2px}
.top-sub{font-size:0.5rem;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1px}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tbtn{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:6px 10px;color:#fff;font-size:0.62rem;font-weight:700;cursor:pointer;font-family:inherit}
.tbtn.active{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.last-update{font-size:0.58rem;color:rgba(255,255,255,.4)}
#map{flex:1;z-index:1}
/* LEGEND */
.legend{position:absolute;bottom:200px;right:8px;background:rgba(11,20,55,.92);border:1px solid #334155;border-radius:10px;padding:8px 10px;z-index:400;min-width:90px;backdrop-filter:blur(4px)}
.legend-title{font-size:0.55rem;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:0.62rem;color:#fff;margin-bottom:4px;cursor:pointer;padding:2px 4px;border-radius:4px;transition:background .15s}
.legend-item:hover{background:rgba(255,255,255,.1)}
.legend-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0;border:1px solid rgba(255,255,255,.3)}
/* PANEL */
.panel{position:fixed;bottom:0;left:0;right:0;background:#0d1526;border-top:2px solid #1e293b;z-index:200;max-height:42vh;overflow-y:auto;transform:translateY(0);transition:transform .3s}
.panel.collapsed{transform:translateY(calc(100% - 44px))}
.panel-handle{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;cursor:pointer;background:#0d1526;border-bottom:1px solid #1e293b;position:sticky;top:0}
.panel-title{font-size:0.7rem;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:1px}
.maq-list{padding:8px}
.maq-card{background:#1e293b;border-radius:10px;padding:10px 12px;margin-bottom:8px;border-left:3px solid #334155;cursor:pointer}
.maq-card.activo{border-color:var(--g)}
.maq-card.detenido{border-color:var(--y)}
.maq-card.inactivo{border-color:#334155;opacity:.6}
.maq-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.maq-name{font-size:0.8rem;font-weight:800;color:#fff;font-family:'JetBrains Mono',monospace}
.maq-estado{font-size:0.6rem;font-weight:700;padding:2px 8px;border-radius:10px;text-transform:uppercase}
.estado-mov{background:rgba(22,163,74,.2);color:var(--g)}
.estado-det{background:rgba(217,119,6,.2);color:var(--y)}
.estado-ina{background:rgba(100,116,139,.2);color:#64748B}
.maq-info{font-size:0.65rem;color:rgba(255,255,255,.5);display:flex;gap:10px;flex-wrap:wrap}
.maq-time{font-size:0.6rem;color:rgba(255,255,255,.3);margin-top:4px}
.empty-panel{text-align:center;padding:24px;color:rgba(255,255,255,.3);font-size:0.78rem;line-height:1.6}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:8px 18px;border-radius:16px;font-size:0.72rem;font-weight:700;display:none;z-index:999;border:1px solid #334155}
.maq-marker{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.maq-marker.mov{background:var(--g)}
.maq-marker.det{background:var(--y)}
.maq-marker.ina{background:#475569}
.leaflet-popup-content-wrapper{background:#0d1526;border:1px solid #334155;border-radius:10px;color:#fff}
.leaflet-popup-tip{background:#0d1526}
.pop-title{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:0.85rem;color:var(--gold);margin-bottom:6px}
.pop-row{font-size:0.72rem;color:rgba(255,255,255,.7);margin-bottom:3px}
.pop-row b{color:#fff}
.gmaps-btn{display:block;margin-top:8px;background:var(--g);color:#fff;border:none;border-radius:7px;padding:7px 12px;font-size:0.7rem;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;font-family:inherit}
</style>
</head>
<body>

<div class="top">
  <div>
    <div class="top-brand">🗺️ Arato GPS — Mapa</div>
    <div class="top-sub">Equipos en tiempo real · Arato 1</div>
  </div>
  <div class="top-right">
    <button class="tbtn active" id="btn-mods" onclick="toggleModules()">🟦 Módulos</button>
    <button class="tbtn" id="btn-lotes" onclick="toggleLotes()">📦 Lotes</button>
    <button class="tbtn" onclick="cargarUbicaciones()">🔄</button>
    <div class="last-update" id="last-update">—</div>
  </div>
</div>

<div id="map"></div>

<!-- Leyenda módulos -->
<div class="legend" id="legend">
  <div class="legend-title">Módulos</div>
  <div id="legend-items"></div>
</div>

<div class="panel" id="panel">
  <div class="panel-handle" onclick="togglePanel()">
    <div class="panel-title">📋 Equipos <span id="count-badge" style="background:#1e293b;padding:2px 8px;border-radius:10px;margin-left:6px;font-size:0.65rem">—</span></div>
    <div id="toggle-icon">▼</div>
  </div>
  <div class="maq-list" id="maq-list">
    <div class="empty-panel">Cargando...</div>
  </div>
</div>

<div id="toast" class="toast"></div>

const SURL='https://rqvcvffyynpnighzwxju.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxdmN2ZmZ5eW5wbmlnaHp3eGp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MjgyNDcsImV4cCI6MjA5MzMwNDI0N30.fFufNEdRvAzl6O6BqtTbx83O3Eg8Wd7gACNJDGQKga4';

const map=L.map('map',{zoomControl:true}).setView([-8.502583,-78.593744],16);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'© Esri',maxZoom:20}).addTo(map);

let markers={};
let modLayers=[];
let loteLayers=[];
let showMods=true;
let showLotes=false;
let panelOpen=true;

// ── DIBUJAR MÓDULOS ──
function drawModules(){
  modLayers.forEach(l=>map.removeLayer(l));
  modLayers=[];
  loteLayers.forEach(l=>map.removeLayer(l));
  loteLayers=[];

  const legend=document.getElementById('legend-items');
  legend.innerHTML='';

  MODS.forEach(mod=>{
    const hexCol=mod.col;
    // Calcular centro del módulo para el label
    let allLats=[],allLngs=[];
    mod.p.forEach(poly=>{
      poly.c.forEach(pt=>{allLats.push(pt[0]);allLngs.push(pt[1]);});
    });
    const cLat=allLats.reduce((a,b)=>a+b,0)/allLats.length;
    const cLng=allLngs.reduce((a,b)=>a+b,0)/allLngs.length;

    // Dibujar polígonos del módulo
    if(showMods){
      mod.p.forEach(poly=>{
        const layer=L.polygon(poly.c,{
          color:hexCol,weight:1.5,opacity:0.9,
          fillColor:hexCol,fillOpacity:0.18
        }).addTo(map);
        layer.bindPopup(`<div class="pop-title">📍 ${mod.n}</div><div class="pop-row">Lote: <b>${poly.l}</b></div>`);
        modLayers.push(layer);
      });

      // Label del módulo
      const label=L.divIcon({
        html:`<div style="background:${hexCol};color:#fff;font-family:'Inter',sans-serif;font-size:11px;font-weight:800;padding:3px 7px;border-radius:6px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.4);opacity:.95">${mod.n}</div>`,
        className:'',iconSize:[50,22],iconAnchor:[25,11]
      });
      const labelMarker=L.marker([cLat,cLng],{icon:label,interactive:false,zIndexOffset:-100}).addTo(map);
      modLayers.push(labelMarker);
    }

    if(showLotes){
      mod.p.forEach(poly=>{
        const layer=L.polygon(poly.c,{
          color:'#ffffff',weight:0.8,opacity:0.5,
          fillColor:hexCol,fillOpacity:0.1,
          dashArray:'3,3'
        }).addTo(map);
        const cL=poly.c.reduce((a,b)=>[a[0]+b[0],a[1]+b[1]],[0,0]).map(v=>v/poly.c.length);
        const lbl=L.divIcon({
          html:`<div style="font-size:8px;color:#fff;font-weight:700;text-shadow:0 0 3px rgba(0,0,0,.8);white-space:nowrap">${poly.l}</div>`,
          className:'',iconSize:[30,12],iconAnchor:[15,6]
        });
        const lm=L.marker(cL,{icon:lbl,interactive:false,zIndexOffset:-200}).addTo(map);
        loteLayers.push(layer);loteLayers.push(lm);
      });
    }

    // Leyenda
    legend.innerHTML+=`<div class="legend-item" onclick="focusModule('${mod.n}',${cLat},${cLng})">
      <div class="legend-dot" style="background:${hexCol}"></div>
      <span>${mod.n}</span>
    </div>`;
  });
}

function toggleModules(){
  showMods=!showMods;
  document.getElementById('btn-mods').classList.toggle('active',showMods);
  drawModules();
}
function toggleLotes(){
  showLotes=!showLotes;
  document.getElementById('btn-lotes').classList.toggle('active',showLotes);
  drawModules();
}
function focusModule(name,lat,lng){
  map.setView([lat,lng],17);
}

// ── GPS EQUIPOS ──
function minsDiff(iso){if(!iso)return 999;return Math.round((Date.now()-new Date(iso).getTime())/60000);}
function getEstado(row){const m=minsDiff(row.created_at);if(m>10)return'inactivo';return row.estado==='en movimiento'?'en movimiento':'detenido';}

async function cargarUbicaciones(){
  try{
    const desde=new Date(Date.now()-12*60*60*1000).toISOString();
    const r=await fetch(SURL+'/rest/v1/ubicaciones_maquinaria?select=*&created_at=gte.'+desde+'&order=created_at.desc',
      {headers:{'apikey':SKEY,'Authorization':'Bearer '+SKEY}});
    const rows=await r.json();
    if(!Array.isArray(rows)){document.getElementById('last-update').textContent='⚠️ Error';return;}
    const latest={};
    rows.forEach(row=>{
      if(!latest[row.maquina]||new Date(row.created_at)>new Date(latest[row.maquina].created_at))latest[row.maquina]=row;
    });
    const equipos=Object.values(latest);
    const activos=equipos.filter(e=>minsDiff(e.created_at)<=10).length;
    document.getElementById('count-badge').textContent=activos+' activos / '+equipos.length;
    document.getElementById('last-update').textContent=new Date().toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    const ids=new Set(equipos.map(e=>e.maquina));
    Object.keys(markers).forEach(m=>{if(!ids.has(m)){markers[m].remove();delete markers[m];}});
    equipos.forEach(eq=>{
      if(!eq.lat||!eq.lng)return;
      const estado=getEstado(eq);
      const cls=estado==='en movimiento'?'mov':estado==='detenido'?'det':'ina';
      const emoji=eq.maquina.includes('MONTA')?'🏗️':'🚜';
      const icon=L.divIcon({html:`<div class="maq-marker ${cls}">${emoji}</div>`,className:'',iconSize:[36,36],iconAnchor:[18,18]});
      const mins=minsDiff(eq.created_at);
      const gmapsUrl=`https://www.google.com/maps?q=${eq.lat},${eq.lng}`;
      const popup=`<div class="pop-title">${emoji} ${eq.maquina}</div>
        <div class="pop-row">👤 <b>${eq.operador||'—'}</b></div>
        <div class="pop-row">📍 <b>${eq.modulo||'—'}</b></div>
        <div class="pop-row">⚡ <b>${eq.velocidad||0} km/h</b></div>
        <div class="pop-row">🕐 Hace <b>${mins} min</b></div>
        <a class="gmaps-btn" href="${gmapsUrl}" target="_blank">🗺️ Ver en Google Maps</a>`;
      if(markers[eq.maquina]){markers[eq.maquina].setLatLng([eq.lat,eq.lng]).setIcon(icon).setPopupContent(popup);}
      else{markers[eq.maquina]=L.marker([eq.lat,eq.lng],{icon,zIndexOffset:1000}).addTo(map).bindPopup(popup);}
    });
    renderLista(equipos);
  }catch(e){document.getElementById('last-update').textContent='⚠️ Sin conexión';}
}

function renderLista(equipos){
  const list=document.getElementById('maq-list');
  if(!equipos.length){
    list.innerHTML='<div class="empty-panel">Sin equipos reportando.<br>Los operadores deben abrir<br><b>gps-operador.html</b></div>';return;
  }
  equipos.sort((a,b)=>minsDiff(a.created_at)-minsDiff(b.created_at));
  list.innerHTML=equipos.map(eq=>{
    const estado=getEstado(eq);const mins=minsDiff(eq.created_at);
    const cls=estado==='en movimiento'?'activo':estado==='detenido'?'detenido':'inactivo';
    const badge=estado==='en movimiento'?'<span class="maq-estado estado-mov">🟢 Movimiento</span>':
                estado==='detenido'?'<span class="maq-estado estado-det">🟡 Detenido</span>':
                `<span class="maq-estado estado-ina">⚫ Sin señal</span>`;
    const emoji=eq.maquina.includes('MONTA')?'🏗️':'🚜';
    return`<div class="maq-card ${cls}" onclick="focusMaquina('${eq.maquina}',${eq.lat||0},${eq.lng||0})">
      <div class="maq-top"><div class="maq-name">${emoji} ${eq.maquina}</div>${badge}</div>
      <div class="maq-info"><span>👤 ${eq.operador||'—'}</span><span>📍 ${eq.modulo||'—'}</span><span>⚡ ${eq.velocidad||0} km/h</span></div>
      <div class="maq-time">Último reporte: hace ${mins} min · ${new Date(eq.created_at).toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'})}</div>
    </div>`;
  }).join('');
}

function focusMaquina(maq,lat,lng){
  if(!lat||!lng)return;
  map.setView([lat,lng],18);
  if(markers[maq])markers[maq].openPopup();
  if(window.innerWidth<600){panelOpen=false;document.getElementById('panel').classList.add('collapsed');document.getElementById('toggle-icon').textContent='▲';}
}

function togglePanel(){
  panelOpen=!panelOpen;
  document.getElementById('panel').classList.toggle('collapsed',!panelOpen);
  document.getElementById('toggle-icon').textContent=panelOpen?'▼':'▲';
}

// Init
drawModules();
cargarUbicaciones();
setInterval(cargarUbicaciones,10000);
</script>
