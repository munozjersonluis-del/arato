<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uso de bandejas</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:#E9EDF2;color:#000}
.hd{display:flex;align-items:center;gap:16px;background:#123A5C;color:#fff;padding:10px 18px}
.hd img{height:38px;background:#fff;border-radius:6px;padding:3px 8px}.hd h1{flex:1;margin:0;font-size:24px;font-weight:900;letter-spacing:.5px;text-align:center}
.fl{display:flex;gap:10px}.fl label{font-size:11px;font-weight:700;display:block;opacity:.85}.fl select,.fl input{font:inherit;font-size:14px;font-weight:700;padding:6px 8px;border-radius:6px;border:0;min-width:150px}
.wrap{padding:12px 20px 20px;max-width:2000px;margin:0 auto}
@media(min-width:701px){.hd{padding-left:max(18px,calc((100vw - 2000px)/2 + 20px));padding-right:max(18px,calc((100vw - 2000px)/2 + 20px))}}.g2>.p{display:flex;flex-direction:column}.g2>.p>.b{flex:1;display:flex;flex-direction:column;justify-content:center}.hd{position:sticky;top:0;z-index:5}
.kp{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:12px}
.kp div{background:#fff;border-radius:8px;padding:12px;text-align:center;border-left:8px solid #123A5C;box-shadow:0 1px 3px #0002}
.kp b{display:block;font-size:34px;font-weight:800}.kp small{font-size:12px;font-weight:800;color:#333}
.p{background:#fff;border-radius:8px;box-shadow:0 1px 3px #0002;overflow:hidden}
.p h2{margin:0;background:#1B4F7A;color:#fff;font-size:15px;font-weight:900;text-align:center;padding:7px;letter-spacing:.3px}
.p .b{padding:8px 12px}
.g2{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:12px;margin-top:12px}
.ley{font-size:12px;font-weight:800;text-align:center;margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:12px;font-weight:700}th{background:#EEF2F6;padding:6px 4px;font-size:11px}td{padding:5px 4px;border-bottom:1px solid #eee;text-align:center}
td.t,th.t{text-align:left}tr.tot td{background:#F1F4F8;font-weight:900}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:middle;margin-right:4px}
.e{text-align:center;padding:40px;font-weight:800;color:#555}
@media(max-width:1100px){.g2{grid-template-columns:1fr}.kp{grid-template-columns:1fr 1fr}}

@media(max-width:700px){.hd{flex-wrap:wrap;gap:8px;padding:10px 12px}.hd img{height:30px}.hd h1{font-size:15px;flex:1 1 60%;text-align:left}.fl{width:100%}.fl>div{flex:1}.fl select,.fl input{min-width:0;width:100%}
.wrap{padding:8px 8px 16px}.kp{grid-template-columns:1fr 1fr!important;gap:8px}.kp div{padding:8px 4px;border-left-width:6px}.kp b{font-size:22px}.kp small{font-size:11px}
.g2{grid-template-columns:1fr!important}.p h2{font-size:13px}.p .b{padding:6px}.sx{overflow-x:auto;-webkit-overflow-scrolling:touch}.sx svg{min-width:var(--mw)}
table{font-size:11px}th,td{padding:4px 2px}.dt{overflow-x:auto}.dt table{min-width:560px}}

.lay{display:grid;grid-template-columns:220px 1fr;align-items:start}
.sb{background:#123A5C;color:#fff;padding:14px 12px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;min-height:calc(100vh - 58px);max-height:calc(100vh - 58px);overflow:auto}
.sb label{font-size:12px;font-weight:800;display:block;margin-bottom:4px;opacity:.9}
.sb select,.sb input{width:100%;font:inherit;font-size:14px;font-weight:700;padding:7px;border-radius:6px;border:0;color:#000}
.ch{display:flex;flex-wrap:wrap;gap:5px;background:#fff;border-radius:6px;padding:6px}.ch button{font:inherit;padding:4px 9px;border-radius:5px;border:0;background:#E3E8EF;color:#000;font-size:13px;font-weight:800;cursor:pointer}.ch button.on{background:#2EAA4A;color:#fff}
.sb .ac{margin-top:auto;padding:10px;border:0;border-radius:6px;background:#2EAA4A;color:#fff;font-weight:900;font-size:15px;cursor:pointer}.sb .lp{padding:7px;border:1px solid #ffffff66;border-radius:6px;background:transparent;color:#fff;font-weight:800;cursor:pointer}
.sbt{display:none}#hr{font-size:12px;font-weight:700;opacity:.85;white-space:nowrap}
@media(max-width:900px){.lay{grid-template-columns:1fr}.sb{display:none;position:fixed;inset:0;z-index:20;max-height:none;min-height:0}.sb.op{display:flex}.sbt{display:inline-block;font:inherit;font-weight:900;padding:7px 12px;border-radius:6px;border:0;background:#2EAA4A;color:#fff}.sb .cx{display:block!important}}

const pct=x=>x.ent?Math.round((x.ent-x.nu)/x.ent*100):null,col=p=>p==null?'#999':p>=90?VE:RO;

function combo(L){const W=1500,H=330,n=L.length||1,gw=(W-40)/n,bw=Math.min(40,gw*.28),mx=Math.max(1,...L.map(x=>Math.max(x.ent,x.uti)))*1.15,Y=v=>H-70-(H-150)*v/mx,PY=p=>58-38*Math.min(p,150)/150+0;
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="--mw:${Math.max(360,n*85)}px">`,pts=[],grpX={};
 L.forEach((x,i)=>{const cx=20+gw*i+gw/2,p=pct(x),y1=Y(x.ent),y2=Y(x.uti);(grpX[x.g]=grpX[x.g]||[]).push(cx);
  s+=`<rect x="${cx-bw-2}" y="${y1}" width="${bw}" height="${H-70-y1}" fill="${AZ}"/><rect x="${cx+2}" y="${y2}" width="${bw}" height="${H-70-y2}" fill="${GR}"/>
  <text x="${cx-bw/2-2}" y="${y1-4}" text-anchor="middle" font-size="12" font-weight="800">${f(x.ent)}</text><text x="${cx+bw/2+2}" y="${y2-4}" text-anchor="middle" font-size="12" font-weight="800">${f(x.uti)}</text>
  <text x="${cx}" y="${H-52}" text-anchor="middle" font-size="12" font-weight="800">${x.fu}</text>`;if(p!=null)pts.push([cx,PY(p)+40,p])});
 for(let i=1;i<pts.length;i++)s+=`<line x1="${pts[i-1][0]}" y1="${pts[i-1][1]}" x2="${pts[i][0]}" y2="${pts[i][1]}" stroke="${OR}" stroke-width="2.5"/>`;
 pts.forEach(q=>s+=`<circle cx="${q[0]}" cy="${q[1]}" r="5" fill="${OR}"/><text x="${q[0]}" y="${q[1]-9}" text-anchor="middle" font-size="12" font-weight="800" fill="${OR}">${q[2]} %</text>`);
 Object.entries(grpX).forEach(([g,xs])=>{const a=Math.min(...xs)-gw/2+6,b=Math.max(...xs)+gw/2-6;s+=`<line x1="${a}" x2="${b}" y1="${H-38}" y2="${H-38}" stroke="#aaa"/><text x="${(a+b)/2}" y="${H-20}" text-anchor="middle" font-size="15" font-weight="900">GRUPO ${g}</text>`});
 return s+'</svg>'}
function hbar(L,lab){const W=520,rh=50,H=L.length*rh+34,mx=110,X=v=>130+(W-200)*Math.min(v,mx)/mx;let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
 L.forEach((r,i)=>{const p=pct(r)??0,y=i*rh+8;s+=`<text x="120" y="${y+24}" text-anchor="end" font-size="15" font-weight="900">${r[lab]}</text><rect x="130" y="${y+4}" width="${X(p)-130}" height="28" fill="${col(pct(r))}"/><text x="${X(p)+6}" y="${y+24}" font-size="14" font-weight="800">${pct(r)==null?'sin entrega':p+' %'}</text>`});
 const x100=X(100);s+=`<line x1="${x100}" x2="${x100}" y1="0" y2="${H-26}" stroke="${RO}" stroke-dasharray="5 4" stroke-width="2"/>`;
 [0,50,100].forEach(v=>s+=`<text x="${X(v)}" y="${H-8}" text-anchor="middle" font-size="12" font-weight="700" fill="#555">${v} %</text>`);return s+'</svg>'}
function pintar(){const F='',L=ROWS.slice().sort((a,b)=>a.g.localeCompare(b.g)||a.fu.localeCompare(b.fu));
 if(!L.length){$('out').innerHTML='<div class="e">No hay entregas ni guías para '+PER()+'.</div>';return}
 const T=sum(L),pt=pct(T);
 const G=[...new Set(L.map(r=>r.g))].map(g=>({g,...sum(L.filter(r=>r.g===g))})).sort((a,b)=>(pct(b)??-1)-(pct(a)??-1));
 const FU=[...new Set(L.map(r=>r.fu))].map(fu=>({fu,...sum(L.filter(r=>r.fu===fu))})).sort((a,b)=>(pct(b)??-1)-(pct(a)??-1));
 let h=`<div class="kp"><div><b>${f(T.ent)}</b><small>Bandejas entregadas</small></div><div style="border-color:#8A96A3"><b>${f(T.uti)}</b><small>Bandejas utilizadas</small></div><div style="border-color:${RO}"><b style="color:${RO}">${f(T.nu)}</b><small>Bandejas no utilizadas</small></div><div style="border-color:#E8A23A"><b style="color:#B26A00">${f(T.se)}</b><small>Bandejas sin registro de entrega</small></div><div style="border-color:${col(pt)}"><b style="color:${col(pt)}">${pt==null?'—':pt+' %'}</b><small>% Utilización</small></div></div>`;
 h+=`<div class="p"><h2>UTILIZACIÓN DE BANDEJAS POR GRUPO Y FUNDO · ${PER()}</h2><div class="b"><div class="ley"><span class="dot" style="background:${AZ}"></span>Entregadas &nbsp; <span class="dot" style="background:${GR}"></span>Utilizadas &nbsp; <span class="dot" style="background:${OR}"></span>% Utilización</div><div class="sx">${combo(L)}</div></div></div>`;
 if(ESS()){const DD=[...new Set(DAYS.map(x=>x.d))].sort().map(d=>{const t=sum(DAYS.filter(x=>x.d===d));return{d,...t}}).filter(x=>x.ent||x.uti);
  h+=`<div class="p" style="margin-top:12px"><h2>TENDENCIA POR DÍA · BANDEJAS NO UTILIZADAS Y % UTILIZACIÓN</h2><div class="b sx">${trend(DD,x=>x.nu,x=>pct(x),v=>f(v),v=>v+' %',RO,OR,null,'No utilizadas','% Utilización')}</div></div>`}
 h+=`<div class="g2"><div class="p"><h2>UTILIZACIÓN POR GRUPO</h2><div class="b">${hbar(G,'g')}</div></div><div class="p"><h2>UTILIZACIÓN POR FUNDO</h2><div class="b">${hbar(FU,'fu')}</div></div>
 <div class="p"><h2>DETALLE POR GRUPO</h2><div class="b dt"><table><tr><th class="t">Grupo</th><th class="t">Fundo</th><th>Puntos</th><th>Entregadas</th><th>Utilizadas</th><th>No utilizadas</th><th>Sin registro de entrega</th><th>% Utiliz.</th></tr>`+
  [...new Set(L.map(r=>r.g))].map(g=>{const R=L.filter(r=>r.g===g),t=sum(R);return R.map((r,i)=>{const p=pct(r);return`<tr><td class="t">${i?'':g}</td><td class="t">${r.fu}</td><td>${r.pts||''}</td><td>${f(r.ent)}</td><td>${f(r.uti)}</td><td>${f(r.nu)}</td><td style="color:#B26A00">${r.se?f(r.se):'0'}</td><td><span class="dot" style="background:${col(p)}"></span>${p==null?'—':p+' %'}</td></tr>`}).join('')+`<tr class="tot"><td class="t"></td><td class="t">Total ${g}</td><td>${t.pts}</td><td>${f(t.ent)}</td><td>${f(t.uti)}</td><td>${f(t.nu)}</td><td style="color:#B26A00">${t.se?f(t.se):'0'}</td><td>${pct(t)==null?'—':pct(t)+' %'}</td></tr>`}).join('')+
  `<tr class="tot"><td class="t">TOTAL</td><td></td><td>${T.pts}</td><td>${f(T.ent)}</td><td>${f(T.uti)}</td><td>${f(T.nu)}</td><td style="color:#B26A00">${T.se?f(T.se):'0'}</td><td>${pt==null?'—':pt+' %'}</td></tr></table></div></div></div>`;
 $('out').innerHTML=h;$('hr').textContent='Actualizado '+new Date().toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'})}
sbInit(cargar,build);fechas().then(cargar);setInterval(()=>{if(!document.hidden)cargar()},300000);
</script></body></html>
