<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Pedidos de bandejas</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#F2F4F8;color:#123A5C}
.hd{padding:12px 14px;color:#fff;background:#1E7FD9;display:flex;align-items:center;gap:8px}.hd b{font-size:18px;display:block}.hd small{font-size:12.5px;opacity:.9}.hd button{margin-left:auto;background:#fff3;border:0;color:#fff;border-radius:8px;padding:7px 10px;font-weight:800;font-size:14px}
.lab{margin:12px 14px 5px;font-weight:800;font-size:15px}.fld{margin:0 14px}
input,select{width:100%;font-size:18px;padding:11px;border-radius:10px;border:2px solid #C9D2DC;font-weight:700;color:#141F6B;background:#fff}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 14px}.gr button{border:0;border-radius:12px;padding:15px 0;font-weight:900;font-size:22px;background:#E3ECF6;color:#141F6B}.gr button.on{background:#141F6B;color:#fff}
.big{display:block;width:calc(100% - 24px);margin:12px;border:0;border-radius:14px;color:#fff;font-weight:900;font-size:18px;padding:15px}

.tabs{display:flex;gap:6px;margin:10px 12px 0}.tabs button{flex:1;border:2px solid #141F6B;background:#fff;color:#141F6B;border-radius:10px;padding:9px;font-weight:800;font-size:15px}.tabs button.on{background:#141F6B;color:#fff}
.c{background:#fff;border-radius:14px;margin:10px 12px;padding:10px 12px}.c h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.r{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid #EEF1F5;font-weight:700;font-size:14px}.r .n{width:38px;height:38px;border-radius:50%;background:#7B1FA2;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}.r small{display:block;color:#678;font-weight:600;font-size:12px}.r .s{margin-left:auto;text-align:right;font-size:12px;font-weight:800}
.x{opacity:.45;text-decoration:line-through}
.st{font-size:11.5px;font-weight:800;border-radius:8px;padding:2px 8px;white-space:nowrap}.s1{background:#FFF3C4;color:#7A5A00}.s2{background:#E4F3EA;color:#14633A}.s3{background:#FDECEA;color:#B0301F}
.mw{position:relative}.mp{border-radius:12px;overflow:auto;border:2px solid #C9D2DC;background:#fff;-webkit-overflow-scrolling:touch}.mp .in{position:relative}.mp img{display:block}
.zm{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:6px;z-index:3}.zm button{width:42px;height:42px;border-radius:10px;border:0;background:#fff;box-shadow:0 1px 5px #0004;font-size:22px;font-weight:900;color:#141F6B}
.pin{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:#7B1FA2;border:2px solid #fff;box-shadow:0 1px 4px #0007;pointer-events:none;display:flex;align-items:center;justify-content:center}.pin b{color:#fff;font-size:11px;font-weight:900;line-height:1}.pin.nw{background:#FF6D00;box-shadow:0 0 0 1.5px #FF6D00,0 1px 4px #0006}.pin s{display:none}
.sel{margin:8px 12px;background:#fff;border-radius:12px;padding:10px 12px;font-weight:800;font-size:15px}
.num{display:flex;align-items:center;justify-content:space-between;margin:4px 14px}.num button{width:62px;height:62px;border-radius:50%;border:0;background:#141F6B;color:#fff;font-size:34px;font-weight:900}.num b{font-size:50px}
.qk{display:flex;gap:6px;margin:6px 14px}.qk button{flex:1;border:0;background:#E3ECF6;color:#141F6B;border-radius:10px;padding:10px 0;font-weight:900;font-size:16px}
.e{text-align:center;color:#789;font-weight:700;padding:24px}
.hr{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid #EEF1F5;font-weight:700;font-size:14px}.hr small{display:block;color:#678;font-weight:600;font-size:12px}
.row{display:flex;gap:8px;margin:0 12px}.row .big{margin:0;width:auto;flex:1;font-size:15px;padding:13px}
.msg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#123A5C;color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;display:none;z-index:9}
.soon{font-size:12px;color:#B07800;font-weight:700;margin:4px 14px 0}
.tg{width:100%;border:1.5px solid #C9D2DC;background:#F7F9FB;color:#1B4F7A;border-radius:10px;padding:8px;font-weight:800;font-size:14px;margin-bottom:6px}</style></head><body><div id=app></div><div id=msg class=msg></div>
<script src="bandejas-mapas.js"></script>
<script>
const SB='https://rqvcvffyynpnighzwxju.supabase.co',K='sb_publishable_keWbJCavFGWO_B976cjxAA_Gd5JMzFn',H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json',Prefer:'return=representation'};
const MAPAS=window.MAPAS;
const FUNDOS={'VALLE 1':['M01','M02','M03','M04','M05','M06','M07','M08','M09','M10','M11','M12'],'VALLE 2':['M13','M14','M19'],'VALLE 3':['M15','M16','M17','M18'],'VALLE 4':['M20'],'DUNA':['M01','M02','M03','M04','M05','M06']};
const FN=f=>f==='DUNA'?'Duna':f.replace('VALLE ','Valle ');
const $=s=>document.querySelector(s),A=$('#app');
const ls=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
const ymd=d=>d.toLocaleDateString('en-CA',{timeZone:'America/Lima'}),HOY=ymd(new Date()),MAN=ymd(new Date(Date.now()+864e5));
const hm=t=>t?new Date(t).toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit',timeZone:'America/Lima'}):'';
const fh=t=>{if(!t)return'';const d=ymd(new Date(t));return(d===HOY?'':new Date(t).toLocaleDateString('es-PE',{weekday:'short',day:'numeric',timeZone:'America/Lima'})+' · ')+hm(t)};
const dn=d=>new Date(d+'T12:00').toLocaleDateString('es-PE',{weekday:'short',day:'numeric',month:'short'});
function toast(t){const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',2300)}
async function q(t,p,o={}){const r=await fetch(SB+'/rest/v1/'+t+p,{headers:H,...o});if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json()}
let U=ls('pb_user'),V='home',FD=ls('pb_dia')||MAN,D=[],N=null,PT=null,OPN={},ZF=Math.min(1,(Math.min(innerWidth,640)-32)/1680),Z=ZF;
function render(){if(!U||!U.grupo)return login();({home,nuevo,punto}[V]||home)()}
// LOGIN
let LG={dni:'',nombre:'',found:null,grupo:null};
function login(){A.innerHTML=`<div class=hd><div><b>📋 Pedidos de bandejas</b><small>Auxiliar</small></div></div>
<div class=lab>Tu DNI</div><div class=fld><input id=dni inputmode=numeric maxlength=8 value="${LG.dni}" placeholder="8 dígitos"></div>
${LG.found===true?`<div class=ok>✔ ${LG.nombre}</div>`:LG.found===false?`<div class=lab>Tu nombre completo (solo la primera vez)</div><div class=fld><input id=nom value="${LG.nombre}"></div>`:''}
${LG.found!==null?`<div class=lab>¿Con qué grupo estás hoy?</div><div class=gr>${'ABCDEF'.split('').map(g=>`<button class="${LG.grupo===g?'on':''}" onclick="LG.grupo='${g}';LG.nombre=($('#nom')||{}).value||LG.nombre;render()">${g}</button>`).join('')}</div>
<button class=big style="background:${LG.grupo?'#1E9E5A':'#9AA'}" onclick="entrar()">ENTRAR</button>`:''}`;
const i=$('#dni');i.oninput=async()=>{LG.dni=i.value.replace(/\D/g,'');if(LG.dni.length===8){try{const r=await q('bandejas_auxiliares','?dni=eq.'+LG.dni);LG.found=!!r.length;LG.nombre=r.length?r[0].nombre:''}catch(e){LG.found=false}render();$('#dni').blur()}else if(LG.found!==null){LG.found=null;render();$('#dni').focus()}}}
async function entrar(){if(!LG.grupo)return toast('Elige tu grupo');if(LG.found===false){LG.nombre=($('#nom').value||'').trim();if(LG.nombre.length<3)return toast('Escribe tu nombre');try{await q('bandejas_auxiliares','',{method:'POST',body:JSON.stringify({dni:LG.dni,nombre:LG.nombre})})}catch(e){}}
U={dni:LG.dni,nombre:LG.nombre,grupo:LG.grupo};ls('pb_user',U);load()}
function cambiarGrupo(){LG={dni:U.dni,nombre:U.nombre,found:true,grupo:U.grupo};U=null;render()}
async function load(){try{D=await q('bandejas_pedidos',`?dni=eq.${U.dni}&fecha=in.(${HOY},${MAN})&order=creado`)||[]}catch(e){toast('Sin conexión')}render()}
// datos
const KEY=p=>p.fundo+'|'+p.modulo;
function puntos(fecha){const G={};D.filter(p=>p.fecha===fecha).forEach(p=>{const k=KEY(p);(G[k]=G[k]||{}),(G[k][p.punto]=G[k][p.punto]||[]).push(p)});return G}
const vivo=L=>L.filter(p=>p.estado!=='anulado'&&p.estado!=='rechazado');
function estado(L){const v=vivo(L);if(!v.length)return[L.some(p=>p.estado==='rechazado')?'rechazado':'anulado','s3'];if(v.every(p=>p.estado==='entregado'))return['✓ entregado','s2'];if(v.some(p=>p.estado==='parcial'))return['parcial','s1'];if(v.some(p=>p.estado==='en_camino'))return['🚚 en camino','s2'];if(v.some(p=>p.estado==='aceptado'))return['✋ aceptado','s2'];return['⏳ esperando','s1']}
// MAPA
function mapa(k,pins,id){const M=MAPAS[k];if(!M)return`<div class=e>Mapa de este módulo aún no cargado<br><small>Ensayo: solo Valle 3 · M17</small></div>`;
return `<div class=mw><div class=zm><button onclick="zoom(1.3,'${id}')">+</button><button onclick="zoom(1/1.3,'${id}')">−</button></div><div class=mp id=${id} style="height:${Math.min(810*Z+6,innerHeight*(id==='mN'?0.5:0.4))}px"><div class=in style="width:${M.w*Z}px"><img src="${M.img}" style="width:${M.w*Z}px" data-k="${k}">${pins.map(p=>`<div class="pin ${p.nw?'nw':''}" style="left:${p.x*Z}px;top:${p.y*Z}px"><b>${p.n}</b></div>`).join('')}</div></div></div>`}
let SC={};function zoom(f,id){const m=document.getElementById(id);const cx=(m.scrollLeft+m.clientWidth/2)/Z,cy=(m.scrollTop+m.clientHeight/2)/Z;Z=Math.min(1.5,Math.max(ZF,Z*f));SC[id]=[cx*Z-m.clientWidth/2,cy*Z-m.clientHeight/2];render()}
function scrollTo(id,pins){const m=document.getElementById(id);if(!m)return;if(SC[id]){m.scrollLeft=SC[id][0];m.scrollTop=SC[id][1];return}const p=pins[pins.length-1]||{x:700,y:420};m.scrollLeft=p.x*Z-m.clientWidth/2;m.scrollTop=p.y*Z-m.clientHeight/2}
// HOME
function home(){const G=puntos(FD);const tot=vivo(D.filter(p=>p.fecha===FD)).reduce((s,p)=>s+p.cantidad,0);const ks=Object.keys(G);
A.innerHTML=`<div class=hd><div><b>📋 Mis pedidos · Grupo ${U.grupo}</b><small>${U.nombre}</small></div><button onclick="cambiarGrupo()">Grupo ⚙</button></div>
<div class=tabs><button class="${FD===HOY?'on':''}" onclick="FD=HOY;ls('pb_dia',FD);SC={};render()">Hoy ${dn(HOY)}</button><button class="${FD===MAN?'on':''}" onclick="FD=MAN;ls('pb_dia',FD);SC={};render()">Mañana ${dn(MAN)}</button></div>
<button class=big style="background:#1E7FD9;font-size:20px" onclick="nuevo0()">➕ PEDIR BANDEJAS</button>
${ks.length?ks.map((k,i)=>{const P=G[k],ns=Object.keys(P).sort((a,b)=>a-b);const pins=ns.map(n=>{const v=vivo(P[n]);const f=P[n][0];return{n,x:f.x,y:f.y,c:v.reduce((s,p)=>s+p.cantidad,0)}}).filter(p=>p.c);const [f,m]=k.split('|');
return`<div class=c><h3>📍 ${FN(f)} · ${m}<span style="font-size:13px">${vivo(Object.values(P).flat()).reduce((s,p)=>s+p.cantidad,0)} bandejas</span></h3><div style="display:flex;gap:6px"><button class=tg style="flex:1" onclick="OPN[${i}]=!OPN[${i}];SC={};render()">${OPN[i]?'▲ Ocultar mapa':'🗺 Ver mapa'}</button><button class=tg style="flex:1;background:#25D366;color:#fff;border-color:#25D366" onclick="compartir('${k}')">📤 Compartir</button></div>${OPN[i]?mapa(k,pins,'mH'+i):''}
${ns.map(n=>{const L=P[n],v=vivo(L),e=estado(L);return`<div class="r ${v.length?'':'x'}" onclick="PT={k:'${k}',n:${n}};V='punto';SC={};render()"><div class=n>C${n}</div><div>${L[0].lote||L[0].bloque} · ${v.reduce((s,p)=>s+p.cantidad,0)}<small>pidió ${fh(L[0].creado)}${L.length>1?' · '+L.length+' pedidos':''}</small></div><div class=s><span class="st ${e[1]}">${e[0]}</span></div></div>`}).join('')}</div>`}).join('')
+`<div class=c style="text-align:center;font-weight:900">Total del día: ${tot} bandejas</div>`:'<div class=e>Aún no hay pedidos para este día</div>'}`;
ks.forEach((k,i)=>{const P=G[k];if(OPN[i])scrollTo('mH'+i,Object.values(P).map(L=>L[0]))})}
// NUEVO
function nuevo0(){const last=D.filter(p=>p.fecha===FD).slice(-1)[0];N={f:last?last.fundo:'VALLE 3',m:last?last.modulo:'M17',P:[],act:-1,mas:null};V='nuevo';SC={};render()}
function nextN(){const L=D.filter(p=>p.fecha===FD&&p.fundo===N.f&&p.modulo===N.m);return Math.max(0,...L.map(p=>p.punto))+1}
function keep(){const m=$('#mN');if(m)SC.mN=[m.scrollLeft,m.scrollTop]}
function nuevo(){const k=N.f+'|'+N.m,M=MAPAS[k];const G=puntos(FD)[k]||{};const pins=Object.keys(G).map(x=>({n:x,x:G[x][0].x,y:G[x][0].y})).concat(N.mas?[]:N.P.map(p=>({n:p.n,x:p.x,y:p.y,nw:1,c:p.c})));
const tot=N.P.reduce((s,p)=>s+p.c,0);
const card=(p,i)=>{const o=N.act===i,bl=p.sel.map(x=>p.nb[x].l).join(', ')||'elige bloque';return`<div style="background:#fff;border-radius:12px;margin:6px 12px;padding:7px 9px">
<div style="display:flex;align-items:center;gap:7px"><span style="background:#FF6D00;color:#fff;border-radius:50%;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex:none">${p.n}</span>
<span onclick="${p.fixed?'':`N.act=${o?-1:i};keep();render()`}" style="flex:1;font-weight:800;font-size:13px;color:${p.sel.length?'#123A5C':'#B0301F'};line-height:1.2">${bl}${p.fixed?'':` <span style="color:#1E7FD9">${o?'▲':'✎'}</span>`}</span>
<button onclick="cc(${i},-5)" style="width:34px;height:34px;border-radius:50%;border:0;background:#141F6B;color:#fff;font-size:20px;font-weight:900">−</button><b style="width:38px;text-align:center;font-size:19px">${p.c}</b><button onclick="cc(${i},5)" style="width:34px;height:34px;border-radius:50%;border:0;background:#141F6B;color:#fff;font-size:20px;font-weight:900">+</button>
${p.fixed?'':`<button onclick="quitar(${i})" style="border:0;background:none;font-size:18px;padding:0 2px">🗑</button>`}</div>
${o&&!p.fixed?`<div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:7px">${p.nb.map((b,j)=>`<button onclick="tog(${i},${j})" style="border:1.5px solid #141F6B;border-radius:8px;padding:5px 7px;font-weight:800;font-size:12.5px;${p.sel.includes(j)?'background:#141F6B;color:#fff':'background:#fff;color:#141F6B'}">${b.l}</button>`).join('')}</div>`:''}</div>`};
A.innerHTML=`<div class=hd><div><b>➕ ${N.mas?'Pedir más · C'+N.mas:'Nuevo pedido'}</b><small>Para ${dn(FD)} · Grupo ${U.grupo}</small></div><button onclick="V='home';render()">✕</button></div>
${N.mas?`<div class=sel>📍 ${FN(N.f)} · ${N.m}</div>`:`<div class=lab>1. Fundo y módulo</div><div style="display:flex;gap:8px;margin:0 12px"><select id=sf>${Object.keys(FUNDOS).map(f=>`<option value="${f}" ${f===N.f?'selected':''}>${FN(f)}</option>`).join('')}</select><select id=sm>${FUNDOS[N.f].map(m=>`<option ${m===N.m?'selected':''}>${m}</option>`).join('')}</select></div>
${M?'':'<div class=soon>⚠ Ensayo: por ahora solo hay mapa de Valle 3 · M17</div>'}
<div class=lab>2. Toca en el mapa los puntos</div><div style="margin:0 12px">${mapa(k,pins,'mN')}</div>`}
${N.P.length?``+N.P.map(card).join(''):(N.mas?'':'<div class=sel style="color:#99A">Aún no marcaste puntos</div>')}
${N.P.length>1?`<div class=c style="background:#141F6B;color:#fff;display:flex;justify-content:space-between;font-weight:900;margin:8px 12px"><span>${N.P.length} puntos</span><span>Total ${tot} bandejas</span></div>`:''}
<button class=big style="background:${N.P.length?'#1E9E5A':'#9AA'};font-size:19px" onclick="enviar()">ENVIAR ${N.P.length>1?N.P.length+' PUNTOS':(N.P[0]?'C'+N.P[0].n:'')} · ${tot} bandejas</button>`;
if(!N.mas){$('#sf').onchange=e=>{if(N.P.length&&!confirm('Se borrarán los puntos marcados. ¿Cambiar?'))return render();N.f=e.target.value;N.m=FUNDOS[N.f][0];N.P=[];N.act=-1;SC={};render()};$('#sm').onchange=e=>{if(N.P.length&&!confirm('Se borrarán los puntos marcados. ¿Cambiar?'))return render();N.m=e.target.value;N.P=[];N.act=-1;SC={};render()};
const im=document.querySelector('#mN img');if(im){scrollTo('mN',pins);im.onclick=e=>{const r=im.getBoundingClientRect();let x=Math.round((e.clientX-r.left)/Z),y=Math.round((e.clientY-r.top)/Z);(M.com||[]).forEach(([cx,cy])=>{if(Math.abs(x-cx)<58&&Math.abs(y-cy)<38){x=cx+(x>=cx?62:-62);toast('Punto movido al costado del comedor')}});
const nb=M.bl.map(o=>({o,d:(o.x-x)**2+(o.y-y)**2})).sort((p,q)=>p.d-q.d);const near=nb.filter(z=>z.d<220*220).slice(0,6).map(z=>z.o);
N.P.push({n:nextN()+N.P.length,x,y,nb:near.length?near:[nb[0].o],sel:[0],c:40});N.act=-1;keep();render()}}}}
function tog(i,j){const p=N.P[i];p.sel=p.sel.includes(j)?p.sel.filter(x=>x!==j):[...p.sel,j];keep();render()}
function cc(i,d){N.P[i].c=Math.max(5,N.P[i].c+d);keep();render()}
function quitar(i){N.P.splice(i,1);const b=nextN();N.P.forEach((p,k)=>p.n=b+k);N.act=-1;keep();render()}
async function enviar(){if(!N.P.length)return toast('Marca al menos un punto en el mapa');const bad=N.P.find(p=>!p.sel.length);if(bad)return toast('C'+bad.n+': elige al menos un bloque');
const rows=N.P.map(p=>({fecha:FD,dni:U.dni,auxiliar:U.nombre,grupo:U.grupo,fundo:N.f,modulo:N.m,punto:p.n,bloque:[...new Set(p.sel.map(j=>p.nb[j].b))].join(', '),lote:p.sel.map(j=>p.nb[j].l).join(', '),x:p.x,y:p.y,cantidad:p.c,tipo:FD===HOY?'dia':'inicio'}));
try{await q('bandejas_pedidos','',{method:'POST',body:JSON.stringify(rows)});toast('✔ '+(rows.length>1?rows.length+' puntos enviados':'C'+rows[0].punto+' enviado'));V='home';SC={};load()}catch(e){toast('No se pudo enviar, revisa la señal')}}
// PUNTO
function punto(){const [f,m]=PT.k.split('|'),L=(puntos(FD)[PT.k]||{})[PT.n]||[];if(!L.length){V='home';return render()}const p0=L[0],v=vivo(L),pend=L.filter(p=>p.estado==='pendiente');
const pid=v.reduce((s,p)=>s+p.cantidad,0),rec=v.reduce((s,p)=>s+(p.entregado||0),0);
A.innerHTML=`<div class=hd><div><b>C${PT.n} · ${FN(f)} · ${m}</b><small>${p0.bloque} · ${p0.lote}</small></div><button onclick="V='home';SC={};render()">✕</button></div>
<div style="margin:10px 12px">${mapa(PT.k,[{n:PT.n,x:p0.x,y:p0.y,nw:1}],'mP')}</div>
<div class=c><h3>Historial</h3>${L.map((p,i)=>`<div class="hr ${p.estado==='anulado'?'x':''}"><span>${i?'Pidió más':(p.tipo==='inicio'?'Pidió (para iniciar)':'Pidió')}<small>${fh(p.creado)}</small></span><b>${p.cantidad}</b></div>
${p.aceptado_at?`<div class=hr><span>Aceptó<small>${hm(p.aceptado_at)} · ${p.placa||''}</small></span><b>✋</b></div>`:''}${p.en_camino_at?`<div class=hr><span>Salió al punto<small>${hm(p.en_camino_at)}</small></span><b>🚚</b></div>`:''}${p.estado==='rechazado'?`<div class=hr><span style="color:#B0301F">Rechazado<small>${p.motivo||''}</small></span></div>`:''}${p.estado==='entregado'||p.estado==='parcial'?`<div class=hr><span>Dejaron<small>${hm(p.entregado_at)}${p.placa?' · '+p.placa:''}${p.tipo!=='inicio'?' · '+Math.round((new Date(p.entregado_at)-new Date(p.creado))/6e4)+' min':''}</small></span><b style="color:#1E9E5A">${p.entregado} ✓</b></div>`:p.estado==='anulado'?`<div class=hr><span style="color:#B0301F">Anulado<small>${fh(p.anulado_at)}</small></span></div>`:`<div class=hr><span style="color:#B07800">Esperando entrega</span><button onclick="anular(${p.id})" style="border:0;background:#FDECEA;color:#B0301F;border-radius:8px;font-weight:800;padding:5px 10px">✕ Anular</button></div>`}`).join('')}</div>
<div class=c style="background:#141F6B;color:#fff;display:flex;justify-content:space-between;font-weight:800"><span>Pidió ${pid}</span><span>Recibió ${rec}</span></div>
${v.length?`<button class=big style="background:#1E7FD9" onclick="N={f:'${f}',m:'${m}',mas:${PT.n},act:0,P:[{n:${PT.n},x:${p0.x},y:${p0.y},nb:[{b:'${p0.bloque}',l:'${p0.lote}'}],sel:[0],c:40,fixed:1}]};V='nuevo';render()">➕ Pedir más aquí</button>`:''}
${pend.length?`<div class=row><button class=big style="background:#1B4F7A" onclick="cambiar(${pend[pend.length-1].id},${pend[pend.length-1].cantidad})">✏️ Cambiar cantidad</button></div>`:''}`;
const mp=$("#mP");if(mp){mp.scrollLeft=p0.x*Z-mp.clientWidth/2;mp.scrollTop=p0.y*Z-mp.clientHeight/2}}
async function anular(id){if(!confirm('¿Anular este pedido?'))return;try{await q('bandejas_pedidos','?id=eq.'+id+'&estado=eq.pendiente',{method:'PATCH',body:JSON.stringify({estado:'anulado',anulado_at:new Date().toISOString()})});toast('Pedido anulado');load()}catch(e){toast('Sin conexión')}}
async function cambiar(id,c){const n=parseInt(prompt('Nueva cantidad de bandejas',c));if(!(n>0))return;try{await q('bandejas_pedidos','?id=eq.'+id+'&estado=eq.pendiente',{method:'PATCH',body:JSON.stringify({cantidad:n})});toast('Cantidad cambiada');load()}catch(e){toast('Sin conexión')}}

async function compartir(k){const P=puntos(FD)[k]||{},[f,m]=k.split('|'),M=MAPAS[k];const ns=Object.keys(P).sort((a,b)=>a-b).filter(n=>vivo(P[n]).length);if(!ns.length)return toast('No hay puntos');
toast('Preparando imagen…');const rows=ns.map(n=>{const L=vivo(P[n]);return{n,lote:L[0].lote||L[0].bloque,c:L.reduce((s,p)=>s+p.cantidad,0),x:L[0].x,y:L[0].y}}),tot=rows.reduce((s,r)=>s+r.c,0);
const txt=`*Pedido de bandejas*\nGrupo ${U.grupo} · ${U.nombre}\n${dn(FD)} · ${FN(f)} · ${m}\n`+rows.map(r=>`Punto ${r.n}: ${r.c} bandejas (${r.lote})`).join('\n')+`\n*Total: ${tot} bandejas*`;
let blob=null;if(M){try{const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=M.img});
const xs=rows.map(r=>r.x),ys=rows.map(r=>r.y),pad=220,x0=Math.max(0,Math.min(...xs)-pad),x1=Math.min(M.w,Math.max(...xs)+pad),y0=Math.max(0,Math.min(...ys)-pad*0.8),y1=Math.min(760,Math.max(...ys)+pad*0.6);
const sc=img.naturalWidth/M.w,W=1200,s=W/(x1-x0),mh=Math.round((y1-y0)*s),lh=46,H=110+mh+30+rows.length*lh+70;const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
g.fillStyle='#fff';g.fillRect(0,0,W,H);g.fillStyle='#1E7FD9';g.fillRect(0,0,W,96);g.fillStyle='#fff';g.font='bold 38px Arial';g.fillText(`Pedido de bandejas · Grupo ${U.grupo}`,28,46);g.font='26px Arial';g.fillText(`${dn(FD)} · ${FN(f)} · ${m} · ${U.nombre}`,28,82);
g.drawImage(img,x0*sc,y0*sc,(x1-x0)*sc,(y1-y0)*sc,0,104,W,mh);
rows.forEach(r=>{const px=(r.x-x0)*s,py=104+(r.y-y0)*s;g.beginPath();g.arc(px,py,22,0,7);g.fillStyle='#FF6D00';g.fill();g.lineWidth=4;g.strokeStyle='#fff';g.stroke();g.fillStyle='#fff';g.font="bold 24px Arial";g.textAlign="center";g.fillText(r.n,px,py+8);g.textAlign='left'});
let y=104+mh+30;rows.forEach((r,i)=>{if(i%2==0){g.fillStyle='#F2F4F8';g.fillRect(16,y-4,W-32,lh)}g.beginPath();g.arc(48,y+19,16,0,7);g.fillStyle='#FF6D00';g.fill();g.fillStyle='#fff';g.font='bold 18px Arial';g.textAlign='center';g.fillText(r.n,48,y+25);g.textAlign='left';g.fillStyle='#123A5C';g.font='bold 24px Arial';g.fillText(r.lote,80,y+27);g.textAlign='right';g.font='bold 28px Arial';g.fillText(r.c+' bandejas',W-28,y+29);g.textAlign='left';y+=lh});
g.fillStyle='#141F6B';g.fillRect(16,y+6,W-32,54);g.fillStyle='#fff';g.font='bold 30px Arial';g.fillText(`${rows.length} puntos`,36,y+43);g.textAlign='right';g.fillText(`Total ${tot} bandejas`,W-36,y+43);g.textAlign='left';
blob=await new Promise(ok=>c.toBlob(ok,'image/jpeg',0.9))}catch(e){blob=null}}
const file=blob?new File([blob],`pedido_${U.grupo}_${FD}.jpg`,{type:'image/jpeg'}):null;
try{if(file&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(e){if(e.name==='AbortError')return}
if(file){const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;a.click();toast('Imagen guardada: envíala por WhatsApp')}else location.href='https://wa.me/?text='+encodeURIComponent(txt)}
setInterval(()=>{if(U&&U.grupo&&V==='home')load()},30000);U&&U.grupo?load():render();
</script></body></html>
