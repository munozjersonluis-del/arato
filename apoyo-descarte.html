<!doctype html><html lang=es><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Apoyo · Botar descarte</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#EEF2F7;color:#0F2A44}.w{max-width:460px;margin:0 auto}
.hd{background:linear-gradient(135deg,#0D2740,#1B4F7A);color:#fff;padding:18px 20px 70px;text-align:center}.hd small{font-weight:800;letter-spacing:1.5px;opacity:.7;font-size:10.5px}.hd h1{margin:6px 0 0;font-size:19px}
.k{margin:-54px 16px 14px;background:#fff;border-radius:20px;padding:20px;box-shadow:0 10px 26px #0F2A4420;text-align:center}.k small{font-weight:800;color:#7A8899;font-size:12px;letter-spacing:1px}
.big{width:96px;height:96px;border-radius:24px;color:#fff;font-size:56px;font-weight:900;display:flex;align-items:center;justify-content:center;margin:10px auto 6px}.k h2{margin:0 0 16px;font-size:22px}
.in{display:flex;gap:10px}.in label{flex:1;border:2px solid #D9E0E8;border-radius:12px;padding:8px 12px;text-align:left;display:block}.in label span{display:block;font-size:11px;font-weight:800;color:#7A8899}.in input{border:0;outline:0;font:inherit;font-size:17px;font-weight:800;color:#0F2A44;width:100%;background:none;padding:2px 0}
.bt{margin-top:14px;width:100%;border:0;background:#25D366;color:#fff;border-radius:14px;padding:16px;font-weight:900;font-size:17px;cursor:pointer}.bt:disabled{opacity:.6}
.sk{margin-top:10px;background:none;border:0;color:#C25E10;font-weight:700;font-size:13px;text-decoration:underline;cursor:pointer}
.ord{display:flex;justify-content:space-between;margin:4px 22px 8px}.o{width:44px;height:44px;border-radius:12px;color:#fff;font-weight:900;font-size:19px;display:flex;align-items:center;justify-content:center;position:relative}.o i{position:absolute;bottom:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#2E9E4F;border:2px solid #EEF2F7;font-style:normal;font-size:11px;display:flex;align-items:center;justify-content:center}.o.p{opacity:.35}.o.c{box-shadow:0 0 0 3px #EEF2F7,0 0 0 6px var(--c)}
.hi{margin:18px 16px;background:#fff;border-radius:14px;padding:6px 16px}.hi h3{font-size:11.5px;font-weight:800;color:#7A8899;letter-spacing:1px;margin:10px 0 4px}.hr{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #F0F2F5;font-size:14px}.hr .g{width:28px;height:28px;border-radius:8px;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:13px}.hr b{flex:1}.hr span{color:#5B6B7C;font-weight:600;font-size:13px}
.ud{display:block;margin:0 auto 26px;background:none;border:0;color:#7A8899;font-size:12.5px;text-decoration:underline;cursor:pointer}
#st{text-align:center;font-size:12px;color:#7A8899;padding:4px}
/* imagen whatsapp */
#img{position:fixed;left:-2000px;top:0;width:420px;background:#fff;font-family:Inter,system-ui,Arial;color:#0F2A44}
#img .ih{background:linear-gradient(135deg,#0D2740,#1B4F7A);color:#fff;text-align:center;padding:16px 12px}#img .ih small{font-size:10px;font-weight:800;letter-spacing:1.5px;opacity:.7}#img .ih b{display:block;font-size:19px;margin-top:3px;letter-spacing:.5px}
#img .mn{display:flex;align-items:center;gap:16px;padding:18px}#img .g{width:80px;height:80px;border-radius:20px;color:#fff;font-size:46px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}#img em{font-style:normal;font-size:11.5px;font-weight:800;color:#7A8899;letter-spacing:1px}#img h2{margin:1px 0 4px;font-size:25px}#img .mn div div{font-size:15.5px;font-weight:700;color:#334}
#img .ord{margin:0;padding:12px 18px 16px;border-top:1px solid #EEF1F5}#img .o i{border-color:#fff}#img .o.c{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--c)}#img .nx{background:#F4F7FB;text-align:center;font-size:13.5px;font-weight:700;color:#5B6B7C;padding:11px}
</style></head><body><div class=w>
<div class=hd><small>MISSION PRODUCE · BLUEBERRIES CHAO</small><h1>Apoyo · Botar descarte</h1></div>
<div class=k><small>LE TOCA AL</small><div class=big id=bg></div><h2 id=gn></h2>
<div class=in><label><span>📅 FECHA</span><input type=date id=iF></label><label style="flex:.6"><span>👥 PERSONAS</span><input type=number id=iP min=1 inputmode=numeric placeholder="0"></label></div>
<button class=bt id=go>📲 Enviar al WhatsApp</button><button class=sk id=sk></button></div>
<div class=ord id=ord></div>
<div class=hi><h3>ÚLTIMOS APOYOS</h3><div id=hist></div></div>
<button class=ud id=ud>↶ Deshacer último registro</button><div id=st></div></div>
<div id=img></div>
<script>
const SB="https://rqvcvffyynpnighzwxju.supabase.co",KY="sb_publishable_keWbJCavFGWO_B976cjxAA_Gd5JMzFn",H={apikey:KY,Authorization:"Bearer "+KY,"Content-Type":"application/json",Prefer:"return=representation"};
const GS="ABCDEF",C={A:'#6B3FA0',B:'#2E86C1',C:'#C9A800',D:'#7F8790',E:'#C0392B',F:'#E67E22'},$=i=>document.getElementById(i);
const DL=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];let R=[],skip=0;
const fl=s=>{const d=new Date(s+'T12:00');return DL[d.getDay()]+' '+s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4)},fc=s=>{if(!s)return'—';const d=new Date(s+'T12:00');return DL[d.getDay()].slice(0,3)+' '+s.slice(8,10)+'/'+s.slice(5,7)};
async function load(){try{const r=await fetch(SB+"/rest/v1/apoyo_descarte?select=*&order=id",{headers:H});R=await r.json();$("st").textContent="✔ Sincronizado"}catch(e){$("st").textContent="⚠ Sin conexión"}render()}
function est(extra){const L=extra?[...R,extra]:R;const V=L.length?Math.max(...L.map(x=>x.vuelta)):1;let D={};L.filter(x=>x.vuelta===V).forEach(x=>D[x.grupo]=1);let vuelta=V;if(Object.keys(D).length===6){vuelta=V+1;D={}}
 const last=L.length?L[L.length-1].grupo:'F',pend=[];for(let i=1;i<=6;i++){const g=GS[(GS.indexOf(last)+i)%6];if(!D[g])pend.push(g)}return{vuelta,D,pend}}
const ordHTML=(D,nx)=>[...GS].map(g=>`<span class="o${D[g]?'':(g===nx?' c':' p')}" style="background:${C[g]};--c:${C[g]}">${g}${D[g]?'<i>✔</i>':''}</span>`).join('');
function render(){const {D,pend}=est(),nx=pend[skip%pend.length];
 $("bg").textContent=nx;$("bg").style.background=C[nx];$("bg").style.boxShadow="0 8px 18px "+C[nx]+"55";$("gn").textContent="Grupo "+nx;
 $("sk").textContent=pend.length>1?`Grupo ${nx} no puede · pasar al Grupo ${pend[(skip+1)%pend.length]}`:'';$("sk").style.display=pend.length>1?'':'none';
 $("ord").innerHTML=ordHTML(D,nx);
 $("hist").innerHTML=R.slice(-5).reverse().map(x=>`<div class=hr><span class=g style="background:${C[x.grupo]}">${x.grupo}</span><b>Grupo ${x.grupo}</b><span>${fc(x.fecha)}${x.personas?' · '+x.personas+' pers.':''}</span></div>`).join('')||'<div class=hr><span>Sin registros</span></div>'}
$("sk").onclick=()=>{skip++;render()};
async function lib(){if(window.html2canvas)return;await new Promise((r,j)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';s.onload=r;s.onerror=j;document.head.appendChild(s)})}
$("go").onclick=async()=>{const f=$("iF").value,p=+$("iP").value||null;if(!f){alert("Pon la fecha");$("iF").focus();return}if(!p){alert("Pon cuántas personas");$("iP").focus();return}
 const {vuelta,pend}=est(),g=pend[skip%pend.length];$("go").disabled=true;$("go").textContent="Guardando…";
 try{const r=await fetch(SB+"/rest/v1/apoyo_descarte",{method:"POST",headers:H,body:JSON.stringify({vuelta,grupo:g,fecha:f,personas:p})});if(!r.ok)throw 0;const row=(await r.json())[0];
  const e2=est(row),D2=(()=>{const V=row.vuelta,o={};[...R,row].filter(x=>x.vuelta===V).forEach(x=>o[x.grupo]=1);return o})();
  $("img").innerHTML=`<div class=ih><small>MISSION PRODUCE · BLUEBERRIES CHAO</small><b>APOYO · BOTAR DESCARTE</b></div><div class=mn><span class=g style="background:${C[g]}">${g}</span><div><em>LE TOCA AL</em><h2>Grupo ${g}</h2><div>📅 ${fl(f)}</div><div>👥 ${p} personas</div></div></div><div class=ord>${[...GS].map(x=>`<span class="o${D2[x]&&x!==g?'':(x===g?' c':' p')}" style="background:${C[x]};--c:${C[x]}">${x}${D2[x]&&x!==g?'<i>✔</i>':''}</span>`).join('')}</div><div class=nx>Siguiente turno: Grupo ${e2.pend[0]}</div>`;
  const txt=`Apoyo botar descarte: Grupo ${g} · ${fl(f).toLowerCase()} · ${p} personas`;
  $("iF").value="";$("iP").value="";skip=0;await load();$("go").textContent="Preparando imagen…";
  let file=null;try{await lib();const cv=await html2canvas($("img"),{scale:2,backgroundColor:'#ffffff'});const b=await new Promise(r=>cv.toBlob(r,'image/png'));file=new File([b],'Apoyo_descarte.png',{type:'image/png'})}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],text:txt})}catch(e){}}
  else location.href="https://wa.me/?text="+encodeURIComponent(txt)}
 catch(e){alert("No se pudo guardar. Revisa tu conexión.")}
 $("go").disabled=false;$("go").textContent="📲 Enviar al WhatsApp"};
$("ud").onclick=async()=>{if(!R.length)return;const x=R[R.length-1];if(!confirm(`¿Quitar el último registro? Grupo ${x.grupo} · ${fc(x.fecha)}`))return;await fetch(SB+"/rest/v1/apoyo_descarte?id=eq."+x.id,{method:"DELETE",headers:H});load()};
load();setInterval(()=>{if(!document.hidden&&!document.activeElement.matches('input'))load()},30000);
</script></body></html>
