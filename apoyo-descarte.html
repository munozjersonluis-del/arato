<!doctype html><html lang=es><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Apoyo · Botar descarte</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#EEF2F7;color:#0F2A44}.w{max-width:460px;margin:0 auto;padding-bottom:20px}
.hd{background:linear-gradient(135deg,#0D2740,#1B4F7A);color:#fff;padding:18px 20px;text-align:center}.hd small{font-weight:800;letter-spacing:1.5px;opacity:.7;font-size:10.5px}.hd h1{margin:6px 0 2px;font-size:19px}
.pr{display:flex;align-items:center;gap:10px;margin-top:12px}.pb{flex:1;height:8px;background:#ffffff2a;border-radius:4px;overflow:hidden}.pb div{height:100%;background:#4ADE80;border-radius:4px}.pr b{font-size:12.5px;white-space:nowrap}
.sec{margin:14px 14px 0;font-size:12px;font-weight:800;letter-spacing:.8px}
.c{margin:8px 14px 0;background:#fff;border-radius:16px;padding:4px 14px;box-shadow:0 4px 14px #0F2A4414}
.r{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid #F0F2F5}.r:first-child{border:0}.g{width:40px;height:40px;border-radius:11px;color:#fff;font-weight:900;font-size:19px;display:flex;align-items:center;justify-content:center;flex:none}.n{flex:1;font-weight:800;font-size:16px}.n small{display:block;font-size:12px;color:#7A8899;font-weight:600}.ok{width:28px;height:28px;border-radius:50%;background:#2E9E4F;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900}
.e{padding:14px 0;text-align:center;color:#9AA6B2;font-weight:600;font-size:13px}
.fa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px 0}.fa button{background:none;border:0;padding:0;cursor:pointer;font:inherit}.fa span{width:56px;height:56px;border-radius:14px;color:#fff;font-weight:900;font-size:26px;display:flex;align-items:center;justify-content:center;margin:0 auto 4px}.fa small{font-size:11px;font-weight:700;color:#7A8899}.fa .sel span{box-shadow:0 0 0 3px #fff,0 0 0 6px #0F2A44}
.fm{margin:10px 14px 0;background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 14px #0F2A4414}.fm h3{margin:0 0 10px;font-size:14px}.row{display:flex;gap:8px}.row label{flex:1;border:2px solid #D9E0E8;border-radius:10px;padding:6px 10px;display:block}.row label span{display:block;font-size:10px;color:#7A8899;font-weight:800}.row input{border:0;outline:0;font:inherit;font-size:16px;font-weight:800;color:#0F2A44;width:100%;background:none;padding:2px 0}
.wa{margin-top:12px;width:100%;border:0;background:#25D366;color:#fff;border-radius:12px;padding:14px;font-weight:900;font-size:15.5px;cursor:pointer}.wa:disabled{opacity:.6}
.ft{text-align:center;font-size:11.5px;color:#7A8899;font-weight:600;padding:12px 20px 4px}.ud{display:block;margin:6px auto;background:none;border:0;color:#7A8899;font-size:12.5px;text-decoration:underline;cursor:pointer}#st{text-align:center;font-size:12px;color:#7A8899}
#img{position:fixed;left:-2000px;top:0;width:420px;background:#fff;color:#0F2A44;font-family:Inter,system-ui,Arial}
#img .ih{background:linear-gradient(135deg,#0D2740,#1B4F7A);color:#fff;text-align:center;padding:16px 12px}#img .ih small{font-size:10px;font-weight:800;letter-spacing:1.5px;opacity:.7}#img .ih b{display:block;font-size:19px;margin-top:3px;letter-spacing:.5px}
#img .mn{display:flex;align-items:center;gap:16px;padding:18px}#img .bg{width:80px;height:80px;border-radius:20px;color:#fff;font-size:46px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}#img em{font-style:normal;font-size:11.5px;font-weight:800;color:#7A8899;letter-spacing:1px}#img h2{margin:1px 0 4px;font-size:25px}#img .mn div div{font-size:15.5px;font-weight:700;color:#334}
#img .ls{display:flex;border-top:1px solid #EEF1F5}#img .ls>div{flex:1;padding:12px 14px}#img .ls>div+div{border-left:1px solid #EEF1F5}#img .ls h4{margin:0 0 8px;font-size:11px;letter-spacing:.8px}#img .ch{display:flex;flex-wrap:wrap;gap:6px}#img .ch span{width:32px;height:32px;border-radius:8px;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:15px}
</style></head><body><div class=w>
<div class=hd><small>MISSION PRODUCE · BLUEBERRIES CHAO</small><h1>Apoyo · Botar descarte</h1><div class=pr><div class=pb><div id=pbar></div></div><b id=ptx></b></div></div>
<div class=sec style="color:#1E7B3C">✔ YA APOYARON</div><div class=c id=ya></div>
<div class=sec style="color:#C25E10">⏳ FALTAN APOYAR · toca uno para registrar</div><div class=c><div class=fa id=fa></div></div>
<div class=fm id=fm style="display:none"><h3 id=ft></h3><div class=row><label><span>📅 FECHA</span><input type=date id=iF></label><label style="flex:.55"><span>👥 PERSONAS</span><input type=number id=iP min=1 inputmode=numeric placeholder="0"></label></div><button class=wa id=go>📲 Registrar y enviar al WhatsApp</button></div>
<div class=ft>Cuando los 6 grupos hayan apoyado, empieza una nueva vuelta</div>
<button class=ud id=ud>↶ Deshacer último registro</button><div id=st></div></div>
<div id=img></div>
<script>
const SB="https://rqvcvffyynpnighzwxju.supabase.co",KY="sb_publishable_keWbJCavFGWO_B976cjxAA_Gd5JMzFn",H={apikey:KY,Authorization:"Bearer "+KY,"Content-Type":"application/json",Prefer:"return=representation"};
const GS="ABCDEF",C={A:'#6B3FA0',B:'#2E86C1',C:'#C9A800',D:'#7F8790',E:'#C0392B',F:'#E67E22'},$=i=>document.getElementById(i);
const DL=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];let R=[],sel=null;
const fl=s=>{const d=new Date(s+'T12:00');return DL[d.getDay()]+' '+s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4)},fc=s=>{if(!s)return'';const d=new Date(s+'T12:00');return DL[d.getDay()].slice(0,3)+' '+s.slice(8,10)+'/'+s.slice(5,7)};
async function load(){try{const r=await fetch(SB+"/rest/v1/apoyo_descarte?select=*&order=id",{headers:H});R=await r.json();$("st").textContent="✔ Sincronizado"}catch(e){$("st").textContent="⚠ Sin conexión"}render()}
function est(L){const V=L.length?Math.max(...L.map(x=>x.vuelta)):1,cur=L.filter(x=>x.vuelta===V);if(cur.length>=6&&new Set(cur.map(x=>x.grupo)).size===6)return{vuelta:V+1,ya:[]};return{vuelta:V,ya:cur}}
function render(){const {ya}=est(R),hecho=new Set(ya.map(x=>x.grupo)),falta=[...GS].filter(g=>!hecho.has(g));if(sel&&!falta.includes(sel))sel=null;
 $("pbar").style.width=(ya.length/6*100)+"%";$("ptx").textContent=ya.length+" de 6 grupos apoyaron";
 $("ya").innerHTML=ya.length?ya.map(x=>`<div class=r><span class=g style="background:${C[x.grupo]}">${x.grupo}</span><span class=n>Grupo ${x.grupo}<small>${fc(x.fecha)}${x.personas?' · '+x.personas+' personas':''}</small></span><span class=ok>✔</span></div>`).join(''):'<div class=e>Ningún grupo todavía en esta vuelta</div>';
 $("fa").innerHTML=falta.map(g=>`<button data-g=${g} class="${g===sel?'sel':''}"><span style="background:${C[g]}">${g}</span><small>Grupo ${g}</small></button>`).join('');
 $("fm").style.display=sel?'':'none';if(sel)$("ft").textContent="Registrar apoyo · Grupo "+sel}
$("fa").onclick=e=>{const b=e.target.closest('[data-g]');if(!b)return;sel=b.dataset.g;render();$("fm").scrollIntoView({behavior:'smooth',block:'center'})};
async function lib(){if(window.html2canvas)return;await new Promise((r,j)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';s.onload=r;s.onerror=j;document.head.appendChild(s)})}
$("go").onclick=async()=>{const f=$("iF").value,p=+$("iP").value||null,g=sel;if(!g)return;if(!f){alert("Pon la fecha");$("iF").focus();return}if(!p){alert("Pon cuántas personas");$("iP").focus();return}
 const {vuelta}=est(R);$("go").disabled=true;$("go").textContent="Guardando…";
 try{const r=await fetch(SB+"/rest/v1/apoyo_descarte",{method:"POST",headers:H,body:JSON.stringify({vuelta,grupo:g,fecha:f,personas:p})});if(!r.ok)throw 0;const row=(await r.json())[0];
  const ya2=[...R,row].filter(x=>x.vuelta===row.vuelta).map(x=>x.grupo),fal2=[...GS].filter(x=>!ya2.includes(x));
  $("img").innerHTML=`<div class=ih><small>MISSION PRODUCE · BLUEBERRIES CHAO</small><b>APOYO · BOTAR DESCARTE</b></div><div class=mn><span class=bg style="background:${C[g]}">${g}</span><div><em>APOYA</em><h2>Grupo ${g}</h2><div>📅 ${fl(f)}</div><div>👥 ${p} personas</div></div></div><div class=ls><div><h4 style="color:#1E7B3C">✔ YA APOYARON (${ya2.length})</h4><div class=ch>${ya2.map(x=>`<span style="background:${C[x]}">${x}</span>`).join('')}</div></div><div><h4 style="color:#C25E10">⏳ FALTAN (${fal2.length})</h4><div class=ch>${fal2.map(x=>`<span style="background:${C[x]}">${x}</span>`).join('')||'<b style="font-size:13px;color:#1E7B3C">¡Vuelta completa!</b>'}</div></div></div>`;
  const txt=`Apoyo botar descarte: Grupo ${g} · ${fl(f).toLowerCase()} · ${p} personas`;
  $("iF").value="";$("iP").value="";sel=null;await load();$("go").textContent="Preparando imagen…";
  let file=null;try{await lib();const cv=await html2canvas($("img"),{scale:2,backgroundColor:'#ffffff'});const b=await new Promise(r=>cv.toBlob(r,'image/png'));file=new File([b],'Apoyo_descarte.png',{type:'image/png'})}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],text:txt})}catch(e){}}else location.href="https://wa.me/?text="+encodeURIComponent(txt)}
 catch(e){alert("No se pudo guardar. Revisa tu conexión.")}
 $("go").disabled=false;$("go").textContent="📲 Registrar y enviar al WhatsApp"};
$("ud").onclick=async()=>{if(!R.length)return;const x=R[R.length-1];if(!confirm(`¿Quitar el último registro? Grupo ${x.grupo} · ${fc(x.fecha)}`))return;await fetch(SB+"/rest/v1/apoyo_descarte?id=eq."+x.id,{method:"DELETE",headers:H});load()};
load();setInterval(()=>{if(!document.hidden&&!document.activeElement.matches('input'))load()},30000);
</script></body></html>
