<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revisión de guías</title>
<style>
:root{--az:#123A5C;--r:#F8B4AC;--y:#FFE08A}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#EEF2F6;color:#000}
.top{background:var(--az);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
.top h1{margin:0 0 10px;font-size:22px}.r{display:flex;gap:8px;flex-wrap:wrap}
.r select,.r input,.r button{padding:9px 10px;border-radius:9px;border:0;font-size:16px;font-weight:700}
.r button{background:#25D366;color:#fff;cursor:pointer}
.w{max-width:980px;margin:0 auto;padding:14px 12px 40px}
.sum{border-radius:12px;padding:12px 14px;font-weight:900;font-size:18px;margin-bottom:14px}
.c{scroll-margin-top:130px;background:#fff;border-radius:14px;margin-bottom:14px;overflow:hidden;box-shadow:0 1px 3px #0002}
.c summary{list-style:none;cursor:pointer}.c summary::-webkit-details-marker{display:none}.ab{float:right;transition:.2s}.c[open] .ab{transform:rotate(180deg)}.c h2{margin:0;padding:12px 14px;background:var(--az);color:#fff;font-size:18px}
.v{padding:8px 12px;border-top:1px solid #e5e9ef}.v.bad{background:#FFF4F2;border-left:6px solid #D2412C}
.fila{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:800;font-size:16px}.fila .n{min-width:52px;font-weight:900}.fila .h{padding:4px 8px;border-radius:7px;background:#F1F4F8}.fila .a,.fila .rl{color:#333;font-size:14px}.fila .fu{margin-left:auto;font-size:13px;color:#123A5C}
.res{padding:10px 14px;background:#FFF8E1;font-weight:700;font-size:15px;border-bottom:2px solid #eee}
.v .t{font-weight:900;font-size:17px;margin-bottom:6px}
.hs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.hs span{padding:6px 10px;border-radius:8px;background:#F1F4F8;font-weight:800;font-size:16px}
.o{color:#B3261E;font-weight:700;font-size:15px;line-height:1.5;margin-top:2px}
.g{display:inline-block;font-size:14px;font-weight:800;background:#123A5C;color:#fff;padding:6px 10px;border-radius:8px;margin:2px 4px 8px 0;word-break:break-all}
.ok{padding:12px 14px;color:#1E7A46;font-weight:800}
.e{text-align:center;padding:30px;font-weight:800;color:#555}
.ley{font-size:14px;font-weight:700;margin:6px 0 14px}
</style></head><body>
<div class="top"><h1>🔎 Revisión de horas de guías</h1><div class="r">
<select id="fu"><option value="">Todos los fundos</option></select><input type="date" id="dia"><button id="act">↻ Actualizar</button><button id="xl" style="background:#1D6F42">📥 Excel</button></div></div>
<div class="w"><div class="ley">🟥 error seguro · 🟨 dudoso · Refrigerio 12:00–13:00 o 12:30–13:30 · Toca el grupo para ver todas sus guías en orden; las que tienen error salen en rojo con la explicación. Inicio → Fin = llenado de la guía.</div><div id="out"><div class="e">Cargando…</div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>const CYC=(rec,ini,fu,a)=>{if(rec==null)return null;if(!a)return ini!=null&&ini<1e9?rec-ini:null;const rf=a.rec!=null&&a.rec<=780&&rec>780;if(fu!==a.fu){return ini!=null&&ini<1e9?rec-ini:null}if(rf)return ini!=null&&ini<1e9&&ini>a.rec?rec-ini:rec-780;return a.rec!=null?rec-a.rec:null};

const SB='https://rqvcvffyynpnighzwxju.supabase.co',SBK='sb_publishable_keWbJCavFGWO_B976cjxAA_Gd5JMzFn',H={apikey:SBK,Authorization:'Bearer '+SBK};
const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mins=v=>{const m=String(v||'').match(/(\d{1,2}):(\d{2})/);return m?+m[1]*60+ +m[2]:null},hm=m=>m==null?'—':Math.floor(m/60)+':'+String(m%60).padStart(2,'0');
const hoy=()=>{const d=new Date(Date.now()-5*3600e3);return d.toISOString().slice(0,10)};
const R1='#F8B4AC',Y1='#FFE08A';let ALL=[],DATA=[];
const du=m=>m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+String(m%60).padStart(2,'0')+' min':'');
function revisar(V){V.forEach((v,i)=>{let j=i-1;while(j>=0&&V[j].sx)j--;const pv=v.sx?null:(j>=0?V[j]:null),ini=v.ini,e={},o=[];
 if(ini!=null&&v.fin!=null&&ini>v.fin){e.ini=e.fin=R1;o.push(`El inicio (${hm(ini)}) está después del fin (${hm(v.fin)}). Una de las dos horas está mal.`)}
 if(ini!=null&&pv&&pv.fin!=null&&ini<pv.fin-5){e.ini=R1;o.push(`Dice que empezó a las <b>${hm(ini)}</b>, pero el viaje ${pv.n} recién terminó a las <b>${hm(pv.fin)}</b>. El inicio debería ser ${hm(pv.fin)} o después.`);e.x=1}
 else if(ini!=null&&pv&&pv.fin!=null&&ini-pv.fin>60){e.ini=Y1;o.push(`Del viaje ${pv.n} (terminó <b>${hm(pv.fin)}</b>) a este viaje (empezó <b>${hm(ini)}</b>) pasaron <b>${du(ini-pv.fin)}</b> sin guía. ¿Faltó registrar una guía?`)}
 if(!e.x&&ini!=null&&v.fin!=null&&v.fin-ini>50){e.fin=e.fin||Y1;o.push(`Se demoró <b>${du(v.fin-ini)}</b> en llenar (lo normal es 20 a 40 min).`)}
 if(!e.x&&ini!=null&&v.fin!=null&&(ini<775&&v.fin>755)){e.ini=e.ini||Y1;o.push('La guía está abierta en hora de refrigerio (de 12:00 a 13:00 o de 12:30 a 13:30). Se cierra antes de salir y la siguiente empieza al regresar.')}
 if(v.ciclo!=null&&v.ciclo>90&&!o.length){e.rec=R1;o.push(`Entre el recojo del viaje ${pv.n} (<b>${hm(pv.rec)}</b>) y este (<b>${hm(v.rec)}</b>) pasaron <b>${du(v.ciclo)}</b>.`)}
 if((ini!=null&&ini<390)||(v.rec!=null&&v.rec>1110)){e.ini=e.ini||Y1;o.push('Hora fuera de la jornada (antes de 6:30 o después de 18:30).')}
 v.e=e;v.o=o})}
function pintar(){const F=$('fu').value,P={};
 ALL.filter(r=>!F||r.fundo===F).forEach(r=>{(P[r.placa]=P[r.placa]||[]).push({cod:r.codigo,g:String(r.grupo||''),fu:r.fundo,cal:r.calidad,ini:mins(r.inicio),fin:mins(r.fin),rec:mins(r.recojo)})});
 let h='',tot=0,nv=0;DATA=[];
 Object.keys(P).sort((a,b)=>P[a][0].g.localeCompare(P[b][0].g)).forEach(p=>{const L=P[p].sort((a,b)=>(a.rec??0)-(b.rec??0)),T=[];
  L.forEach(r=>{const t=T[T.length-1];if(t&&r.rec!=null&&r.rec-t.rec<=2){t.gs.push(r);t.u=r.rec}else T.push({rec:r.rec,u:r.rec,gs:[r]})});
  const V=T.map((t,i)=>({n:i+1,gs:t.gs,sx:t.gs.every(x=>!/^EXPORT/i.test(x.cal||'')),ini:Math.min(...t.gs.map(x=>x.ini??1e9)),fin:Math.max(...t.gs.map(x=>x.fin??-1)),rec:t.rec,fu:[...new Set(t.gs.map(x=>x.fu))].join(', '),ciclo:CYC(t.rec,Math.min(...t.gs.map(x=>x.ini??1e9)),[...new Set(t.gs.map(x=>x.fu))].join(', '),i&&{rec:T[i-1].rec,fu:[...new Set(T[i-1].gs.map(x=>x.fu))].join(', ')})}));
  V.forEach(v=>{if(v.ini>=1e9)v.ini=null;if(v.fin<0)v.fin=null});revisar(V);
  const M=V.filter(v=>v.o.length);DATA.push({p,g:L[0].g,V,M});nv+=V.length;tot+=M.length;
  h+=`<details class="c"><summary><h2>🚚 ${esc(p)} · GRUPO ${esc(L[0].g)} · ${V.length} viajes${M.length?` · <span style="background:#D2412C;padding:2px 8px;border-radius:6px">${M.length} por corregir</span>`:' · ✅ todo bien'} <span class="ab">▼</span></h2></summary>`
   +(M.length?`<div class="res"><b>Resumen:</b> ${M.map(v=>`viaje ${v.n}`).join(', ')} ${M.length>1?'tienen':'tiene'} horas para revisar. Los viajes sin color están bien.</div>`:'')
   +V.map(v=>{const s=k=>v.e[k]&&k!=='x'?` style="background:${v.e[k]}"`:'',bad=v.o.length,cg=v.gs.map(x=>`<span class="g">📄 ${esc(x.cod)}${String(x.cal||'').toUpperCase().startsWith('EXPORT')?'':' · '+esc(x.cal)}</span>`).join('');
    return`<div class="v${bad?' bad':''}"><div class="fila"><span class="n">${bad?'⚠':'✅'} V${v.n}</span><span${s('ini')} class="h">${hm(v.ini)}</span><span class="a">→</span><span${s('fin')} class="h">${hm(v.fin)}</span><span class="rl">recojo</span><span${s('rec')} class="h">${hm(v.rec)}</span><span class="fu">${esc(v.fu)}</span></div><div>${cg}</div>${bad?`<div class="o">${v.o.map(x=>'• '+x).join('<br>')}</div>`:''}</div>`}).join('')+'</details>'});
 $('out').innerHTML=(nv?`<div class="sum" style="${tot?'background:#FDECEA;color:#B3261E;border:2px solid #D2412C':'background:#E8F6EE;color:#1E7A46;border:2px solid #1E9E5A'}">${tot?`⚠ ${tot} de ${nv} viajes con horas para corregir`:'✅ Todas las horas están bien'}</div>`:'')+(h||'<div class="e">No hay guías subidas para este día.</div>')}
async function cargar(){const d=$('dia').value;$('out').innerHTML='<div class="e">Cargando…</div>';
 try{const L=await (await fetch(`${SB}/rest/v1/guias_campo?fundo=neq.TERRANOVA&fecha=eq.${d}&select=codigo,grupo,fundo,placa,calidad,inicio,fin,recojo&limit=5000`,{headers:H})).json();
  ALL=Array.isArray(L)?L:[];const fs=[...new Set(ALL.map(r=>r.fundo).filter(Boolean))].sort(),cur=$('fu').value;
  $('fu').innerHTML='<option value="">Todos los fundos</option>'+fs.map(x=>`<option${x===cur?' selected':''}>${esc(x)}</option>`).join('');pintar()}
 catch(e){$('out').innerHTML='<div class="e">Sin conexión.</div>'}}
$('dia').value=hoy();$('dia').onchange=cargar;$('act').onclick=cargar;$('fu').onchange=pintar;document.addEventListener('toggle',e=>{if(e.target.open)document.querySelectorAll('details.c').forEach(d=>{if(d!==e.target)d.open=false});if(e.target.open)e.target.scrollIntoView({behavior:'smooth',block:'start'})},true);cargar();
const txt=x=>String(x).replace(/<[^>]+>/g,'');
$('xl').onclick=async()=>{if(!DATA.length)return alert('No hay guías para este día');const d=$('dia').value.split('-').reverse().join('/'),F=$('fu').value;
 const wb=new ExcelJS.Workbook(),AZ='FF123A5C',RO='FFF8B4AC',AM='FFFFE08A',RS='FFFFF4F2',VE='FFE8F6EE',bd={top:{style:'thin',color:{argb:'FFBFC7D1'}},left:{style:'thin',color:{argb:'FFBFC7D1'}},bottom:{style:'thin',color:{argb:'FFBFC7D1'}},right:{style:'thin',color:{argb:'FFBFC7D1'}}};
 const fill=c=>({type:'pattern',pattern:'solid',fgColor:{argb:c}});
 const tit=(ws,t,sub,n)=>{ws.mergeCells(1,1,1,n);const a=ws.getCell(1,1);a.value=t;a.font={bold:true,size:16,color:{argb:'FFFFFFFF'}};a.fill=fill(AZ);a.alignment={vertical:'middle',horizontal:'center'};ws.getRow(1).height=30;
  ws.mergeCells(2,1,2,n);const b=ws.getCell(2,1);b.value=sub;b.font={bold:true,size:11};b.alignment={horizontal:'center',wrapText:true};ws.getRow(2).height=32};
 const head=(ws,r,H)=>{const row=ws.getRow(r);H.forEach((h,i)=>{const c=row.getCell(i+1);c.value=h;c.font={bold:true,color:{argb:'FFFFFFFF'}};c.fill=fill('FF1B5E8C');c.alignment={horizontal:'center',vertical:'middle',wrapText:true};c.border=bd});row.height=28};
 // RESUMEN
 const R=wb.addWorksheet('RESUMEN',{views:[{state:'frozen',ySplit:3}]});tit(R,'REVISIÓN DE HORAS DE GUÍAS · '+d,(F||'Todos los fundos')+' · 🟥 error seguro · 🟨 dudoso · refrigerio 12:00–13:00 o 12:30–13:30',5);
 head(R,3,['PLACA','GRUPO','VIAJES','POR CORREGIR','VIAJES CON ERROR']);
 DATA.forEach((x,i)=>{const row=R.getRow(4+i);[x.p,x.g,x.V.length,x.M.length,x.M.length?x.M.map(v=>'V'+v.n).join(', '):'✅ Todo bien'].forEach((v,j)=>{const c=row.getCell(j+1);c.value=v;c.border=bd;c.font={bold:true,color:{argb:j===4&&x.M.length?'FFB3261E':'FF000000'}};c.alignment={horizontal:j===4?'left':'center',vertical:'middle'};if(x.M.length&&j===3)c.fill=fill(RO)})});
 const tv=DATA.reduce((a,x)=>a+x.V.length,0),te=DATA.reduce((a,x)=>a+x.M.length,0),rt=R.getRow(4+DATA.length);['TOTAL','',tv,te,Math.round(te/tv*100)+'% con error'].forEach((v,j)=>{const c=rt.getCell(j+1);c.value=v;c.font={bold:true};c.fill=fill('FFE3E8EF');c.border=bd;c.alignment={horizontal:'center'}});
 R.columns=[{width:14},{width:10},{width:10},{width:15},{width:40}];
 // GRUPOS
 DATA.forEach(x=>{const W=wb.addWorksheet(('GRUPO '+x.g+' '+x.p).slice(0,31),{views:[{state:'frozen',ySplit:3}]});
  tit(W,`🚚 ${x.p} · GRUPO ${x.g} · ${d}`,`${x.V.length} viajes · ${x.M.length?x.M.length+' por corregir ('+x.M.map(v=>'V'+v.n).join(', ')+')':'✅ todas las horas bien'}`,9);
  head(W,3,['VIAJE','N° GUÍA','FUNDO','INICIO','FIN','RECOJO','CICLO (MIN)','ESTADO','OBSERVACIÓN']);
  let r=4;x.V.forEach(v=>{const bad=v.o.length,cods=v.gs.map(g=>g.cod+(String(g.cal||'').toUpperCase().startsWith('EXPORT')?'':' ('+g.cal+')')).join('\n');
   const row=W.getRow(r++),vals=['V'+v.n,cods,v.fu,hm(v.ini),hm(v.fin),hm(v.rec),v.ciclo??'—',bad?'⚠ REVISAR':'✅ OK',bad?v.o.map(o=>'• '+txt(o)).join('\n'):''];
   vals.forEach((val,j)=>{const c=row.getCell(j+1);c.value=val;c.border=bd;c.alignment={horizontal:j===8||j===1?'left':'center',vertical:'middle',wrapText:true};c.font={bold:j!==8||bad,color:{argb:j===8||(j===7&&bad)?'FFB3261E':j===7?'FF1E7A46':'FF000000'}};if(bad)c.fill=fill(RS);if(!bad&&j===7)c.fill=fill(VE)});
   const k={ini:4,fin:5,rec:6};Object.entries(v.e).forEach(([n,col])=>{if(k[n])row.getCell(k[n]).fill=fill(col===R1?RO:AM)});
   row.height=Math.max(22,(bad?v.o.length*30:0),v.gs.length*16)});
  W.columns=[{width:8},{width:40},{width:16},{width:9},{width:9},{width:9},{width:9},{width:12},{width:62}]});
 const b=await wb.xlsx.writeBuffer(),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([b],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download=`Revision_guias_${$('dia').value}.xlsx`;a.click()};
</script></body></html>
